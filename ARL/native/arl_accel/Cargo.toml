[package]
name = "arl_accel"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[lib]
name = "arl_accel"
crate-type = ["cdylib"]

[dependencies]
percent-encoding = "2.3.1"
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
regex = "1.12.2"
# 2.5.8 引入了要求 Rust 1.88 的 ICU 依赖；生产镜像固定 Rust 1.85.1。
url = "=2.5.7"
