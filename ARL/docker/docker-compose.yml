volumes:
  arl_db:
    external: true
  redis_data:
  rabbitmq_data:

services:
  nginx:
    build:
      context: ./nginx-reverse-proxy
      dockerfile: Dockerfile
    container_name: arl_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_LISTEN_PORT:-80}:80"
    environment:
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:?BASIC_AUTH_PASSWORD must be set in the environment or ARL/docker/.env}
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"

  web:
    # 与 build.sh 保持一致，统一使用本地构建镜像标签，避免因拉取/找不到 latest 导致 web 未启动进而触发 502
    image: arl:local
    container_name: arl_web
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    # 仅通过 nginx 容器反向代理访问，避免宿主机额外暴露端口
    expose:
      - "443"
    volumes:
      # 运行期配置与版本模板分离：
      # - config-docker.yaml 作为版本模板（随代码更新）
      # - config-runtime.yaml 作为用户运行配置（不进 git，升级不覆盖）
      - ./config-runtime.yaml:/code/app/config.yaml
      - ./image:/code/app/tmp_screenshot
      - ./exports:/code/app/exports
      - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
      # 共享 worker 扫描日志，供仪表盘“实时扫描日志”读取
      - ./logs:/code/logs:ro
      # 自定义域名字典（包含 uploaded 子目录），持久化到宿主机
      - ./dicts/domain:/code/app/dicts/custom/domain
      # 自定义敏感目录字典，供 FILE_LEAK_DICT 指向使用
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
      # 配置管理支持在线 git 更新 nuclei/afrog PoC，web 需要对 tools 目录写权限
      - ../../tools:/code/tools
    entrypoint: ["start_web.sh"]
    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded
      # 端口扫描默认采用 SYN，all 模式按单 IP 隔离并发，避免旧 runtime 配置覆盖新策略
      - ARL_PORT_SCAN_SYN_ENABLE=1
      - ARL_PORT_SCAN_SYN_FALLBACK_ENABLE=1
      - ARL_PORT_SCAN_SKIP_CDN_IP_DEFAULT=1

  worker_1:
    # 与 web/scheduler 使用同一镜像标签，确保任务进程和 API 运行环境一致
    image: arl:local
    container_name: arl_worker_1
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    # Nmap -sS 仅需要 raw socket；不授予 NET_ADMIN 或 privileged。
    cap_add:
      - NET_RAW
    volumes:
      # 运行期配置与版本模板分离：
      # - config-docker.yaml 作为版本模板（随代码更新）
      # - config-runtime.yaml 作为用户运行配置（不进 git，升级不覆盖）
      - ./config-runtime.yaml:/code/app/config.yaml
      - ./image:/code/app/tmp_screenshot
      - ./exports:/code/app/exports
      - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
      # 将 worker 日志落到宿主机，供 web 仪表盘读取
      - ./logs:/code/logs
      - ./dicts/domain:/code/app/dicts/custom/domain
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
      - ../../tools:/code/tools:ro
    entrypoint: ["start_worker.sh"]

    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # 双 worker 横向扩展首版：采用保守并发，避免总并发翻倍过猛压垮基础组件
      - ARL_CELERY_TASK_WORKER_CONCURRENCY=2
      - ARL_CELERY_HEAVY_WORKER_CONCURRENCY=2
      - ARL_CELERY_WEB_WORKER_CONCURRENCY=2
      - ARL_CELERY_GITHUB_WORKER_CONCURRENCY=1
      # 保持主日志文件路径不变，兼容历史仪表盘默认读取路径
      - ARL_SCAN_LOG_FILE=/code/logs/arl_worker.log
      # 启动恢复仅由主 worker 执行，减少多副本同时恢复带来的抖动
      - ARL_WORKER_RECOVER_ON_BOOT=1
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded
      # 端口扫描默认采用 SYN，all 模式按单 IP 隔离并发，避免旧 runtime 配置覆盖新策略
      - ARL_PORT_SCAN_SYN_ENABLE=1
      - ARL_PORT_SCAN_SYN_FALLBACK_ENABLE=1
      - ARL_PORT_SCAN_SKIP_CDN_IP_DEFAULT=1

  worker_2:
    # 第二个 worker 实例：与 worker_1 共用镜像和队列，承担横向扩展分流
    image: arl:local
    container_name: arl_worker_2
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    # Nmap -sS 仅需要 raw socket；不授予 NET_ADMIN 或 privileged。
    cap_add:
      - NET_RAW
    volumes:
      - ./config-runtime.yaml:/code/app/config.yaml
      - ./image:/code/app/tmp_screenshot
      - ./exports:/code/app/exports
      - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
      - ./logs:/code/logs
      - ./dicts/domain:/code/app/dicts/custom/domain
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
      - ../../tools:/code/tools:ro
    entrypoint: ["start_worker.sh"]
    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # 双 worker 横向扩展首版：采用保守并发，避免总并发翻倍过猛压垮基础组件
      - ARL_CELERY_TASK_WORKER_CONCURRENCY=2
      - ARL_CELERY_HEAVY_WORKER_CONCURRENCY=2
      - ARL_CELERY_WEB_WORKER_CONCURRENCY=2
      - ARL_CELERY_GITHUB_WORKER_CONCURRENCY=1
      - ARL_SCAN_LOG_FILE=/code/logs/arl_worker_2.log
      # 第二个 worker 默认跳过启动恢复，仅消费新消息
      - ARL_WORKER_RECOVER_ON_BOOT=0
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded
      # 保持两个 worker 的端口扫描策略一致
      - ARL_PORT_SCAN_SYN_ENABLE=1
      - ARL_PORT_SCAN_SYN_FALLBACK_ENABLE=1
      - ARL_PORT_SCAN_SKIP_CDN_IP_DEFAULT=1

  scheduler:
    # 与 build.sh 保持一致，统一使用本地构建镜像标签
    image: arl:local
    container_name: arl_scheduler
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    volumes:
      # 运行期配置与版本模板分离：
      # - config-docker.yaml 作为版本模板（随代码更新）
      # - config-runtime.yaml 作为用户运行配置（不进 git，升级不覆盖）
      - ./config-runtime.yaml:/code/app/config.yaml
      # scheduler 也需要读取字典路径（配置加载阶段会校验文件存在）
      - ./dicts/domain:/code/app/dicts/custom/domain
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
    entrypoint:
      [
        "sh",
        "-c",
        "wait-for-it.sh -t 0 mongodb:27017; wait-for-it.sh -t 0 rabbitmq:5672; wait-for-it.sh -t 0 redis:6379; PYTHONPATH=/code python3 -m app.tools.sync_runtime_config --quiet || { echo '[ERROR] scheduler runtime config sync failed'; exit 1; }; python3 -m app.scheduler",
      ]
    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded

  mongodb:
    image: mongo:7.0
    container_name: arl_mongodb
    restart: always
    volumes:
      - arl_db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=arl
      # 凭据必填：缺失即拒绝启动，防止默认口令误部署到生产。
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:?set MONGO credentials in .env (see .env.example)}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:?set MONGO credentials in .env (see .env.example)}
      - ARL_APP_USERNAME=${ARL_APP_USERNAME:?set app credentials in .env (see .env.example)}
      - ARL_APP_PASSWORD=${ARL_APP_PASSWORD:?set app credentials in .env (see .env.example)}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arl_rabbitmq
    restart: always
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    environment:
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:?set rabbitmq credentials in .env (see .env.example)}
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:?set rabbitmq credentials in .env (see .env.example)}
      - RABBITMQ_DEFAULT_VHOST=arlv2host
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"

  redis:
    image: redis:7-alpine
    container_name: arl_redis
    restart: always
    # 仅容器内通信，避免宿主机暴露 Redis 端口
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"
