version: "3"

volumes:
  arl_db:
    external: true
  redis_data:

services:
  nginx:
    build:
      context: ./nginx-reverse-proxy
      dockerfile: Dockerfile
    container_name: arl_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_LISTEN_PORT:-80}:80"
    environment:
      - BASIC_AUTH_USERNAME=${BASIC_AUTH_USERNAME:-admin}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-admin123456}
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"

  web:
    # 与 build.sh 保持一致，统一使用本地构建镜像标签，避免因拉取/找不到 latest 导致 web 未启动进而触发 502
    image: arl:local
    container_name: arl_web
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    # 仅通过 nginx 容器反向代理访问，避免宿主机额外暴露端口
    expose:
      - "443"
    volumes:
      - ./config-docker.yaml:/code/app/config.yaml
      - ./image:/code/app/tmp_screenshot
      - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
      # 共享 worker 扫描日志，供仪表盘“实时扫描日志”读取
      - ./logs:/code/logs:ro
      # 自定义域名字典（包含 uploaded 子目录），持久化到宿主机
      - ./dicts/domain:/code/app/dicts/custom/domain
      # 自定义敏感目录字典，供 FILE_LEAK_DICT 指向使用
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
      # 配置管理支持在线 git 更新 nuclei/afrog PoC，web 需要对 tools 目录写权限
      - ../../tools:/code/tools
    entrypoint: ["start_web.sh"]
    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded

  worker:
    # 与 web/scheduler 使用同一镜像标签，确保任务进程和 API 运行环境一致
    image: arl:local
    container_name: arl_worker
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    volumes:
      - ./config-docker.yaml:/code/app/config.yaml
      - ./image:/code/app/tmp_screenshot
      - ./poc:/opt/ARL-NPoC/xing/plugins/upload_poc
      # 将 worker 日志落到宿主机，供 web 仪表盘读取
      - ./logs:/code/logs
      - ./dicts/domain:/code/app/dicts/custom/domain
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
      - ../../tools:/code/tools:ro
    entrypoint: ["start_worker.sh"]

    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded

  scheduler:
    # 与 build.sh 保持一致，统一使用本地构建镜像标签
    image: arl:local
    container_name: arl_scheduler
    restart: unless-stopped
    depends_on:
      - mongodb
      - rabbitmq
      - redis
    volumes:
      - ./config-docker.yaml:/code/app/config.yaml
      # scheduler 也需要读取字典路径（配置加载阶段会校验文件存在）
      - ./dicts/domain:/code/app/dicts/custom/domain
      - ./dicts/file_leak:/code/app/dicts/custom/file_leak
    entrypoint:
      [
        "sh",
        "-c",
        "wait-for-it.sh -t 60 mongodb:27017; wait-for-it.sh -t 60 rabbitmq:5672; wait-for-it.sh -t 60 redis:6379; python3 -m app.scheduler",
      ]
    environment:
      - LANG=en_US.UTF-8
      - TZ=Asia/Shanghai
      # Mongo 启动阶段可能端口已监听但尚未可用，适当放宽客户端超时避免进程误判退出
      - ARL_MONGO_SERVER_SELECTION_TIMEOUT_MS=30000
      - ARL_MONGO_CONNECT_TIMEOUT_MS=15000
      - ARL_DOMAIN_DICT_CUSTOM_DIR=/code/app/dicts/custom/domain
      - ARL_DOMAIN_DICT_UPLOAD_DIR=/code/app/dicts/custom/domain/uploaded
      - ARL_FILE_LEAK_DICT_CUSTOM_DIR=/code/app/dicts/custom/file_leak
      - ARL_FILE_LEAK_DICT_UPLOAD_DIR=/code/app/dicts/custom/file_leak/uploaded

  mongodb:
    image: mongo:7.0
    container_name: arl_mongodb
    restart: always
    volumes:
      - arl_db:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    environment:
      - MONGO_INITDB_DATABASE=arl
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-admin}
      - ARL_APP_USERNAME=${ARL_APP_USERNAME:-admin}
      - ARL_APP_PASSWORD=${ARL_APP_PASSWORD:-arlpass}

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: arl_rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_PASS=arlpassword
      - RABBITMQ_DEFAULT_USER=arl
      - RABBITMQ_DEFAULT_VHOST=arlv2host
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"

  redis:
    image: redis:7-alpine
    container_name: arl_redis
    restart: always
    # 仅容器内通信，避免宿主机暴露 Redis 端口
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "1M"
        max-file: "10"
