id: poc-yaml-starrocks-mpp-database-unauthorized-access
info:
  name: StarRocks MPP数据库未授权访问漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: StarRocks
  fofa: title="StarRocks"
requests:
- method: GET
  path: /mem_tracker
  expression: "status_code == 200 && \ncontains(body,\"MemTracker\") &&\ncontains(body,\"\
    Memory\") &&\ncontains(body,\"Configs\") &&\ncontains(body,\"Memory Usage Detail\"\
    )\n"
variables: {}
transport: http
