id: poc-yaml-couchdb-unauth
info:
  name: Couchdb 未授权访问漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Couchdb
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /_config
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "httpd_design_handlers") && contains(body,
    "external_manager") && contains(body, "replicator_manager")
  output: []
