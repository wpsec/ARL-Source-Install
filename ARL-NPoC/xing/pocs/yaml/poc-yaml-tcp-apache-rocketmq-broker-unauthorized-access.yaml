id: poc-yaml-tcp-apache-rocketmq-broker-unauthorized-access
info:
  name: RocketMQ Broker 未授权访问漏洞
  severity: high
  tags:
  - 配置不当
  finger: rocketmq
scheme: rocketmq
port: 10911
variables:
  t1: hex_decode("")
tcpRequests:
- expression:
  - conn.WriteStr(t1)
  - conn.ReadStr()
  - contains(res, "\"serializeTypeCurrentRPC\"") && contains(res, "\"code\":0")
  - contains(res, "\"opaque\"") && contains(res, "\"version\"")
  - '!contains(res, "HTTP") && !contains(res, "FTP")'
transport: tcp
