id: poc-yaml-apache-solr-rce-cnvd-2023-27598
info:
  name: Apache Solr 远程代码执行漏洞(CNVD-2023-27598)
  severity: critical
  tags:
  - 两高一弱
  - rce
  - CNVD-2023-27598
  finger: solr
requests:
- method: GET
  path: /solr/
  expression: 'contains(title,"Solr Admin") &&

    matches(body,`favicon\.ico\?_=(?P<version>[0-9.]+)">`) &&

    compare_versions(regex_find(body,`favicon\.ico\?_=(?P<version>[0-9.]+)">`), ">=8.10.0,
    <9.2.0")

    '
variables: {}
transport: http
