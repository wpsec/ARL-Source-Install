id: poc-yaml-backup-migration-sensitive-information-leak
info:
  name: 备份迁移 敏感信息泄露漏洞 (CVE-2023-6271)
  severity: high
  tags:
  - CVE-2023-6271
  - 信息泄露
  finger: backup-migration
  fofa: wp-content/plugins/backup-backup/
requests:
- method: GET
  path: /wp-content/plugins/backup-backup/readme.txt
  expression: status_code == 200 && contains(body,"backup-backup") && matches(body,"(?mi)Stable
    tag\x3a ([0-9.]+)")
  output:
  - regex_match(body,"Stable tag\x3a (?P<version>[0-9.]+)")
- method: GET
  path: /wp-content/plugins/backup-backup/readme.txt
  expression: status_code == 200 && compare_versions(version, "<1.3.5")
variables: {}
transport: http
