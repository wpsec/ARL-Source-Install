id: poc-yaml-spring-boot-jolokia-unauth-access
info:
  name: Spring Boot Jolokia 未授权访问漏洞
  severity: high
  tags:
  - 未授权访问
  finger: Spring Boot
  osprey-id: vb_2020_0047
variables:
  paths: 'jolokia/list

    actuator/jolokia/list/

    '
requests:
- method: GET
  path: /{{.paths}}
  expression: 'status_code == 200 && contains(body, "{\"request\":{\"type\":\"list\"}")
    && contains(body, "jolokia")

    '
transport: http
