    x1f\\x8b\\x08\" ||\n  substr(body, 0, 8) == \"\\x52\\x61\\x72\\x21\\x1A\\x07\\\
    x00\\x00\" ||\n  substr(body, 0, 8) == \"\\x52\\x61\\x72\\x21\\x1A\\x07\\x01\\\
    x00\" ||\n  substr(body, 0, 6) == \"\\xFD\\x37\\x7A\\x58\\x5A\\x00\" ||\n  substr(body,\
    \ 0, 4) == \"\\x50\\x4b\\x03\\x04\" ||\n  substr(body, 0, 2) == \"\\x1F\\x9D\"\
    \ ||\n  substr(body, 0, 2) == \"\\x1F\\xA0\" ||\n  substr(body, 0, 4) == \"\\\
    x4C\\x5A\\x49\\x50\"  ||\n  (\n    contains(body, \"\\x00\\x00\\x00\\x00\\x00\\\
