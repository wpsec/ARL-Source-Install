id: poc-yaml-apache-tomcat-example-directory-open
info:
  name: Apache Tomcat 示例目录开放漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: tomcat
  fofa: body="Apache Tomcat"
requests:
- method: GET
  path: /examples/servlets/servlet/SessionExample
  expression: status_code == 200 && contains(body,"<title>Sessions Example</title>")
    && contains(body,"Session ID") && contains(body,"Value of Session Attribute:")
variables: {}
transport: http
