id: poc-yaml-wp-staging-sensitive-information-leak
info:
  name: WP Staging 敏感信息泄露漏洞(CVE-2023-6113)
  severity: medium
  tags:
  - CVE-2023-6113
  - 信息泄露
  finger: wp-staging
  fofa: wp-content/plugins/wp-staging/
requests:
- method: GET
  path: /wp-content/plugins/wp-staging/readme.txt
  expression: status_code == 200 && contains(body,"wp-staging") && matches(body,"(?mi)Stable
    tag\x3a ([0-9.]+)")
  output:
  - regex_match(body,"Stable tag\x3a (?P<version>[0-9.]+)")
- method: GET
  path: /wp-content/plugins/wp-staging/readme.txt
  expression: status_code == 200 && compare_versions(version, "<3.1.3")
variables: {}
transport: http
