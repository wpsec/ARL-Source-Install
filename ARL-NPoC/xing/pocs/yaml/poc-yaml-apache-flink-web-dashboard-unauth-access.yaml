id: poc-yaml-apache-flink-web-dashboard-unauth-access
info:
  name: Apache Flink Web Dashboard 未授权访问漏洞
  severity: high
  tags:
  - 未授权访问
  finger: Apache Flink
  osprey-id: vb_2018_0054
requests:
- method: GET
  path: /#/overview
  headers: {}
  expression: 'status_code == 200 && contains(body, "Overview</a></li>") && contains(body,
    "Running Jobs</a></li>") && contains(body, "Completed Jobs</a></li>") && contains(body,
    "Task Managers</a></li>") && contains(body, "Job Manager</a></li>")

    '
variables: {}
transport: http
