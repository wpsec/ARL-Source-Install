id: poc-yaml-landray-oa-sysUiExtend-file-upload
info:
  name: 蓝凌OA sysUiExtend.do 任意文件上传漏洞
  severity: critical
  tags:
  - 两高一弱
  - 文件上传
  finger: 蓝凌OA
  fofa: app="Landray-OA系统"
requests:
- method: GET
  path: /api///sys/ui/sys_ui_extend/sysUiExtend.do?method=upload
  expression: 'status_code == 200

    && contains(body,"添加主题包")

    && contains(body,"上传文件")

    '
variables: {}
transport: http
