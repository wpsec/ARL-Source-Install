id: poc-yaml-h2-database-web-console-unauthorized-access
info:
  name: H2 Database Web Consoleorized Access 未授权访问漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: H2 Database
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /h2-console
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "Welcome to H2")
  output:
  - regex_match(body,"location.href = '(?P<token>.+?)'")
- method: GET
  path: /h2-console/{{.token}}
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "Generic H2")
  output: []
