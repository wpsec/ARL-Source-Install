id: poc-yaml-apache-axis-webservice-identify
info:
  name: 发现 Apache Axis webservice
  severity: info
  tags:
  - identify
  finger: Apache Axis
variables:
  path: 'services

    servlet/AxisaxiServlet

    servlet/AxisServlet

    services/listServices

    services/FreeMarkerService

    services/AdminService

    axis/services

    axis2/services

    axis/servlet/AxisServlet

    axis2/servlet/AxisServlet

    axis2/services/listServices

    axis/services/FreeMarkerService

    axis/services/AdminService

    admin/services'
requests:
- method: GET
  path: /{{.path}}
  expression: contains(body, "Services") && contains(body, "?wsdl\"><i>")
transport: http
