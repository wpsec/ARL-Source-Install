    \ name=\"P\"\r\n\r\nadmin\r\n------WebKitFormBoundaryVnBC9fNE0xAOdxca\r\nContent-Disposition:\
    \ form-data; name=\"TYPE\"\r\n\r\nmobile1\r\n------WebKitFormBoundaryVnBC9fNE0xAOdxca\r\
    \nContent-Disposition: form-data; name=\"DEST_UID\"\r\n\r\n12334\r\n------WebKitFormBoundaryVnBC9fNE0xAOdxca\r\
    \nContent-Disposition: form-data; name=\"UPLOAD_MODE\"\r\n\r\n2\r\n------WebKitFormBoundaryVnBC9fNE0xAOdxca\r\
