    \ \"lazyUpdate\": \"null\"\n      },\n      \"params\":{\n          \"script\"\
    :{\n              \"parameters\":[\n              {\n              \"name\":\"\
    aaaa\",\n              \"type\":\"tagid\",\n              \"value\":\"\"\n   \
    \           }\n              ],\n              \"mode\":\"\",\n              \"\
    id\":\"\",\n              \"test\":\"true\",\n              \"name\":\"ok\",\n\
    \              \"outputId\":\"\",\n              \"code\":\"aaa\"\n          }\n\
    \      }\n  }\n"
  expression: "status_code == 400 \n&& contains(headers, \"ETag\") \n&& contains(body,\
    \ \"\\\"error\\\":\\\"unexpected_error\\\"\") \n&& contains(body, \"TypeError:\
