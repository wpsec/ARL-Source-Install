id: poc-yaml-apache-storm-ui-unauth-access
info:
  name: Apache Storm UI 未授权访问漏洞
  severity: medium
  tags:
  - 未授权访问
  finger: Storm UI
  osprey-id: vb_2018_0051
requests:
- method: GET
  path: /index.html
  headers: {}
  expression: 'status == 200 && contains(body, "<h2>Nimbus Configuration</h2>") &&

    contains(body, "Storm UI") &&

    contains(body, "<h2>Cluster Summary</h2>") &&

    contains(body, "<h2>Nimbus Summary</h2>") &&

    contains(body, "<h2>Topology Summary</h2>")

    '
variables: {}
transport: http
