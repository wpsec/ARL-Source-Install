id: poc-yaml-phpinfo-identify
info:
  name: phpinfo 信息泄露漏洞
  severity: medium
  tags:
  - identify
  finger: php
variables:
  path: '/phpinfo.php

    /info.php

    /p.php

    /php.php

    /test.php

    /'
requests:
- method: GET
  path: '{{.path}}'
  expression: 'status_code == 200 &&

    contains(content_type, "text/html") &&

    contains(body, "PHP Version") &&

    contains(body, "PHP License") &&

    contains(body, "phpinfo")

    '
transport: http
