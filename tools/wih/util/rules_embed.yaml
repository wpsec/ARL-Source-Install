rules:
  # 域名，内置规则
  - id: domain
    enabled: true
    pattern: '(?i)\b(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+(?:(?:com|cn|net|org|edu|gov|mil|int|biz|info|pro|top|vip|club|xyz|online|site|tech|store|app|dev|io|ai|co|me|cc|tv|hk|jp|kr|sg|us|uk|de|fr|ru|nl|au|ca|it|es|in|br|ch|se|no|fi|pl|eu)|(?:(?:com|net|org|gov|edu|ac|mil)\.cn)|xn--[a-z0-9-]{2,59})\b'
  # IP， 内置规则
  - id: ip
    enabled: true
  # 路径，内置规则
  - id: path
    enabled: true
    pattern: '/(?:[A-Za-z0-9._~!$&()*+,=:@%-]{1,80}/?){1,8}'
  # URL主机部分为域名，内置规则
  - id: domain_url
    enabled: true
  # URL主机部分为IP，内置规则
  - id: ip_url
    enabled: true
  # 邮箱
  - id: email
    enabled: true
    pattern: \b[A-Za-z0-9._\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,61}\b
  # 二代身份证
  - id: id_card
    enabled: true
    pattern: \b([1-9]\d{5}(19|20)\d{2}((0[1-9])|(1[0-2]))(([0-2][1-9])|10|20|30|31)\d{3}[0-9Xx])\b
  # 手机号
  - id: phone
    enabled: true
    pattern: \b1[3-9]\d{9}\b
  # jwt token (不要修改ID)
  - id: jwt_token
    enabled: true
    pattern: eyJ[A-Za-z0-9_/+\-]{10,}={0,2}\.[A-Za-z0-9_/+\-\\]{15,}={0,2}\.[A-Za-z0-9_/+\-\\]{10,}={0,2}
  # 阿里云 AccessKey ID (不要修改ID)
  - id: Aliyun_AK_ID
    enabled: true
    pattern: \bLTAI[A-Za-z\d]{12,30}\b
  # 腾讯云 AccessKey ID (不要修改ID)
  - id: QCloud_AK_ID
    enabled: true
    pattern: \bAKID[A-Za-z\d]{13,40}\b
  # 京东云 AccessKey ID (不要修改ID)
  - id: JDCloud_AK_ID
    enabled: true
    pattern: \bJDC_[0-9A-Z]{25,40}\b
  # 亚马逊 AccessKey ID
  - id: AWS_AK_ID
    enabled: true
    pattern: '["''](?:A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}["'']'
  # 火山引擎 AccessKey ID
  - id: VolcanoEngine_AK_ID
    enabled: true
    pattern: \b(?:AKLT|AKTP)[a-zA-Z0-9]{35,50}\b
  # 金山云 AccessKey ID
  - id: Kingsoft_AK_ID
    enabled: true
    pattern: \bAKLT[a-zA-Z0-9-_]{16,28}\b
  # 谷歌云 AccessKey ID
  - id: GCP_AK_ID
    enabled: true
    pattern: \bAIza[0-9A-Za-z_\-]{35}\b
  # 提取 SecretKey, 内置规则
  - id: secret_key
    enabled: true
  # Bearer Token
  - id: bearer_token
    enabled: true
    pattern: \b[Bb]earer\s+[a-zA-Z0-9\-=._+/\\]{20,500}\b
  # Basic Token
  - id: basic_token
    enabled: true
    pattern: \b[Bb]asic\s+[A-Za-z0-9+/]{18,}={0,2}\b
  # Auth Token
  - id: auth_token
    enabled: true
    pattern: '["''\[]*[Aa]uthorization["''\]]*\s*[:=]\s*[''"]?\b(?:[Tt]oken\s+)?[a-zA-Z0-9\-_+/]{20,500}[''"]?'
  # PRIVATE KEY
  - id: private_key
    enabled: true
    pattern: -----\s*?BEGIN[ A-Z0-9_-]*?PRIVATE KEY\s*?-----[a-zA-Z0-9\/\n\r=+]*-----\s*?END[ A-Z0-9_-]*? PRIVATE KEY\s*?-----
  #Gitlab V2 Token
  - id: gitlab_v2_token
    enabled: true
    pattern: \b(glpat-[a-zA-Z0-9\-=_]{20,22})\b
  #Github Token
  - id: github_token
    enabled: true
    pattern: \b((?:ghp|gho|ghu|ghs|ghr|github_pat)_[a-zA-Z0-9_]{36,255})\b
  #腾讯云 API网关 APPKEY
  - id: qcloud_api_gateway_appkey
    enabled: true
    pattern: \bAPID[a-zA-Z0-9]{32,42}\b
  #微信 公众号/小程序 APPID
  - id: wechat_appid
    enabled: true
    pattern: '["''](wx[a-z0-9]{15,18})["'']'
  #企业微信 corpid
  - id: wechat_corpid
    enabled: true
    pattern: '["''](ww[a-z0-9]{15,18})["'']'
  #微信公众号
  - id: wechat_id
    enabled: true
    pattern: '["''](gh_[a-z0-9]{11,13})["'']'
  # 密码
  - id: password
    enabled: true
    pattern: (?i)(?:admin_?pass|password|[a-z]{3,15}_?password|user_?pass|user_?pwd|admin_?pwd)\\?['"]*\s*[:=]\s*\\?['"][a-z0-9!@#$%&*]{5,20}\\?['"]
  # 企业微信 webhook
  - id: wechat_webhookurl
    enabled: true
    pattern: \bhttps://qyapi.weixin.qq.com/cgi-bin/webhook/send\?key=[a-zA-Z0-9\-]{25,50}\b
  # 钉钉 webhook
  - id: dingtalk_webhookurl
    enabled: true
    pattern: \bhttps://oapi.dingtalk.com/robot/send\?access_token=[a-z0-9]{50,80}\b
  # 飞书 webhook
  - id: feishu_webhookurl
    enabled: true
    pattern: \bhttps://open.feishu.cn/open-apis/bot/v2/hook/[a-z0-9\-]{25,50}\b
  # slack webhook
  - id: slack_webhookurl
    enabled: true
    pattern: \bhttps://hooks.slack.com/services/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{6,12}/[a-zA-Z0-9\-_]{15,24}\b
  # grafana api key
  - id: grafana_api_key
    enabled: true
    pattern: \beyJrIjoi[a-zA-Z0-9\-_+/]{50,100}={0,2}\b
  # grafana cloud api token
  - id: grafana_cloud_api_token
    enabled: true
    pattern: \bglc_[A-Za-z0-9\-_+/]{32,200}={0,2}\b
  # grafana service account token
  - id: grafana_service_account_token
    enabled: true
    pattern: \bglsa_[A-Za-z0-9]{32}_[A-Fa-f0-9]{8}\b
  - id: app_key
    enabled: true
    pattern: \b(?:VUE|APP|REACT)_[A-Z_0-9]{1,15}_(?:KEY|PASS|PASSWORD|TOKEN|APIKEY)['"]*[:=]"(?:[A-Za-z0-9_\-]{15,50}|[a-z0-9/+]{50,100}==?)"

  # OpenAI API Key
  - id: openai_api_key
    enabled: true
    pattern: '(?i)(?:openai|chatgpt|gpt)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{48}\b'

  # Anthropic API Key
  - id: anthropic_api_key
    enabled: true
    pattern: \bsk-ant-api[0-9a-zA-Z\-_]{80,100}\b

  # HuggingFace Token
  - id: huggingface_token
    enabled: true
    pattern: \bhf_[a-zA-Z0-9]{34}\b

  # Cohere API Key
  - id: cohere_api_key
    enabled: true
    pattern: '(?i)(?:cohere|command-r|command-light|embed-v)[^\r\n]{0,80}\b[a-zA-Z0-9]{40}\b'

  # Pinecone API Key
  - id: pinecone_api_key
    enabled: true
    pattern: \b(?:pc-)[a-zA-Z0-9]{30,40}\b

  # DeepSeek API Key
  - id: deepseek_api_key
    enabled: true
    pattern: '(?i)(?:deepseek)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{32}\b'

  # 百川 API Key
  - id: baichuan_api_key
    enabled: true
    pattern: '(?i)(?:baichuan|百川)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{32}\b'

  # Google Gemini API Key
  - id: gemini_api_key
    enabled: true
    pattern: \bAIzaSy[A-Za-z0-9_\\-]{33}\b

  # Replicate API Key
  - id: replicate_api_key
    enabled: true
    pattern: \br8_[a-zA-Z0-9]{37}\b

  # Moonshot (月之暗面/Kimi) API Key
  - id: moonshot_api_key
    enabled: true
    pattern: '(?i)(?:moonshot|kimi|月之暗面)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{40}\b'

  # Midjourney API Key
  - id: midjourney_api_key
    enabled: true
    pattern: '(?i)(?:midjourney|mj)[^\r\n]{0,80}(?:api[_-]?key|token|secret)[^\r\n]{0,80}\b[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}\b'

  # stability.ai API Key
  - id: stability_api_key
    enabled: true
    pattern: '(?i)(?:stability(?:\.ai|ai)?|stable(?:[_ -]?diffusion)?)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{48}\b'

  # ZhipuAI (智谱清言/ChatGLM) API Key
  - id: zhipu_api_key
    enabled: true
    pattern: '(?i)(?:zhipu|chatglm|glm-?4|智谱)[^\r\n]{0,80}\b[a-zA-Z0-9]{32}\.[a-zA-Z0-9]{10}\b'

  # Minimax API Key
  - id: minimax_api_key
    enabled: true
    pattern: '(?i)(?:minimax(?:[_-]?(?:api(?:[_-]?key)?|group(?:[_-]?id)?))?|groupid|mini[-_]?max)[^\r\n]{0,80}\b[A-Za-z0-9]{32}\b'

  # DashScope (阿里灵积/通义千问) API Key
  - id: dashscope_api_key
    enabled: true
    pattern: '(?i)(?:dashscope|qwen|通义|aliyun)[^\r\n]{0,80}\bsk-[a-zA-Z0-9]{32}\b'

  # ======================== SnowEyes 拓展规则（已转为 WIH 格式）========================
  # Shiro rememberMe 特征
  - id: shiro_rememberme
    enabled: true
    pattern: "(?:=deleteMe|rememberMe=)"
  # Swagger / OpenAPI 页面特征
  - id: swagger_ui
    enabled: true
    pattern: '(?:swagger-ui\.html|"swagger"\s*:|Swagger UI|swaggerUi|swaggerVersion)'
  # UEditor 组件特征
  - id: ueditor_js
    enabled: true
    pattern: 'ueditor\.(?:config|all)\.js'
  # Druid 监控页面特征
  - id: druid_stat
    enabled: true
    pattern: "Druid Stat Index"
  # PDF.js 特征
  - id: pdfjs_viewer
    enabled: true
    pattern: 'pdf\.worker(?:\.min)?\.js|pdf\.worker'
  # Vite 开发模式泄露特征
  - id: vite_dev_mode
    enabled: true
    pattern: "/@vite/client"
  # Java 反序列化线索（ViewState）
  - id: java_deserialization
    enabled: true
    pattern: 'javax\.faces\.ViewState'
  # 常见调试/管理参数线索
  - id: debug_logic_parameters
    enabled: true
    pattern: "(?:[?&]|\\b)(?:access|adm|admin|alter|cfg|clone|config|create|dbg|debug|delete|disable|edit|enable|exec|execute|grant|load|make|modify|rename|reset|root|shell|test|toggl)="
  # URL 作为参数值（可能存在 SSRF / 跳转风险）
  - id: url_as_value
    enabled: true
    pattern: "(?:[?&]|\\b)[^=\\s]{1,40}=(?:https?://|https?%3a%2f%2f)"
  # 文件上传表单特征
  - id: upload_form
    enabled: true
    pattern: 'type\s*=\s*["'']file["'']'
  # 常见 DoS 相关参数线索
  - id: dos_parameters
    enabled: true
    pattern: "(?:[?&]|\\b)(?:size|page|num|limit|start|end|count)="
  # Linux passwd 文件泄露特征
  - id: passwd_file_leak
    enabled: true
    pattern: "/root:/bin/bash"
  # Windows win.ini 泄露特征
  - id: win_ini_leak
    enabled: true
    pattern: "for 16-bit app"
  # 内网 IP 信息
  - id: internal_ip
    enabled: true
    pattern: '(?:(?:127\.0\.0\.1)|(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3})|(?:172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})|(?:192\.168\.\d{1,3}\.\d{1,3}))'
  # MAC 地址
  - id: mac_address
    enabled: true
    pattern: "(?:^|[^A-Za-z0-9])(?:[A-Fa-f0-9]{2}(?::[A-Fa-f0-9]{2}){5})(?:$|[^A-Za-z0-9])"
  # 云密钥关键字线索
  - id: cloud_key_hint
    enabled: true
    pattern: "(?i)(?:access(?:_|-|)?key(?:_|-|)?(?:id|secret)|LTAI[a-z0-9]{12,20})"
  # Windows 文件/目录路径
  - id: windows_path
    enabled: true
    pattern: '[A-Za-z]:\\\\[^\\r\\n<>:"|?*]{1,240}'
  # JDBC 连接串
  - id: jdbc_connection
    enabled: true
    pattern: 'jdbc:[a-z:]+://[a-z0-9\.\-_:;=/@?,&]+'
  # SourceMap 文件线索
  - id: source_map_file
    enabled: true
    pattern: '\.js\.map(?:[?#][^"''\s]*)?'
  # 302/跳转头线索
  - id: location_header
    enabled: true
    pattern: 'Location:\s*[^\r\n]+'
  # 对象存储 Key 标签线索
  - id: object_storage_key
    enabled: true
    pattern: "<Key>[^<]{1,500}</Key>"

# 排除规则， 支持字段 id, content, target , source 逻辑为 and ，如果是正则匹配，需要使用 regex: 开头
exclude_rules:
  # 排除站点 https://cc.163.com 中 类型为 secret_key 的内容
  - name: "不收集 cc.163.com 的 secret_key" # 排除规则名称，无实际意义
    id: secret_key
    target: regex:cc\.163\.com
    enabled: true

  - name: "不收集 open.work.weixin.qq.com 的 bearer_token"
    id: bearer_token
    target: https://open.work.weixin.qq.com
    content: regex:Bearer\s+
    enabled: true

  - name: "过滤来自首页的内容"
    source_tag: page
    enabled: false

  - name: "过滤 path 中带引号或分号的残缺路由"
    id: path
    content: regex:^/.*(?:['"`;]).*$
    enabled: true

  - name: "过滤 path 中的静态资源路径"
    id: path
    content: regex:^/(?:static|assets?)/.*\.(?:js|mjs|css|scss|jpg|jpeg|png|gif|ico|svg|vue|ts|woff2?|ttf|map)(?:[?#].*)?$
    enabled: true

  - name: "过滤 path 中明显无意义的 HTML 标签路径"
    id: path
    content: regex:^/(?:head|body|html|script|style|meta|link|title)$
    enabled: true

  - name: "过滤 minimax_api_key 误命中的 32 位纯 hex 摘要"
    id: minimax_api_key
    content: regex:(?i)\b[a-f0-9]{32}\b
    enabled: true

  - name: "过滤 cohere_api_key 误命中的 40 位纯 hex 摘要"
    id: cohere_api_key
    content: regex:(?i)\b[a-f0-9]{40}\b
    enabled: true

  - name: "过滤通用线索规则中的前端国际化与对象属性噪声"
    id: regex:^(?:domain|debug_logic_parameters|dos_parameters|url_as_value)$
    content: regex:(?i)(?:^|[^\w])(?:formdata|this|window|eg|pleaseenterpassword|forgetpassword|passwordtip|isshowpassword|safepassword|mobilepassword|token\.js)(?:$|[^\w])
    enabled: true
